Unsweetened Oloroso or Amontillado","d":"Sweetened Amontillado or Oloroso"},"notes":{"a":"A sweetened Fino is labelled Pale Cream.","b":"These are labelled PX; PX is often the sweetening component IN Cream Sherry.","c":"Dry Sherries that are sweetened must carry a different term, such as Medium or Cream.","d":"Correct: per the book."},"answer":"d","ctx":"","src":"L2 book p. 118 (Sweet Sherry styles)","cards":"L2-card-92, L2-card-22"},{"id":"Q-L2-25-14","level":"L2","lo":"LO5","ch":"25","topic":"PX production","trap":"","stem":"How is PX (Pedro Ximénez) Sherry made sweet?","options":{"a":"Its black grapes are dried indoors before a slow fermentation.","b":"Its white grapes are sun-dried to concentrate their sugar.","c":"Its grapes are left on the vine until affected by noble rot.","d":"Its dry base wine is sweetened with sugar before bottling."},"notes":{"a":"PX grapes are white, not black, and they are dried in the sun.","b":"Correct: the wine is then fortified and aged oxidatively in the solera.","c":"Noble rot is used for wines such as Sauternes and Tokaj, not PX.","d":"Its sweetness comes from sun-dried grapes, not from added sugar."},"answer":"b","ctx":"","src":"L2 book p. 118 (Sweet Sherry styles)","cards":"L2-card-92"},{"id":"Q-L2-25-15","level":"L2","lo":"LO5","ch":"25","topic":"PX style","trap":"","stem":"A Sherry is deep brown and sweet, with pronounced fig, prune, raisin, liquorice and molasses. Which style is it MOST LIKELY to be?","options":{"a":"Pedro Ximénez","b":"Oloroso","c":"Pale Cream","d":"Amontillado"},"notes":{"a":"Correct: PX, from sun-dried white Pedro Ximénez grapes, fortified and aged oxidatively.","b":"Brown, with raisin and prune, but a dry style.","c":"A sweetened Fino, so it is pale, not deep brown.","d":"A dry style, with bread dough plus walnut and caramel."},"answer":"a","ctx":"PX is often the sweetening component in Cream Sherries.","src":"L2 book p. 118 (Sweet Sherry styles)","cards":"L2-card-92"},{"id":"Q-L2-25-16","level":"L2","lo":"LO5","ch":"25","topic":"Sweetened Sherry labelling","trap":"","stem":"What labelling rule applies when a dry Sherry is sweetened before sale?","options":{"a":"It must carry a different or supplementary term.","b":"It must be labelled PX, as PX is the usual sweetener.","c":"It must state the level of sugar in grams per litre.","d":"It may keep its dry style name with no other term."},"notes":{"a":"Correct: e.g. Pale Cream for a sweetened Fino; Medium or Cream for sweetened Amontillado or Oloroso.","b":"PX is a specific sweet style made from sun-dried Pedro Ximénez grapes.","c":"Not the book's rule; it requires a different or supplementary term.","d":"No: the book says a different or supplementary term must be used."},"answer":"a","ctx":"","src":"L2 book p. 118 (Sweet Sherry styles)","cards":"L2-card-92"},{"id":"Q-L2-25-17","level":"L2","lo":"LO5","ch":"25","topic":"Sweet Sherry terms","trap":"NOT stem","stem":"Which of these Sherry labelling terms does NOT indicate a sweet style?","options":{"a":"Cream","b":"Amontillado","c":"PX","d":"Pale Cream"},"notes":{"a":"Sweet: often a sweetened Amontillado or Oloroso.","b":"Correct: a dry style (flor, then oxidative ageing).","c":"Sweet: from sun-dried Pedro Ximénez grapes.","d":"Sweet: a sweetened Fino."},"answer":"b","ctx":"Dry: Fino, Amontillado, Oloroso. Sweet: Pale Cream, Medium, Cream, PX.","src":"L2 book p. 116-118 (Sherry styles)","cards":"L2-card-92, L2-card-38"},{"id":"Q-L2-25-18","level":"L2","lo":"LO5","ch":"25","topic":"Port extraction","trap":"","stem":"What is the first step in Port making after the harvest, and how is it traditionally done?","options":{"a":"Slow extraction of colour and tannin, by long maceration","b":"Rapid extraction of colour and tannin, by foot treading","c":"Gentle whole-bunch pressing, to avoid extracting tannin","d":"Drying the grapes in the sun, to concentrate the sugar"},"notes":{"a":"The book stresses RAPID extraction from the skins.","b":"Correct: machines now also exist for this purpose.","c":"Port needs colour and tannin from the skins of black grapes.","d":"Sun-drying is used for PX Sherry, not Port."},"answer":"b","ctx":"The why (L3 stretch): fortification cuts the fermentation short, leaving little time on the skins.","src":"L2 book p. 118 (Port production)","cards":"L2-card-93"},{"id":"Q-L2-25-19","level":"L2","lo":"LO5","ch":"25","topic":"Inexpensive Ruby Port","trap":"Reserve Ruby vs Ruby (known gap)","stem":"Which description best fits an inexpensive Ruby Port?","options":{"a":"Sweet and highly tannic, with very concentrated black fruit.","b":"Sweet and pale, with walnut, coffee and caramel notes.","c":"Dry and pale, with bread dough and almond flavours.","d":"Sweet and simple, with lower tannin and some red fruit."},"notes":{"a":"That fits Vintage Port.","b":"Walnut, coffee and caramel come from long oxidative ageing (aged tawny styles).","c":"That describes Fino Sherry; all Port is sweet.","d":"Correct: per the book; other ruby styles have more tannin and intensity."},"answer":"d","ctx":"Reserve Ruby uses better-quality wines with greater flavour intensity.","src":"L2 book p. 118 (Ruby-style Ports)","cards":"L2-card-93, L2-card-94"},{"id":"Q-L2-25-20","level":"L2","lo":"LO5","ch":"25","topic":"Reserve Ruby maturation","trap":"Reserve Ruby vs Ruby (known gap)","stem":"Why are some Reserve Ruby Ports matured for longer than standard Ruby Ports?","options":{"a":"To let the wines of a single vintage be declared.","b":"To develop a tawny colour and walnut and caramel notes.","c":"To build a thick deposit so the wine must be decanted.","d":"To soften the wine and integrate the added alcohol."},"notes":{"a":"Declaring a single vintage relates to Vintage Port, not Reserve Ruby.","b":"That comes from long oxidative ageing in small barrels (tawny styles).","c":"That is Vintage Port, after long maturation in bottle.","d":"Correct: per the book; Reserve Ruby also uses better-quality, more intense wines."},"answer":"d","ctx":"Reserve Ruby = better wines + more intensity + sometimes longer maturation. Still a blend of vintages.","src":"L2 book p. 118 (Ruby-style Ports)","cards":"L2-card-94"},{"id":"Q-L2-25-21","level":"L2","lo":"LO5","ch":"25","topic":"LBV Port","trap":"LBV vs Reserve Ruby","stem":"How does a Late Bottled Vintage (LBV) Port differ from a Reserve Ruby Port?","options":{"a":"It is a blend of several older vintages.","b":"It is pale and simple, with low tannin.","c":"It contains wines from a single vintage.","d":"It is aged oxidatively in small barrels."},"notes":{"a":"That fits Reserve Ruby and most Ports; LBV is from one vintage.","b":"That describes inexpensive Tawny Port; LBV is a deeply coloured ruby style.","c":"Correct: otherwise the book says LBV is similar in style to a Reserve Ruby.","d":"That is how the best tawny styles get their colour."},"answer":"c","ctx":"","src":"L2 book p. 118 (Ruby-style Ports)","cards":"L2-card-94, L2-card-22"},{"id":"Q-L2-25-22","level":"L2","lo":"LO5","ch":"25","topic":"Vintage Port","trap":"NOT stem","stem":"Which of these is NOT a characteristic of Vintage Port?","options":{"a":"Low in tannin and ready to drink on release","b":"Throws a thick deposit, so needs decanting","c":"Made only in years that producers declare","d":"Turns from ruby to garnet as it ages"},"notes":{"a":"Correct: Vintage Port is high in tannin and can mature in bottle for at least 20 years.","b":"True: a thick deposit forms as it matures in bottle.","c":"True: producers only 'declare' a Vintage Port in the best years.","d":"True: it also develops dried fruit, leather and forest floor."},"answer":"a","ctx":"","src":"L2 book p. 119 (Vintage Port)","cards":"L2-card-94"},{"id":"Q-L2-25-23","level":"L2","lo":"LO5","ch":"25","topic":"Aged Tawny style","trap":"","stem":"A sweet Port is brown, with complex dried fruit, walnut, coffee and caramel notes. Which style is it MOST LIKELY to be?","options":{"a":"20 Year Old Tawny Port","b":"Reserve Ruby Port","c":"Late Bottled Vintage Port","d":"Inexpensive Tawny Port"},"notes":{"a":"Correct: long oxidative ageing in small barrels gives the brown colour and these notes.","b":"A ruby style: deep colour and more intense cooked black fruit.","c":"A ruby style: deep colour and cooked black fruit.","d":"Simple, fruity, low in tannin and pale; not complex oxidative notes."},"answer":"a","ctx":"Age indications on the best tawnies: 10, 20, 30 or 40 years.","src":"L2 book p. 118-119 (Port styles)","cards":"L2-card-94, L2-card-22"},{"id":"Q-L2-25-24","level":"L2","lo":"LO5","ch":"25","topic":"Inexpensive Tawny Port","trap":"not all Tawny is long-aged","stem":"How does an inexpensive wine labelled simply 'Tawny Port' differ from a tawny with an indication of age?","options":{"a":"It comes from a single vintage, stated on the label.","b":"It is simple and fruity, pale, with low tannin.","c":"It is high in tannin and needs years in bottle.","d":"It is more complex, with stronger walnut and coffee."},"notes":{"a":"The single-vintage Ports in the book are LBV and Vintage.","b":"Correct: per the book; age-indicated tawnies are complex, from long oxidative ageing.","c":"That describes Vintage Port.","d":"Reversed: complexity comes from the long ageing of age-indicated tawnies."},"answer":"b","ctx":"","src":"L2 book p. 119 (Tawny-style Ports)","cards":"L2-card-94"},{"id":"Q-L3-24-01","level":"L3","lo":"Stretch (L2 LO5)","ch":"24","topic":"Vintage rules","trap":"Vintage Champagne = 100% one year (known gap)","stem":"How does the meaning of 'Vintage' on a Champagne label compare with its meaning in some other sparkling wine regions?","options":{"a":"Champagne: one year only; some regions allow a little from other years.","b":"Both require 100% from one year, so the term means the same everywhere.","c":"Neither has a rule: 'Vintage' simply means the best wine of the house.","d":"Champagne allows a little from other years; some regions require one only."},"notes":{"a":"Correct: as stated on L3 p. 178.","b":"L3 says some other appellations allow a small percentage of other years.","c":"That is closer to Prestige Cuvée, which L3 says is not a labelling term.","d":"Reversed: in Champagne the wine must come from a single year."},"answer":"a","ctx":"(2016 edition; may have changed.) Vintage Champagne is made only in the best years.","src":"L3 book (2016) ch 41, p. 178","cards":"L2-card-22, L3-stretch-41"},{"id":"Q-L3-24-02","level":"L3","lo":"Stretch (L2 LO5)","ch":"24","topic":"Meunier in the Marne","trap":"","stem":"Why does Meunier predominate in Champagne's Vallée de la Marne?","options":{"a":"It buds late, so it avoids the area's frequent spring frosts.","b":"It gives the most body, the backbone of most Champagne blends.","c":"It thrives on chalk, which is found only in this sub-region.","d":"It buds early, so it makes the most of a short season."},"notes":{"a":"Correct: L3 p. 180; it also gives fruity flavours, useful for wines made to drink young.","b":"That is Pinot Noir's role (Montagne de Reims, Côte des Bar).","c":"Chalk dominates the whole region; Chardonnay leads in the Côte des Blancs.","d":"The reverse: L3 says it buds LATE, avoiding spring frosts."},"answer":"a","ctx":"Chardonnay: Côte des Blancs (citrus, floral, high acid). Pinot Noir: Montagne de Reims, Côte des Bar (body, red fruit).","src":"L3 book (2016) ch 42, p. 179-180","cards":"L3-stretch-41"},{"id":"Q-L3-24-03","level":"L3","lo":"Stretch (L2 LO5)","ch":"24","topic":"Transfer method","trap":"","stem":"What is the main advantage of the transfer method over the traditional method?","options":{"a":"It avoids the costly processes of riddling and disgorgement.","b":"It allows the wine to be labelled 'Traditional Method'.","c":"It adds more autolytic character by stirring the lees in tank.","d":"It avoids the second fermentation, so it is quicker to make."},"notes":{"a":"Correct: after lees ageing, bottles are emptied into a pressurised tank, filtered and rebottled.","b":"L3 says transfer-method wines often state 'bottle-fermented' instead.","c":"Stirring the lees with paddles is a tank-method option, not the transfer method's aim.","d":"There is still a second fermentation in bottle, as in the traditional method."},"answer":"a","ctx":"(2016 edition; may have changed.) Not an L2 method: at L2 the bottle-fermentation method to know is the traditional method.","src":"L3 book (2016) ch 41, p. 175, 177","cards":"L3-stretch-40"},{"id":"Q-L3-24-04","level":"L3","lo":"Stretch (L2 LO5)","ch":"24","topic":"Lees after autolysis","trap":"","stem":"Once yeast autolysis is complete, what is the benefit of keeping a sparkling wine in contact with its lees?","options":{"a":"The lees absorb colour from the black grapes used.","b":"The lees slowly ferment the sugar from the dosage.","c":"Lees contact can keep the wine fresh for years.","d":"The lees keep adding more bread and toast flavour."},"notes":{"a":"Not given in L3; colour is limited by gentle pressing of whole bunches.","b":"Dosage is added after disgorgement, once the lees have been removed.","c":"Correct: L3 p. 174 says keeping the lees in contact can maintain the wine's freshness for years.","d":"These compounds are released DURING autolysis; the stem says it is complete."},"answer":"c","ctx":"Autolysis usually lasts four to five years, but has been known to last up to ten.","src":"L3 book (2016) ch 41, p. 174","cards":"L3-stretch-40"},{"id":"Q-L3-24-05","level":"L3","lo":"Stretch (L2 LO5)","ch":"24","topic":"Asti vs tank method","trap":"","stem":"How does the Asti method differ from the tank method used for dry wines such as Prosecco?","options":{"a":"It involves only one alcoholic fermentation, not two.","b":"It involves a second fermentation in the bottle, not a tank.","c":"It keeps the wine on its lees for months to add autolysis.","d":"It uses a dry base wine and adds sugar at the end."},"notes":{"a":"Correct: juice ferments once in a pressurised tank and is stopped at about 7% abv.","b":"Both use pressurised tanks; bottle fermentation is the traditional method.","c":"Asti has no autolytic character, which would detract from Muscat's fruit.","d":"It starts from juice, not a dry base wine; the sweetness is unfermented sugar."},"answer":"a","ctx":"Asti does not benefit from ageing and should be drunk as young as possible.","src":"L3 book (2016) ch 41, p. 177; ch 42, p. 182","cards":"L3-stretch-40"},{"id":"Q-L3-24-06","level":"L3","lo":"Stretch (L2 LO5)","ch":"24","topic":"Sparkling sweetness terms","trap":"Demi-Sec sounds dry","stem":"Which list puts these EU sparkling wine sweetness terms in order from driest to sweetest?","options":{"a":"Brut Nature, Demi-Sec, Brut, Doux","b":"Brut Nature, Brut, Demi-Sec, Doux","c":"Brut, Brut Nature, Demi-Sec, Doux","d":"Brut Nature, Brut, Doux, Demi-Sec"},"notes":{"a":"Demi-Sec (medium sweet) is sweeter than Brut.","b":"Correct: 0-3, 0-12, 32-50 and 50+ g/L residual sugar in the L3 table.","c":"Brut Nature (no dosage allowed) is drier than Brut.","d":"Doux (50+ g/L) is sweeter than Demi-Sec."},"answer":"b","ctx":"(2016 edition; may have changed.) Brut Nature is also called Zéro Dosage: no dosage sugar added.","src":"L3 book (2016) ch 41, p. 174, 177","cards":"L2-card-88, L2-card-22"},{"id":"Q-L3-25-02","level":"L3","lo":"Stretch (L2 LO5)","ch":"25","topic":"Why Palomino","trap":"","stem":"Why is Palomino considered ideal for Sherry production?","options":{"a":"It is high in acid, which balances the added spirit.","b":"It is neutral and low in acid, so ageing defines the style.","c":"It is very aromatic, giving Fino its almond character.","d":"It has thin skins, so it is ideal for drying in the sun."},"notes":{"a":"Palomino is naturally low in acid.","b":"Correct: L3 p. 184: styles are largely set by biological or oxidative maturation.","c":"Palomino lacks obvious varietal aromas.","d":"That is Pedro Ximénez, used for sweet Sherries."},"answer":"b","ctx":"","src":"L3 book (2016) ch 43, p. 184","cards":"L3-stretch-42"},{"id":"Q-L3-25-03","level":"L3","lo":"Stretch (L2 LO5)","ch":"25","topic":"Flor conditions","trap":"NOT stem","stem":"Which of these conditions does flor NOT favour?","options":{"a":"Cool to moderate temperatures","b":"High levels of humidity","c":"High summer temperatures","d":"Wine at about 15% abv"},"notes":{"a":"Flor favours these, so it grows most vigorously in spring and autumn.","b":"Flor favours high humidity (L3 p. 187).","c":"Correct: flor favours cool to moderate temperatures and dies back in summer and winter.","d":"Ideal: wines for biological ageing are fortified to 15-15.5% abv."},"answer":"c","ctx":"Flor feeds on alcohol and oxygen, making acetaldehyde, the source of Fino's distinctive flavour.","src":"L3 book (2016) ch 43, p. 185, 187","cards":"L3-stretch-42"},{"id":"Q-L3-25-04","level":"L3","lo":"Stretch (L2 LO5)","ch":"25","topic":"First classification","trap":"","stem":"A Palomino base wine comes from a cool coastal vineyard and was fermented at a low temperature. Which ageing route is it MOST likely to be classified for?","options":{"a":"Refortification straight away, as for Amontillado","b":"Oxidative ageing without flor, as for Oloroso","c":"Biological ageing under flor, as for Fino","d":"Blending with PX, as for a Cream Sherry"},"notes":{"a":"Amontillado spends time under flor FIRST, and is refortified later.","b":"More likely for grapes from warmer inland vineyards and/or warmer ferments.","c":"Correct: L3 p. 185: cooler coastal grapes and/or cooler ferments tend to suit biological ageing.","d":"Cream is a sweetened style; the first classification is biological vs oxidative."},"answer":"c","ctx":"Lighter, paler wines with finesse go to biological ageing; darker, richer ones to oxidative.","src":"L3 book (2016) ch 43, p. 185","cards":"L3-stretch-42"},{"id":"Q-L3-25-05","level":"L3","lo":"Stretch (L2 LO5)","ch":"25","topic":"Douro schist","trap":"","stem":"How can vines survive the very hot, dry summers of the Douro Valley?","options":{"a":"Albariza soil stores winter rain and forms a crust in summer.","b":"Chalk soils drain well but retain water in dry periods.","c":"Drip irrigation draws water from the Douro River in summer.","d":"Schist bedrock fractures vertically, so roots reach deep water."},"notes":{"a":"That is Jerez (Sherry), not the Douro.","b":"That is Champagne's soil, as described in L3.","c":"Not the L3 explanation; the vertically fractured schist is.","d":"Correct: L3 p. 190: the roots reach reserves built up by the winter rains."},"answer":"d","ctx":"The Douro gets hotter and drier from west (Baixo Corgo) to east.","src":"L3 book (2016) ch 44, p. 190","cards":"L3-stretch-43"},{"id":"Q-L3-25-06","level":"L3","lo":"Stretch (L2 LO5)","ch":"25","topic":"LBV vs Vintage Port","trap":"","stem":"Why are most LBV Ports ready to drink on release, unlike Vintage Port?","options":{"a":"They blend several vintages to soften the tannins.","b":"They are bottled within two years and left unfiltered.","c":"They age 4-6 years in large oak and are fined and filtered.","d":"They age for decades in small barrels before bottling."},"notes":{"a":"LBV must be made from a single vintage.","b":"Closer to Vintage Port: bottled by the third year, unfined and unfiltered.","c":"Correct: L3 p. 193; a few unfiltered LBVs are closer to Vintage Port and may need decanting.","d":"That is long oxidative ageing, as for tawny with an indication of age."},"answer":"c","ctx":"(2016 edition; may have changed.) Links to L2: LBV is similar in style to a Reserve Ruby but from a single vintage (L2 book p. 118).","src":"L3 book (2016) ch 44, p. 192-194","cards":"L3-stretch-44"},{"id":"Q-L3-25-07","level":"L3","lo":"Stretch (L2 LO5)","ch":"25","topic":"Tawny age indications","trap":"average age, not minimum","stem":"What does '20 Years Old' on a Tawny Port label indicate?","options":{"a":"Its character is typical of an average age of 20 years.","b":"The wine was bottled from a single vintage 20 years ago.","c":"The wine has aged in bottle for 20 years before release.","d":"Every wine in the blend has been aged for at least 20 years."},"notes":{"a":"Correct: L3 p. 194: an average age, not the age of the youngest wine in the blend.","b":"Age-indicated tawnies are blends; the book's single-vintage Ports are LBV and Vintage.","c":"The ageing is in barrels (pipes); tawnies do not benefit from bottle ageing.","d":"No: the stated age is an average, not a minimum for each component."},"answer":"a","ctx":"(2016 edition; may have changed.) The label must state the bottling year, as these wines lose freshness after bottling.","src":"L3 book (2016) ch 44, p. 193-194","cards":"L2-card-94, L3-stretch-44"},{"id":"Q-L2-24-25","level":"L2","lo":"LO5","ch":"24","topic":"Prosecco grape","trap":"","stem":"Which grape variety is used to make the base wine for Prosecco DOC?","options":{"a":"Chardonnay","b":"Garganega","c":"Glera","d":"Moscato"},"notes":{"a":"A Champagne grape; Prosecco is made from Glera.","b":"The grape of Soave, a still white from the Veneto.","c":"Correct: a white variety giving light- to medium-bodied wines with pear, melon and blossom (p. 115).","d":"Moscato (Muscat) is the grape of Asti DOCG, also from Italy."},"answer":"c","ctx":"Hook: Glera = Prosecco; Moscato = Asti.","src":"L2 book p. 115 (Prosecco)","cards":"L2-card-90"},{"id":"Q-L2-24-26","level":"L2","lo":"LO5","ch":"24","topic":"Asti grape","trap":"Barbera d'Asti, not Asti (known gap)","stem":"Which grape variety is Asti DOCG made from, and what aromas does it give?","options":{"a":"Moscato, giving blossom, grape and peach","b":"Cortese, giving apple, lemon and pear","c":"Barbera, giving red cherry and red plum","d":"Glera, giving pear, melon and blossom"},"notes":{"a":"Correct: Asti DOCG is sweet, fruity and light-bodied, from Piemonte (p. 115).","b":"Cortese makes still, dry Gavi DOCG, also in Piemonte.","c":"Barbera makes the still red Barbera d'Asti DOCG; don't confuse the two.","d":"Glera is the grape of Prosecco DOC."},"answer":"a","ctx":"Hook: Moscato = Asti; Barbera = Barbera d'Asti (still red); Cortese = Gavi.","src":"L2 book p. 115 (Asti)","cards":"L2-card-90"}];

// ---------- derived stats ----------
function latestByQ(){ const m={}; for(const a of attempts){ for(const [qid,r] of Object.entries(a.answers||{})){ if(!m[qid]||r.at>m[qid].at) m[qid]={credit:r.credit,at:r.at,pick:r.pick}; } } return m; }
function avgOf(ids,lat){ return ids.length? ids.reduce((s,id)=>s+lat[id].credit,0)/ids.length : null; }
const DAY=864e5, INTERVALS=[1,3,7,21,60];
const dkey=iso=>new Date(iso).toLocaleDateString("en-CA");
let QST={}; // qid -> {first,last,streak,mastered,due}
function buildQST(){ const h={}; for(const a of attempts) for(const [qid,r] of Object.entries(a.answers||{})) if(byId[qid]) (h[qid]=h[qid]||[]).push(r);
  const out={}; for(const [qid,arr] of Object.entries(h)){ arr.sort((x,y)=>x.at.localeCompare(y.at)); const last=arr[arr.length-1], days=new Set();
    for(let i=arr.length-1;i>=0;i--){ if(arr[i].credit<1) break; days.add(dkey(arr[i].at)); }
    const streak=days.size, base=new Date(dkey(last.at)+"T00:00:00").getTime();
    const due=last.credit<1? base+DAY : base+INTERVALS[Math.min(streak,INTERVALS.length)-1]*DAY;
    out[qid]={first:arr[0],last,streak,mastered:last.credit===1&&streak>=2,due,n:arr.length}; }
  QST=out; return out; }
function stats(){
  buildQST(); const lat=latestByQ(); const ids=Object.keys(QST);
  const l2=ids.filter(id=>byId[id].level==="L2"); const fst={}; for(const id of ids) fst[id]=QST[id].first;
  let wsum=0,wacc=0,wf=0,have=[];
  for(const [lo,k] of Object.entries(MOCK)){ const a=l2.filter(id=>byId[id].lo===lo); if(a.length){wsum+=k;wacc+=k*avgOf(a,lat);wf+=k*avgOf(a,fst);have.push(lo);} }
  const now=Date.now(), due=l2.filter(id=>QST[id].due<=now).sort((x,y)=>QST[x].due-QST[y].due);
  return {lat,fst,ids,l2,acc:avgOf(l2,lat),proj:wsum?wacc/wsum:null,ready:wsum?wf/wsum:null,have,missed:ids.filter(id=>lat[id].credit<1),due};
}

xpensive"],["Crozes-Hermitage","Larger, flatter","","","","Less intense","","Cheaper (higher yields, mechanisation)"],["Languedoc-Roussillon (Minervois, Pays d'Oc)","Ripens reliably","","","","","","Blends (Minervois) or Pays d'Oc IGP"],["South Eastern Australia","Warm inland","","","","","","High volume"],["Barossa Valley","Warm","Full","","High, ripe","Cooked black fruit, black pepper","Often vanilla/coconut oak","Very old vines, low yields"],["Hunter Valley","Very hot; cloud, sea breezes slow ripening","Medium","","","Fresh black fruit; ages to earth, meat","",""]]}},"orders":[{"id":"pradikat","title":"Prädikat categories","prompt":"Order the Prädikat categories by minimum sugar required at harvest, lowest first.","items":["Kabinett","Spätlese","Auslese","Beerenauslese (BA)","Trockenbeerenauslese (TBA)"],"note":"Eiswein is listed fourth (before BA) but needs the SAME minimum sugar as BA, so it is left out of this drill.","src":"L2 cards 15, 16"},{"id":"spain-ageing","title":"Spanish ageing terms","prompt":"Order the Spanish ageing terms from least to most ageing.","items":["Joven (Genérico in Rioja)","Crianza","Reserva","Gran Reserva"],"src":"L2 card 17"},{"id":"burgundy-hierarchy","title":"Burgundy quality hierarchy","prompt":"Order the Burgundy hierarchy from lowest to highest.","items":["Regional (Bourgogne AOC)","Village (e.g. Gevrey-Chambertin AOC)","Premier Cru","Grand Cru"],"src":"L2 card 19"},{"id":"grape-stages","title":"Grape formation and ripening","prompt":"Order the stages of grape formation and ripening.","items":["Flowering","Fruit set","Véraison","Ripening"],"src":"L2 cards 39, 39b"},{"id":"red-winemaking","title":"Red winemaking","prompt":"Order the stages of red winemaking.","items":["Crushing","Alcoholic fermentation (with skins)","Draining","Pressing","Storage or maturation","Packaging"],"src":"L2 card 43"},{"id":"white-winemaking","title":"White winemaking","prompt":"Order the stages of white winemaking.","items":["Crushing","Pressing","Alcoholic fermentation","Storage or maturation","Packaging"],"src":"L2 card 44"},{"id":"sat-order","title":"SAT order","prompt":"Order the sections of the WSET Level 2 Systematic Approach to Tasting.","items":["Appearance","Nose","Palate","Conclusions"],"src":"L2 card 02"},{"id":"quality-levels","title":"Quality levels","prompt":"Order the SAT quality levels from lowest to highest.","items":["Faulty","Poor","Acceptable","Good","Very good","Outstanding"],"src":"L2 cards 02, 07"},{"id":"white-colour","title":"White wine colours","prompt":"Order the SAT white wine colours as on the scale (youngest-looking first).","items":["Lemon-green","Lemon","Gold","Amber","Brown"],"note":"Scale from card 02; card 10 confirms ageing goes lemon -> gold -> amber.","src":"L2 cards 02, 10"},{"id":"red-ageing","title":"Red wine colour with age","prompt":"Order the colours a red wine passes through as it ages in bottle.","items":["Ruby","Garnet","Tawny","Brown"],"src":"L2 card 10"},{"id":"service-temps","title":"Service temperatures","prompt":"Order these styles from coldest to warmest service temperature.","items":["Sweet wine (6-8°C)","Light-/medium-bodied white and rosé (7-10°C)","Full-bodied white (10-13°C)","Medium-/full-bodied red (15-18°C)"],"note":"Sparkling (6-10°C) and light-bodied red (13-18°C) left out because their ranges overlap others; the styles kept rank the same way at both ends of their ranges.","src":"L2 card 26"},{"id":"open-still","title":"Opening still wine","prompt":"Order the steps for opening a bottle of still wine (cork or synthetic cork).","items":["Remove the top of the capsule","Clean the neck","Centre the corkscrew and draw the cork gently","Wipe the inside and outside of the neck"],"src":"L2 card 28"}],"maps":{"burgundy":{"title":"Burgundy (and Beaujolais)","axis":"north-south","chapters":[6,10,17],"note":"Schematic, not to scale. Group order is stated: Chablis north, Côte d'Or (Côte de Nuits = northern half, Côte de Beaune = southern half), Mâconnais south; Beaujolais is a separate region directly south of Burgundy, with Beaujolais Villages in the north and Beaujolais AOC in the flat south. Order of villages WITHIN each Côte, and of Mâcon vs Pouilly-Fuissé, is not stated in the L2 sources; they are listed in textbook order, not geographic order. Bourgogne AOC covers the whole region.","groups":[{"label":"Chablis","items":["Chablis AOC"]},{"label":"Côte de Nuits (Côte d'Or, northern half)","items":["Gevrey-Chambertin","Nuits-Saint-Georges"]},{"label":"Côte de Beaune (Côte d'Or, southern half)","items":["Beaune","Pommard","Meursault","Puligny-Montrachet"]},{"label":"Mâconnais","items":["Mâcon AOC","Pouilly-Fuissé"]},{"label":"Beaujolais","items":["Beaujolais Villages (north; contains the 10 crus, e.g. Fleurie)","Beaujolais AOC (flat, fertile south)"]}],"src":"L2 cards 19, 48, 58, 59, 75; L2 textbook p. 52-53, 68-69, 94-95"},"bordeaux":{"title":"Bordeaux","axis":"west-east","chapters":[9,11,14,15],"note":"Schematic, not to scale. Left Bank = west and south of the Gironde/Garonne; Right Bank = north and east of the Gironde and Dordogne (the Gironde is where the Garonne and Dordogne meet). Within the Left Bank, Haut-Médoc is north of Bordeaux city and Graves south of it; Sauternes' position relative to Graves, Margaux vs Pauillac, and Saint-Émilion vs Pomerol are not stated in L2 sources, so no order is implied there. Bordeaux AOC/Supérieur can come from anywhere in the region.","groups":[{"label":"Left Bank: Haut-Médoc (north of Bordeaux city)","items":["Margaux","Pauillac"]},{"label":"Left Bank: Graves (south of Bordeaux city)","items":["Graves AOC","Pessac-Léognan"]},{"label":"Left Bank: Sauternes","items":["Sauternes AOC"]},{"label":"Right Bank","items":["Saint-Émilion","Pomerol"]}],"src":"L2 cards 21, 21b, 55, 69, 71; L2 textbook p. 82"},"rhone":{"title":"Rhône Valley","axis":"north-south","chapters":[16,18],"note":"Schematic, not to scale. The Rhône Valley follows the river down to the Mediterranean. Côte Rôtie is in the ]},{"g":"Montepulciano","r":[["GIs","Italy: Montepulciano d'Abruzzo"]]}],"24":[{"g":"Sparkling wines","r":[["Grapes","Chardonnay, Pinot Noir, Meunier, Moscato (Muscat), Glera"],["GIs","France: Champagne · Italy: Asti, Prosecco · Spain: Cava · Other countries: South Africa, USA, Australia, New Zealand"],["Methods","Bottle fermentation: traditional method · Tank method: dry styles, sweet styles"],["Label terms","Brut, Demi-Sec, Vintage/Non-Vintage, Traditional Method, Cap Classique"]]}],"25":[{"g":"Sherry","r":[["GI","Spain: Sherry"],["Process","Fortification after fermentation; ageing in contact with flor; ageing in contact with oxygen"],["Label terms","Fino, Amontillado, Oloroso, Pale Cream, Medium, Cream, PX (Pedro Ximénez)"]]},{"g":"Port","r":[["GI","Portugal: Port"],["Process","Fortification to interrupt fermentation; ageing"],["Label terms","Ruby, Reserve Ruby, Late Bottled Vintage (LBV), Vintage, Tawny"]]}]},"cards":{"L2-card-01":{"head":"PREPARING FOR TASTING","src":"book p. 7-8","body":"- Environment: good lighting, free of strong odours, space for glasses and notes, spittoons.\n- You: clean palate (no toothpaste or strongly flavoured food); no perfume/aftershave.\n- Glass: odourless, colourless, transparent, no residues. ISO glass. Two key features:\n  1. Rounded bowl - aids swirling to release aromas.\n  2. Inward-sloping walls - capture aromas at the top of the glass.\n- Sample: 5 cL. Enough to assess appearance, nose and palate; small enough to swirl in the base of the bowl without spilling."},"L2-card-02":{"head":"WSET LEVEL 2 SYSTEMATIC APPROACH TO TASTING WINE","src":"book p. 14","body":"APPEARANCE\n- Clarity: clear - hazy (faulty?)\n- Intensity: pale - medium - deep\n- Colour, white: lemon-green - lemon - gold - amber - brown\n- Colour, rosé: pink - pink-orange - orange\n- Colour, red: purple - ruby - garnet - tawny - brown\nNOSE\n- Condition: clean - unclean (faulty?)\n- Intensity: light - medium - pronounced\n- Aroma characteristics: e.g. primary, secondary, tertiary\nPALATE\n- Sweetness: dry - off-dry - medium - sweet\n- Acidity: low - medium - high\n- Tannin: low - medium - high\n- Alcohol: low - medium - high\n- Body: light - medium - full\n- Flavour intensity: light - medium - pronounced\n- Flavour characteristics: e.g. primary, secondary, tertiary\n- Finish: short - medium - long\nCONCLUSIONS\n- Quality level: faulty - poor - acceptable - good - very good - outstanding\n\nL2 rosé colours: pink - pink-orange - orange (p. 14). (L3 stretch only: the 2016 L3 book says \"salmon\"; in the L2 exam always say \"pink-orange\".)"},"L2-card-03":{"head":"APPEARANCE DETAIL","src":"book p. 8-9","body":"- Clarity: most wines are clear. Hazy = unusually high suspended particles; may indicate a fault (identify on nose/palate) or that the wine was not clarified before packaging.\n- Intensity: glass at 45 degrees, look from core to rim. Whites always look colourless right at the rim. White with broad watery rim = pale; pigment almost to rim = deep. Red lightly pigmented rim to core = pale (stem easy to see through upright glass); intensely pigmented to rim = deep (stem impossible to see).\n- Whites: lemon most common; noticeable green = lemon-green; hint of orange/brown = gold; very noticeable browning = amber or brown.\n- Reds: ruby most common; noticeable blue/purple = purple; orange/brown but still more red than brown = garnet; more brown than red = tawny; no redness left = brown.\n- Rosé: pure pink = pink; pink with hint of orange = pink-orange; orange dominant = orange (very rare)."},"L2-card-04":{"head":"NOSE DETAIL","src":"book p. 9-10","body":"- Swirl, then a short sniff. A quick sniff before swirling can catch delicate aromas.\n- Condition: likely faulty if it smells of damp cardboard; honey, caramel or coffee (when not the expected style); or lacks freshness and expected fruit.\n- Aroma intensity: immediately apparent = pronounced; faint even after swirling = light; otherwise medium.\n- Primary = from the grapes or created during fermentation.\n- Secondary = post-fermentation winemaking: oak (vanilla, smoke), malolactic conversion (cream, butter), autolysis in sparkling wines (toasted bread, biscuit).\n- Tertiary = ageing. Oxidative (e.g. long period in oak) -> coffee, caramel. Protected from oxygen (e.g. long period in bottle) -> petrol (gasoline), honey, mushroom. In both, fruit becomes less fresh and can take on dried-fruit character.\n- Not every wine has primary, secondary and tertiary aromas."},"L2-card-04b":{"head":"NOSE DETAIL","src":"book p. 9-10","body":"- Character and clarity of aromas account for much of the difference between basic and very fine wines (p. 9). Simple wine = few primary aromas, often in one cluster; complex = many, across clusters. Most wines are fruity; also check for floral, herbaceous etc. (p. 10)."},"L2-card-05":{"head":"PALATE: SWEETNESS, ACIDITY, TANNIN","src":"book p. 11","body":"- Sweetness: dry = none detectable; off-dry = tiny detectable amount; medium = distinct sugar but generally not sweet enough for most desserts; sweet = sugar is the prominent feature (e.g. Sauternes, Port).\n- Acidity: tingling, makes mouth water; more acid = more and longer watering. Sugar and acid mask each other (sweet wine acidity seems less obvious than e.g. Chablis), but mouth-watering is always the reliable guide. Alcohol burn can feel like acidity - check mouth-watering.\n- Tannin: mostly from grape skins during fermentation; binds to saliva, drying, rough; can taste bitter.\n- All wines have acid: even low-acid wines have noticeable acidity; high-acid wines are still less acidic than vinegar (p. 11)."},"L2-card-06":{"head":"PALATE: ALCOHOL, BODY, FLAVOUR, FINISH","src":"book p. 12-13","body":"- Alcohol bands, still wines: low = below 11% abv; medium = 11-13.9% abv; high = 14% abv and above.\n- Alcohol bands, fortified wines: low = 15-16.4% abv; medium = 16.5-18.4% abv; high = 18.5% abv and above.\n- Body: overall impression of how the wine feels (touch, not taste). Created by sugar, acidity, tannin and alcohol together. Alcohol is the main factor for most wines. Sugar adds body; high acidity makes it feel lighter; high ripe tannin feels fuller; low unripe tannin seems harsher, thinner, lighter.\n- Flavour intensity: usually matches aroma intensity, but warming in the mouth can make spice more prominent; floral can be less prominent.\n- Finish: count only the persistence of DESIRABLE sensations. If pleasant flavours vanish and a structural component (e.g. acid) lingers = short. Flavours last as long as or beyond structural components = long."},"L2-card-06b":{"head":"PALATE: ALCOHOL, BODY, FLAVOUR, FINISH","src":"book p. 12-13","body":"- Alcohol: high = heavier in the mouth plus a hot, burning sensation (pain receptors), especially after spitting or swallowing; low = can seem watery unless e.g. sugar adds body (p. 12).\n- Flavour characteristics: generally the same as the aromas on the nose; note any extra ones that appear as the wine warms in the mouth (p. 12)."},"L2-card-07":{"head":"QUALITY: FOUR CRITERIA","src":"book p. 13-14","body":"- Balance: e.g. sugar balanced by acidity; alcohol less burning if enough fruit intensity; high acid seems thin without enough fruit. Out of balance = rarely more than acceptable.\n- Length/finish: short finish = lower quality; how it finishes also matters (alcohol burn is negative).\n- Intensity: weak, dilute = seldom good; beyond a point more intensity is not necessarily better. Also called \"concentration\".\n- Complexity: desirable in many wines, but not all premium wines are complex; purity and definition can make a wine great (e.g. ice wines), and oak/tertiary could detract.\nScoring:\n- Outstanding = positive on all four.\n- Very good = positive on three, short on one.\n- Good = positive on two, short on two.\n- Acceptable = positive on one, short on three.\n- Poor = problems on all four.\n- Complexity can come from primary aromas alone, or from primary combined with secondary/tertiary. Example: very good = balanced, a range of flavours, medium intensity, but a short finish (p. 14)."},"L2-card-08":{"head":"WSET LEVEL 2 WINE-LEXICON: PRIMARY AROMAS","src":"book p. 15","body":"PRIMARY AROMAS AND FLAVOURS (the grape and alcoholic fermentation)\n- Floral: blossom, rose, violet\n- Green fruit: apple, pear, gooseberry, grape\n- Citrus fruit: grapefruit, lemon, lime, orange\n- Stone fruit: peach, apricot, nectarine\n- Tropical fruit: banana, lychee, mango, melon, passion fruit, pineapple\n- Red fruit: redcurrant, cranberry, raspberry, strawberry, red cherry, red plum\n- Black fruit: blackcurrant, blackberry, blueberry, black cherry, black plum\n- Herbaceous: green bell pepper (capsicum), grass, tomato leaf, asparagus\n- Herbal: eucalyptus, mint, fennel, dill, dried herbs\n- Spice: black/white pepper, liquorice\n- Fruit ripeness: unripe fruit, ripe fruit, dried fruit, cooked fruit\n- Other: wet stones, candy"},"L2-card-09":{"head":"WSET LEVEL 2 WINE-LEXICON: SECONDARY AND TERTIARY AROMAS","src":"book p. 15","body":"SECONDARY AROMAS AND FLAVOURS (post-fermentation winemaking)\n- Yeast (lees, autolysis, flor): biscuit, pastry, bread, toasted bread, bread dough, cheese, yogurt\n- Malolactic conversion: butter, cheese, cream\n- Oak: vanilla, cloves, coconut, cedar, charred wood, smoke, chocolate, coffee\nTERTIARY AROMAS AND FLAVOURS (maturation)\n- Red wine: dried fruit, leather, earth, mushroom, meat, tobacco, wet leaves, forest floor, caramel\n- White wine: dried fruit, orange marmalade, petrol (gasoline), cinnamon, ginger, nutmeg, almond, hazelnut, honey, caramel\n- Deliberately oxidised wines: almond, hazelnut, walnut, chocolate, coffee, caramel"},"L2-card-10":{"head":"BOTTLE AGEING CHANGES","src":"Chapter 5, book p. 49","body":"- Most wines do not improve in bottle: fruit fades, replaced with vegetal notes.\n- Wines that age well OFTEN have high acidity, high sugar (sweet wines) and high tannin (reds). Above all, they NEED enough flavour concentration to evolve positively.\n- Whites: colour lemon -> gold -> amber, and DEEPER in intensity. Tertiary: dried apricot, honey, nut, spice.\n- Reds: colour ruby -> garnet -> tawny -> brown, and typically PALER in intensity. Tannins softer and smoother. Tertiary: fig, prune, meat, wet leaves. Deposits can form; decant if heavy."},"L2-card-11":{"head":"GEOGRAPHICAL INDICATIONS","src":"Chapter 4, book p. 36-37","body":"- A GI is a legally defined vineyard area: can be a whole region or country, or as small as one vineyard. Not every wine comes from a GI, but some statement of origin (e.g. country) is legally required.\n- GIs outside the EU: indicate where the grapes were grown; minimal restrictions on grapes or winemaking, so styles vary; consumers look to grape variety to predict style.\n- GIs inside the EU: also come with regulations on which grapes may be grown and how wines are made, so a relatively reliable guide to style.\n- PDO (Protected Designation of Origin): typically small areas, tightly defined rules; many of Europe's most famous wines.\n- PGI (Protected Geographical Indication): typically much wider areas, less strict rules, more flexibility on grapes and techniques; ranges from high-volume inexpensive acceptable wines to low-volume outstanding wines."},"L2-card-12":{"head":"PDO AND PGI LABELLING TERMS BY COUNTRY","src":"book p. 37","body":"- France: PDO = Appellation d'origine protégée (AOP) or Appellation d'origine contrôlée (AOC). PGI = Indication géographique protégée (IGP).\n- Italy: PDO = Denominazione di Origine Controllata (DOC), Denominazione di Origine Controllata e Garantita (DOCG). PGI = Indicazione Geografica Tipica (IGT).\n- Spain: PDO = Denominación de Origen (DO), Denominación de Origen Calificada (DOCa). PGI = Vino de la Tierra.\n- Germany: PDO = Qualitätswein, Prädikatswein. PGI = Landwein.\nExamples of PGIs named in the book: Pays d'Oc IGP (Languedoc-Roussillon), Veneto IGT, Vino de la Tierra, Landwein."},"L2-card-13":{"head":"OTHER GRAPE-GROWING LABEL TERMS","src":"book p. 38-39","body":"- Old Vine / Vieilles vignes: older vines give fewer grapes, more concentrated and complex. NOT legally defined.\n- Vintage: year the grapes were harvested. Southern hemisphere wine is about half a year older than a northern hemisphere wine of the same vintage.\n- Late Harvest (Vendanges tardives in France): picked much later; riper flavours, higher sugar, fuller body. Can be dry, off-dry, medium or sweet.\n- Botrytis/Noble Rot: very concentrated sugar and acid; nearly always sweet wines.\n- Icewine/Eiswein: healthy grapes left on the vine into winter, frozen, pressed before they thaw; ice and skins separated from a little concentrated liquid; sweet, concentrated, pure varietal character (p. 30).\n- Organic: grapes grown without most chemicals (some sprays still permitted).\n- In the EU the grape variety does not necessarily appear on PDO labels (e.g. Chablis = Chardonnay). Outside the EU wines are commonly varietally labelled."},"L2-card-13b":{"head":"OTHER GRAPE-GROWING LABEL TERMS","src":"book p. 38-39","body":"- Botrytis (noble rot): fungus makes tiny holes in ripe grapes, water evaporates, concentrating sugars, acids, flavours. Must grow on ripe grapes, with damp misty mornings then warm, dry afternoons; otherwise it can easily destroy the grapes (p. 30).\n- Vintage: most wines are best young, so it shows whether a wine is past its best; for age-worthy wines, whether it is at its best. In some regions weather varies considerably year to year, which matters when buying very expensive wines from prestigious regions (p. 38)."},"L2-card-14":{"head":"GERMANY: LANDWEIN, QUALITÄTSWEIN, PRÄDIKATSWEIN","src":"Chapter 8, book p. 60","body":"- Landwein: PGI; typically light-bodied, dry to off-dry.\n- Qualitätswein: PDO; must come from one of 13 winegrowing areas (e.g. Rheingau, Mosel); higher ripeness than Landwein; typically more intense flavour and fuller body.\n- Germany's cool climate means growers often struggle to ripen grapes, so much label terminology reflects ripeness (sugar) at harvest (p. 60)."},"L2-card-15":{"head":"GERMANY: PRÄDIKAT CATEGORIES 1-3","src":"book p. 60-61","body":"- Prädikatswein: higher minimum sugar than Qualitätswein; grapes from a single winegrowing area. Six Prädikat categories in ascending order of required sugar at harvest:\n  1. Kabinett - lightest, most delicate; green apple, lime, blossom.\n  2. Spätlese (late harvest) - more concentrated, fuller; riper citrus, some peach.\n  3. Auslese (selected harvest) - selected extra-ripe bunches; apricot, mango, dried fruit; can be trocken but most have some sweetness."},"L2-card-16":{"head":"GERMANY: PRÄDIKAT CATEGORIES 4-6 AND RULES","src":"book p. 60-61","body":"Six Prädikat categories continued (ascending order of required sugar):\n  4. Eiswein (ice wine) - grapes frozen on the vine; NO botrytis; vibrant fresh peach, apricot, mango, pineapple. Weather needed does not occur every year; tiny yields; high prices.\n  5. Beerenauslese / BA (selected berry harvest) - botrytis-concentrated bunches or berries; apricot, mango, dried fruit, honey. Always sweet.\n  6. Trockenbeerenauslese / TBA (selected dried berry harvest) - individually selected berries 'dried' by botrytis; rare, concentrated; flavours similar to BA but more intense (p. 61).\n  Exception to the ascending order: Eiswein and Beerenauslese require the SAME minimum sugar level.\n- Kabinett, Spätlese, Auslese can be dry; a dry Auslese is higher in alcohol than a dry Spätlese, which is higher than a dry Kabinett.\n- BA, TBA, Eiswein: sugars concentrated on the vine; naturally low alcohol and sweet; age for decades."},"L2-card-16b":{"head":"GERMANY: PRÄDIKAT CATEGORIES 4-6 AND RULES","src":"book p. 60-61","body":"- Sweetness terms: Trocken = dry; Halbtrocken = some sweetness."},"L2-card-17":{"head":"SPAIN: AGEING TERMS","src":"Chapter 19, book p. 99-100","body":"In order of ageing: Joven -> Crianza -> Reserva -> Gran Reserva.\n- Joven: young, fruity, no minimum ageing, typically released the year after vintage; primary fruit. Called Genérico in Rioja.\n- Crianza: aged in oak before release; gains secondary oak flavours (vanilla, smoke, coconut).\n- Reserva: extended ageing in oak and bottle; softer tannins, some cooked/dried fruit; primary, secondary and tertiary (dried fruit, mushrooms).\n- Gran Reserva: highest minimum ageing; most pronounced secondary and tertiary aromas.\n- These are national Spanish terms, not specific to Rioja DOCa. Some regions are stricter; many producers exceed minimums.\n- Only wines with enough flavour intensity, acidity and (reds) tannin suit long ageing.\n- Long-ageing an inferior wine makes it taste stale and lacking in fruit; a producer may choose not to make a Gran Reserva in some years (p. 100)."},"L2-card-18":{"head":"ITALY","src":"Chapter 23, book p. 109","body":"- Some wines named after region (Barolo DOCG, Barbaresco DOCG, Valpolicella DOC); some after grape + region (Barbera d'Asti DOCG = \"Barbera from Asti\").\n- Classico: grapes from the historic centre of a region; often hilliest part; typically more concentrated.\n- Riserva: DOC or DOCG wine aged for at least a set number of months before release."},"L2-card-19":{"head":"FRANCE: BURGUNDY AND BEAUJOLAIS HIERARCHIES","src":"","body":"Burgundy (Chapter 6, book p. 53), lowest to highest:\n  Regional (Bourgogne AOC, the broadest: covers all of Burgundy) -> Village (e.g. Gevrey-Chambertin AOC) -> Premier Cru (village name + Premier Cru; may name the vineyard) -> Grand Cru (own appellation; vineyard name + Grand Cru AOC; rarest, most age-worthy).\nBeaujolais (Chapter 17, book p. 95):\n  Beaujolais AOC (mostly flat, fertile south; high yields; lightest) -> Beaujolais Villages AOC (villages in the north; slopes, warm well-drained soils) -> 10 crus with own appellations (e.g. Fleurie AOC)."},"L2-card-20":{"head":"FRANCE: RHÔNE AND ALSACE HIERARCHIES","src":"","body":"Rhône (Chapter 18, book p. 98):\n  Côtes du Rhône AOC (covers the whole valley, but almost all from the south) -> Côtes du Rhône Villages AOC -> crus (North: Crozes-Hermitage, Hermitage, Côte Rôtie, Condrieu; South: Châteauneuf-du-Pape).\n  One hierarchy across North and South Rhône, similar to Beaujolais (p. 98).\nAlsace (Chapter 12, book p. 78):\n  Alsace AOC (usually labelled by grape; from 2021 vintage sweetness must be shown on a standardised scale) -> Alsace Grand Cru AOCs (specific vineyards, mostly on the steep foothills of the Vosges, facing east/south-east; more sunlight, so typically riper in flavour and fuller in body; typical grand cru grapes Pinot Gris, Riesling, Gewurztraminer). Vendanges tardives (VT) = late harvest, typically medium to sweet, from Pinot Gris, Riesling or Gewurztraminer; both Alsace and Alsace Grand Cru can be VT."},"L2-card-21":{"head":"FRANCE: BORDEAUX LABELLING TERMS","src":"","body":"Bordeaux (Chapters 14-15, book p. 82, 87):\n  - Regional: Bordeaux AOC; Bordeaux Supérieur AOC (slightly stricter rules on yields, ageing, minimum alcohol). Both typically Merlot-dominated; grapes can come from anywhere in the Bordeaux region.\n  - Left Bank: Haut-Médoc AOC, north of Bordeaux city (includes Margaux AOC, Pauillac AOC); Graves AOC, south of the city (includes Pessac-Léognan AOC). Cabernet Sauvignon typically dominant.\n  - Right Bank: Pomerol AOC; Saint-Émilion AOC (includes the more prestigious Saint-Émilion Grand Cru AOC); these two are the most important Right Bank AOCs. Merlot most important.\n  - Château: wine made from grapes grown on the producer's own land (not necessarily a grand building).\n  - Grand Cru Classé / Cru Classé: wines from classifications ranking the best châteaux in some sub-regions.\n  - Cru Bourgeois: Médoc wines NOT classified as Grand Cru Classé can apply to use this term."},"L2-card-21b":{"head":"FRANCE: BORDEAUX LABELLING TERMS","src":"","body":"- Gironde Estuary = where the Garonne and Dordogne meet (p. 82).\n  - Classified wines: some classifications are old, but widely seen as a strong quality signal; among Bordeaux's most expensive; can mature for many years or decades. Cru Bourgeois: mostly lower prices, but some very good to outstanding and long-lived (p. 87)."},"L2-card-22":{"head":"SPARKLING AND FORTIFIED LABEL TERMS","src":"Chapters 24-25","body":"- Traditional Method / Méthode traditionnelle: second fermentation in the bottle (book p. 112).\n- Brut: very small amount of sugar added, tastes dry. Demi-Sec: medium sweetness (book p. 113).\n- Non-vintage: blend of several vintages (most Champagne). Vintage Champagne: exceptional years only (book p. 113).\n- Champagne and Cava do not have to mention PDO status on the label (book p. 115).\n- Cap Classique: South African traditional-method sparkling wine (book p. 114).\n- Sherry: Pale Cream = sweetened Fino; Medium and Cream = often sweetened Amontillado or Oloroso; PX (Pedro Ximénez) = sweet, from sun-dried PX grapes (book p. 118).\n- Port: Ruby, Reserve Ruby, LBV (single vintage, similar to Reserve Ruby), Vintage Port (declared in the best years); Tawny with age indications 10, 20, 30 or 40 years; inexpensive \"Tawny Port\" is simple, fruity, pale (book p. 118-119)."},"L2-card-22b":{"head":"SPARKLING AND FORTIFIED LABEL TERMS","src":"Chapters 24-25","body":"- Many sparkling wines are non-vintage; vintage sparkling usually costs more than the same producer's non-vintage (p. 115)."},"L2-card-23":{"head":"FOOD AND WINE","src":"Chapter 2, book p. 16-18","body":"Two food components make wine taste \"harder\" (more drying and bitter, more acidic, less sweet, less fruity): SWEETNESS and UMAMI.\nTwo make wine taste \"softer\" (less drying and bitter, less acidic, sweeter, more fruity): SALT and ACID.\nFood generally affects wine more than the reverse, and more likely negatively.\n- Taste adapts to what you just ate (e.g. orange juice after toothpaste). Chocolate and thick creamy dishes coat the mouth and impair taste (p. 16)."},"L2-card-24":{"head":"FOOD AND WINE TABLE: FOOD IS... WINE SEEMS...","src":"book p. 17","body":"- Sweet: more drying and bitter, more acidic; less sweet and fruity. Rule: choose a wine sweeter than the dish.\n- Umami: more drying and bitter, more acidic; less sweet and fruity. Examples: cooked or dried mushrooms, air-dried meats, aged cheeses, miso.\n- Salty: less drying and bitter, less acidic; more fruity, more body. Salt softens tannin.\n- Acidic: less drying and bitter, less acidic; more sweet and fruity. (But if wine acidity is low, acidic food makes it seem less fruity.)\n- Highly flavoured: wine overwhelmed by the food flavours. Match flavour intensities.\n- Fatty/oily: wine seems less acidic. Acidic wine \"cuts through\" fat (very subjective).\n- Hot (chilli heat): alcohol in the wine seems more noticeable, and alcohol increases the burning sensation of chilli.\nIndividual sensitivities and preferences vary; take them into account.\n- Umami is hard to isolate: it tends to come with other tastes, such as salt, that balance its negative effects (p. 17)."},"L2-card-25":{"head":"STORAGE","src":"Chapter 3, book p. 19","body":"1. Long-term: cool, constant temperature (extremes and big swings damage wine).\n2. Away from strong sunshine and bright artificial light (light and heat lose fruit character).\n3. Cork-sealed bottles on their side so the cork stays moist (dry cork lets air in -> oxidation). Screwcaps can stand up."},"L2-card-26":{"head":"SERVICE TEMPERATURES","src":"book p. 21","body":"- Sweet wines (e.g. Sauternes): well chilled, 6-8°C (43-46°F)\n- Sparkling wines (e.g. Champagne): well chilled, 6-10°C (43-50°F)\n- Light-, medium-bodied white and rosé (e.g. Pinot Grigio): chilled, 7-10°C (45-50°F)\n- Full-bodied white (e.g. oaked Chardonnay): lightly chilled, 10-13°C (50-55°F)\n- Light-bodied red (e.g. Beaujolais): room temperature or lightly chilled, 13-18°C (55-64°F)\n- Medium-, full-bodied red (e.g. Shiraz): room temperature, 15-18°C (59-64°F)\n- Ice bucket: fill with ice AND cold water. Never heat wine (e.g. by a radiator); let it warm naturally in the room.\n- Room temperatures vary (air conditioning, central heating), so use the ranges. A guest's preferred temperature overrides the guidance. An insulated container can keep wine chilled (p. 19-21)."},"L2-card-27":{"head":"GLASSES AND SERVING","src":"book p. 20","body":"- Best glasses narrow at the rim (concentrates aromas). Red glasses slightly larger than white; sparkling in flutes or tulips.\n- Glasses completely clean, polished before use.\n- Before serving check: appearance (haze could mean fault), no bits floating, aroma for faults (e.g. wet cardboard, vinegar).\n- Keeping opened wine: fridge with cork in; vacuum systems (pump air out); inert gas systems (nitrogen, argon).\n- An opened wine slowly becomes stale (loses fresh character) as it reacts with air. Inert gases do not react with the wine; they keep air away from it (p. 20)."},"L2-card-28":{"head":"OPENING AND DECANTING","src":"book p. 22","body":"- Still wine (method applies only to cork or synthetic cork): remove top of capsule, clean the neck; centre the corkscrew, draw cork gently; wipe inside and outside of neck.\n- Sparkling: high pressure; chilling reduces it, but the cork can still fly out and injure someone. Remove foil, loosen wire cage, keep hand on cork from then on; bottle at an angle; hold the cork in one hand and the base of the bottle in the other, and TURN THE BOTTLE; release pressure with a quiet \"phut\".\n- Decanting (wines with heavy deposit; the deposit is natural, formed during bottle ageing of some reds): keep bottle horizontal (decanting basket), gently remove capsule top, clean shoulder and neck, remove cork gently, pour in front of a light, stop when deposit reaches the neck."},"L2-card-29":{"head":"COMMON FAULTS","src":"book p. 23","body":"- Cork taint: TCA (trichloroanisole), mainly from contaminated cork; \"corked\"; damp cardboard aromas; fruit muted, less fresh.\n- Failure of closure (oxidation): browner than expected; honey, caramel, coffee; lacks freshness and fruit. (Not a fault in oxidative styles or very old wines.)\n- Heat damage: too hot, direct sunlight or bright artificial light; loses freshness and fruit character quickly."},"L2-card-30":{"head":"KEY NUMBERS: TASTING, CLIMATE, WINEMAKING","src":"","body":"- Tasting sample: 5 cL (book p. 8).\n- Alcohol bands, still: low below 11%; medium 11-13.9%; high 14% and above (book p. 12).\n- Alcohol bands, fortified: low 15-16.4%; medium 16.5-18.4%; high 18.5% and above (book p. 12).\n- Climate (average growing-season temperature, book p. 31): cool 16.5°C (62°F) or below; moderate 16.5-18.5°C (62-65°F); warm 18.5-21°C (65-70°F).\n- Growing season: northern hemisphere April-October; southern hemisphere October-April (book p. 31).\n- Most vineyards lie between 30° and 50° north or south of the equator (book p. 31).\n- A vine needs five things: warmth, sunlight, carbon dioxide, water, nutrients (book p. 27).\n- Dry wine alcohol: most between 11.5% and 16% abv (book p. 40).\n- Fortification raises alcohol to 15-20% abv (book p. 44).\n- Fermentation temperatures: reds 20-32°C (68-90°F); whites 12-22°C (54-72°F); short-maceration rosé at white-wine temperatures (book p. 46)."},"L2-card-30b":{"head":"KEY NUMBERS: TASTING, CLIMATE, WINEMAKING","src":"","body":"- Barrels: after two or three uses have very little flavour left to give (book p. 47)."},"L2-card-31":{"head":"KEY NUMBERS: STYLES, SPARKLING, FORTIFIED, LABELS","src":"","body":"- White Zinfandel: typically 8-10% abv (book p. 56).\n- Sparkling second fermentation adds around 1.5% abv (book p. 111).\n- Champagne legal minimum on lees: 12 months (book p. 113).\n- Sherry: Fino fortified to around 15% abv (flor survives); Oloroso to around 17% (flor cannot survive); Amontillado refortified to around 17% (book p. 116-117).\n- Amarone della Valpolicella: around 15% abv (book p. 106).\n- Vintage Port: potential to mature in bottle for at least 20 years (book p. 119).\n- Tawny age indications: 10, 20, 30, 40 years (book p. 119).\n- Germany: 13 winegrowing areas for Qualitätswein; 6 Prädikat categories (book p. 60).\n- Beaujolais: 10 crus (book p. 95)."},"L2-card-32":{"head":"SPEC: EXAM FORMAT AND WEIGHTING","src":"L2 spec p. 18-19","body":"- 50 multiple-choice questions, 60 minutes, closed book. One correct answer each; no marks lost for wrong answers.\n- Pass 55%; Merit 70-84%; Distinction 85% or more.\n- Questions per Learning Outcome: LO1 vineyard and labelling 5; LO2 winemaking and bottle ageing 4; LO3 principal grapes 19; LO4 regionally important grapes 12; LO5 sparkling and fortified 6; LO6 storage, service, food 4.\n- The spec says the textbook (Wines: Looking behind the label) contains the information needed to answer all questions.\n- The 12 countries on the spec: France, Italy, Spain, Germany, Portugal, Hungary, USA, Chile, Argentina, South Africa, Australia, New Zealand. Austria is NOT on the L2 spec."},"L2-card-33":{"head":"SPEC GIs: MERLOT AND CABERNET SAUVIGNON","src":"L2 spec p. 10","body":"MERLOT\n- PGI: France Pays d'Oc. PDOs: France Bordeaux, Saint-Émilion, Pomerol.\n- Other: USA California, Napa Valley, Sonoma; Chile Central Valley; South Africa Stellenbosch; Australia Margaret River; New Zealand Hawke's Bay.\nCABERNET SAUVIGNON\n- PGI: France Pays d'Oc. PDOs: France Bordeaux, Haut-Médoc, Pauillac, Margaux, Graves, Pessac-Léognan.\n- Other: USA California, Napa Valley (Oakville, Rutherford, Calistoga), Sonoma; Chile Central Valley, Maipo Valley, Colchagua Valley; South Africa Stellenbosch; Australia Coonawarra, Margaret River; New Zealand Hawke's Bay."},"L2-card-34":{"head":"SPEC GIs: SYRAH/SHIRAZ AND PINOT NOIR","src":"L2 spec p. 10","body":"SYRAH/SHIRAZ\n- PGI: France Pays d'Oc. PDOs: Northern Rhône Crozes-Hermitage, Hermitage, Côte Rôtie; Languedoc-Roussillon Minervois.\n- Other: Australia South Eastern Australia, Barossa Valley, Hunter Valley.\nPINOT NOIR\n- PDOs: France Bourgogne/Burgundy, Gevrey-Chambertin, Nuits-Saint-Georges, Beaune, Pommard. (No PGI listed.)\n- Other: USA Sonoma, Los Carneros, Santa Barbara County, Oregon; Chile Casablanca Valley; South Africa Walker Bay; Australia Yarra Valley, Mornington Peninsula; New Zealand Martinborough, Marlborough, Central Otago."},"L2-card-35":{"head":"SPEC GIs: CHARDONNAY AND RIESLING","src":"L2 spec p. 11","body":"CHARDONNAY\n- PGI: France Pays d'Oc. PDOs: France Bourgogne/Burgundy, Chablis, Puligny-Montrachet, Meursault, Mâcon, Pouilly-Fuissé.\n- Other: USA California, Sonoma, Los Carneros, Napa Valley, Santa Barbara County, Oregon; Chile Central Valley, Casablanca Valley; South Africa Western Cape, Walker Bay; Australia South Eastern Australia, Yarra Valley, Adelaide Hills, Margaret River; New Zealand Marlborough, Hawke's Bay.\nRIESLING\n- PDOs: France Alsace; Germany Mosel, Rheingau, Pfalz. (No PGI listed.)\n- Other: Australia Clare Valley, Eden Valley."},"L2-card-36":{"head":"SPEC GIs: SAUVIGNON BLANC AND PINOT GRIGIO/GRIS","src":"L2 spec p. 11","body":"SAUVIGNON BLANC\n- PGI: France Pays d'Oc. PDOs: Loire Sancerre, Pouilly-Fumé, Touraine; Bordeaux Bordeaux, Graves, Pessac-Léognan.\n- Other: USA Napa Valley; Chile Central Valley, Casablanca Valley; South Africa Elgin, Constantia; Australia Adelaide Hills, Margaret River; New Zealand Marlborough.\nPINOT GRIS/PINOT GRIGIO\n- PGI: Italy Veneto. PDOs: France Alsace; Italy Delle Venezie, Friuli-Venezia Giulia.\nREGIONAL LABEL TERMS FOR PRINCIPAL GRAPES (p. 11)\n- Burgundy: Premier Cru, Grand Cru. Bordeaux: Bordeaux, Bordeaux Supérieur, Cru Bourgeois, Grand Cru Classé. Alsace: Grand Cru.\n- Germany: Prädikatswein, Kabinett, Spätlese, Auslese, BA, TBA, Eiswein; Trocken, Halbtrocken."},"L2-card-37":{"head":"SPEC GIs: REGIONALLY IMPORTANT BLACK GRAPES","src":"L2 spec p. 12-13","body":"- Gamay: Beaujolais, Beaujolais Villages, Beaujolais Cru (Fleurie).\n- Grenache/Garnacha: Southern Rhône Côtes du Rhône, Côtes du Rhône Villages, Châteauneuf-du-Pape; Languedoc-Roussillon and Provence Minervois, Côtes de Provence; Spain Rioja, Navarra, Priorat; Australia Barossa Valley, McLaren Vale.\n- Tempranillo: Spain Rioja, Ribera del Duero, Catalunya. Terms: Joven/Genérico, Crianza, Reserva, Gran Reserva.\n- Nebbiolo: Barolo, Barbaresco. Barbera: Barbera d'Asti.\n- Sangiovese: Chianti, Chianti Classico, Brunello di Montalcino. Term: Riserva.\n- Corvina: Valpolicella, Amarone della Valpolicella, Recioto della Valpolicella. Term: Classico.\n- Montepulciano: Montepulciano d'Abruzzo.\n- Zinfandel/Primitivo: USA California; Italy Puglia.\n- Pinotage: South Africa Western Cape. Term: Cape Blend.\n- Carmenère: Chile Central Valley. Malbec: Argentina Mendoza."},"L2-card-38":{"head":"SPEC GIs: REGIONALLY IMPORTANT WHITE GRAPES, SPARKLING, FORTIFIED","src":"L2 spec p. 13-14","body":"- Chenin Blanc: France Vouvray; South Africa Western Cape.\n- Sémillon/Semillon: France Sauternes; Australia Hunter Valley, Barossa Valley.\n- Viognier: Northern Rhône Condrieu. Gewurztraminer: Alsace, Alsace Grand Cru.\n- Verdicchio: Verdicchio dei Castelli di Jesi. Cortese: Gavi. Garganega: Soave, Recioto di Soave (term: Classico). Fiano: Fiano di Avellino.\n- Albariño: Rías Baixas. Furmint: Hungary Tokaj (term: Aszú).\n- Sparkling grapes: Chardonnay, Pinot Noir, Meunier, Moscato (Muscat), Glera. Regions: Champagne, Asti, Prosecco, Cava; South Africa, USA, Australia, New Zealand.\n- Sparkling terms: Brut, Demi-Sec, Vintage/Non-Vintage, Traditional Method, Cap Classique.\n- Sherry terms: Fino, Amontillado, Oloroso, Pale Cream, Medium, Cream, PX. Port terms: Ruby, Reserve Ruby, LBV, Vintage, Tawny."},"L2-card-39":{"head":"CH 4: THE GRAPE AND RIPENING","src":"L2 book p. 27-29","body":"- Parts of the grape: skin = colour, tannins, flavours (colour and tannin much higher in black grapes); pulp = water, sugar, acids, flavours (pale in almost all grapes); seeds and stems = tannins, bitter if handled roughly.\n- Stages: flowering (vines are self-pollinating) -> fruit set (flower becomes a small, hard, green grape) -> véraison (green colour lost; whites turn golden, blacks red then purple) -> ripening.\n- During ripening: grapes swell with water, soften; acidity falls; sugar rises; herbaceous flavours decrease.\n- White grapes: green fruit -> stone fruit -> tropical fruit as ripeness increases. Black grapes: fresh fruit -> cooked fruit.\n- Black grape tannins become riper; unripe tannins taste bitter.\n- Extra-ripe: left on the vine past normal harvest (needs dry, warm weather); exaggerated ripe aromas, more sugar; later grapes raisin, concentrating acid and sugar with dried-fruit aromas; used for sweet wines."},"L2-card-39b":{"head":"CH 4: THE GRAPE AND RIPENING","src":"L2 book p. 27-29","body":"- Vines can live 60+ years. Most wine is made from one European species. Year: spring shoots, leaves, flowers; grapes by end of summer; leaves drop in autumn; dormant in winter (p. 26).\n- Photosynthesis: sunlight lets the vine combine CO2 (taken in by leaves) and water (from roots) into sugars, which power growth and ripening. Without enough heat the vine cannot grow, so it is dormant in winter (p. 27).\n- Each flower cluster becomes a bunch; by mid-summer grapes are big enough for ripening to begin (véraison) (p. 28)."},"L2-card-40":{"head":"CH 4: CLIMATE INFLUENCES","src":"L2 book p. 31-33","body":"- Latitude: most important factor; nearer the equator = hotter. Most vineyards 30°-50° N or S.\n- Altitude: higher = cooler.\n- Seas: moderating; cold currents cool the Cape (South Africa); warm currents warm northern Europe.\n- Rivers: warm up and cool down slower than land; warmth in cooler regions, frost protection, longer warm period; reflect sunlight.\n- Air: cool sea/mountain air moderates; cold mountain air descends at night to cool warm vineyards.\n- Cloud blocks sunlight, slowing ripening (important in some warmer Australian regions). Fog cools at ground level (coastal California and Chile). Mist near autumn rivers is essential for botrytis.\n- Mountains: barrier against cloud, rain, cold winds -> sunny summers, dry autumns, extended season.\n- Slope and aspect: slopes facing the equator get more heat and light -> riper grapes.\n- Soil: water and nutrients; stony surfaces absorb heat and warm the vineyard."},"L2-card-40b":{"head":"CH 4: CLIMATE INFLUENCES","src":"L2 book p. 31-33","body":"- Climate = long-term average temperature, sunlight, rainfall; weather = day-to-day. Climate change: rising temperatures, more variability, more extreme events (p. 31, 33)."},"L2-card-41":{"head":"CH 4: WEATHER HAZARDS AND GROWING","src":"L2 book p. 33-35","body":"- Cool vintage: acid too high, sugar too low, signature aromas may not develop.\n- Hot vintage: uncharacteristic dried-fruit aromas, sunburn; water-stressed vines shut down and grapes stop ripening; extreme cases vines die.\n- Drought: below-average rain, worse with heat; irrigation helps if water available.\n- High rain: fungal disease; heavy rain near harvest swells grapes and dilutes flavour.\n- Hail: can destroy an entire crop. Frost: particular risk in spring, kills new growth, reduces that year's crop.\n- Training (mostly on trellises) and pruning (typically in winter while dormant) keep a healthy, viable crop."},"L2-card-42":{"head":"CH 4: WEATHER HAZARDS AND GROWING","src":"L2 book p. 33-35","body":"- Irrigation: allowed in most dry regions; water is increasingly scarce and expensive.\n- Fungicides, insecticides, herbicides; organic = most chemicals not used, some sprays still allowed.\n- Yield: too high -> diluted flavours, lower sugar; too low -> not commercially viable. Max yields set by law in some regions.\n- Harvest: earlier = less sugar, more acid, less-ripe flavours; later = more sugar, less acid, riper. Hand or machine: neither is fundamentally better; machines can't work steep slopes.\n- Nets and fences keep out birds and animals; fungal diseases and insects are very hard to control and cut quality and quantity; many growers minimise chemicals. Yield = fruit produced per unit of area. Hand or machine harvest normally depends on the style of wine (p. 34-35)."},"L2-card-43":{"head":"CH 5: WINEMAKING STAGES","src":"L2 book p. 40-44","body":"- Alcoholic fermentation: yeast eat sugar -> alcohol + CO2 (escapes) + heat. Usually stops when sugar is used up -> dry. Most dry wines 11.5-16% abv.\n- Red: crushing -> alcoholic fermentation (with skins) -> draining -> pressing -> storage or maturation -> packaging. Heat helps extraction but the cap of skins floats; mix it by punching down (plunger) or pumping over (liquid sprayed over the cap).\n- Rosé: short maceration (red-wine start, drained after a few hours, then white-wine temperatures) or blending red and white (not permitted in many parts of Europe). Rosés rarely stored or matured in oak.\n- Alcoholic fermentation is the one thing common to all wines; final alcohol depends on how much sugar is in the grapes. Crushing splits skins to release some juice; pressing squeezes out as much liquid as possible, before or after fermentation (p. 40)."},"L2-card-43b":{"head":"CH 5: WINEMAKING STAGES","src":"L2 book p. 40-44","body":"- Storage: under a year for most wines, little flavour change. Maturation: extended storage; flavours move from primary towards tertiary, tannins integrate; normally in oak, which may add secondary flavours. Glass bottles most popular; also bag-in-box, plastic, cartons (p. 40)."},"L2-card-44":{"head":"CH 5: WINEMAKING STAGES","src":"L2 book p. 40-44","body":"- White: crushing -> pressing -> alcoholic fermentation -> storage or maturation -> packaging. Black grapes pressed very gently can make white wine.\n- Sweet: concentrated grape sugars (yeast can't eat it all; e.g. Tokaji Aszú); removing the yeast with fine filters (e.g. White Zinfandel); killing the yeast by fortification to 15-20% abv (e.g. Port); adding sweetness to a dry wine (grape juice, concentrated grape juice, or blending with sweet wine).\n- Residual sugar = sugar left after fermentation. Adding sweetness gives precise control; used for red, white and rosé. Fortified wines carry no risk of re-fermenting (p. 44)."},"L2-card-45":{"head":"CH 5: WINEMAKING OPTIONS","src":"L2 book p. 45-49","body":"- Adjustments: add sugar in cool climates/vintages (more alcohol); add acid in warm climates; neutralise acid in cool climates.\n- Fermentation temperature: reds 20-32°C (helps extract colour and tannin); whites 12-22°C (cooler end gives notable fruity aromas); short-maceration rosé at white temperatures.\n- Inert vessels (stainless steel, concrete): add no flavour; can be airtight, preventing oxygen changing flavours.\n- Why add sugar: low-sugar grapes give low-alcohol wines lacking body. Why add acid: low-acid wines would be unbalanced (p. 45)."},"L2-card-46":{"head":"CH 5: WINEMAKING OPTIONS","src":"L2 book p. 45-49","body":"- Oak: adds flavour directly (toasting -> sweet spice, charred wood; new oak -> vanilla, coconut, charred wood, spice; little flavour left after two or three uses) and lets oxygen in (caramel, dried fruit, nuts; softens red tannins). Changes faster in small barrels (more wine-to-wood contact); large vessels rarely used to give oak flavour.\n- Oak alternatives: staves or chips in inert vessels, much cheaper.\n- Malolactic conversion: bacteria, after fermentation; lowers acidity, can give buttery flavours. Nearly always in reds (buttery flavours not really noticeable); a choice in whites (often blocked for aromatic grapes like Riesling).\n- Lees: dead yeast; stirring adds body and flavours (biscuit, bread).\n- Blending: consistency (brands), complexity. Clarification: e.g. filtration; some skip it, so wine may be less than perfectly clear."},"L2-card-47":{"head":"CH 6: PINOT NOIR - THE GRAPE","src":"L2 book p. 51","body":"- Black, THIN-skinned; hard to grow; needs cool to moderate climate. Too warm -> loses fresh fruit, tastes unattractively cooked. Prone to rot and disease; poor vintages can yield very little good wine.\n- Wine: usually pale to medium colour; high acidity; low to medium tannins; red fruit (strawberry, raspberry, red cherry), fresh to cooked depending on ripeness.\n- Usually single-varietal (exception: sparkling such as Champagne). Often oak-matured but small new oak can overwhelm it; older and/or larger barrels often used. Best have subtle oak (smoke, cloves, vanilla).\n- Most drunk young and fruity; very good/outstanding can develop forest floor, mushroom over several years.\n- Renowned for expressing small vineyard differences. Planting in too-warm regions has produced some overly alcoholic wines lacking identifiable Pinot fruit (p. 55)."},"L2-card-48":{"head":"CH 6: PINOT NOIR - BURGUNDY","src":"L2 book p. 52-53","body":"- Climate cool in the north to moderate further south; Pinot best in the moderate areas. Best sites on south- and south-east-facing slopes (extra sunlight).\n- Côte d'Or: northern half Côte de Nuits, southern half Côte de Beaune.\n- Bourgogne AOC: light to medium body, low tannin, high acid, fresh red fruit; drink young; can still be high priced.\n- Village wines: better sited; more intensity, complexity, length. Côte de Nuits: Gevrey-Chambertin, Nuits-Saint-Georges. Côte de Beaune: Beaune, Pommard.\n- Premier and grand cru: slopes facing south or south-east; concentrated fruit, subtle oak, pronounced tertiary (forest floor, mushroom). Grands crus are the best individual vineyards: most concentrated, complex, longest-lived, exceptionally high prices."},"L2-card-49":{"head":"CH 6: PINOT NOIR - OUTSIDE FRANCE","src":"L2 book p. 54-55","body":"- California: mostly too warm; coastal regions only. Los Carneros cooled by morning fogs from San Pablo Bay; western Sonoma by Pacific breezes; Santa Barbara County by sea breezes from west and south. Ripe red fruit (strawberry, red cherry), often notable oak; finest develop forest floor, mushroom.\n- Oregon: northerly latitude + Pacific exposure = mostly moderate, ideal; complex fresh red fruit, subtle oak; ages to earth, mushroom.\n- Chile: Casablanca Valley, cooled by sea breezes and morning fogs; red fruit, sometimes herbal; good value."},"L2-card-50":{"head":"CH 6: PINOT NOIR - OUTSIDE FRANCE","src":"L2 book p. 54-55","body":"- South Africa: coolest coastal regions; Walker Bay, strong southerly sea breezes encourage vibrant red fruit; very good to outstanding.\n- Australia (overall warm; some moderate and cool areas): Yarra Valley and Mornington Peninsula (Victoria), cooled by Southern Ocean breezes; light and fragrant to riper, cooked red fruit, medium tannins.\n- New Zealand: premier black grape. Martinborough, Marlborough (cool). Central Otago: ripest, most powerful; ring of mountains blocks sea breezes and rain; intensely sunny days, cool nights; pronounced strawberry, red cherry, medium to full body, medium tannins.\n- Central Otago Pinot is often oak-matured and may need a few years of bottle age (p. 55)."},"L2-card-51":{"head":"CH 7: ZINFANDEL/PRIMITIVO","src":"L2 book p. 56-57","body":"- Black grape, needs a warm climate. Ripens from red fruit (strawberry, raspberry) to black fruit (black plum, blackberry, blueberry). Uneven ripening: some berries raisin before others ripen -> high sugar, dried fruit (prune, raisin).\n- White Zinfandel (California): medium-sweet rosé; typically short maceration; low alcohol (8-10%) by removing yeast before fermentation finishes; pink, simple strawberry, raspberry.\n- Red Zinfandel (California): full red fermentation on skins; often oak to soften tannins and add complexity. Pronounced red and black fruit, dried fruit, oak (vanilla, coffee); dry, medium to high acidity and tannin, HIGH alcohol, full body. Very old vines -> concentrated; tertiary earth, meat.\n- Labels: rosé Zinfandel low abv; red Zinfandel high abv (e.g. 15.5%).\n- Italy: Primitivo in warm Puglia; soft, fruity, dry reds for high-volume brands; top examples from controlled yields can be excellent value."},"L2-card-52":{"head":"CH 8: RIESLING - THE GRAPE","src":"L2 book p. 58-59","body":"- Cold-hardy white grape; prefers cool to moderate climates. Naturally high acidity and susceptible to botrytis -> outstanding wines at all sweetness levels.\n- Aromatic: pronounced fruity and floral aromas, high acidity.\n- Just-ripe: green fruit (apple, pear), citrus (lemon, lime), floral (blossom). Extra-ripe: stone fruit (peach, apricot), tropical (mango, pineapple), sometimes dried apricot.\n- Builds sugar and flavour slowly while retaining acid -> suited to late harvest where autumns are dry and sunny.\n- Off-dry/medium: interrupt fermentation by removing yeast (lower alcohol, residual sugar) or add unfermented grape juice (Süssreserve). Sweetest: extra-ripe grapes, fermentation stops naturally.\n- Fermented in inert vessels (stainless steel) to preserve floral aromas. Finest age for years or decades; high acid keeps them fresh while developing honey and petrol."},"L2-card-53":{"head":"CH 8: RIESLING - REGIONS","src":"L2 book p. 59-62","body":"- Germany: Riesling is the most important grape, widely planted; predominantly cool; some vineyards above 50°N.\n- Mosel: one of the most northerly; lighter body; commonly medium sweetness balancing very high acidity. Best on steep south- or south-west-facing slopes by the river: aspect, stony soils, reflected sunlight.\n- Rheingau: steep south-facing slopes on the north bank of the Rhine; drier and more body than Mosel.\n- Pfalz: near France, mountains to the west, dry and sunny; like an extension of Alsace; typically dry and medium-bodied.\n- Alsace AOC: east of the Vosges Mountains (block rain-bearing westerly winds) -> one of France's driest, sunniest regions. Best vineyards in foothills facing east/south-east (morning sun). Dry, pronounced, ripe citrus and stone fruit, medium body, high acid. Best = grands crus. Sweeter = Vendanges tardives."},"L2-card-53b":{"head":"CH 8: RIESLING - REGIONS","src":"L2 book p. 59-62","body":"- Australia: Eden Valley and Clare Valley (South Australia); moderate thanks to altitude (unlike warm Barossa nearby); dry, pronounced lime, lemon, sometimes petrol.\n- Alsace: dry autumns extend ripening (p. 62).\n- Riesling today: because of its German roots it is often wrongly linked with low-quality sweetened Liebfraumilch; premium wines drive its sales worldwide (p. 62)."},"L2-card-54":{"head":"CH 9: CHENIN BLANC","src":"L2 book p. 63-64","body":"- Very versatile; grows in cool, moderate and warm climates. Flavours by ripeness: green fruit (apple), citrus (lemon) -> stone fruit (peach), tropical (pineapple, mango).\n- Naturally high acidity; suits late harvest; susceptible to botrytis -> dry to sweet styles; oaked and unoaked. Best age for many years.\n- Vouvray AOC (Loire): only Chenin permitted; dry, off-dry, medium, sweet and sparkling. Dry: fresh apple. Off-dry/medium labelled Demi-Sec. Sweeter: extra-ripe or botrytis grapes, stone/tropical fruit. Typically unoaked. Best age to honey, dried fruit.\n- South Africa: most planted white grape; prized for keeping high acidity in a warm climate. High-volume \"Western Cape\" from warmer inland areas, often blended (e.g. with Chardonnay); dry, medium body, peach, pineapple, sometimes vanilla from chips/staves. Old vines -> very good/outstanding, tropical fruit, smoke, vanilla from oak."},"L2-card-54b":{"head":"CH 9: CHENIN BLANC","src":"L2 book p. 63-64","body":"- South Africa: some blend Chenin with aromatic varieties such as Viognier for a refreshing, floral style (p. 64)."},"L2-card-55":{"head":"CH 9: SÉMILLON/SEMILLON","src":"L2 book p. 64-65","body":"- White grape, mainly moderate and warm climates. Young: simple apple, lemon, grass. Medium to high acid, light to full body depending on ripeness. Can age to dried fruit, nuts, honey.\n- Bordeaux: blended with Sauvignon Blanc for dry and sweet wines; Sémillon adds body and ageing potential; very good/outstanding blends often oak-matured, develop for many years.\n- Sauternes AOC: sweet white from botrytis-concentrated grapes; Sémillon most important because p

ent BEST compares Barossa Valley Semillon with Hunter Valley Semillon?","options":{"a":"Barossa ranges from Hunter-like styles to full, oaked wines.","b":"Barossa is sweet and botrytised; Hunter is dry and oaked.","c":"Barossa is picked early; Hunter is picked late for extra richness.","d":"Each is blended with Sauvignon Blanc before it is bottled."},"notes":{"a":"Correct: the book says Barossa styles range from very like Hunter to full-bodied and oak-matured.","b":"Hunter is dry but made in inert vessels; the book gives no sweet Barossa style.","c":"Wrong for Hunter: it is harvested early, while sugar is low and acidity high.","d":"Hunter is single-varietal. Australian blends with Sauvignon exist but define neither GI."},"answer":"a","ctx":"Spec Semillon GIs: Sauternes (France); Hunter Valley and Barossa Valley (Australia).","src":"L2 book p. 65 (Australia)","cards":"L2-card-55, L2-card-55b"},{"id":"Q-L2-09-11","level":"L2","lo":"LO4","ch":"9","topic":"Tokaji Aszú Puttonyos","trap":"Puttonyos direction: 6 is sweeter than 5","stem":"On a bottle of Tokaji Aszú, what does '6 Puttonyos' indicate compared with '5 Puttonyos'?","options":{"a":"More Furmint.","b":"More sweetness.","c":"Higher alcohol.","d":"Longer oak ageing."},"notes":{"a":"Furmint is the principal grape, but Puttonyos say nothing about the blend.","b":"Correct: the number of Puttonyos is a good guide to sweetness; 6 is sweeter than 5.","c":"Puttonyos are a guide to sweetness, not alcohol.","d":"Tokaji Aszú does age in oak, but Puttonyos indicate sweetness."},"answer":"b","ctx":"Most Tokaji Aszú is labelled 5 or 6 Puttonyos. Aszú is the spec labelling term.","src":"L2 book p. 66 (Furmint)","cards":"L2-card-56"},{"id":"Q-L2-09-12","level":"L2","lo":"LO4","ch":"9","topic":"Tokaji Aszú style","trap":"NOT stem; Aszú is always sweet","stem":"Which statement about Tokaji Aszú is NOT correct?","options":{"a":"It can be dry or sweet, depending on the vintage.","b":"It is amber in colour, from its long ageing in oak.","c":"Its sweetness is balanced by high acidity.","d":"Furmint is its principal grape, often with others."},"notes":{"a":"Correct (the false one): the book says Tokaji Aszú is always sweet. Tokaj's dry and medium wines are not Aszú.","b":"True: it traditionally spends a significant time ageing in oak.","c":"True: sweet and full-bodied, with high acidity and a long, intense finish.","d":"True: blended with other local grapes for greater aroma complexity."},"answer":"a","ctx":"Tokaj also makes dry and medium wines, but it is most famous for sweet, botrytised Tokaji Aszú.","src":"L2 book p. 66 (Furmint)","cards":"L2-card-56"},{"id":"Q-L2-10-02","level":"L2","lo":"LO3","ch":"10","topic":"Moderate-climate Chardonnay","trap":"","stem":"How would you describe a typical moderate-climate Chardonnay?","options":{"a":"Medium acid, full body; peach, pineapple and banana.","b":"High acid, light to medium body; apple, pear, lemon, wet stones.","c":"Medium to high acid, medium to full body; lemon, peach, melon.","d":"Low acid, light body; simple pear and floral notes."},"notes":{"a":"That is the typical warm-climate style (for example, Pays d'Oc).","b":"That is the typical cool-climate style (for example, Chablis).","c":"Correct: as described in the book (for example, the Côte d'Or).","d":"Not one of the book's Chardonnay climate styles."},"answer":"c","ctx":"Climate drives Chardonnay's fruit, alcohol, body and acidity more than almost anything else.","src":"L2 book p. 67 (The characteristics of Chardonnay)","cards":"L2-card-57"},{"id":"Q-L2-10-03","level":"L2","lo":"LO3","ch":"10","topic":"Acidification","trap":"","stem":"Why is acidification commonplace for many warm-climate Chardonnays?","options":{"a":"To lower the alcohol after a late harvest.","b":"To balance the wine's alcohol and body.","c":"To add buttery flavours and soften acid.","d":"To give flavours of bread and biscuit."},"notes":{"a":"Adding acid does not lower alcohol; it balances it.","b":"Correct: warm climates give full body and only medium acidity, so added acid restores balance.","c":"That is malolactic conversion, which lowers acidity rather than adding it.","d":"Those come from lees contact, not from adding acid."},"answer":"b","ctx":"Causal chain: warm climate -> riper grapes -> more alcohol, fuller body, less acid -> add acid to balance.","src":"L2 book p. 67 (Winemaking and maturation options)","cards":"L2-card-57"},{"id":"Q-L2-10-04","level":"L2","lo":"LO3","ch":"10","topic":"Secondary flavours","trap":"LEAST stem; MLF vs oak flavours","stem":"Which of these flavours in a Chardonnay is LEAST likely to come from oak?","options":{"a":"Vanilla","b":"Coconut","c":"Butter","d":"Smoke"},"notes":{"a":"Oak adds vanilla; chips or staves can give it more cheaply.","b":"Oak adds coconut, along with smoke and vanilla.","c":"Correct: butter and cream come from malolactic conversion, which also softens harsh acids.","d":"Oak barrel fermentation or maturation adds smoke."},"answer":"c","ctx":"Three sources: MLF = butter, cream; lees = body, bread, biscuit; oak = body, smoke, vanilla, coconut.","src":"L2 book p. 67 (Winemaking and maturation options)","cards":"L2-card-57"},{"id":"Q-L2-10-05","level":"L2","lo":"LO3","ch":"10","topic":"Choosing winemaking options","trap":"BEST stem","stem":"A producer has lightly flavoured Chardonnay grapes from a cool site. Which winemaking approach is BEST?","options":{"a":"Add oak chips and use extended contact with the lees.","b":"Ferment and mature in new oak barrels for more complexity.","c":"Use full malolactic conversion for buttery richness.","d":"Use inert vessels and avoid strong secondary flavours."},"notes":{"a":"Chips and lees add secondary flavours that could overwhelm delicate fruit.","b":"Only wines of enough flavour intensity benefit; new oak would swamp delicate fruit.","c":"Buttery MLF flavours could swamp delicate fruit; such producers may avoid MLF.","d":"Correct: the book says strong secondary flavours can easily overwhelm lightly flavoured wines."},"answer":"d","ctx":"Wines made without oak may be labelled 'unoaked' or 'unwooded'.","src":"L2 book p. 68 (Winemaking and maturation options)","cards":"L2-card-57"},{"id":"Q-L2-10-06","level":"L2","lo":"LO3","ch":"10","topic":"Bottle-aged Chardonnay","trap":"secondary vs tertiary","stem":"Which tertiary flavours does a very good or outstanding Chardonnay gather with bottle age?","options":{"a":"Butter and cream","b":"Bread and biscuit","c":"Vanilla and coconut","d":"Hazelnut and mushroom"},"notes":{"a":"Secondary flavours from malolactic conversion, not tertiary.","b":"Secondary flavours from lees contact.","c":"Secondary flavours from oak.","d":"Correct: per the book; top Côte d'Or crus develop these for decades."},"answer":"d","ctx":"","src":"L2 book p. 68","cards":"L2-card-57, L2-card-59"},{"id":"Q-L2-10-07","level":"L2","lo":"LO3","ch":"10","topic":"Bourgogne AOC","trap":"","stem":"What does the regional appellation Bourgogne AOC tell you about a white Burgundy?","options":{"a":"It ranks above the village appellations.","b":"Its grapes must come from the Côte d'Or vineyards only.","c":"It comes from a single premier cru vineyard.","d":"Its grapes may come from anywhere in Burgundy."},"notes":{"a":"Regional is the lowest level: below village, premier cru and grand cru.","b":"Too narrow: the regional appellation covers all of Burgundy.","c":"Premier Cru wines carry the village name plus Premier Cru.","d":"Correct: usually simple, with apple and lemon and high acidity."},"answer":"d","ctx":"Burgundy hierarchy, lowest to highest: regional -> village -> Premier Cru -> Grand Cru.","src":"L2 book p. 68 (Bourgogne AOC); p. 53","cards":"L2-card-58, L2-card-19"},{"id":"Q-L2-10-08","level":"L2","lo":"LO3","ch":"10","topic":"Chablis Premier and Grand Cru","trap":"","stem":"Why do Chablis Premier Cru and Grand Cru wines tend to be riper and more flavourful than basic Chablis?","options":{"a":"Their flat valley sites are protected from frost.","b":"They are fermented and matured in new oak barrels instead.","c":"Their hillsides face south/south-west, giving more sun.","d":"Their grapes are left on the vine until botrytis develops."},"notes":{"a":"The best sites are on hillsides; frost is a key concern across Chablis.","b":"With very few exceptions, Chablis shows no detectable oak; inert vessels are preferred.","c":"Correct: more sun exposure gives riper grapes and more flavourful, complex wines.","d":"Chablis is dry; botrytis plays no part in its style."},"answer":"c","ctx":"Chablis's unoaked style and labelling by region, not grape, help explain its steady popularity (p. 71).","src":"L2 book p. 68 (Chablis AOC)","cards":"L2-card-58"},{"id":"Q-L2-10-09","level":"L2","lo":"LO3","ch":"10","topic":"Côte de Beaune Chardonnay villages","trap":"Pommard and Beaune are Pinot Noir GIs (known gap)","stem":"Which two Côte de Beaune villages are famous for very good and outstanding Chardonnay?","options":{"a":"Gevrey-Chambertin and Nuits-Saint-Georges","b":"Mâcon and Pouilly-Fuissé","c":"Beaune and Pommard","d":"Meursault and Puligny-Montrachet"},"notes":{"a":"Côte de Nuits villages, listed for Pinot Noir.","b":"Mâconnais appellations in southern Burgundy, not the Côte de Beaune.","c":"Côte de Beaune villages, but listed on the spec for Pinot Noir.","d":"Correct: their premier and grand crus can develop hazelnut and mushroom for decades."},"answer":"d","ctx":"The Côte d'Or's Chardonnay focus is the Côte de Beaune, south of the town of Beaune.","src":"L2 book p. 68 (Côte d'Or); L2 spec p. 10-11","cards":"L2-card-59, L2-card-48"},{"id":"Q-L2-10-10","level":"L2","lo":"LO3","ch":"10","topic":"Côte d'Or vs Chablis","trap":"","stem":"How is a Meursault Chardonnay MOST LIKELY to differ from a Chablis?","options":{"a":"It has a lighter body, higher acidity and wet-stone notes.","b":"It has simpler fruit, as it is made for early drinking.","c":"It has less oak influence, being fermented in inert vessels.","d":"It has more body, riper fruit and complexity from oak and lees."},"notes":{"a":"That describes Chablis, from the cool north of Burgundy.","b":"Meursault's premier and grand crus can develop for decades.","c":"Reversed: it is Chablis that is typically fermented in inert vessels.","d":"Correct: the moderate climate gives peach and melon; oak and lees add complexity and body."},"answer":"d","ctx":"Causal chain: cool Chablis -> high acid, green fruit, unoaked; moderate Côte d'Or -> riper fruit, oak, lees.","src":"L2 book p. 68 (Chablis AOC; Côte d'Or)","cards":"L2-card-58, L2-card-59"},{"id":"Q-L2-10-11","level":"L2","lo":"LO3","ch":"10","topic":"Pouilly-Fuissé vs Mâcon","trap":"","stem":"Why does Pouilly-Fuissé usually offer more concentrated Chardonnay than basic Mâcon AOC?","options":{"a":"Its vines grow grapes that are affected by botrytis.","b":"Its vines grow on steep slopes facing east and south-east.","c":"Its vines grow in the cool north of Burgundy, near Chablis.","d":"Its vines grow on flat, fertile land on the valley floor."},"notes":{"a":"Pouilly-Fuissé is a dry Chardonnay; botrytis plays no part.","b":"Correct: these slopes give concentrated stone and tropical fruit; oak is often used too.","c":"It is in the Mâconnais, in the south of Burgundy.","d":"The book credits steep slopes, not flat land."},"answer":"b","ctx":"Mâcon AOC: fruity, mostly unoaked, with simple lemon, peach and melon flavours.","src":"L2 book p. 69 (Mâconnais)","cards":"L2-card-59"},{"id":"Q-L2-10-12","level":"L2","lo":"LO3","ch":"10","topic":"Pays d'Oc IGP","trap":"PGI terms (known gap)","stem":"Most Chardonnay from Languedoc-Roussillon is labelled Pays d'Oc IGP. What type of GI is this?","options":{"a":"A PGI: a wide area with less strict rules.","b":"A PDO: a small area with tightly defined rules.","c":"A PDO covering the whole of southern France.","d":"A PGI that permits only Chardonnay grapes."},"notes":{"a":"Correct: IGP is the French PGI term; PGIs give producers more flexibility.","b":"That describes a PDO (AOC or AOP in France).","c":"IGP is a PGI term; the French PDO terms are AOC and AOP.","d":"PGI rules are less strict; Pays d'Oc is also a spec GI for Merlot and Syrah."},"answer":"a","ctx":"Warm climate: high volumes of peach, pineapple and banana; chips or staves common in cheaper wines.","src":"L2 book p. 69 (Languedoc-Roussillon); p. 37","cards":"L2-card-59, L2-card-12"},{"id":"Q-L2-10-13","level":"L2","lo":"LO3","ch":"10","topic":"Coastal vs inland California","trap":"","stem":"Why can coastal regions such as Sonoma make more intensely flavoured, balanced Chardonnay than California's Central Valley?","options":{"a":"Coastal sites are warmer, so the grapes ripen more fully.","b":"Sea influences slow ripening, so grapes keep acidity.","c":"Higher yields give more concentrated grape flavours.","d":"Mountains shield the coastal vines from the ocean."},"notes":{"a":"Reversed: coastal influences cool the vineyards and slow ripening.","b":"Correct: coastal influences moderate the climate; the Central Valley is cut off from the sea by mountains.","c":"High, irrigated yields are a Central Valley feature and do not concentrate flavour.","d":"Reversed: mountains cut the inland Central Valley off from sea influence."},"answer":"b","ctx":"Central Valley: very warm, dry, irrigated; labelled 'California'; peach, pineapple; any oak from chips.","src":"L2 book p. 69 (California)","cards":"L2-card-60"},{"id":"Q-L2-10-14","level":"L2","lo":"LO3","ch":"10","topic":"Coastal California GIs","trap":"NOT stem; Napa warms going north","stem":"Which statement about Chardonnay GIs in coastal California is NOT correct?","options":{"a":"Napa Valley grows cooler and cloudier further north.","b":"Sonoma's coastal vineyards get Pacific sea breezes.","c":"Santa Barbara County gets breezes funnelled inland.","d":"Los Carneros is cooled by fogs from San Pablo Bay."},"notes":{"a":"Correct (the false one): Napa gets warmer and sunnier further north; full body, tropical fruit, new oak.","b":"True: these help grapes keep acidity while building complex flavours.","c":"True: lateral valleys funnel sea breezes; styles range from Côte de Beaune-like to tropical.","d":"True: morning fogs come in from San Pablo Bay."},"answer":"a","ctx":"","src":"L2 book p. 69 (California)","cards":"L2-card-60"},{"id":"Q-L2-10-15","level":"L2","lo":"LO3","ch":"10","topic":"Oregon Chardonnay","trap":"MOST LIKELY stem","stem":"A Chardonnay from a generally moderate region, made in relatively small quantities, has refreshingly high acidity and flavours from lemon to melon. Which GI is it MOST LIKELY from?","options":{"a":"Pays d'Oc","b":"California","c":"Oregon","d":"Napa Valley"},"notes":{"a":"Warm Languedoc-Roussillon gives high volumes of peach, pineapple and banana.","b":"Central Valley wines labelled California have medium acidity, peach and pineapple, high volume.","c":"Correct: moderate climate, high acidity, lemon to melon; small production next to California.","d":"Napa Chardonnay is full-bodied, with pronounced tropical fruit and new-oak vanilla and spice."},"answer":"c","ctx":"","src":"L2 book p. 69-70 (USA)","cards":"L2-card-60"},{"id":"Q-L2-10-16","level":"L2","lo":"LO3","ch":"10","topic":"Australian Chardonnay GIs","trap":"Adelaide Hills altitude vs Yarra ocean currents","stem":"Which Australian Chardonnay region is cooled by ocean currents from the south?","options":{"a":"South Eastern Australia","b":"Margaret River","c":"Adelaide Hills","d":"Yarra Valley"},"notes":{"a":"High-volume wines, with fruit often from warm, irrigated inland vineyards.","b":"Warm, but moderated by cooling sea breezes; smaller volume, consistently high quality.","c":"Adelaide Hills is cooled by altitude, not ocean currents.","d":"Correct: the longer growing season gives ripe peach, medium to high acid and balanced oak."},"answer":"d","ctx":"South Eastern Australia wines are sometimes blended with Semillon or cooler-site wines for better balance.","src":"L2 book p. 70 (Australia)","cards":"L2-card-61"},{"id":"Q-L2-10-17","level":"L2","lo":"LO3","ch":"10","topic":"New Zealand Chardonnay GIs","trap":"NZ Chardonnay = Marlborough and Hawke's Bay (known gap)","stem":"Which two New Zealand regions are listed for Chardonnay in the Level 2 specification?","options":{"a":"Marlborough and Hawke's Bay","b":"Marlborough and Central Otago","c":"Hawke's Bay and Martinborough","d":"Central Otago and Martinborough"},"notes":{"a":"Correct: Marlborough (cool, sunny) and Hawke's Bay (moderate; Chardonnay is its most planted white).","b":"Central Otago is listed for Pinot Noir only.","c":"Martinborough is listed for Pinot Noir only.","d":"Both are Pinot Noir GIs on the spec."},"answer":"a","ctx":"Marlborough: ripe lemon, peach, melon, high acid, subtle oak. Hawke's Bay: full body, high acid, stone fruit.","src":"L2 spec p. 10-11; L2 book p. 70","cards":"L2-card-35, L2-card-61, L2-card-34"},{"id":"Q-L2-10-18","level":"L2","lo":"LO3","ch":"10","topic":"Chilean Chardonnay","trap":"","stem":"Why does Chile's Casablanca Valley produce fresher Chardonnay than much of the larger, warmer Central Valley?","options":{"a":"Pacific sea breezes and morning fogs slow the ripening.","b":"Its inland position shelters it from the Pacific Ocean.","c":"Its heavy summer rainfall keeps the grapes cool.","d":"Its vineyards are cooled mainly by their high altitude."},"notes":{"a":"Correct: these cooling influences give refreshing wines with lemon and peach flavours.","b":"Casablanca is coastal and exposed to the Pacific Ocean.","c":"Not given; the book credits sea breezes and morning fogs.","d":"Altitude moderates the best Central Valley vineyards, not Casablanca."},"answer":"a","ctx":"Central Valley: inexpensive high-volume brands up to outstanding wines from altitude-moderated sites.","src":"L2 book p. 70 (Chile)","cards":"L2-card-61"},{"id":"Q-L2-10-19","level":"L2","lo":"LO3","ch":"10","topic":"South African Chardonnay","trap":"","stem":"Why does Walker Bay Chardonnay typically have higher acidity than high-volume Western Cape Chardonnay?","options":{"a":"Walker Bay Chardonnay is blended with Chenin.","b":"Strong southerly sea breezes keep Walker Bay cool.","c":"Walker Bay grapes are picked late for richness.","d":"Walker Bay vineyards are high and far inland."},"notes":{"a":"The book links Chenin blends to the hot inland, high-volume wines.","b":"Correct: among South Africa's coolest regions; high acid, peach, pineapple and oak.","c":"Not given, and late picking lowers acidity; the cause is cooling sea breezes.","d":"It is coastal; the hot inland areas supply high-volume Western Cape wines."},"answer":"b","ctx":"Spec: South African Chardonnay GIs are Western Cape and Walker Bay.","src":"L2 book p. 71 (South Africa)","cards":"L2-card-61"},{"id":"Q-L3-09-01","level":"L3","lo":"Stretch (L2 LO4)","ch":"9","topic":"Chenin Blanc harvest","trap":"","stem":"Why may pickers need several passes through a Loire Chenin Blanc vineyard at harvest?","options":{"a":"Frost forces early picking of exposed rows.","b":"Its thick skins need extra time to soften.","c":"Noble rot only forms on the lowest bunches.","d":"Grapes in one bunch often ripen unevenly."},"notes":{"a":"Not the reason given; passes let pickers choose grapes at the desired ripeness.","b":"Not given; the L3 point is uneven ripening within one bunch.","c":"Not the reason given; the issue is uneven ripeness within a bunch.","d":"Correct: per the L3 book; unripe grapes give green, herbaceous aromas unless excluded."},"answer":"d","ctx":"L3: barely ripe Chenin (10-11% abv) is used for sparkling; riper berries for dry, then medium, then sweet.","src":"L3 book (2016) ch 18, p. 96","cards":"L3-stretch-27"},{"id":"Q-L3-09-02","level":"L3","lo":"Stretch (L2 LO4)","ch":"9","topic":"Sauternes and noble rot","trap":"","stem":"Why are Bordeaux's top sweet wine appellations, such as Sauternes, grouped by the Garonne and Ciron rivers?","options":{"a":"The rivers leave warm gravel ideal for Cabernet Sauvignon.","b":"The rivers protect the vines from spring frost and hail.","c":"The rivers reflect sunlight, drying grapes into raisins.","d":"The rivers create misty autumn conditions for noble rot."},"notes":{"a":"Sauternes is a sweet white; Sémillon dominates there.","b":"Not the reason given; it is the autumn mist for botrytis.","c":"Passerillage helps in years with little noble rot; the rivers' role is autumn mist for botrytis.","d":"Correct: mist on fully ripened grapes favours noble rot, per the L3 book."},"answer":"d","ctx":"L3: Sémillon's thin skin suits noble rot; Sauvignon Blanc adds acidity; botrytised grapes are hand-picked.","src":"L3 book (2016) ch 13, p. 82","cards":"L3-stretch-28"},{"id":"Q-L3-09-03","level":"L3","lo":"Stretch (L2 LO4)","ch":"9","topic":"Tokaji Aszú production","trap":"","stem":"How does the production of Tokaji Aszú differ from the method used for Sauternes?","options":{"a":"Fermentation is stopped early by adding grape spirit.","b":"Botrytised bunches are machine-harvested whole.","c":"Aszú berries are macerated in a base wine, then pressed.","d":"Aszú grapes are dried on straw mats, rather than rotted."},"notes":{"a":"That is fortification, as for Port; Tokaji Aszú is not fortified.","b":"Pickers select individual aszú berries by hand, in several passes.","c":"Correct: they soak 12-60 hours in a base wine of healthy grapes; Sauternes ferments the botrytised grapes.","d":"Aszú berries are botrytised (noble rot), not dried on mats."},"answer":"c","ctx":"The amount of aszú berries sets sweetness, in puttonyos (2016 edition; may have changed).","src":"L3 book (2016) ch 24, p. 116-117","cards":"L3-stretch-28"},{"id":"Q-L3-09-04","level":"L3","lo":"Stretch (L2 LO4)","ch":"9","topic":"Dry Furmint","trap":"","stem":"Why is dry Tokaj wine made without botrytis, usually from Furmint, gaining importance?","options":{"a":"Tokaj's climate has become too dry for noble rot to form.","b":"New laws have banned the sweet Tokaji Aszú style.","c":"It lets producers make wine in years with little noble rot.","d":"Furmint is too low in acidity for good sweet wines."},"notes":{"a":"Not given; the rivers still bring the morning humidity noble rot needs.","b":"No ban is given; Aszú remains Tokaj's most famous style, alongside dry wines.","c":"Correct: per the L3 book; styles range from simple and unoaked to concentrated, new-oak and age-worthy.","d":"Furmint is high in acidity and botrytis-prone: the principal Aszú grape."},"answer":"c","ctx":"L3: dry Furmint has apple flavours when young, developing nuts and honey with age.","src":"L3 book (2016) ch 24, p. 116","cards":"L3-stretch-28"},{"id":"Q-L3-10-01","level":"L3","lo":"Stretch (L2 LO3)","ch":"10","topic":"Chablis frost protection","trap":"","stem":"Which two measures does the L3 book say Chablis growers use to protect their vines from frost?","options":{"a":"Low sites and mulching","b":"Sprinklers and heaters","c":"Shade cloth and netting","d":"Leaf removal and pruning"},"notes":{"a":"Low, flat land is more frost-prone; the L3 book says hillsides are less so.","b":"Correct: frost, which can strike as late as May, is the region's major climatic problem.","c":"These protect against sun or hail, not frost.","d":"Canopy and vine management, not frost protection."},"answer":"b","ctx":"Links to L2: frost can limit the amount of Chablis produced each year (L2 book p. 68).","src":"L3 book (2016) ch 15, p. 85-86","cards":"L3-stretch-19"},{"id":"Q-L3-10-02","level":"L3","lo":"Stretch (L2 LO3)","ch":"10","topic":"Côte d'Or white grands crus","trap":"","stem":"Within the Côte d'Or, where are all but one of the white grands crus found?","options":{"a":"The Côte de Nuits","b":"The Côte de Beaune","c":"The Hautes-Côtes de Nuits","d":"The Hautes-Côtes de Beaune"},"notes":{"a":"Home of all but one of the RED grands crus.","b":"Correct: and all but one of the red grands crus are in the Côte de Nuits.","c":"A regional appellation to the west, at higher altitude; no grands crus.","d":"A regional appellation, higher and cooler, giving less body and concentration."},"answer":"b","ctx":"L3: Puligny-Montrachet and Chassagne-Montrachet share the grand cru of Montrachet.","src":"L3 book (2016) ch 15, p. 87-88","cards":"L3-stretch-19"},{"id":"Q-L3-10-03","level":"L3","lo":"Stretch (L2 LO3)","ch":"10","topic":"Mâconnais villages","trap":"","stem":"Besides Pouilly-Fuissé, which Mâconnais village appellation does the L3 book name as one of the region's two most famous?","options":{"a":"Rully","b":"Meursault","c":"Montagny","d":"Saint-Véran"},"notes":{"a":"A Côte Chalonnaise village, also a centre for sparkling wine.","b":"A Côte de Beaune village, not in the Mâconnais.","c":"A Côte Chalonnaise village, which makes only white wines.","d":"Correct: its best wines show ripe tropical and stone fruit, and most are barrel-matured."},"answer":"d","ctx":"L3: Pouilly-Fuissé's amphitheatre-like slopes on the Roche de Solutré act as natural suntraps. (2016 edition; may have changed.)","src":"L3 book (2016) ch 15, p. 89","cards":"L3-stretch-19"},{"id":"Q-L3-10-04","level":"L3","lo":"Stretch (L2 LO3)","ch":"10","topic":"California fog","trap":"","stem":"Fog matters for coastal California Chardonnay. How does it extend the ocean's cooling effect into the day?","options":{"a":"The sun takes time to burn it off each morning.","b":"It reflects extra sunlight onto vines at midday.","c":"It brings regular rain through the ripening season.","d":"It forms over the hot Central Valley and drifts west."},"notes":{"a":"Correct: cold air and fog drawn in each evening lower night temperatures; slow burn-off extends the cooling.","b":"Fog shades and cools; it does not add sunlight.","c":"The L3 book stresses little rain in the ripening season; drip irrigation is widely used.","d":"The Central Valley has no ocean exposure; the fog comes in from the cold ocean."},"answer":"a","ctx":"Root cause: the very cold California Ocean Current matters more than latitude (L3 book).","src":"L3 book (2016) ch 33, p. 143","cards":"L3-stretch-20"},{"id":"Q-L3-10-05","level":"L3","lo":"Stretch (L2 LO3)","ch":"10","topic":"Hawke's Bay vs Marlborough","trap":"NZ Chardonnay = Marlborough and Hawke's Bay (known gap)","stem":"Why is Hawke's Bay Chardonnay typically fuller-bodied than Marlborough Chardonnay?","options":{"a":"It lies on the South Island, sheltered by its mountains.","b":"It has the highest rainfall of New Zealand's regions.","c":"It is the warmest main area, with the longest sunshine.","d":"It is continental, with a very wide diurnal range."},"notes":{"a":"Hawke's Bay is on the North Island's east coast; the South Island is cooler.","b":"The L3 book gives Auckland as the wettest; Hawke's Bay is the warmest, sunniest main area.","c":"Correct: per L3. L2 calls Hawke's Bay moderate and Marlborough cool, so riper grapes, fuller body.","d":"That describes Central Otago, unlike the rest of maritime New Zealand."},"answer":"c","ctx":"L3 chain: long sunshine + sea-breeze-cooled nights + long season -> ripe flavour with acidity.","src":"L3 book (2016) ch 40, p. 170-171; L2 book p. 70","cards":"L3-stretch-21, L3-stretch-22, L2-card-61"},{"id":"Q-L2-09-13","level":"L2","lo":"LO4","ch":"9","topic":"Furmint grape traits","trap":"","stem":"Which two natural features of Furmint make it ideal for the sweet wines of Tokaj?","options":{"a":"High acidity and high susceptibility to botrytis","b":"Thick skins and strong resistance to botrytis","c":"Low acidity and a habit of ripening early","d":"Pronounced floral aromas and a deep colour"},"notes":{"a":"Correct: the book gives both, making Furmint ideal for sweet wines (p. 66).","b":"The reverse: Furmint is very susceptible to botrytis.","c":"Furmint has naturally high acidity, which balances the sweetness.","d":"Not the book's reasons; Furmint is often blended with local grapes for more aroma."},"answer":"a","ctx":"Furmint is Tokaj's most planted grape and the principal grape of Tokaji Aszú.","src":"L2 book p. 66 (Furmint)","cards":"L2-card-56"},{"id":"Q-L2-10-20","level":"L2","lo":"LO3","ch":"10","topic":"South Eastern Australia Chardonnay","trap":"","stem":"Why are high-volume Chardonnays labelled South Eastern Australia sometimes blended with Semillon or with wine from cooler vineyards?","options":{"a":"To raise the alcohol of grapes from cool coastal sites.","b":"To meet a legal minimum of two grape varieties in the blend.","c":"To achieve better balance in fruit from warm inland sites.","d":"To add oak flavours without the cost of barrels."},"notes":{"a":"The fruit often comes from WARM inland vineyards, not cool coastal ones.","b":"No such rule is given; blending is a choice made for balance.","c":"Correct: the book says blending can help achieve better balance (p. 70).","d":"Blending adds no oak; chips and staves are the low-cost oak option."},"answer":"c","ctx":"The GI covers a very broad area; the fruit often comes from warm, irrigated inland vineyards.","src":"L2 book p. 70 (Australia)","cards":"L2-card-61"},{"id":"Q-L2-10-21","level":"L2","lo":"LO3","ch":"10","topic":"Margaret River Chardonnay","trap":"","stem":"A medium- to full-bodied Chardonnay with ripe peach and pineapple comes from a warm, sea-breeze-cooled region of modest output and consistently high quality. Which GI is it MOST LIKELY from?","options":{"a":"Adelaide Hills","b":"Margaret River","c":"South Eastern Australia","d":"Chablis"},"notes":{"a":"Cooled by altitude, not sea breezes.","b":"Correct: Western Australia; warm, but sea breezes moderate temperatures and slow ripening (p. 70).","c":"High volume, often from warm irrigated inland vineyards; not small volume.","d":"Cool; light to medium body with green apple, lemon and wet stones."},"answer":"b","ctx":"","src":"L2 book p. 70 (Australia)","cards":"L2-card-61"},{"id":"Q-L2-11-02","level":"L2","lo":"LO3","ch":"11","topic":"Sauvignon Blanc aromas","trap":"","stem":"Which group of herbaceous aromas is typical of Sauvignon Blanc?","options":{"a":"White blossom, ripe peach and apricot","b":"Pear, lemon and ripe banana","c":"Grass, bell pepper and asparagus","d":"Rose, lychee and ripe apricot"},"notes":{"a":"This is Viognier's floral and stone-fruit profile (p. 79), not herbaceous.","b":"These are fruit flavours of Pinot Grigio/Gris styles (p. 76), not herbaceous aromas.","c":"Correct: the book lists grass, green bell pepper (capsicum) and asparagus as its pronounced herbaceous aromas.","d":"These are Gewurztraminer's floral and fruit aromas (p. 79), not herbaceous ones."},"answer":"c","ctx":"","src":"L2 book p. 72 (The characteristics of Sauvignon Blanc)","cards":"L2-card-62"},{"id":"Q-L2-11-03","level":"L2","lo":"LO3","ch":"11","topic":"Ripeness and flavour","trap":"LEAST stem","stem":"A Sauvignon Blanc is made from grapes picked at a low level of ripeness. Which flavour is it LEAST likely to show?","options":{"a":"Crisp green apple","b":"Passion fruit","c":"Grapefruit","d":"Gooseberry"},"notes":{"a":"Likely: green fruit is at the less ripe end of the book's range.","b":"Correct: tropical fruit (passion fruit) comes with riper grapes; less ripe grapes give green fruit and citrus.","c":"Likely: citrus (grapefruit) sits with green fruit and wet stones at the less ripe end.","d":"Likely: green fruit (apple, gooseberry) is at the less ripe end of the book's range."},"answer":"b","ctx":"Ripeness ladder: green fruit, citrus, wet stones -> stone fruit (peach) -> tropical fruit (passion fruit).","src":"L2 book p. 72 (The characteristics of Sauvignon Blanc)","cards":"L2-card-62"},{"id":"Q-L2-11-04","level":"L2","lo":"LO3","ch":"11","topic":"Sauvignon Blanc and oak","trap":"","stem":"Why are most single-varietal Sauvignon Blancs made in inert vessels rather than new oak?","options":{"a":"New oak can easily overwhelm its herbaceous character.","b":"Inert vessels add the flavours of grass and asparagus.","c":"New oak would raise its acidity to quite unpleasant levels.","d":"Inert vessels allow the wine to age for many years."},"notes":{"a":"Correct: the book says its distinctive herbaceous characters may be easily overwhelmed by new oak.","b":"Inert vessels add no flavour; grass and asparagus come from the grape itself.","c":"Oak does not raise acidity; the book's reason is that oak flavours mask the herbaceous character.","d":"No: the book says Sauvignon Blanc is usually best drunk young."},"answer":"a","ctx":"","src":"L2 book p. 72 (Winemaking and maturation options)","cards":"L2-card-62"},{"id":"Q-L2-11-05","level":"L2","lo":"LO3","ch":"11","topic":"'Barrel aged' label term","trap":"","stem":"A Sauvignon Blanc label says 'barrel aged'. What does this tell you about the wine?","options":{"a":"It was aged in bottle before release.","b":"It was made from late-picked grapes.","c":"Oak was used during winemaking.","d":"It was made from very old vines."},"notes":{"a":"'Barrel' refers to oak vessels, not to bottle ageing.","b":"That would be 'Late Harvest' or, in Alsace, Vendanges tardives (p. 78).","c":"Correct: the book says oak use is typically shown by terms such as 'barrel aged'.","d":"That would be 'Old Vines' (vieilles vignes), which has no legal definition (p. 38)."},"answer":"c","ctx":"Most Sauvignon Blanc is unoaked, so an oak term on the label is a useful style clue.","src":"L2 book p. 72 (Winemaking and maturation options)","cards":"L2-card-62"},{"id":"Q-L2-11-06","level":"L2","lo":"LO3","ch":"11","topic":"Drinking Sauvignon Blanc young","trap":"","stem":"Why is Sauvignon Blanc usually best drunk young?","options":{"a":"Its oak flavours fade quickly and leave the wine thin.","b":"Its firm tannins become harsh and drying with bottle age.","c":"Its low acidity leaves it flat and dull after a short time.","d":"Its fresh aromas can fade and turn vegetal quite quickly."},"notes":{"a":"Most are unoaked (inert vessels); the problem the book gives is loss of fresh aroma.","b":"Tannin is not the issue: it is a white wine, mostly made in inert vessels.","c":"It has high acidity (p. 72); the problem the book gives is loss of fresh aroma.","d":"Correct: even outstanding examples can lose fresh aromas within a couple of years and develop vegetal notes."},"answer":"d","ctx":"Exception to remember: very good oak-matured Graves and Pessac-Léognan whites can develop honey and nuts (p. 73).","src":"L2 book p. 72 (Winemaking and maturation options)","cards":"L2-card-62"},{"id":"Q-L2-11-07","level":"L2","lo":"LO3","ch":"11","topic":"Sancerre style","trap":"MOST LIKELY stem","stem":"An unoaked, single-varietal white has high acidity, green apple, grass, asparagus and a hint of wet stones. Which GI is it MOST LIKELY from?","options":{"a":"Constantia","b":"Pays d'Oc","c":"Sancerre","d":"Pessac-Léognan"},"notes":{"a":"Constantia Sauvignon Blanc is described with ripe tropical fruit as well as herbaceous aromas (p. 74).","b":"Languedoc Sauvignon Blanc shows tropical fruit (passion fruit) alongside grass (p. 73).","c":"Correct: the book's Sancerre/Pouilly-Fumé profile is dry, high acid, apple, grass, asparagus, sometimes wet stones.","d":"Typically a Sémillon blend, and the best are often oak-matured (p. 73); this stem describes an unoaked varietal."},"answer":"c","ctx":"Causal chain: cool Loire climate -> grapes stay at the less ripe end -> green fruit, herbaceous notes, high acidity.","src":"L2 book p. 73 (France: Loire)","cards":"L2-card-63, L2-card-64"},{"id":"Q-L2-11-08","level":"L2","lo":"LO3","ch":"11","topic":"Sancerre and Pouilly-Fumé","trap":"","stem":"Which white grape varieties are permitted in Sancerre AOC and Pouilly-Fumé AOC?","options":{"a":"Only Sauvignon Blanc is permitted in both.","b":"Their whites are Sauvignon Blanc-Sémillon blends.","c":"They are sold under the wider Touraine AOC label.","d":"Both lie side by side on the same bank of the Loire."},"notes":{"a":"Correct: both are cool Loire AOCs where Sauvignon Blanc is the only white variety permitted.","b":"Sémillon blends are typical of Graves and Pessac-Léognan in Bordeaux, not these Loire AOCs.","c":"Touraine AOC is a separate appellation covering the wider sub-region to their west.","d":"The book says the two appellations face each other across the Loire River."},"answer":"a","ctx":"Memory hook: Sancerre and Pouilly-Fumé are neighbours facing each other across the river.","src":"L2 book p. 73 (France: Loire)","cards":"L2-card-63"},{"id":"Q-L2-11-09","level":"L2","lo":"LO3","ch":"11","topic":"Touraine Sauvignon Blanc","trap":"","stem":"How does Touraine AOC Sauvignon Blanc typically differ from Sancerre?","options":{"a":"It is richer and oak-matured, from a single village to the east.","b":"It is fruity and inexpensive, from a wider area to the west.","c":"It is blended with Sémillon to add body and ageing potential.","d":"It is made sweet from late-harvested, extra-ripe grapes."},"notes":{"a":"Wrong on both style and place: Touraine lies to the west and is typically fruity and inexpensive.","b":"Correct: grapes come from the wider Touraine sub-region west of Sancerre and Pouilly-Fumé (p. 73).","c":"Sémillon blends are typical of Bordeaux (Graves, Pessac-Léognan), not Touraine.","d":"The book describes Touraine Sauvignon Blanc as fruity and inexpensive, not sweet."},"answer":"b","ctx":"","src":"L2 book p. 73 (France: Loire)","cards":"L2-card-63"},{"id":"Q-L2-11-10","level":"L2","lo":"LO3","ch":"11","topic":"Pessac-Léognan white blend","trap":"Pessac-Léognan whites = Sauvignon Blanc + Sémillon (known gap)","stem":"White Pessac-Léognan is typically a blend. Which grape is blended with Sauvignon Blanc, and what does it add?","options":{"a":"Viognier, which adds floral notes and body","b":"Chardonnay, which adds body and a creamy texture","c":"Sémillon, which adds body and helps the wine age","d":"Sémillon, which adds acidity and herbaceous aromas"},"notes":{"a":"Viognier is a blending partner elsewhere (p. 80), but not in Bordeaux whites.","b":"Chardonnay is not part of the Bordeaux white blend in the book; the partner is Sémillon.","c":"Correct: the book says Sémillon adds body to Sauvignon Blanc and helps the wine to age.","d":"Right grape, wrong role: high acidity and herbaceous aromas come from Sauvignon Blanc itself."},"answer":"c","ctx":"Known gap: Pessac-Léognan reds are Cabernet Sauvignon-led (p. 82, 86); its whites are Sauvignon Blanc-Sémillon blends.","src":"L2 book p. 73 (France: Bordeaux)","cards":"L2-card-63"},{"id":"Q-L2-11-11","level":"L2","lo":"LO3","ch":"11","topic":"Aged white Pessac-Léognan","trap":"Pessac-Léognan whites (known gap)","stem":"An outstanding, oak-matured white Pessac-Léognan has spent ten years in bottle. Which flavours is it MOST LIKELY to have developed?","options":{"a":"Passion fruit and grass","b":"Banana and candy","c":"Honey and nuts","d":"Bread and biscuit"},"notes":{"a":"These are fresh primary aromas; with age they fade rather than develop.","b":"These come from Beaujolais-style red winemaking (p. 94), not aged white Bordeaux.","c":"Correct: very good or outstanding Graves and Pessac-Léognan whites develop honey and nuts in bottle (p. 73).","d":"These come from contact with dead yeast (lees), as in traditional-method sparkling wine."},"answer":"c","ctx":"Why it can age: Sémillon adds body and ageing potential, and the best wines are oak-matured.","src":"L2 book p. 73 (France: Bordeaux)","cards":"L2-card-63"},{"id":"Q-L2-11-12","level":"L2","lo":"LO3","ch":"11","topic":"Bordeaux AOC vs Graves","trap":"","stem":"How does a simple white Bordeaux AOC Sauvignon Blanc typically differ from a white Graves AOC?","options":{"a":"It is fresher and simpler, with grass and green apple.","b":"It must be a blend, while Graves may be single-varietal.","c":"It is oak-matured, while Graves is usually unoaked.","d":"It is fuller-bodied, as it contains more Sémillon."},"notes":{"a":"Correct: Graves and Pessac-Léognan whites are described as more concentrated and complex (p. 73).","b":"Reversed idea: Bordeaux AOC may be varietal Sauvignon Blanc or a blend; Graves is typically a blend.","c":"Reversed: it is very good Graves and Pessac-Léognan that are often oak-matured.","d":"The book says it is Graves that is the more concentrated, complex wine."},"answer":"a","ctx":"Spec Bordeaux GIs for Sauvignon Blanc: Bordeaux, Graves, Pessac-Léognan.","src":"L2 book p. 73 (France: Bordeaux)","cards":"L2-card-63, L2-card-36"},{"id":"Q-L2-11-13","level":"L2","lo":"LO3","ch":"11","topic":"Pays d'Oc Sauvignon Blanc","trap":"Pays d'Oc is a PGI (IGP), not an AOC (known gap)","stem":"Much of Languedoc-Roussillon is too warm for Sauvignon Blanc. Where does it make its best wines there, and how are they usually labelled?","options":{"a":"Areas cooled by morning fog; Pays d'Oc IGP","b":"Areas cooled by altitude; Pays d'Oc AOC","c":"The warm coastal plains; Pays d'Oc AOC","d":"Areas cooled by altitude; Pays d'Oc IGP"},"notes":{"a":"Morning fog (with sea breezes) is the book's explanation for Casablanca, Chile.","b":"Right sites, wrong level: Pays d'Oc is an IGP (PGI), not an AOC.","c":"The best sites are those cooled by altitude, and Pays d'Oc is an IGP, not an AOC.","d":"Correct: both points are in the book (p. 73). Pays d'Oc is a PGI."},"answer":"d","ctx":"Style from here: dry, high acidity, tropical fruit (passion fruit) with grass.","src":"L2 book p. 73 (France: Languedoc-Roussillon); L2 spec p. 11","cards":"L2-card-63, L2-card-36"},{"id":"Q-L2-11-14","level":"L2","lo":"LO3","ch":"11","topic":"Marlborough fruit range","trap":"","stem":"Why do many Marlborough Sauvignon Blancs show a broad range of fruit, from grapefruit to passion fruit?","options":{"a":"Grapes from different sites or ripeness levels are blended.","b":"The wine is blended with Semillon, which adds tropical fruit.","c":"It is matured in new oak, which adds riper fruit flavours.","d":"Its warm climate ripens every grape fully to tropical fruit."},"notes":{"a":"Correct: the book says blending across sites or ripeness levels gives grapefruit, peach and passion fruit.","b":"Semillon blends are typical of Margaret River and Bordeaux, and Sémillon adds body, not tropical fruit.","c":"Oak does not add fruit flavours; oak is an experiment beyond the classic style (p. 73).","d":"Marlborough has a cool climate (p. 73)."},"answer":"a","ctx":"Marlborough is in the north-east of the South Island; its wines are more pronounced than the Loire's.","src":"L2 book p. 73 (New Zealand)","cards":"L2-card-64"},{"id":"Q-L2-11-15","level":"L2","lo":"LO3","ch":"11","topic":"Napa Valley Sauvignon Blanc","trap":"","stem":"California is mostly too warm for fresh, herbaceous Sauvignon Blanc. How do producers of very good examples in the Napa Valley achieve this style?","options":{"a":"They delay harvest to build herbaceous flavours.","b":"They use cooler areas and may harvest early.","c":"They blend in Sémillon to add acidity and freshness.","d":"They ferment in new oak to add herbaceous aromas."},"notes":{"a":"Picking late would lose acidity and herbaceous aromas; the book says pick early.","b":"Correct: early picking retains the grape's acidity and herbaceous aromas (p. 74).","c":"Sémillon adds body (p. 73); the book's answer is cooler sites and early picking.","d":"When oak is used in Napa it adds body and smoke (p. 74), not herbaceous aromas."},"answer":"b","ctx":"Some Napa examples are made in contact with oak to add body and flavour (smoke).","src":"L2 book p. 74 (USA)","cards":"L2-card-64"},{"id":"Q-L2-11-16","level":"L2","lo":"LO3","ch":"11","topic":"Australian Sauvignon Blanc","trap":"","stem":"Which statement about Sauvignon Blanc in Australia is correct?","options":{"a":"Adelaide Hills vineyards are cooled by morning fog.","b":"In Margaret River it is rarely blended with Semillon.","c":"Margaret River is in South Australia, near Adelaide.","d":"It is the most planted grape in Adelaide Hills."},"notes":{"a":"Wrong: they are cooled by altitude. Fog and sea breezes cool Casablanca, Chile.","b":"Wrong: Margaret River is known for it most commonly as a blend with Semillon.","c":"Wrong: Margaret River is in Western Australia; Adelaide Hills is in South Australia.","d":"Correct: and the Adelaide Hills vineyards are cooled by altitude (p. 74)."},"answer":"d","ctx":"Margaret River: often blended with Semillon, concentrated grassy aromas, some oak contact.","src":"L2 book p. 74 (Australia)","cards":"L2-card-64"},{"id":"Q-L2-11-17","level":"L2","lo":"LO3","ch":"11","topic":"Casablanca Valley","trap":"","stem":"Why does Chile's Casablanca Valley have a reputation for very good-quality Sauvignon Blanc?","options":{"a":"It is a large valley making mostly high-volume brands.","b":"It is cooled by sea breezes and morning fogs.","c":"It is cooled by its high altitude in the Andes.","d":"It is cooled by breezes from the Southern Ocean."},"notes":{"a":"Not the book's reason: the larger Central Valley makes a range of qualities (p. 74).","b":"Correct: as stated in the book (p. 74).","c":"Altitude is the book's explanation for Elgin and Adelaide Hills; Casablanca is coastal.","d":"Right idea, wrong ocean: Casablanca's breezes and fogs come from the Pacific (p. 54); the Southern Ocean cools Constantia (p. 74)."},"answer":"b","ctx":"Spec Chilean GIs for Sauvignon Blanc: Casablanca Valley and Central Valley.","src":"L2 book p. 74 (Chile)","cards":"L2-card-64"},{"id":"Q-L2-11-18","level":"L2","lo":"LO3","ch":"11","topic":"Elgin vs Constantia","trap":"Elgin and Constantia = Sauvignon Blanc (known gap)","stem":"How does a typical Elgin Sauvignon Blanc differ from one from Constantia?","options":{"a":"Elgin shows more ripe tropical fruit and less acidity.","b":"Elgin is usually blended with Semillon and oaked.","c":"Elgin shows more green fruit (apple) and wet stones.","d":"Elgin is warmer, as it lies inland, away from the sea."},"notes":{"a":"Reversed: ripe tropical fruit is the book's Constantia description.","b":"Not the book's description of Elgin; Semillon blends are typical of Margaret River.","c":"Correct: Elgin gives apple and sometimes wet stones; Constantia shows ripe tropical fruit and herbaceous aromas.","d":"Elgin is cooled by altitude and often cited as the coolest wine region in South Africa."},"answer":"c","ctx":"Hook: Elgin = Elevation (altitude, apple). Constantia = Coast (Southern Ocean breezes, tropical).","src":"L2 book p. 74 (South Africa)","cards":"L2-card-64"},{"id":"Q-L2-11-19","level":"L2","lo":"LO3","ch":"11","topic":"Cooling influences","trap":"NOT stem; Constantia is cooled by the sea (known gap)","stem":"For which of these Sauvignon Blanc regions does the book NOT give altitude as the cooling influence?","options":{"a":"Constantia","b":"Languedoc-Roussillon","c":"Elgin","d":"Adelaide Hills"},"notes":{"a":"Correct: Constantia, south of Cape Town, is cooled by sea breezes from the Southern Ocean (p. 74).","b":"Its best Sauvignon Blanc comes from areas cooled by altitude (p. 73).","c":"Cooled by altitude; often cited as the coolest wine region in South Africa (p. 74).","d":"Cooled by altitude; Sauvignon Blanc is its most widely planted grape (p. 74)."},"answer":"a","ctx":"South Africa's Sauvignon Blanc is mostly coastal, as inland vineyards are generally too warm (p. 74).","src":"L2 book p. 73-74","cards":"L2-card-63, L2-card-64"},{"id":"Q-L2-12-02","level":"L2","lo":"LO3","ch":"12","topic":"Pinot Grigio and Pinot Gris","trap":"","stem":"What is the relationship between Pinot Grigio and Pinot Gris?","options":{"a":"They are the Italian and French names for one grape.","b":"Pinot Gris is the name used only for sweet wines.","c":"They are two different grapes from the same grape family.","d":"Pinot Grigio is a black grape; Pinot Gris is white."},"notes":{"a":"Correct: Pinot Grigio is the Italian name and Pinot Gris the French name for the same white variety.","b":"Alsace Pinot Gris ranges from dry to medium (p. 77); the name is simply the French one.","c":"No: the book says they are two names for the same white grape variety.","d":"Both names refer to the same white grape (p. 76)."},"answer":"a","ctx":"","src":"L2 book p. 76 (Pinot Grigio/Pinot Gris)","cards":"L2-card-65"},{"id":"Q-L2-12-03","level":"L2","lo":"LO3","ch":"12","topic":"Riper Pinot Gris style","trap":"","stem":"What style of Pinot Gris comes from controlled yields and a delayed harvest?","options":{"a":"Full body, high acidity, grass and green apple","b":"Light body, low acidity, rose and lychee","c":"Full body, medium acidity, peach, mango and banana","d":"Light body, medium to high acidity, simple pear and lemon"},"notes":{"a":"Riper grapes have lower acidity, and grass and green apple suggest Sauvignon Blanc.","b":"Rose and lychee belong to Gewurztraminer, which is full-bodied (p. 79).","c":"Correct: powerful and full-bodied, medium acidity, pronounced lemon, peach, mango and banana (p. 76).","d":"This is the common style from high yields picked early (p. 76)."},"answer":"c","ctx":"Causal chain: lower yields + later picking -> more sugar, less acid, more complex flavour -> fuller, richer wine.","src":"L2 book p. 76 (The characteristics of Pinot Grigio/Pinot Gris)","cards":"L2-card-65"},{"id":"Q-L2-12-04","level":"L2","lo":"LO3","ch":"12","topic":"What sets the style","trap":"","stem":"According to the book, what mainly determines which of Pinot Grigio's two very different styles is produced?","options":{"a":"Grape-growing and harvesting choices","b":"The use of oak barrels or inert vessels","c":"Whether malolactic conversion takes place","d":"The length of ageing in bottle before release"},"notes":{"a":"Correct: the two styles are determined principally by grape-growing and harvesting choices (p. 76).","b":"Both styles are typically fermented in inert vessels (p. 76).","c":"The book says the styles are decided mainly in the vineyard: yields and harvest timing.","d":"Bottle age can add ginger and honey to fuller styles, but the style is set in the vineyard."},"answer":"a","ctx":"The book calls it a variety that shows how yields and ripeness decide style, quality and price (p. 78).","src":"L2 book p. 76 (Pinot Grigio/Pinot Gris)","cards":"L2-card-65"},{"id":"Q-L2-12-05","level":"L2","lo":"LO3","ch":"12","topic":"Off-dry Pinot Gris","trap":"","stem":"How do some producers of the riper, fuller-bodied Pinot Gris style keep an off-dry or medium level of sweetness?","options":{"a":"They ferment the wine in new oak barrels.","b":"They interrupt fermentation by removing the yeasts.","c":"They leave the grapes to freeze on the vine.","d":"They add grape spirit to stop the fermentation early."},"notes":{"a":"Oak does not add sweetness, and Pinot Gris is typically fermented in inert vessels.","b":"Correct: as stated in the book (p. 76); the lighter Italian style is almost always fermented to dryness.","c":"That is how icewine is made, not the book's method for Pinot Gris.","d":"That is fortification (15-20% abv), used for Port (p. 44), not for still Pinot Gris."},"answer":"b","ctx":"","src":"L2 book p. 76 (Winemaking and maturation options)","cards":"L2-card-65"},{"id":"Q-L2-12-06","level":"L2","lo":"LO3","ch":"12","topic":"Pinot Grigio ageing","trap":"","stem":"How do light Pinot Grigio and concentrated, full-bodied Pinot Gris typically differ in their ageing?","options":{"a":"The light style fades fast; the full style can gain ginger and honey.","b":"Both styles develop petrol and toast notes after several years.","c":"Both styles should be drunk young, as their fruit fades quickly in bottle.","d":"The light style gains honey and nuts; the full style fades fast."},"notes":{"a":"Correct: simple flavours fade quickly; full-bodied examples can develop ginger and honey in bottle (p. 76).","b":"Petrol is the book's tertiary note for aged Riesling (p. 59), not Pinot Gris.","c":"Only the light style; concentrated, full-bodied examples can develop in bottle.","d":"Reversed: it is the light style that should be drunk young and fresh."},"answer":"a","ctx":"","src":"L2 book p. 76 (Winemaking and maturation options)","cards":"L2-card-65"},{"id":"Q-L2-12-07","level":"L2","lo":"LO3","ch":"12","topic":"Veneto Pinot Grigio labels","trap":"DOC vs IGT levels; PGI terms (known gap)","stem":"Much high-volume Pinot Grigio comes from the Veneto. Under which labels is it typically sold?","options":{"a":"Friuli-Venezia Giulia DOC or Veneto IGT","b":"delle Venezie DOC or Veneto IGT","c":"Soave DOC or Veneto IGT","d":"Veneto DOC or delle Venezie IGT"},"notes":{"a":"Friuli-Venezia Giulia is a separate region, known for a fuller style (p. 77).","b":"Correct: as stated in the book (p. 77). Veneto IGT is the PGI; delle Venezie DOC is a PDO.","c":"Soave is a Veneto GI for Garganega, not Pinot Grigio.","d":"Levels swapped: the book gives delle Venezie DOC and Veneto IGT."},"answer":"b","ctx":"Spec: PGI Veneto; PDOs delle Venezie and Friuli-Venezia Giulia (plus Alsace in France).","src":"L2 book p. 77 (Italy); L2 spec p. 11","cards":"L2-card-66, L2-card-36"},{"id":"Q-L2-12-08","level":"L2","lo":"LO3","ch":"12","topic":"Typical Italian Pinot Grigio","trap":"NOT stem","stem":"Which of the following is NOT typical of most Italian Pinot Grigio?","options":{"a":"No oak influence","b":"A light body","c":"A long finish","d":"An inexpensive price"},"notes":{"a":"Typical: the book describes them as unoaked.","b":"Typical: with few exceptions they are simple, unoaked and light in body.","c":"Correct: they typically have a short finish and are most commonly acceptable to good in quality (p. 77).","d":"Typical: high-volume production keeps them inexpensive."},"answer":"c","ctx":"","src":"L2 book p. 77 (Italy)","cards":"L2-card-66"},{"id":"Q-L2-12-09","level":"L2","lo":"LO3","ch":"12","topic":"Friuli-Venezia Giulia","trap":"","stem":"In which Italian region does the book say a more complex, fuller-bodied style of Pinot Grigio can be found?","options":{"a":"Tuscany, on the central-west coast of Italy","b":"Puglia, in the heel of the south-east","c":"Piemonte, in the far north-west corner","d":"Friuli-Venezia Giulia, in the north-east"},"notes":{"a":"Not given for Pinot Grigio in the book; Tuscany is known for Sangiovese.","b":"Not given for Pinot Grigio in the book.","c":"Not given for Pinot Grigio in the book; Piemonte is known for Nebbiolo, Barbera and Cortese.","d":"Correct: Friuli-Venezia Giulia is in northern Italy's eastern corner (p. 77)."},"answer":"d","ctx":"Contrast: the Veneto makes the light, high-volume style; Friuli-Venezia Giulia the fuller one.","src":"L2 book p. 77 (Italy)","cards":"L2-card-66"},{"id":"Q-L2-12-10","level":"L2","lo":"LO3","ch":"12","topic":"Pinot Grigio fermentation","trap":"","stem":"Why is Pinot Grigio/Pinot Gris typically fermented in inert vessels?","options":{"a":"To raise its acidity before bottling","b":"To preserve its fruity flavours","c":"To add body and toasty flavours","d":"To let in oxygen slowly through the walls"},"notes":{"a":"Inert vessels do not raise acidity; the aim is to keep the fruit.","b":"Correct: as stated in the book (p. 76).","c":"Toast and extra body would come from oak barrels, not inert vessels.","d":"That is a feature of oak barrels; inert vessels such as stainless steel do not do this."},"answer":"b","ctx":"","src":"L2 book p. 76 (Winemaking and maturation options)","cards":"L2-card-65"},{"id":"Q-L2-12-11","level":"L2","lo":"LO3","ch":"12","topic":"Alsace Pinot Gris acidity","trap":"","stem":"Why does Alsace AOC Pinot Gris typically have only medium acidity?","options":{"a":"The wine is matured for years in new oak.","b":"The vines are cropped at very high yields.","c":"The grapes are picked later, when extra-ripe.","d":"The grapes are picked early to keep them fresh."},"notes":{"a":"Not the book's reason; the cause is late picking of extra-ripe grapes.","b":"High yields go with the light, simple style, not with Alsace (p. 76).","c":"Correct: by then acidity is typically medium, with more sugar ripeness and flavour complexity (p. 77).","d":"Early picking retains acidity; it gives the light Italian style (p. 76)."},"answer":"c","ctx":"Alsace style: dry to medium, medium to full body, pronounced peach and mango; honey and ginger with age.","src":"L2 book p. 77 (France)","cards":"L2-card-66"},{"id":"Q-L2-12-12","level":"L2","lo":"LO3","ch":"12","topic":"Alsace Grand Cru label","trap":"","stem":"What does 'Grand Cru' on an Alsace Pinot Gris label tell you?","options":{"a":"The wine is a blend of the region's best grapes.","b":"The wine was made from late-harvested grapes.","c":"The grapes came from a specific grand cru vineyard.","d":"The wine comes from a top-ranked château."},"notes":{"a":"Alsace wines are typically labelled by grape variety; grands crus are defined by vineyard.","b":"That is Vendanges tardives (VT); both Alsace and Alsace Grand Cru can be VT (p. 78).","c":"Correct: Alsace Grand Cru wines must come from specific vineyards, mostly on the Vosges foothills (p. 78).","d":"Château rankings are a Bordeaux idea (Grand Cru Classé), not Alsace."},"answer":"c","ctx":"The book says the best Alsace Pinot Gris comes from grand cru vineyards (p. 77).","src":"L2 book p. 78 (Labelling in Alsace)","cards":"L2-card-20, L2-card-66"},{"id":"Q-L2-12-13","level":"L2","lo":"LO3","ch":"12","topic":"Why grands crus are riper","trap":"","stem":"Why are Alsace grand cru wines typically riper in flavour and fuller in body than wines from the flatter plains?","options":{"a":"Their slopes face north, sheltered from the sun.","b":"Their flat, fertile sites give higher yields of riper grapes.","c":"Their grapes are concentrated by noble rot each year.","d":"Their steep east/south-east slopes get more sunlight."},"notes":{"a":"They face east/south-east, which gives more sunlight, not less.","b":"The grands crus are on steep slopes; the book contrasts them with the flatter plains.","c":"Not the book's reason; it credits the extra sunlight on the steep slopes.","d":"Correct: the grand cru sites on the Vosges foothills receive more sunlight (p. 78)."},"answer":"d","ctx":"Causal chain: steep slope facing the morning sun -> more sunlight -> riper grapes -> riper flavour, fuller body.","src":"L2 book p. 78 (Labelling in Alsace)","cards":"L2-card-20"},{"id":"Q-L2-12-14","level":"L2","lo":"LO3","ch":"12","topic":"Vendanges tardives","trap":"","stem":"What does 'Vendanges tardives' (VT) mean on an Alsace label, and what style does it typically denote?","options":{"a":"Late harvest; a medium to sweet wine from extra-ripe grapes","b":"Old vines; a concentrated dry wine from low yields","c":"Grand cru vineyard; a dry wine from steep, sunny slopes","d":"Late harvest; a dry wine with high alcohol from very ripe grapes"},"notes":{"a":"Correct: as stated in the book (p. 78).","b":"Old Vines is a different term with no legal definition; VT means late harvest.","c":"That describes Alsace Grand Cru, not VT.","d":"VT typically denotes a medium to sweet wine, not a dry one."},"answer":"a","ctx":"","src":"L2 book p. 78 (Labelling in Alsace)","cards":"L2-card-20"},{"id":"Q-L2-12-15","level":"L2","lo":"LO3","ch":"12","topic":"VT labelling rules","trap":"Both Alsace and Alsace Grand Cru can be VT","stem":"Which statement about Vendanges tardives (VT) in Alsace is correct?","options":{"a":"VT is a separate appellation for the sweet wines of Alsace.","b":"Alsace AOC and Alsace Grand Cru wines can both be VT.","c":"VT is reserved for Alsace Grand Cru wines.","d":"Pinot Gris cannot be labelled VT in Alsace."},"notes":{"a":"Wrong: VT is a labelling term used on Alsace or Alsace Grand Cru wines.","b":"Correct: as stated in the book (p. 78).","c":"Wrong: the book says both Alsace and Alsace Grand Cru wines can be labelled VT.","d":"Wrong: Pinot Gris, Riesling and Gewurztraminer can all be labelled VT."},"answer":"b","ctx":"","src":"L2 book p. 78 (Labelling in Alsace)","cards":"L2-card-20"},{"id":"Q-L2-12-16","level":"L2","lo":"LO3","ch":"12","topic":"Alsace sweetness labelling","trap":"","stem":"As of the 2021 vintage, what must the label of an Alsace AOC wine indicate?","options":{"a":"The percentage of each grape in the blend","b":"The name of the grand cru vineyard","c":"Whether the wine was matured in oak","d":"Its level of sweetness, on a standardised scale"},"notes":{"a":"Not the 2021 rule; most Alsace wines are labelled with a single grape variety.","b":"Only Alsace Grand Cru wines come from named grand cru vineyards.","c":"Not a label requirement given in the book; the 2021 rule concerns sweetness.","d":"Correct: as stated in the book (p. 78); Alsace wines are also typically labelled by grape variety."},"answer":"d","ctx":"Why it helps: Alsace Pinot Gris can be dry to medium, so the scale tells you the sweetness.","src":"L2 book p. 78 (Labelling in Alsace)","cards":"L2-card-20"},{"id":"Q-L2-12-17","level":"L2","lo":"LO3","ch":"12","topic":"Pinot Gris vs Pinot Grigio name","trap":"","stem":"Outside Italy and France, what does a producer usually signal by labelling a wine 'Pinot Gris' rather than 'Pinot Grigio'?","options":{"a":"A style with more body and complexity","b":"A wine made from a different grape variety","c":"A lighter-bodied style with higher acidity","d":"A wine matured in new oak barrels"},"notes":{"a":"Correct: 'Pinot Grigio' signals a higher-acid, lighter-bodied style (p. 78).","b":"Pinot Grigio and Pinot Gris are the same grape (p. 76).","c":"Reversed: that is what 'Pinot Grigio' signals.","d":"The book says the names signal body and complexity, not oak use."},"answer":"a","ctx":"The names point to the classic models: Italian (light) and Alsace (fuller).","src":"L2 book p. 78 (Pinot Grigio/Pinot Gris today)","cards":"L2-card-66"},{"id":"Q-L2-12-18","level":"L2","lo":"LO3","ch":"12","topic":"Pinot Gris with food","trap":"BEST stem","stem":"A guest orders a strongly flavoured dish. Which of these wines is the BEST match?","options":{"a":"A New World 'Pinot Grigio'","b":"Veneto IGT Pinot Grigio","c":"Pinot Grigio delle Venezie DOC","d":"Alsace Grand Cru Pinot Gris"},"notes":{"a":"The name signals a lighter, higher-acid style that the dish could overpower.","b":"A light, simple style that a strongly flavoured dish would overpower.","c":"A light, simple style with a short finish; the dish would overpower it.","d":"Correct: riper Pinot Gris pairs well with strongly flavoured food (p. 78); intensities should match (p. 18)."},"answer":"d","ctx":"","src":"L2 book p. 78 (Pinot Grigio/Pinot Gris today); p. 18 (Flavour intensity)","cards":"L2-card-66, L2-card-24"},{"id":"Q-L2-12-19","level":"L2","lo":"LO3","ch":"12","topic":"Alsace Pinot Gris style","trap":"MOST LIKELY stem","stem":"An off-dry white has medium acidity, a full body, pronounced peach and mango, and notes of honey and ginger. Which wine is it MOST LIKELY to be?","options":{"a":"Sancerre","b":"Alsace Pinot Gris","c":"Rías Baixas Albariño","d":"Veneto IGT Pinot Grigio"},"notes":{"a":"Sancerre is dry with high acidity, green apple and herbaceous notes (p. 73).","b":"Correct: medium acidity, medium to full body, peach and mango, with honey and ginger in bottle (p. 77).","c":"Albariño is dry with high acidity, citrus and stone fruit (p. 80).","d":"Typically dry and light-bodied, with simple pear and lemon (p. 76-77)."},"answer":"b","ctx":"","src":"L2 book p. 77 (France)","cards":"L2-card-66"},{"id":"Q-L2-13-01","level":"L2","lo":"LO4","ch":"13","topic":"Gewurztraminer style","trap":"MOST LIKELY stem","stem":"A dry white is full-bodied and high in alcohol, with low acidity and pronounced aromas of rose and lychee. Which grape is it MOST LIKELY made from?","options":{"a":"Sauvignon Blanc","b":"Gewurztraminer","c":"Pinot Grigio","d":"Albariño"},"notes":{"a":"Sauvignon Blanc has high acidity, a light to medium body and herbaceous aromas (p. 72).","b":"Correct: full body, low to medium acidity, rose, peach, apricot and lychee (p. 79).","c":"Typical Pinot Grigio is light-bodied with simple pear and lemon (p. 76).","d":"Albariño is medium-bodied with high acidity and citrus and stone fruit (p. 80)."},"answer":"b","ctx":"Memory hook: Gewurz = rose and lychee.","src":"L2 book p. 79 (Gewurztraminer)","cards":"L2-card-67"},{"id":"Q-L2-13-02","level":"L2","lo":"LO4","ch":"13","topic":"Gewurztraminer alcohol","trap":"","stem":"Why is a dry Gewurztraminer typically high in alcohol?","options":{"a":"It is fortified with grape spirit after fermentation.","b":"It is fermented with the skins in new oak barrels.","c":"Its grapes build up high sugar levels as they ripen.","d":"It is grown in very hot climates with high yields."},"notes":{"a":"Fortification is used for fortified wines such as Port, not Gewurztraminer.","b":"Gewurztraminer is typically unoaked; the alcohol comes from the grape's sugar.","c":"Correct: when that sugar is fermented to dryness, the result is a high-alcohol wine (p. 79).","d":"It grows best in cool to moderate climates (p. 79)."},"answer":"c","ctx":"Causal chain: high sugar -> fermented dry -> high alcohol -> full body.","src":"L2 book p. 79 (Gewurztraminer)","cards":"L2-card-67"},{"id":"Q-L2-13-03","level":"L2","lo":"LO4","ch":"13","topic":"Gewurztraminer characteristics","trap":"NOT stem","stem":"Which of the following is NOT typical of Gewurztraminer?","options":{"a":"Unoaked winemaking","b":"Full body","c":"High acidity","d":"Lychee flavours"},"notes":{"a":"Typical: it is usually unoaked to preserve its floral aromas.","b":"Typical: high sugar gives high alcohol and a full body.","c":"Correct: a typical Gewurztraminer has low to medium acidity (p. 79).","d":"Typical: tropical fruit (lychee) alongside rose, peach and apricot (p. 79)."},"answer":"c","ctx":"","src":"L2 book p. 79 (Gewurztraminer)","cards":"L2-card-67"},{"id":"Q-L2-13-04","level":"L2","lo":"LO4","ch":"13","topic":"Alsace grand cru grapes","trap":"","stem":"In Alsace, Gewurztraminer makes some of the region's highest-quality grand cru wines alongside which two other grapes?","options":{"a":"Riesling and Pinot Gris","b":"Pinot Gris and Viognier","c":"Sauvignon Blanc and Pinot Gris","d":"Riesling and Chardonnay"},"notes":{"a":"Correct: as stated in the book (p. 79); these are also the typical grand cru grapes on p. 78.","b":"Viognier's classic French home is Condrieu, in the Northern Rhône (p. 80).","c":"The book's French homes for Sauvignon Blanc are the Loire, Bordeaux and Languedoc.","d":"Chardonnay is not named as an Alsace grand cru grape in the book."},"answer":"a","ctx":"Spec GIs for Gewurztraminer: Alsace and Alsace Grand Cru.","src":"L2 book p. 79 (Gewurztraminer); p. 78 (Labelling in Alsace)","cards":"L2-card-67, L2-card-20, L2-card-38"},{"id":"Q-L2-13-05","level":"L2","lo":"LO4","ch":"13","topic":"Condrieu style","trap":"MOST LIKELY stem","stem":"A dry white has low to medium acidity, high alcohol, a full body, pronounced blossom, peach and apricot, and a light vanilla note. Which GI is it MOST LIKELY from?","options":{"a":"delle Venezie","b":"Rías Baixas","c":"Sancerre","d":"Condrieu"},"notes":{"a":"Typically light, simple Pinot Grigio with pear and lemon (p. 77).","b":"Albariño from here has high acidity and a medium body (p. 80).","c":"Sancerre has high acidity and herbaceous, green-fruit aromas (p. 73).","d":"Correct: Viognier gives blossom, peach and apricot, and light vanilla from oak is common in Condrieu (p. 79-80)."},"answer":"d","ctx":"","src":"L2 book p. 79-80 (Viognier)","cards":"L2-card-67"},{"id":"Q-L2-13-06","level":"L2","lo":"LO4","ch":"13","topic":"Viognier and oak","trap":"","stem":"Unusually for an aromatic grape, Viognier is sometimes oaked. How is oak typically used in Condrieu AOC?","options":{"a":"It is not used, as oak is banned in Condrieu AOC","b":"To soften the wine's very high natural acidity","c":"To add strong toast and smoke flavours that dominate","d":"To add light vanilla without hiding the floral aromas"},"notes":{"a":"Wrong: the book says light oak flavours are common in Condrieu.","b":"Viognier already has low to medium acidity (p. 79).","c":"The book stresses care not to overpower the delicate floral aromas.","d":"Correct: light oak (vanilla) is common, but winemakers take care not to overpower the floral aromas (p. 80)."},"answer":"d","ctx":"Most Viognier is made in inert vessels; the oaked examples are the unusual ones (p. 79).","src":"L2 book p. 79-80 (Viognier)","cards":"L2-card-67"},{"id":"Q-L2-13-07","level":"L2","lo":"LO4","ch":"13","topic":"Condrieu AOC","trap":"Condrieu vs Côte Rôtie","stem":"Which statement best describes Condrieu AOC?","options":{"a":"A Northern Rhône AOC for Syrah co-fermented with Viognier","b":"A Southern Rhône AOC for white blends led by Viognier","c":"An Alsace AOC for late-harvested, sweet Viognier","d":"A Northern Rhône AOC for single-varietal Viognier"},"notes":{"a":"That is the tradition in Côte Rôtie, a red wine AOC (p. 91).","b":"Condrieu is in the Northern Rhône and is dedicated to single-varietal Viognier.","c":"Condrieu is in the Rhône; Viognier is not an Alsace grape in the book.","d":"Correct: as stated in the book (p. 80)."},"answer":"d","ctx":"Viognier is also a popular blending partner, adding floral notes and body (p. 80).","src":"L2 book p. 80 (Viognier)","cards":"L2-card-67, L2-card-38"},{"id":"Q-L2-13-08","level":"L2","lo":"LO4","ch":"13","topic":"Rías Baixas climate","trap":"","stem":"Why is Rías Baixas DO well suited to refreshing white wines such as Albariño?","options":{"a":"Near the Atlantic, it is cooler, wetter and cloudier.","b":"High altitude on the central plateau gives cool nights.","c":"Mediterranean breezes cool its hot, dry summers.","d":"Mountains shelter it from the rain-bearing Atlantic."},"notes":{"a":"Correct: a moderate climate, notably cooler, wetter and cloudier than many other Spanish regions (p. 80).","b":"Rías Baixas is in Spain's north-west corner, close to the Atlantic.","c":"It is on the Atlantic side, in Spain's north-west corner (p. 80).","d":"The reverse: its Atlantic position makes it wetter and cloudier."},"answer":"a","ctx":"Causal chain: Atlantic influence -> cooler, cloudier -> slower ripening -> high acidity, refreshing whites.","src":"L2 book p. 80 (Albariño)","cards":"L2-card-67, L2-card-38"},{"id":"Q-L2-13-09","level":"L2","lo":"LO4","ch":"13","topic":"Albariño style","trap":"","stem":"What is the typical style of an Albariño from Rías Baixas?","options":{"a":"Dry, high acidity, medium body, citrus and stone fruit","b":"Dry, medium acidity, full body, oaky vanilla and toast","c":"Dry, high acidity, light body, grass and asparagus","d":"Dry, low acidity, full body, rose and lychee"},"notes":{"a":"Correct: lemon, grapefruit, peach and apricot; usually unoaked and drunk young (p. 80).","b":"Albariño is most commonly unoaked; a little lees contact, not oak, may add body.","c":"Herbaceous aromas suggest Sauvignon Blanc; Albariño is medium-bodied with citrus and stone fruit.","d":"This describes Gewurztraminer (p. 79)."},"answer":"a","ctx":"Sometimes a small amount of lees contact is used to add body and complexity (p. 80).","src":"L2 book p. 80 (Albariño)","cards":"L2-card-67"},{"id":"Q-L3-11-01","level":"L3","lo":"Stretch (L2 LO3)","ch":"11","topic":"Awatere vs Wairau","trap":"","stem":"Why do Sauvignon Blancs from Marlborough's Awatere Valley tend to be more herbaceous and less tropical than many from the Wairau Valley?","options":{"a":"Awatere is drier, cooler and windier.","b":"Awatere wines are fermented in new oak barrels.","c":"Awatere is warmer, with longer sunny days.","d":"Awatere vines are cropped at much higher yields."},"notes":{"a":"Correct: per the L3 book, this gives higher acidity, pronounced herbaceous notes and less tropical fruit.","b":"Not the L3 book's explanation, and oak does not add herbaceous aromas.","c":"Reversed: the L3 book says Awatere is the cooler valley; it is Wairau that has long sunny days.","d":"Not the L3 book's explanation; it credits Awatere's drier, cooler, windier climate."},"answer":"a","ctx":"L2 only needs 'Marlborough is cool' and blending across sites; the two valleys are L3 detail.","src":"L3 book (2016) ch 40, p. 171","cards":"L3-stretch-21"},{"id":"Q-L3-11-02","level":"L3","lo":"Stretch (L2 LO3)","ch":"11","topic":"White Pessac-Léognan winemaking","trap":"","stem":"Why do the best white Pessac-Léognan wines have a rounder body and more toasty notes than most Sauvignon Blanc?","options":{"a":"They are fermented cool in steel and bottled early.","b":"They are made from grapes affected by noble rot.","c":"They are blended with Chardonnay for extra body.","d":"They are fermented and/or matured partly in new oak."},"notes":{"a":"That is the aromatic approach (e.g. New Zealand), which keeps fresh, fruity flavours.","b":"Noble rot is for the sweet wines of Sauternes, not the dry whites of Pessac-Léognan.","c":"The blending partner is Sémillon, not Chardonnay.","d":"Correct: per the L3 book, often with lees ageing and MLF; Sémillon adds further body."},"answer":"d","ctx":"L2 link: the L2 book says very good Graves and Pessac-Léognan whites are often oak-matured (p. 73).","src":"L3 book (2016) ch 8, p. 57, 60; ch 13, p. 79","cards":"L2-card-63"},{"id":"Q-L3-11-03","level":"L3","lo":"Stretch (L2 LO3)","ch":"11","topic":"MLF in Sancerre","trap":"","stem":"Why might a Sancerre producer encourage malolactic conversion (MLF) in a cooler vintage?","options":{"a":"To protect the wine from oxidation in barrel.","b":"To raise the alcohol of under-ripe grapes.","c":"To add herbaceous aromas of grass and asparagus.","d":"To lower the wine's high acidity."},"notes":{"a":"Not the role of MLF; SO2 is the winemaker's antioxidant.","b":"MLF converts malic acid to softer lactic acid; it does not raise alcohol.","c":"MLF can add buttery notes, not herbaceous ones; those come from the grape.","d":"Correct: per the L3 book, MLF is most likely to be encouraged in cooler vintages to lower acidity."},"answer":"d","ctx":"Why cool years matter: the Loire is at the northern limit for its grapes, so vintages vary widely (L3 p. 95).","src":"L3 book (2016) ch 18, p. 95","cards":"L3-stretch-27, L3-stretch-15"},{"id":"Q-L3-12-01","level":"L3","lo":"Stretch (L2 LO3)","ch":"12","topic":"Pinot Grigio clones","trap":"","stem":"Why are premium Pinot Grigios from Italy's northern alpine regions more concentrated than high-volume Pinot Grigio from the Veneto plain?","options":{"a":"They use a pale-skinned clone with large, fleshy berries.","b":"They use small-berried clones capable of more concentration.","c":"They are harvested early at high yields to keep acidity.","d":"They are fermented and matured in new oak barriques."},"notes":{"a":"Reversed: that clone gives the relatively neutral, high-volume Veneto wines.","b":"Correct: per the L3 book; the Veneto volume wines use a pale-skinned clone with large, fleshy pulp.","c":"High yields and early picking give the neutral, high-volume style.","d":"Not the L3 book's explanation; it points to clone, climate and viticulture."},"answer":"b","ctx":"L2 link: the L2 book's light style comes from high yields and an early harvest (p. 76).","src":"L3 book (2016) ch 8, p. 60-61","cards":"L2-card-65, L2-card-66"},{"id":"Q-L3-12-02","level":"L3","lo":"Stretch (L2 LO3)","ch":"12","topic":"Alto Adige Pinot Grigio","trap":"","stem":"Why are Alto Adige's mountain vineyards well suited to dry Pinot Grigio with high acidity?","options":{"a":"Heavy summer rain swells the grapes and dilutes sugar.","b":"Altitude gives warm nights that speed up ripening.","c":"Warm Adriatic breezes give a long, hot growing season.","d":"Altitude gives a large diurnal range, with cool nights."},"notes":{"a":"The L3 book says Alto Adige has short, dry summers with low rainfall.","b":"Reversed: altitude gives cool nights; warm nights would speed the loss of acidity.","c":"The L3 book links the Adriatic to Friuli's warm southern plain, not to Alto Adige.","d":"Correct: per the L3 book, this makes the area ideal for aromatic whites; its Pinot Grigio is dry with high acidity."},"answer":"d","ctx":"Alto Adige is not on the L2 spec; the L2 Italian Pinot Grigio GIs are Veneto, delle Venezie and Friuli-Venezia Giulia.","src":"L3 book (2016) ch 27, p. 121-122","cards":"L3-stretch-09, L3-stretch-38"},{"id":"Q-L3-13-01","level":"L3","lo":"Stretch (L2 LO4)","ch":"13","topic":"Viognier ripeness","trap":"","stem":"Why does Viognier typically give wines with high alcohol and only low to medium acidity?","options":{"a":"It is usually grown in the hottest, flattest valley floors.","b":"Its signature aromas only develop at very high sugar levels.","c":"It is usually blended with Marsanne for extra weight.","d":"It is usually fermented and matured in new oak barrels."},"notes":{"a":"Not the L3 book's reason; the best Condrieu comes from steep, terraced, well-exposed sites.","b":"Correct: per the L3 book, growers must wait until late in the season, by which time acidity has fallen.","c":"Condrieu is made solely from Viognier; in the L3 book Marsanne is blended with Roussanne.","d":"Oak does not raise alcohol, and the L3 book says new oak must be handled with care."},"answer":"b","ctx":"L2 link: the L2 book gives Viognier low to medium acidity, high alcohol and a medium to full body (p. 79).","src":"L3 book (2016) ch 19, p. 100","cards":"L3-stretch-31"},{"id":"Q-L3-13-02","level":"L3","lo":"Stretch (L2 LO4)","ch":"13","topic":"Albariño in a damp climate","trap":"","stem":"Rías Baixas is damp, so mildew and rot are a risk. Which two features help Albariño growers cope with this?","options":{"a":"Pergola training and very thin grape skins","b":"Thin grape skins and vines trained close to the soil","c":"Thick grape skins and vines trained on pergolas","d":"Thick grape skins and a hot, dry growing season"},"notes":{"a":"Right training, wrong skin: the L3 book says Albariño is thick-skinned.","b":"Thin skins and low training would raise rot risk; the L3 book gives thick skins and pergolas.","c":"Correct: per the L3 book, thick skins resist fungal disease and pergolas encourage air circulation.","d":"Right skin, wrong climate: the L3 book describes Rías Baixas as moderate and damp."},"answer":"c","ctx":"L2 link: the L2 book says Rías Baixas is notably cooler, wetter and cloudier than much of Spain (p. 80).","src":"L3 book (2016) ch 30, p. 133, 137","cards":"L3-stretch-34, L3-stretch-35"},{"id":"Q-L2-11-20","level":"L2","lo":"LO3","ch":"11","topic":"Chile Central Valley Sauvignon","trap":"","stem":"Which describes the quality of Sauvignon Blanc from Chile's larger Central Valley, in contrast to Casablanca Valley's reputation for very good quality?","options":{"a":"It is cooler, thanks to more sea breezes and morning fog.","b":"It ranges from inexpensive high-volume brands to very good.","c":"It is typically matured in new oak and sold at a premium.","d":"It is mostly an off-dry, simple style from warm sites."},"notes":{"a":"Reversed: it is coastal Casablanca that is cooled by sea breezes and fog.","b":"Correct: the larger Central Valley makes a range of quality levels (p. 74).","c":"Not given for Chile; the book's Central Valley point is a range of quality levels (p. 74).","d":"No: the book gives a range of quality, from inexpensive brands to very good (p. 74)."},"answer":"b","ctx":"Casablanca: coastal, cooled by sea breezes and morning fogs; reputation for very good quality.","src":"L2 book p. 74 (Chile)","cards":"L2-card-64"},{"id":"Q-L2-14-02","level":"L2","lo":"LO3","ch":"14","topic":"Merlot structure","trap":"Merlot vs Cabernet structure","stem":"What levels of acidity and tannin does a typical single-varietal Merlot have?","options":{"a":"Low acidity and low tannins","b":"High acidity and low tannins","c":"High acidity with high, firm tannins","d":"Medium acidity and medium tannins"},"notes":{"a":"Merlot is medium in both; it softens blends but is not low in either.","b":"Not Merlot's profile; the book gives medium acidity and medium tannins.","c":"That is Cabernet Sauvignon, which Merlot is often blended with to soften.","d":"Correct: the book says single-varietal Merlot is typically dry with medium acidity and medium tannins."},"answer":"d","ctx":"Contrast: Cabernet Sauvignon is high in acidity and tannin

, which is why Merlot softens it in blends.","src":"L2 book p. 81 (The characteristics of Merlot)","cards":"L2-card-68"},{"id":"Q-L2-14-03","level":"L2","lo":"LO3","ch":"14","topic":"Just-ripe Merlot","trap":"NOT stem; just-ripe vs riper","stem":"Which of these flavours is NOT typical of a wine made from just-ripe Merlot grapes?","options":{"a":"Strawberry","b":"Cooked blackberry","c":"Red plum","d":"Green bell pepper"},"notes":{"a":"Typical: the book lists fresh red fruit (strawberry, red plum) for just-ripe Merlot.","b":"Correct: cooked black fruit (blackberry, black plum) comes from RIPER Merlot grapes.","c":"Typical: fresh red fruit is the just-ripe Merlot profile.","d":"Typical: just-ripe Merlot shows herbaceous notes such as green bell pepper."},"answer":"b","ctx":"Causal chain: just-ripe -> lighter body, fresh red fruit, herbaceous; riper -> fuller body, cooked black fruit.","src":"L2 book p. 81 (The characteristics of Merlot)","cards":"L2-card-68"},{"id":"Q-L2-14-04","level":"L2","lo":"LO3","ch":"14","topic":"Riper Merlot style","trap":"","stem":"How can a producer in a moderate climate make a riper, fuller-bodied style of Merlot?","options":{"a":"By harvesting the grapes earlier","b":"By encouraging full malolactic conversion","c":"By fermenting in stainless steel tanks","d":"By harvesting the grapes later"},"notes":{"a":"Earlier picking gives just-ripe grapes: lighter body, fresh red fruit, green bell pepper.","b":"MLF softens acidity; it does not make the grapes riper.","c":"Vessel choice does not change grape ripeness; ripeness is decided in the vineyard.","d":"Correct: the riper style is easy in a warm climate but can be achieved by harvesting later in a moderate one."},"answer":"d","ctx":"","src":"L2 book p. 81 (The characteristics of Merlot)","cards":"L2-card-68"},{"id":"Q-L2-14-05","level":"L2","lo":"LO3","ch":"14","topic":"Merlot in blends","trap":"","stem":"What does Merlot typically add when it is blended with Cabernet Sauvignon?","options":{"a":"Higher acidity and firmer tannin, so it ages for longer","b":"Black pepper and floral aromas, so it is more complex","c":"Red fruit and lower tannin, so the wine is ready sooner","d":"Vanilla and smoky flavours, so it needs no oak ageing"},"notes":{"a":"Reversed: Merlot has medium acidity and tannin; it softens high-tannin Cabernet.","b":"Black pepper is the hallmark of Syrah, not Merlot.","c":"Correct: the book says Merlot adds red fruit and lowers tannin, so blends are ready to drink earlier.","d":"Vanilla and smoke come from oak, not from the grape itself."},"answer":"c","ctx":"","src":"L2 book p. 81 (Winemaking and maturation options)","cards":"L2-card-68"},{"id":"Q-L2-14-06","level":"L2","lo":"LO3","ch":"14","topic":"Merlot and oak","trap":"","stem":"How does the use of oak typically differ between lighter and fuller-bodied styles of Merlot?","options":{"a":"Lighter styles need little oak; fuller ones may benefit.","b":"Fuller styles avoid oak, as it adds too much tannin to them.","c":"Lighter styles need long oak ageing to soften their tannins.","d":"Both styles are normally unoaked, as oak hides Merlot's fruit."},"notes":{"a":"Correct: fuller styles may gain softness and flavour complexity from oak; lighter ones have little need for it.","b":"The book says fuller-bodied styles may benefit from the softness oak maturation gives.","c":"Lighter Merlot has little need for extended barrel maturation; Merlot is medium in tannin.","d":"Both oaked and unoaked styles are made; fuller-bodied styles may benefit from oak."},"answer":"a","ctx":"With bottle age, the best Merlot-dominated wines develop notes of dried fruit and tobacco.","src":"L2 book p. 81 (Winemaking and maturation options)","cards":"L2-card-68"},{"id":"Q-L2-14-07","level":"L2","lo":"LO3","ch":"14","topic":"Australian Merlot GI","trap":"Coonawarra is Cabernet only","stem":"Which Australian GI is listed for Merlot in the Level 2 specification?","options":{"a":"Margaret River","b":"Hunter Valley","c":"Coonawarra","d":"Barossa Valley"},"notes":{"a":"Correct: the book notes Merlot blended with Cabernet Sauvignon in high-quality Margaret River wines.","b":"Listed for Shiraz and Semillon, not Merlot.","c":"Listed for Cabernet Sauvignon only, not Merlot.","d":"Listed for Shiraz, Grenache and Semillon, not Merlot."},"answer":"a","ctx":"Margaret River appears on the spec for both Merlot and Cabernet; Coonawarra for Cabernet only.","src":"L2 spec p. 10; L2 book p. 84","cards":"L2-card-33, L2-card-69b"},{"id":"Q-L2-14-08","level":"L2","lo":"LO3","ch":"14","topic":"Bordeaux climate","trap":"","stem":"Why does Bordeaux have high levels of rainfall?","options":{"a":"It lies close to the Mediterranean Sea.","b":"It lies close to the Atlantic Ocean.","c":"It is cooled by the Gironde's morning fogs.","d":"It sits in the shelter of high mountains."},"notes":{"a":"That is Languedoc-Roussillon, which is warm with less variable weather.","b":"Correct: the book links Bordeaux's moderate climate and high rainfall to the nearby Atlantic.","c":"Not the book's explanation; the Gironde is the estuary that divides the region.","d":"Mountain shelter reduces rainfall; it does not cause high rainfall."},"answer":"b","ctx":"Causal chain: Atlantic -> moderate climate, high rainfall -> variable vintages -> blending matters.","src":"L2 book p. 82 (Bordeaux)","cards":"L2-card-69"},{"id":"Q-L2-14-09","level":"L2","lo":"LO3","ch":"14","topic":"Right Bank appellations","trap":"","stem":"Which of these Bordeaux appellations is on the Right Bank?","options":{"a":"Margaux","b":"Pauillac","c":"Pomerol","d":"Pessac-Léognan"},"notes":{"a":"Left Bank: within the Haut-Médoc.","b":"Left Bank: within the Haut-Médoc, north of the city of Bordeaux.","c":"Correct: Pomerol and Saint-Émilion are the most important Right Bank appellations.","d":"Left Bank: within Graves, south of the city of Bordeaux."},"answer":"c","ctx":"Right Bank = north and east of the Gironde and Dordogne; Merlot is its most important grape.","src":"L2 book p. 82 (Labelling in Bordeaux, Part 1)","cards":"L2-card-21, L2-card-69"},{"id":"Q-L2-14-10","level":"L2","lo":"LO3","ch":"14","topic":"Gironde Estuary","trap":"","stem":"Which two rivers meet to form Bordeaux's Gironde Estuary?","options":{"a":"The Garonne and Dordogne","b":"The Loire and the Garonne","c":"The Rhône and the Dordogne","d":"The Loire and the Rhône"},"notes":{"a":"Correct: the book says the Gironde Estuary is where the Garonne and Dordogne Rivers meet.","b":"The Loire is a separate river and wine region to the north.","c":"The Rhône flows south to the Mediterranean, far from Bordeaux.","d":"Neither river flows through Bordeaux."},"answer":"a","ctx":"Left Bank = west and south of the Gironde/Garonne; Right Bank = north and east of the Gironde and Dordogne.","src":"L2 book p. 82 (Bordeaux)","cards":"L2-card-21b, L2-card-69"},{"id":"Q-L2-14-11","level":"L2","lo":"LO3","ch":"14","topic":"Bordeaux AOC","trap":"","stem":"Which statement best describes a typical red wine labelled Bordeaux AOC?","options":{"a":"A Merlot-led blend from anywhere in Bordeaux","b":"A classified wine from one of the region's best châteaux","c":"A Cabernet-led blend from the Left Bank's gravel soils","d":"A single-varietal Merlot from the Right Bank only"},"notes":{"a":"Correct: Bordeaux AOC reds are typically Merlot-dominated and can come from anywhere in the region.","b":"That is Grand Cru Classé / Cru Classé, not the regional appellation.","c":"That fits Left Bank AOCs such as Haut-Médoc; Bordeaux AOC is regional and Merlot-led.","d":"Grapes can come from anywhere in Bordeaux, and the wines are typically blends."},"answer":"a","ctx":"Bordeaux Supérieur: same area, slightly stricter rules on yields, ageing and minimum alcohol.","src":"L2 book p. 82 (Labelling in Bordeaux, Part 1)","cards":"L2-card-21, L2-card-69"},{"id":"Q-L2-14-12","level":"L2","lo":"LO3","ch":"14","topic":"Saint-Émilion Grand Cru","trap":"","stem":"How does Saint-Émilion Grand Cru AOC relate to Saint-Émilion AOC?","options":{"a":"It is a more prestigious AOC within Saint-Émilion.","b":"It is a term any Bordeaux château may apply to use.","c":"It is a lower-level appellation covering a wider area.","d":"It is a ranking of Médoc châteaux, not an appellation."},"notes":{"a":"Correct: the book says Saint-Émilion AOC includes the more prestigious Saint-Émilion Grand Cru AOC.","b":"That resembles Cru Bourgeois, which unclassified Médoc wines can apply to use.","c":"Reversed: it lies within Saint-Émilion AOC and is the more prestigious.","d":"It is a Right Bank AOC, not a Médoc ranking."},"answer":"a","ctx":"Outstanding Saint-Émilion and Pomerol: full body, pronounced black fruit, oak; age to dried fruit and tobacco.","src":"L2 book p. 82 (Labelling in Bordeaux, Part 1)","cards":"L2-card-21"},{"id":"Q-L2-14-13","level":"L2","lo":"LO3","ch":"14","topic":"Chilean Merlot style","trap":"MOST LIKELY stem","stem":"A soft, medium-bodied Merlot from a high-volume brand, made from fully ripe fruit and intended for immediate drinking, is MOST LIKELY from:","options":{"a":"Pomerol","b":"Saint-Émilion Grand Cru","c":"Stellenbosch","d":"Central Valley"},"notes":{"a":"Pomerol's most famous wines are full-bodied, oaked and age-worthy, not high-volume brands.","b":"The more prestigious Saint-Émilion appellation, for age-worthy wines.","c":"Stellenbosch is known for complex, age-worthy reds from Bordeaux varieties.","d":"Correct: warm, dry Central Valley gives high yields of fully ripe Merlot for soft, medium-bodied brands."},"answer":"d","ctx":"Causal chain: warm, dry Central Valley -> reliable ripening and high yields -> soft, fruity, high-volume Merlot.","src":"L2 book p. 83 (Chile)","cards":"L2-card-69b, L2-card-69"},{"id":"Q-L2-14-14","level":"L2","lo":"LO3","ch":"14","topic":"Fresher Chilean Merlot","trap":"","stem":"In Chile, what allows producers to make fresher styles of Merlot than the typical soft Central Valley style?","options":{"a":"Higher yields from flat valley-floor sites","b":"Harvesting the grapes later in the season","c":"Ageing the wine for longer in new oak","d":"The moderating effect of altitude"},"notes":{"a":"Valley floors are flatter and more fertile; high yields do not bring freshness.","b":"A later harvest gives riper, fuller wines, not fresher ones.","c":"Oak adds flavour and softens tannin; it does not make a wine fresher.","d":"Correct: the book says the moderating effects of altitude allow fresher styles."},"answer":"d","ctx":"","src":"L2 book p. 83 (Chile)","cards":"L2-card-69b"},{"id":"Q-L2-14-15","level":"L2","lo":"LO3","ch":"14","topic":"California vs Napa Merlot","trap":"California label vs Napa/Sonoma","stem":"How does a typical Merlot labelled 'California' differ from one labelled Napa Valley?","options":{"a":"It is fuller-bodied and more concentrated than Napa's.","b":"It is fruity and medium-bodied; Napa's is more concentrated.","c":"It comes from cooler sites, so it is more herbaceous.","d":"It must be unoaked, while Napa's must be aged in new oak."},"notes":{"a":"Reversed: Napa Valley and Sonoma give the concentrated, full-bodied examples.","b":"Correct: the book contrasts fruity, medium-bodied 'California' wines with concentrated, full-bodied Napa and Sonoma.","c":"Not the book's contrast, which is about concentration and body.","d":"No such rules: top wines often use new barrels; high-volume ones may use chips or staves."},"answer":"b","ctx":"Pronounced oak (vanilla, coconut, smoke) is common in Californian reds.","src":"L2 book p. 83 (USA)","cards":"L2-card-69b"},{"id":"Q-L2-14-16","level":"L2","lo":"LO3","ch":"14","topic":"Languedoc Merlot labelling","trap":"PGI terms (known gap)","stem":"A single-varietal Merlot from Languedoc-Roussillon is typically labelled with which GI?","options":{"a":"Bordeaux AOC","b":"Minervois AOC","c":"Pays d'Oc IGP","d":"Côtes du Rhône AOC"},"notes":{"a":"Bordeaux AOC grapes must come from the Bordeaux region, not Languedoc.","b":"A Languedoc AOC given for blends with Syrah (and a Grenache GI), not single-varietal Merlot.","c":"Correct: the book says Languedoc-Roussillon Merlot is typically labelled Pays d'Oc IGP.","d":"A Rhône Valley appellation, not Languedoc-Roussillon."},"answer":"c","ctx":"Pays d'Oc is a PGI (IGP): the spec's southern French GI for Merlot, Cabernet Sauvignon and Syrah.","src":"L2 book p. 83 (Languedoc-Roussillon)","cards":"L2-card-69b, L2-card-33"},{"id":"Q-L2-14-17","level":"L2","lo":"LO3","ch":"14","topic":"Stellenbosch climate","trap":"","stem":"What causes the climate of Stellenbosch to vary from moderate to warm?","options":{"a":"Cloud cover and cooling breezes from the south","b":"Plentiful rainfall during the ripening season","c":"Vineyard altitude and sea breezes","d":"Distance from the Andes and the Coastal Ranges"},"notes":{"a":"That is the book's explanation for Coonawarra.","b":"Not given; the book credits altitude and sea breezes.","c":"Correct: the book says it varies with vineyard altitude and the influence of sea breezes.","d":"That describes Chile's valleys, not Stellenbosch."},"answer":"c","ctx":"Stellenbosch is mountainous and known for complex, age-worthy reds from classic Bordeaux varieties.","src":"L2 book p. 84 (South Africa)","cards":"L2-card-69b"},{"id":"Q-L2-14-18","level":"L2","lo":"LO3","ch":"14","topic":"Bordeaux's main grape","trap":"not Cabernet Sauvignon","stem":"Which is the most widely planted grape variety in Bordeaux?","options":{"a":"Sémillon","b":"Cabernet Sauvignon","c":"Merlot","d":"Sauvignon Blanc"},"notes":{"a":"The key grape of Sauternes, but not the region's most widely planted variety.","b":"Typically dominant on the Left Bank, but not the most widely planted overall.","c":"Correct: the book says Merlot is the most widely planted variety in the region.","d":"A white grape for dry whites and sweet blends; not the most widely planted."},"answer":"c","ctx":"Bordeaux reds are typically blends, mainly of Merlot and Cabernet Sauvignon.","src":"L2 book p. 82 (Bordeaux)","cards":"L2-card-69"},{"id":"Q-L2-14-19","level":"L2","lo":"LO3","ch":"14","topic":"New Zealand Merlot","trap":"right region, wrong climate","stem":"Where does most of New Zealand's Merlot come from, and what is the climate there?","options":{"a":"Hawke's Bay, North Island: hot with very dry summers","b":"Hawke's Bay, North Island: moderate, plentiful rain","c":"Central Otago, South Island: sunny days, cool nights","d":"Marlborough, South Island: cool but sunny"},"notes":{"a":"Right region, wrong climate: the book says moderate with plentiful rainfall.","b":"Correct: per the book; there Merlot is more widely grown than Cabernet Sauvignon.","c":"A Pinot Noir GI; New Zealand Merlot comes mainly from Hawke's Bay.","d":"Marlborough is known for Sauvignon Blanc and Pinot Noir, not Merlot."},"answer":"b","ctx":"Hawke's Bay Merlot ranges from light and fruity to full-bodied and long-lived.","src":"L2 book p. 84 (New Zealand)","cards":"L2-card-69b"},{"id":"Q-L2-15-03","level":"L2","lo":"LO3","ch":"15","topic":"Cabernet's thick skins","trap":"","stem":"Why is Cabernet Sauvignon deeply coloured and high in tannin?","options":{"a":"Its grapes ripen early in the season.","b":"It is usually aged in new oak barrels.","c":"Its grapes have thick skins.","d":"It is usually picked before full ripeness."},"notes":{"a":"The reverse: it needs a long, warm growing season to ripen fully.","b":"Oak adds flavours and softens tannin; colour and tannin come from the skins.","c":"Correct: the thick skins contain high levels of colour, flavour and tannin.","d":"Not the reason; colour and tannin come from its thick skins."},"answer":"c","ctx":"Tannin and acid act as natural preservatives: the best age to dried fruit, earth and forest floor.","src":"L2 book p. 85 (The characteristics of Cabernet Sauvignon)","cards":"L2-card-70"},{"id":"Q-L2-15-04","level":"L2","lo":"LO3","ch":"15","topic":"Cabernet profile","trap":"NOT stem; Merlot vs Cabernet structure","stem":"Which of these is NOT typical of a single-varietal Cabernet Sauvignon?","options":{"a":"Blackcurrant and black cherry","b":"Medium acidity and tannin","c":"Deep colour","d":"Mint or green bell pepper"},"notes":{"a":"Typical: the book's black-fruit descriptors for Cabernet.","b":"Correct: that is Merlot's profile. Cabernet is high in acidity and high in tannin.","c":"Typical: its thick skins give high levels of colour.","d":"Typical: the book says usually herbal (mint) or herbaceous (green bell pepper) notes."},"answer":"b","ctx":"In warm climates Cabernet's fruit flavours can become cooked in character.","src":"L2 book p. 85 (The characteristics of Cabernet Sauvignon)","cards":"L2-card-70"},{"id":"Q-L2-15-05","level":"L2","lo":"LO3","ch":"15","topic":"Blending in cool years","trap":"","stem":"In a cool year on Bordeaux's Left Bank, why might a producer raise the proportion of Merlot in the blend?","options":{"a":"Appellation rules require more Merlot in cool years.","b":"Cabernet may not ripen; Merlot softens the blend.","c":"Merlot needs a longer, warmer season than Cabernet.","d":"Merlot adds tannin and acidity that cool years lack."},"notes":{"a":"No such rule is given; the choice is driven by how well Cabernet ripened.","b":"Correct: Merlot's share may rise when Cabernet struggles to ripen; blending softens tannin and acidity.","c":"Reversed: it is late-ripening Cabernet that needs a long, warm season.","d":"Reversed: Merlot softens; cool years leave Cabernet with harsh tannin and acid."},"answer":"b","ctx":"Causal chain: cool vintage -> Cabernet under-ripe, very tannic and acidic -> more Merlot to soften the blend.","src":"L2 book p. 85-86 (Winemaking options; Bordeaux)","cards":"L2-card-70, L2-card-71"},{"id":"Q-L2-15-06","level":"L2","lo":"LO3","ch":"15","topic":"New oak flavours","trap":"NOT stem; primary vs secondary","stem":"Which of these flavours does new oak NOT typically give to Cabernet Sauvignon?","options":{"a":"Mint","b":"Cloves","c":"Smoke","d":"Cedar"},"notes":{"a":"Correct: mint is a primary, herbal note from the grape itself, not from oak.","b":"From new oak: the book lists smoke, vanilla, cloves and cedar.","c":"From new oak: the book lists smoke, vanilla, cloves and cedar.","d":"From new oak: the book lists smoke, vanilla, cloves and cedar."},"answer":"a","ctx":"Barrels also let small amounts of oxygen into the wine, which softens Cabernet's tannins.","src":"L2 book p. 85 (Winemaking and maturation options)","cards":"L2-card-70"},{"id":"Q-L2-15-07","level":"L2","lo":"LO3","ch":"15","topic":"Haut-Médoc appellations","trap":"","stem":"Which two AOCs named in the Level 2 book lie within the Haut-Médoc?","options":{"a":"Margaux and Pauillac","b":"Graves and Pessac-Léognan","c":"Pauillac and Pessac-Léognan","d":"Margaux and Saint-Émilion"},"notes":{"a":"Correct: the Haut-Médoc, north of the city of Bordeaux, includes Margaux and Pauillac.","b":"Both lie south of the city; Pessac-Léognan is within Graves.","c":"Pessac-Léognan lies within Graves, south of the city.","d":"Saint-Émilion is on the Right Bank."},"answer":"a","ctx":"Left Bank map: Haut-Médoc (Margaux, Pauillac) north of the city; Graves (Pessac-Léognan) to the south.","src":"L2 book p. 82, 86 (Labelling in Bordeaux; Bordeaux)","cards":"L2-card-21, L2-card-71"},{"id":"Q-L2-15-08","level":"L2","lo":"LO3","ch":"15","topic":"Pessac-Léognan reds","trap":"Pessac-Léognan (Cabernet-led reds) (known gap)","stem":"Which statement about Pessac-Léognan AOC is correct?","options":{"a":"It lies on the Right Bank, close to Saint-Émilion and Pomerol.","b":"It lies within the Haut-Médoc, north of Bordeaux city.","c":"It lies within Graves; its reds are typically Merlot-led.","d":"It lies within Graves; its reds are typically Cabernet-led."},"notes":{"a":"It is a Left Bank appellation within Graves.","b":"Graves, which includes Pessac-Léognan, is SOUTH of the city.","c":"Right location, wrong grape: Left Bank reds are typically Cabernet-dominated.","d":"Correct: Graves (incl. Pessac-Léognan) is Left Bank, where Cabernet Sauvignon typically dominates."},"answer":"d","ctx":"Pessac-Léognan is also a spec GI for Sauvignon Blanc-Sémillon dry whites.","src":"L2 book p. 82, 86 (Labelling in Bordeaux; Bordeaux)","cards":"L2-card-21, L2-card-71"},{"id":"Q-L2-15-09","level":"L2","lo":"LO3","ch":"15","topic":"Château on labels","trap":"","stem":"What does the term 'Château' indicate on a Bordeaux label?","options":{"a":"The wine meets slightly stricter rules on yields and alcohol.","b":"The wine was made in a grand historic building.","c":"The grapes were grown on the producer's own land.","d":"The wine has been ranked in an official classification."},"notes":{"a":"That describes Bordeaux Supérieur.","b":"The book says the term does not necessarily refer to a grand building.","c":"Correct: it refers to an estate or producer, not bought-in grapes, and not necessarily a grand building.","d":"That is Grand Cru Classé / Cru Classé."},"answer":"c","ctx":"","src":"L2 book p. 87 (Labelling in Bordeaux, Part 2)","cards":"L2-card-21"},{"id":"Q-L2-15-10","level":"L2","lo":"LO3","ch":"15","topic":"Grand Cru Classé","trap":"","stem":"What do the terms Grand Cru Classé and Cru Classé on a Bordeaux label indicate?","options":{"a":"The wine has been aged for a minimum period in new oak.","b":"The wine comes from an unclassified Médoc château that applied.","c":"The wine was made from grapes grown anywhere in Bordeaux.","d":"The château is ranked in a sub-region's classification."},"notes":{"a":"No ageing rule is given; the terms reflect a classification ranking.","b":"That is Cru Bourgeois.","c":"That describes the regional Bordeaux and Bordeaux Supérieur AOCs.","d":"Correct: some sub-regions classify the best wines from the best châteaux; widely seen as a strong quality sign."},"answer":"d","ctx":"Some classifications are old, but these are among Bordeaux's most expensive, longest-lived wines.","src":"L2 book p. 87 (Labelling in Bordeaux, Part 2)","cards":"L2-card-21, L2-card-21b"},{"id":"Q-L2-15-11","level":"L2","lo":"LO3","ch":"15","topic":"Cru Bourgeois","trap":"Bordeaux Supérieur vs Cru Bourgeois (known gap)","stem":"Wines from the Médoc that are not classified as Grand Cru Classé can apply to use which term on their labels?","options":{"a":"Saint-Émilion Grand Cru","b":"Bordeaux Supérieur","c":"Cru Bourgeois","d":"Cru Classé"},"notes":{"a":"A Right Bank appellation; a Médoc wine cannot use it.","b":"A regional AOC with slightly stricter rules, not a status term for Médoc châteaux.","c":"Correct: the book says Médoc wines not classified as Grand Cru Classé can apply to use Cru Bourgeois.","d":"Only for wines ranked in a classification, which this château is not."},"answer":"c","ctx":"Cru Bourgeois wines are mostly cheaper than classified ones, but some are very good to outstanding.","src":"L2 book p. 87 (Labelling in Bordeaux, Part 2)","cards":"L2-card-21, L2-card-21b"},{"id":"Q-L2-15-12","level":"L2","lo":"LO3","ch":"15","topic":"Supérieur vs Cru Bourgeois","trap":"Bordeaux Supérieur vs Cru Bourgeois (known gap)","stem":"Which statement correctly distinguishes Bordeaux Supérieur from Cru Bourgeois?","options":{"a":"Supérieur covers all Bordeaux; Cru Bourgeois is a Médoc term.","b":"Supérieur is Right Bank only; Cru Bourgeois is Left Bank only.","c":"Each is used only by châteaux ranked as Cru Classé.","d":"Supérieur is a Médoc term; Cru Bourgeois is a region-wide AOC."},"notes":{"a":"Correct: Supérieur can come from anywhere in Bordeaux; Cru Bourgeois is for unclassified Médoc wines that apply.","b":"Supérieur can come from anywhere in Bordeaux, not only the Right Bank.","c":"Neither: Cru Classé is the ranked term; Cru Bourgeois is for UNclassified Médoc wines.","d":"Reversed."},"answer":"a","ctx":"Memory hook: Supérieur = Bordeaux plus slightly stricter rules; Bourgeois = Médoc, not classified.","src":"L2 book p. 82, 87 (Labelling in Bordeaux, Parts 1 and 2)","cards":"L2-card-21, L2-card-21b"},{"id":"Q-L2-15-13","level":"L2","lo":"LO3","ch":"15","topic":"Languedoc Cabernet","trap":"","stem":"Why can Cabernet Sauvignon ripen more reliably in Languedoc-Roussillon than in Bordeaux?","options":{"a":"Its high-altitude vineyards have cool nights.","b":"It is warm, with less variable weather from year to year.","c":"It is moderate, with cooling breezes from the Atlantic.","d":"Its gravel soils drain quickly after heavy autumn rain."},"notes":{"a":"Not the book's explanation; it credits the warm, reliable climate.","b":"Correct: the book says the climate is warm and annual weather is less variable than in Bordeaux.","c":"Languedoc is warm; it is Bordeaux whose moderate, rainy climate comes from the Atlantic.","d":"Gravel is the book's explanation for the Bordeaux Left Bank, not Languedoc."},"answer":"b","ctx":"Its wines are typically labelled Pays d'Oc IGP, as single varietals or blends with Merlot.","src":"L2 book p. 87 (Languedoc-Roussillon)","cards":"L2-card-71"},{"id":"Q-L2-15-14","level":"L2","lo":"LO3","ch":"15","topic":"Napa sub-regions","trap":"Calistoga vs Oakville/Rutherford","stem":"Which Napa Valley sub-region, in the far north of the valley, is warmer still and gives some of Napa's ripest, most full-bodied Cabernets?","options":{"a":"Oakville","b":"Calistoga","c":"Sonoma","d":"Rutherford"},"notes":{"a":"Full-bodied, ripe Cabernet, but Calistoga is the warmer far-north sub-region.","b":"Correct: per the book, Calistoga in the far north is warmer still.","c":"Sonoma is a separate neighbouring region, not a Napa sub-region.","d":"Like Oakville: full-bodied and ripe, but the book names Calistoga as warmer still."},"answer":"b","ctx":"Napa: warm, sunny, long season -> full body, ripe black fruit, high ripe tannins (e.g. Oakville, Rutherford).","src":"L2 book p. 87 (USA)","cards":"L2-card-71, L2-card-33"},{"id":"Q-L2-15-15","level":"L2","lo":"LO3","ch":"15","topic":"Californian Cabernet","trap":"","stem":"Which statement about Californian Cabernet Sauvignon is correct?","options":{"a":"Warmer inland Sonoma can make wines as powerful as Napa's.","b":"Wines labelled California come mainly from Napa and Sonoma.","c":"Oakville is the warmest Napa sub-region, in the far north.","d":"A Napa wine labelled Cabernet Sauvignon must be 100% Cabernet."},"notes":{"a":"Correct: the book says the warmer inland areas of Sonoma can produce similarly powerful wines.","b":"They can be blended from across the state, much of it from the hot Central Valley.","c":"Calistoga is in the far north and is warmer still.","d":"The book says such wines may contain small quantities of other grapes."},"answer":"a","ctx":"'California' blends are for immediate drinking and often get oak flavour from chips or staves.","src":"L2 book p. 87-88 (USA)","cards":"L2-card-71"},{"id":"Q-L2-15-16","level":"L2","lo":"LO3","ch":"15","topic":"Chilean foothill Cabernet","trap":"","stem":"Cabernet Sauvignon from the Andes foothills of Chile's Maipo or Colchagua Valley often shows which distinctive notes alongside black fruit?","options":{"a":"Mint and green bell pepper","b":"Banana and candy","c":"Strawberry and red plum","d":"Black pepper and liquorice"},"notes":{"a":"Correct: foothill wines often show herbal (mint) and herbaceous (green bell pepper) notes.","b":"From Beaujolais-style winemaking (Gamay).","c":"Fresh red fruit of just-ripe Merlot.","d":"These are Syrah/Shiraz descriptors."},"answer":"a","ctx":"Maipo and Colchagua lie within the Central Valley; Cabernet is Chile's most widely planted grape.","src":"L2 book p. 88 (Chile)","cards":"L2-card-72"},{"id":"Q-L2-15-17","level":"L2","lo":"LO3","ch":"15","topic":"Cape Blend","trap":"","stem":"In South Africa, what is a 'Cape Blend'?","options":{"a":"Cabernet Sauvignon and Merlot with Pinotage","b":"Shiraz blended with Grenache and other grapes","c":"Cabernet Sauvignon blended with Carmenère","d":"Cabernet Sauvignon and Merlot with Malbec"},"notes":{"a":"Correct: the book says Cabernet and Merlot are sometimes blended with the local speciality, Pinotage.","b":"That is a 'Rhône Blend'.","c":"Carmenère is Chile's local speciality, blended with Cabernet there.","d":"Malbec is Argentina's speciality; the Cape Blend partner is Pinotage."},"answer":"a","ctx":"Stellenbosch varies with altitude, so styles run from fresh and herbal to full-bodied with cooked fruit.","src":"L2 book p. 88 (South Africa)","cards":"L2-card-72"},{"id":"Q-L2-15-18","level":"L2","lo":"LO3","ch":"15","topic":"Coonawarra climate","trap":"Coonawarra is cool (known gap)","stem":"Which influences moderate the climate of South Australia's Coonawarra region?","options":{"a":"Shelter from a nearby mountain range","b":"Coastal breezes and plentiful winter rain","c":"Altitude and breezes in mountain valleys","d":"Cloud cover and cool southern breezes"},"notes":{"a":"Not the book's explanation; it credits cloud cover and cooling southern breezes.","b":"That is the book's description of warm Margaret River.","c":"Altitude moderates Stellenbosch and Chile's foothills, not Coonawarra.","d":"Correct: per the book; its Cabernet shows mint, pronounced blackcurrant, and ages for many years."},"answer":"d","ctx":"Causal chain: cloud cover + cool southern breezes -> slower ripening -> mint, blackcurrant, long-lived.","src":"L2 book p. 88 (Australia)","cards":"L2-card-72"},{"id":"Q-L2-15-19","level":"L2","lo":"LO3","ch":"15","topic":"Hawke's Bay Cabernet","trap":"MOST LIKELY stem","stem":"A Cabernet Sauvignon-Merlot blend with fresh red- and black-fruit flavours and green bell pepper, from a moderate climate, is MOST LIKELY from:","options":{"a":"Margaret River","b":"Pays d'Oc","c":"Calistoga","d":"Hawke's Bay"},"notes":{"a":"A warm region: ripe black fruit and subtle oak.","b":"Warm Languedoc, where Cabernet ripens reliably; not this fresh, herbaceous style.","c":"Warmer still than the rest of Napa: some of its ripest, most full-bodied wines.","d":"Correct: in moderate Hawke's Bay Cabernet needs the warmest sites; blended with Merlot; fresh fruit, bell pepper."},"answer":"d","ctx":"In Hawke's Bay, Merlot is more widely grown than Cabernet Sauvignon.","src":"L2 book p. 89 (New Zealand)","cards":"L2-card-72, L2-card-33"},{"id":"Q-L2-16-02","level":"L2","lo":"LO3","ch":"16","topic":"Syrah and Shiraz names","trap":"","stem":"What is the difference between Syrah and Shiraz?","options":{"a":"Shiraz is a clone that ripens only in hot regions.","b":"They are two names for the same grape variety.","c":"Syrah is a black grape; Shiraz is a white grape.","d":"Shiraz is a crossing of Syrah and Grenache."},"notes":{"a":"They are the same variety; the name used hints at style, not a different vine.","b":"Correct: Syrah is the French name; Shiraz is the name mostly used in Australia.","c":"Both names refer to the same black grape.","d":"No: the book says they are two names for the same variety."},"answer":"b","ctx":"","src":"L2 book p. 90 (Syrah/Shiraz)","cards":"L2-card-73"},{"id":"Q-L2-16-03","level":"L2","lo":"LO3","ch":"16","topic":"Syrah grape traits","trap":"","stem":"Which description best fits the Syrah/Shiraz grape?","options":{"a":"Thick-skinned and small; best suited to cool climates","b":"Thin-skinned and large; best suited to cool, cloudy climates","c":"Thin-skinned and large; best in hot, dry climates","d":"Thick-skinned and small; needs a moderate to warm climate"},"notes":{"a":"Right grape traits, but it needs a moderate to warm climate to ripen fully.","b":"The reverse: thick skins and small grapes, needing moderate to warm climates.","c":"Syrah has thick skins and small grapes.","d":"Correct: per the book; it gives medium to high levels of tannin and acidity."},"answer":"d","ctx":"","src":"L2 book p. 90 (The characteristics of Syrah/Shiraz)","cards":"L2-card-73"},{"id":"Q-L2-16-04","level":"L2","lo":"LO3","ch":"16","topic":"Name hints at style","trap":"name hints at style","stem":"Outside France and Australia, a producer labels its red 'Syrah' rather than 'Shiraz'. Which style does this MOST likely suggest?","options":{"a":"Full-bodied and high in alcohol, with cooked black fruit","b":"Medium-bodied, with fresh black fruit and black pepper","c":"Light-bodied, with red cherry and banana aromas","d":"Sweet and fortified, with dried-fruit flavours"},"notes":{"a":"That is the warm-climate style the name 'Shiraz' suggests.","b":"Correct: 'Syrah' points to the moderate-climate style, as in the Northern Rhône.","c":"Closer to Beaujolais (Gamay).","d":"Not linked to the Syrah/Shiraz name choice."},"answer":"b","ctx":"The book: outside France and Australia, the name used can give an idea of the style.","src":"L2 book p. 90 (The characteristics of Syrah/Shiraz)","cards":"L2-card-73"},{"id":"Q-L2-16-05","level":"L2","lo":"LO3","ch":"16","topic":"Warm-climate Shiraz","trap":"","stem":"Which flavours are typical of warm-climate Shiraz, such as the riper Australian style?","options":{"a":"Fresh black cherry and herbal notes","b":"Cooked black fruit and liquorice","c":"Fresh red fruit and green bell pepper","d":"Mint and pronounced blackcurrant"},"notes":{"a":"The moderate-climate (Northern Rhône) style.","b":"Correct: warm-climate Shiraz is full-bodied and high in alcohol, with cooked black fruit and liquorice.","c":"Just-ripe Merlot.","d":"Classic Cabernet Sauvignon descriptors (e.g. Coonawarra)."},"answer":"b","ctx":"","src":"L2 book p. 90 (The characteristics of Syrah/Shiraz)","cards":"L2-card-73"},{"id":"Q-L2-16-06","level":"L2","lo":"LO3","ch":"16","topic":"Rhône Blends","trap":"","stem":"What does Syrah typically contribute to a 'Rhône Blend', and which grape is it most commonly blended with?","options":{"a":"Acidity and floral aromas; Viognier","b":"Colour, black fruit and tannin; Grenache","c":"Softness and red fruit; Cabernet Sauvignon","d":"Colour, black fruit and tannin; Merlot"},"notes":{"a":"Viognier is co-fermented in some Côte Rôtie, but that is not a 'Rhône Blend'.","b":"Correct: it is most commonly blended with Southern Rhône grapes such as Grenache.","c":"That is Merlot's role with Cabernet; Rhône Blends are Syrah with Grenache.","d":"Right contribution, wrong partner: the book names Grenache."},"answer":"b","ctx":"","src":"L2 book p. 90 (Winemaking and maturation options)","cards":"L2-card-73"},{"id":"Q-L2-16-07","level":"L2","lo":"LO3","ch":"16","topic":"Aged Syrah","trap":"NOT stem; secondary vs tertiary","stem":"Which of these is NOT a tertiary flavour that fine Syrah/Shiraz typically develops with bottle age?","options":{"a":"Meat","b":"Leather","c":"Earth","d":"Vanilla"},"notes":{"a":"Tertiary: listed in the book.","b":"Tertiary: the book lists dried fruit, leather, meat and earth.","c":"Tertiary: listed in the book.","d":"Correct: vanilla is a secondary flavour from oak, not a tertiary one from bottle age."},"answer":"d","ctx":"Oak softens Syrah's tannins and adds smoke and spice; the finest can age for a decade or more.","src":"L2 book p. 90 (Winemaking and maturation options)","cards":"L2-card-73"},{"id":"Q-L2-16-08","level":"L2","lo":"LO3","ch":"16","topic":"Northern Rhône costs","trap":"","stem":"Why are the AOC wines of the Northern Rhône expensive to produce?","options":{"a":"Steep slopes mean the vines must be worked by hand.","b":"The grapes must be dried before fermentation.","c":"Frequent spring frosts destroy much of each year's crop.","d":"Strict rules require all wines to be aged in new oak."},"notes":{"a":"Correct: many vineyards are so steep that machinery cannot be used.","b":"That is appassimento (e.g. Amarone), not Northern Rhône practice.","c":"Not given in the book; the cost is hand labour on steep slopes.","d":"No such rule is given; the cost comes from hand-working steep slopes."},"answer":"a","ctx":"Syrah is the only black grape permitted in Northern Rhône AOC wines.","src":"L2 book p. 91 (Northern Rhône)","cards":"L2-card-74"},{"id":"Q-L2-16-09","level":"L2","lo":"LO3","ch":"16","topic":"Côte Rôtie and Viognier","trap":"not all producers do it","stem":"Some Côte Rôtie producers co-ferment a small amount of a white grape with Syrah. Which grape is it, and what can it add?","options":{"a":"Viognier, which can add floral aromas","b":"Chardonnay, which can add buttery notes","c":"Sauvignon Blanc, which adds herbaceous notes","d":"Viognier, which adds tannin and deep colour"},"notes":{"a":"Correct: a tradition, though not practised by all producers.","b":"Not the Côte Rôtie tradition, which uses Viognier.","c":"Not the Côte Rôtie tradition, which uses Viognier.","d":"Right grape, wrong effect: the book says it can add floral aromas."},"answer":"a","ctx":"","src":"L2 book p. 91 (Northern Rhône)","cards":"L2-card-74"},{"id":"Q-L2-16-10","level":"L2","lo":"LO3","ch":"16","topic":"Côte Rôtie","trap":"","stem":"Which Northern Rhône AOC, with exceptionally steep and stony slopes, marks the northern limit for successfully ripening Syrah?","options":{"a":"Hermitage","b":"Côte Rôtie","c":"Crozes-Hermitage","d":"Minervois"},"notes":{"a":"Further south: a single steep, south-facing hill.","b":"Correct: in the far north of the Northern Rhône; complex, peppery Syrah that can age for years.","c":"A larger, flatter appellation surrounding Hermitage.","d":"In Languedoc-Roussillon, not the Northern Rhône."},"answer":"b","ctx":"North to south: Côte Rôtie, then Hermitage, with Crozes-Hermitage around it.","src":"L2 book p. 91 (Northern Rhône)","cards":"L2-card-74"},{"id":"Q-L2-16-11","level":"L2","lo":"LO3","ch":"16","topic":"Hermitage","trap":"","stem":"What makes up the entire Hermitage AOC?","options":{"a":"Several north-facing terraces","b":"Stony slopes at Syrah's northern limit","c":"One steep, south-facing slope","d":"A large, flat plain around a hill"},"notes":{"a":"The Hermitage slope faces south, which aids ripening.","b":"That is Côte Rôtie, in the far north of the Northern Rhône.","c":"Correct: one steep, south-facing slope (the hill of Hermitage) forms the whole appellation.","d":"That describes Crozes-Hermitage, which surrounds the hill."},"answer":"c","ctx":"","src":"L2 book p. 91 (Northern Rhône)","cards":"L2-card-74"},{"id":"Q-L2-16-12","level":"L2","lo":"LO3","ch":"16","topic":"Crozes-Hermitage","trap":"","stem":"Why are Crozes-Hermitage wines typically less expensive than those of Hermitage?","options":{"a":"Its cooler sites often fail to ripen","b":"It blends Syrah with cheaper Grenache","c":"Higher yields and easier mechanisation","d":"It is aged in stainless steel, not oak"},"notes":{"a":"Not the reason given; it is yields and mechanisation.","b":"Syrah is the only black grape permitted in Northern Rhône AOC wines.","c":"Correct: Crozes is larger and flatter, so yields are higher and vineyards easier to mechanise.","d":"No such rule; the book explains price by yields and mechanisation."},"answer":"c","ctx":"Trade-off: Crozes wines are generally less intense and complex than Côte Rôtie and Hermitage.","src":"L2 book p. 91 (Northern Rhône)","cards":"L2-card-74"},{"id":"Q-L2-16-13","level":"L2","lo":"LO3","ch":"16","topic":"Moderate-climate Syrah","trap":"MOST LIKELY stem","stem":"A Syrah with fresh black cherry and blackberry, herbal notes and black pepper, from a moderate climate, is MOST LIKELY from:","options":{"a":"South Eastern Australia","b":"Pays d'Oc","c":"Crozes-Hermitage","d":"Barossa Valley"},"notes":{"a":"Warm inland fruit for inexpensive, high-volume Shiraz.","b":"Warm Languedoc-Roussillon, where Syrah ripens reliably to a riper style.","c":"Correct: the moderate-climate Northern Rhône style described in the book.","d":"Warm: full body, cooked black fruit, often vanilla or coconut oak."},"answer":"c","ctx":"Causal chain: moderate climate -> slower ripening -> medium body, fresh black fruit, pepper.","src":"L2 book p. 90-92","cards":"L2-card-73, L2-card-74"},{"id":"Q-L2-16-14","level":"L2","lo":"LO3","ch":"16","topic":"Minervois","trap":"AOC vs IGP; PGI terms (known gap)","stem":"In Languedoc-Roussillon, Syrah is often blended with other grapes in which appellation (AOC) named in the Level 2 book?","options":{"a":"Côtes de Provence","b":"Pays d'Oc","c":"Minervois","d":"Crozes-Hermitage"},"notes":{"a":"A Provence AOC (a Grenache GI), not in Languedoc-Roussillon.","b":"Pays d'Oc is a PGI (IGP), not an AOC; the book mentions it for single-varietal Syrah.","c":"Correct: per the book; single-varietal Syrah there is often labelled Pays d'Oc IGP.","d":"A Northern Rhône AOC."},"answer":"c","ctx":"Warm Languedoc-Roussillon lets Syrah ripen reliably.","src":"L2 book p. 92 (Languedoc-Roussillon)","cards":"L2-card-74, L2-card-34"},{"id":"Q-L2-16-15","level":"L2","lo":"LO3","ch":"16","topic":"South Eastern Australia","trap":"MOST LIKELY stem","stem":"An inexpensive, high-volume Shiraz made from grapes grown in Australia's warm inland regions is MOST LIKELY labelled:","options":{"a":"South Eastern Australia","b":"Margaret River, Western Australia","c":"Hunter Valley, New South Wales","d":"Barossa Valley, South Australia"},"notes":{"a":"Correct: much warm inland Shiraz goes into high-volume brands with this label.","b":"Spec GI for Cabernet, Merlot and some whites, but not Shiraz.","c":"A specific region giving a medium-bodied Shiraz that develops with age.","d":"Barossa makes concentrated wines from some of the world's oldest Shiraz vines."},"answer":"a","ctx":"","src":"L2 book p. 92 (Australia)","cards":"L2-card-74b"},{"id":"Q-L2-16-16","level":"L2","lo":"LO3","ch":"16","topic":"Barossa old vines","trap":"","stem":"Why are Barossa Valley Shiraz wines often so concentrated?","options":{"a":"Irrigation gives very high yields.","b":"Cloud cover slows ripening there.","c":"Its grapes are dried before fermenting.","d":"Its very old vines give low yields."},"notes":{"a":"No: the book credits Barossa's concentration to very old vines giving LOW yields.","b":"That is the Hunter Valley, and it gives medium-bodied wines.","c":"That is appassimento (Amarone), not Barossa practice.","d":"Correct: Barossa has some of the world's oldest Shiraz vines, giving low yields of very concentrated fruit."},"answer":"d","ctx":"Concentrated fruit gives full body, high ripe tannins and cooked black fruit (see Q-L2-16-01).","src":"L2 book p. 92 (Australia)","cards":"L2-card-74b"},{"id":"Q-L2-16-17","level":"L2","lo":"LO3","ch":"16","topic":"Hunter Valley Shiraz","trap":"hot region, fresh style","stem":"The Hunter Valley has very hot summers, yet its Shiraz is typically medium-bodied with fresh black fruit. Why?","options":{"a":"Its vineyards are at high altitude, far from the sea.","b":"Its grapes are picked very late in the season.","c":"Its old vines are kept to very low yields.","d":"High cloud cover and sea breezes slow ripening."},"notes":{"a":"Not the book's explanation; it credits cloud cover and sea breezes.","b":"Late picking would give riper, fuller wines.","c":"Old, low-yielding vines explain Barossa's concentration, not freshness.","d":"Correct: per the book, despite its relatively northerly latitude and hot summers."},"answer":"d","ctx":"In the southern hemisphere, 'northerly' means nearer the equator. Hunter Shiraz ages to earth and meat.","src":"L2 book p. 92 (Australia)","cards":"L2-card-74b"},{"id":"Q-L2-16-18","level":"L2","lo":"LO3","ch":"16","topic":"Shiraz in Australia","trap":"","stem":"Which statement about Shiraz in Australia is correct?","options":{"a":"It is legally required to be blended with Grenache.","b":"It is rarely made as a single-varietal wine.","c":"It is Australia's most widely planted grape variety.","d":"It is mostly grown in cool coastal regions of the south."},"notes":{"a":"Most Australian Shiraz is single-varietal; blends are a choice.","b":"The reverse: it is most often single-varietal, also blended with Cabernet or Grenache.","c":"Correct: and Australia has by far the largest plantings outside France.","d":"Much is concentrated in warm inland regions for high-volume brands."},"answer":"c","ctx":"Australian producers now make a wide range of Shiraz styles, even sparkling reds.","src":"L2 book p. 92-93 (Australia; Syrah/Shiraz today)","cards":"L2-card-74b"},{"id":"Q-L2-16-19","level":"L2","lo":"LO3","ch":"16","topic":"Shiraz GIs","trap":"NOT stem; Coonawarra = Cabernet","stem":"Which of these Australian GIs is NOT listed for Shiraz in the Level 2 specification?","options":{"a":"South Eastern Australia","b":"Coonawarra","c":"Barossa Valley","d":"Hunter Valley"},"notes":{"a":"Listed for Shiraz.","b":"Correct: Coonawarra is listed for Cabernet Sauvignon, not Shiraz.","c":"Listed for Shiraz (and for Grenache and Semillon).","d":"Listed for Shiraz (and for Semillon)."},"answer":"b","ctx":"Spec Shiraz GIs in Australia: South Eastern Australia, Barossa Valley, Hunter Valley.","src":"L2 spec p. 10","cards":"L2-card-34, L2-card-33"},{"id":"Q-L3-14-02","level":"L3","lo":"Stretch (L2 LO3)","ch":"14","topic":"Why Bordeaux blends","trap":"","stem":"According to the L3 book, why does Bordeaux's weather make blending several grape varieties a sensible strategy?","options":{"a":"Their flowering and ripening dates differ, spreading risk.","b":"They all ripen together, so the harvest can be done at once.","c":"Single-varietal wines of any colour are banned in Bordeaux.","d":"The warm, dry climate gives every variety excess sugar."},"notes":{"a":"Correct: one bad frost or heavy shower is unlikely to ruin the entire crop.","b":"The reverse: the varieties flower and ripen at different times.","c":"Not the reason; L3 notes varietal dry white Sauvignon Blanc is made.","d":"Bordeaux is moderate maritime with high rainfall, not warm and dry."},"answer":"a","ctx":"Links to L2 p. 86: in poor years more Merlot goes into Left Bank blends.","src":"L3 book (2016) ch 13, p. 78-79","cards":"L3-stretch-29"},{"id":"Q-L3-14-03","level":"L3","lo":"Stretch (L2 LO3)","ch":"14","topic":"Gulf Stream and Bordeaux","trap":"","stem":"According to the L3 book, what effect does the Gulf Stream have on Bordeaux's vineyards?","options":{"a":"It brings cold air that makes spring frost a major risk.","b":"It shelters the vineyards from Atlantic storms.","c":"It removes rain, giving dry and reliable vintages.","d":"It extends the season; ripening can run into October."},"notes":{"a":"The reverse: it is a warming current; spring frosts are rarely a problem.","b":"That is the Landes forest and coastal sand dunes to the west.","c":"The Atlantic brings high rainfall and humidity, so vintage variation matters.","d":"Correct: a warming current, so spring frosts are rarely a problem and ripening continues well into October."},"answer":"d","ctx":"Rain can disrupt flowering and fruit set, promote rot and dilute flavour: hence vintage variation.","src":"L3 book (2016) ch 13, p. 78","cards":"L3-stretch-29"},{"id":"Q-L3-14-04","level":"L3","lo":"Stretch (L2 LO3)","ch":"14","topic":"Saint-Émilion classification","trap":"","stem":"According to the L3 book, how does the Saint-Émilion classification differ from Bordeaux's other classifications?","options":{"a":"It is part of the appellation system and is revised.","b":"It ranks individual vineyards rather than châteaux.","c":"It ranks red and white wines in separate lists.","d":"It was drawn up in 1855 alongside the Médoc ranking."},"notes":{"a":"Correct: it sits within Saint-Émilion Grand Cru AOC and is revised at least once every ten years.","b":"All Bordeaux classifications rank estates (châteaux), not vineyards.","c":"Separate red and white lists describe the Graves classification.","d":"1855 covered Médoc reds and Sauternes, not Saint-Émilion."},"answer":"a","ctx":"Tiers: Premier Grand Cru Classé A, then B, then Grand Cru Classé (2016 edition; may have changed).","src":"L3 book (2016) ch 13, p. 79","cards":"L3-stretch-30"},{"id":"Q-L3-15-01","level":"L3","lo":"Stretch (L2 LO3)","ch":"15","topic":"What classifications rank","trap":"","stem":"According to the L3 book, what do Bordeaux's classifications actually rank?","options":{"a":"Appellations, from regional up to commune level","b":"Communes, ranked by the price of their wines","c":"Estates (châteaux); a name acts like a brand","d":"Individual vineyard plots, as in Burgundy"},"notes":{"a":"Classifications rank estates, not appellations.","b":"No: classifications rank estates; L3 says the AOCs form no neat quality hierarchy.","c":"Correct: estates can buy or sell plots, so the land behind a name can change.","d":"Not in Bordeaux: classifications rank estates, not vineyards."},"answer":"c","ctx":"Most classifications sit outside the AOC system; Saint-Émilion is the exception (2016 edition; may have changed).","src":"L3 book (2016) ch 13, p. 79-80","cards":"L3-stretch-30"},{"id":"Q-L3-15-02","level":"L3","lo":"Stretch (L2 LO3)","ch":"15","topic":"Pessac-Léognan vs Haut-Médoc","trap":"Pessac-Léognan (Cabernet-led reds) (known gap)","stem":"According to the L3 book, how do the finest red wines of Pessac-Léognan generally compare with those of the Haut-Médoc?","options":{"a":"Softer and richer, with red berry and plum","b":"Lighter, because they are mostly Merlot-based","c":"Fuller-bodied, with more Merlot in the blend","d":"A little lighter in body and more fragrant"},"notes":{"a":"This is the L3 description of Saint-Émilion's Right Bank style.","b":"Pessac-Léognan's gravel suits Cabernet Sauvignon; its reds are Cabernet-led.","c":"No: lighter. It is Graves further south that usually has more Merlot.","d":"Correct: gravel suits Cabernet in both, but Pessac-Léognan reds are a little lighter and more fragrant."},"answer":"d","ctx":"Graves south of Pessac-Léognan: similar style, less concentrated, usually more Merlot.","src":"L3 book (2016) ch 13, p. 80-81","cards":"L3-stretch-29"},{"id":"Q-L3-15-03","level":"L3","lo":"Stretch (L2 LO3)","ch":"15","topic":"Coonawarra soil","trap":"","stem":"According to the L3 book, what is distinctive about Coonawarra's soil?","options":{"a":"Deep gravel that stores heat into the evening","b":"Steep, stony slate that reflects river light","c":"Red terra rossa soil over a limestone subsoil","d":"Cool clay soils that suit Merlot over Cabernet"},"notes":{"a":"That is the Bordeaux Left Bank explanation.","b":"Steep, slaty river slopes describe Germany's best Riesling sites.","c":"Correct: on a narrow strip of land about 1.5 km wide and 15 km long.","d":"That is Saint-Émilion and Pomerol on the Right Bank."},"answer":"c","ctx":"L3 adds: cold Antarctic currents make it moderate maritime; Cabernet shows cassis and eucalyptus or menthol.","src":"L3 book (2016) ch 39, p. 167","cards":"L3-stretch-26"},{"id":"Q-L3-15-04","level":"L3","lo":"Stretch (L2 LO3)","ch":"15","topic":"Cooling in Napa Valley","trap":"","stem":"According to the L3 book, why are the vineyards in the south of Napa Valley cooler than those further north?","options":{"a":"They are shaded by the Vaca Mountains all afternoon.","b":"Cold air drains down from the Mayacamas Mountains.","c":"Morning fogs and breezes come in from San Pablo Bay.","d":"They lie at higher altitude than the northern valley floor."},"notes":{"a":"The Vaca Mountains form the eastern side; the cooling comes from the bay.","b":"L3 says cool air through the Mayacamas' Chalk Hill gap relieves the NORTH (Calistoga); the south is cooled by San Pablo Bay.","c":"Correct: hence cool Los Carneros in the south, while Calistoga in the north gets the warmest days.","d":"Not the L3 explanation; it credits fog and breezes from San Pablo Bay."},"answer":"c","ctx":"Links to L2 p. 87: Calistoga, in the far north, is warmer still and gives some of Napa's ripest wines.","src":"L3 book (2016) ch 33, p. 145","cards":"L3-stretch-20"},{"id":"Q-L3-16-01","level":"L3","lo":"Stretch (L2 LO3)","ch":"16","topic":"Northern Rhône sites","trap":"","stem":"According to the L3 book, why are the best Northern Rhône Syrah sites on steep, south-facing slopes, often in side valleys?","options":{"a":"The slopes shade the vines from intense Mediterranean heat.","b":"Syrah is at its limit; side valleys block the cold mistral.","c":"Flat valley floors are reserved for white grapes by law.","d":"Side valleys funnel warm, humid sea air up from the coast."},"notes":{"a":"Reversed: the north is moderate; south-facing slopes add heat, not shade.","b":"Correct: latitude plus the cold mistral wind leave Syrah needing maximum sun and shelter.","c":"No such rule; slopes are chosen for aspect and shelter.","d":"Not in the L3 book; the side valleys protect against the cold mistral."},"answer":"b","ctx":"The mistral is the cold north wind of the Rhône Valley; it can easily damage the vines.","src":"L3 book (2016) ch 19, p. 99","cards":"L3-stretch-31"},{"id":"Q-L3-16-02","level":"L3","lo":"Stretch (L2 LO3)","ch":"16","topic":"Co-fermenting white grapes","trap":"","stem":"According to the L3 book, besides adding aroma, what can co-fermenting white grapes such as Viognier with Syrah do?","options":{"a":"Raise acidity in a warm vintage","b":"Help stabilise the wine's colour","c":"Raise its tannin for longer ageing","d":"Lower the alcohol of very ripe Syrah"},"notes":{"a":"Viognier is naturally low in acidity (L3 p. 100), so no.","b":"Correct: it can help stabilise the colour extracted from the red grapes (L3 p. 99).","c":"Not stated; the effect is on colour and aroma.","d":"Viognier is picked very ripe and tends to high alcohol."},"answer":"b","ctx":"L2 p. 91: some Côte Rôtie producers co-ferment a little Viognier for floral aromas.","src":"L3 book (2016) ch 19, p. 99-100","cards":"L3-stretch-31"},{"id":"Q-L3-16-03","level":"L3","lo":"Stretch (L2 LO3)","ch":"16","topic":"Crozes-Hermitage sites","trap":"","stem":"According to the L3 book, where in Crozes-Hermitage do the more concentrated, complex and tannic red wines usually come from?","options":{"a":"The hill of Hermitage itself","b":"Irrigated vineyards near the river","c":"The flat plain south of Hermitage","d":"The steeper slopes north of Hermitage"},"notes":{"a":"That hill is the separate Hermitage AOC, not Crozes-Hermitage.","b":"Not in the L3 account, which contrasts northern slopes with the flat southern plain.","c":"This is where the lighter, higher-yielding wines come from.","d":"Correct: lighter wines come from the higher-yielding flat sites to the south."},"answer":"d","ctx":"Fits L2 p. 91: Crozes is larger and flatter than Hermitage, so most of its wines are less intense.","src":"L3 book (2016) ch 19, p. 101","cards":"L3-stretch-31, L2-card-74"},{"id":"Q-L3-16-04","level":"L3","lo":"Stretch (L2 LO3)","ch":"16","topic":"South Eastern Australia zone","trap":"NOT stem","stem":"According to the L3 book, wines from which Australian state are NOT part of the South Eastern Australia super-zone?","options":{"a":"New South Wales","b":"Victoria","c":"South Australia","d":"Western Australia"},"notes":{"a":"Inside the super-zone (e.g. Riverina, Hunter Valley).","b":"Inside the super-zone.","c":"Inside: the zone covers South Australia, Victoria, New South Wales and Queensland.","d":"Correct: the only wines outside the super-zone; they can be labelled Western Australia."},"answer":"d","ctx":"So a blend using Margaret River fruit cannot be labelled South Eastern Australia (2016 edition; may have changed).","src":"L3 book (2016) ch 39, p. 165, 168","cards":"L3-stretch-26"},{"id":"Q-L2-17-02","level":"L2","lo":"LO4","ch":"17","topic":"Gamay structure","trap":"","stem":"Which combination of acidity and tannin is typical of wines made from Gamay?","options":{"a":"High acidity with high tannins","b":"Low acidity with low to medium tannins","c":"Medium acidity with medium levels of tannin","d":"High acidity with low to medium tannins"},"notes":{"a":"Gamay is only low to medium in tannin; Beaujolais techniques keep tannin extraction low.","b":"Acidity is high. Low acidity with high sugar is what the book gives for ripe Grenache.","c":"That is the profile the book gives for Tempranillo.","d":"Correct: the book gives high acidity, low to medium tannins and red fruit (raspberry, red cherry, red plum)."},"answer":"d","ctx":"","src":"L2 book p. 94 (Gamay)","cards":"L2-card-75"},{"id":"Q-L2-17-03","level":"L2","lo":"LO4","ch":"17","topic":"Beaujolais AOC","trap":"flat south vs sloped north","stem":"Why are wines labelled Beaujolais AOC typically the lightest-bodied and simplest wines of the region?","options":{"a":"Most come from high-yielding vines on flat, fertile land.","b":"Most are matured briefly in large, old oak vessels.","c":"Most come from cool, north-facing slopes that ripen slowly.","d":"Most are blended with a share of white grape varieties."},"notes":{"a":"Correct: mostly from the flat, fertile south, where high-yielding vines give the lightest, simplest wines.","b":"Gamay is usually made in inert vessels; the book links the style to high yields.","c":"Not the book's reason. The slopes are in the north (Villages) and they aid ripening.","d":"No such blending is described; the book's reason is high yields on flat, fertile land."},"answer":"a","ctx":"","src":"L2 book p. 95 (Labelling in Beaujolais)","cards":"L2-card-75, L2-card-19"},{"id":"Q-L2-17-04","level":"L2","lo":"LO4","ch":"17","topic":"Beaujolais Villages","trap":"","stem":"What helps Beaujolais Villages wines achieve greater flavour intensity and body than basic Beaujolais?","options":{"a":"Flat, fertile vineyards that allow the vines to crop heavily","b":"Sloped vineyards with more sun and warm, well-drained soils","c":"Maturation in small new-oak barrels for several months","d":"Cool sea breezes that slow ripening and preserve acidity"},"notes":{"a":"That describes the south, the main source of the lightest Beaujolais AOC wines.","b":"Correct: the book says these aid grape ripening in the northern villages.","c":"Gamay is usually made in inert vessels and rarely shows oak.","d":"No sea influence is given; the book credits slopes and warm, well-drained soils."},"answer":"b","ctx":"Causal chain: slopes -> more sun exposure; warm, well-drained soils -> riper grapes -> more intensity and body.","src":"L2 book p. 95 (Labelling in Beaujolais)","cards":"L2-card-75, L2-card-19"},{"id":"Q-L2-17-05","level":"L2","lo":"LO4","ch":"17","topic":"Beaujolais hierarchy","trap":"","stem":"Which list shows these Beaujolais appellations in order, from the base of the hierarchy to the top?","options":{"a":"Fleurie, Beaujolais Villages, Beaujolais","b":"Beaujolais, Beaujolais Villages, Fleurie","c":"Beaujolais Villages, Beaujolais, Fleurie","d":"Beaujolais, Fleurie, Beaujolais Villages"},"notes":{"a":"This is the reverse order: the crus are at the top.","b":"Correct: Beaujolais AOC at the base, then Beaujolais Villages AOC, then the ten crus such as Fleurie AOC.","c":"Beaujolais AOC is the base; Beaujolais Villages is the step above it.","d":"The crus, such as Fleurie, sit above Beaujolais Villages, within its area."},"answer":"b","ctx":"Same shape in the Rhône: regional Côtes du Rhône, then Côtes du Rhône Villages, then crus (L2 book p. 98).","src":"L2 book p. 95 (Labelling in Beaujolais)","cards":"L2-card-19, L2-card-75"},{"id":"Q-L2-17-06","level":"L2","lo":"LO4","ch":"17","topic":"Beaujolais cru style","trap":"MOST LIKELY stem","stem":"A red wine has high acidity, low to medium tannins, medium to pronounced red cherry and raspberry aromas and a medium to long finish. Which GI is it MOST LIKELY from?","options":{"a":"Châteauneuf-du-Pape","b":"Fleurie","c":"Beaujolais","d":"Côtes du Rhône"},"notes":{"a":"Full-bodied and high in alcohol; ripe Grenache is low in acidity.","b":"Correct: crus are the region's most concentrated wines; very good ones show medium to pronounced red fruit and a medium to long finish.","c":"Same grape, but the lightest and simplest wines; the intensity and finish point to a cru.","d":"Simple and medium-bodied with red fruit and white pepper; Grenache-based, so not usually high in acidity."},"answer":"b","ctx":"Gamay clues: high acid + low to medium tannin + red fruit. Then use intensity and finish to place it in the hierarchy.","src":"L2 book p. 94-95","cards":"L2-card-75"},{"id":"Q-L2-17-07","level":"L2","lo":"LO4","ch":"17","topic":"Serving Beaujolais","trap":"","stem":"Why are Beaujolais wines sometimes served lightly chilled?","options":{"a":"To emphasise the freshness of their delicate red fruit","b":"To reduce the burning sensation of their high alcohol levels","c":"To hide the banana and candy aromas from winemaking","d":"To soften the effect of their high levels of tannin"},"notes":{"a":"Correct: as stated in the book (p. 95).","b":"Beaujolais is light- to medium-bodied; the book gives freshness of fruit as the reason.","c":"These aromas are part of the style; the book gives freshness of fruit as the reason.","d":"Beaujolais is only low to medium in tannin, so this is not the reason."},"answer":"a","ctx":"Service table: light-bodied reds such as Beaujolais, room temperature or lightly chilled, 13-18 °C (L2 book p. 21).","src":"L2 book p. 95; p. 21 (Service temperature)","cards":"L2-card-75, L2-card-26"},{"id":"Q-L2-17-08","level":"L2","lo":"LO4","ch":"17","topic":"Typical Beaujolais","trap":"NOT stem; Gamay rarely oaked","stem":"Which of these is NOT typical of most Beaujolais wines?","options":{"a":"Pronounced vanilla and toast from new oak","b":"Best drunk young, while the fruit is fresh","c":"Low to medium tannins and red-fruit flavours","d":"Light to medium body and high acidity"},"notes":{"a":"Correct: Gamay is usually made in inert vessels and rarely displays aromas from oak.","b":"Typical: most are for immediate drinking and quickly lose fresh fruit in bottle.","c":"Typical: this is the book's description of Beaujolais.","d":"Typical: light- to medium-bodied, and Gamay gives high acidity."},"answer":"a","ctx":"","src":"L2 book p. 94-95","cards":"L2-card-75"},{"id":"Q-L2-18-02","level":"L2","lo":"LO4","ch":"18","topic":"Ripe Grenache","trap":"","stem":"When Grenache grapes are fully ripe, what levels of sugar and acidity do they typically have?","options":{"a":"Low sugar and high acidity","b":"Medium sugar and medium acidity","c":"High sugar and high acidity","d":"High sugar and low acidity"},"notes":{"a":"That fits unripe or early-picked grapes; Grenache needs a warm climate and ripens to high sugar.","b":"Grenache ripens in warm climates to high sugar with low acidity.","c":"Acidity is low; that is why partners such as Syrah or Tempranillo add acidity.","d":"Correct: the book says ripe Grenache typically has high sugar and low acidity."},"answer":"d","ctx":"Causal chain: high sugar -> high alcohol (e.g. Châteauneuf-du-Pape); low acid, thin skins -> blended with Syrah or Tempranillo.","src":"L2 book p. 96","cards":"L2-card-76"},{"id":"Q-L2-18-03","level":"L2","lo":"LO4","ch":"18","topic":"Grenache in Minervois","trap":"Minervois is a Grenache GI outside the Rhône (known gap)","stem":"In Minervois AOC, what does Grenache mainly contribute to blends with Syrah and other local grapes?","options":{"a":"Colour, acidity and tannin","b":"Herbaceous and floral aromas","c":"Red-fruit flavours and body","d":"Freshness from high acidity"},"notes":{"a":"These are what Syrah adds to Grenache-based blends (p. 96).","b":"Not given; Grenache gives red fruit (strawberry, red plum, red cherry) and sometimes spice.","c":"Correct: Grenache ripens well in this warm climate and gives red fruit and body.","d":"Ripe Grenache is typically low in acidity."},"answer":"c","ctx":"Minervois is on the spec for BOTH Grenache and Syrah; it is one of Languedoc-Roussillon's most important red AOCs.","src":"L2 book p. 96-97 (Languedoc-Roussillon and Provence)","cards":"L2-card-77, L2-card-76"},{"id":"Q-L2-18-04","level":"L2","lo":"LO4","ch":"18","topic":"Grenache rosé","trap":"","stem":"Grenache is often made into rosé by short maceration. How is the style of these wines BEST described?","options":{"a":"Deep in colour and tannic, aged in new oak","b":"Dry to medium, built to develop in the bottle","c":"Sweet and full-bodied, from partly dried grapes","d":"Dry to medium, to be drunk chilled while young"},"notes":{"a":"Short maceration drains the juice off the skins after a few hours, so little tannin is extracted.","b":"They are intended to be drunk chilled while young and fruity.","c":"Partly dried grapes are used for Recioto della Valpolicella, not Grenache rosé.","d":"Correct: dry to medium in sweetness, typically drunk chilled while young and fruity."},"answer":"d","ctx":"Why Grenache? Its red-fruit flavours suit rosé (L2 book p. 96).","src":"L2 book p. 96; p. 42 (Short maceration)","cards":"L2-card-76"},{"id":"Q-L2-18-05","level":"L2","lo":"LO4","ch":"18","topic":"Grenache and oak","trap":"","stem":"Why do some producers of top-quality Grenache prefer to mature it in old oak rather than new oak?","options":{"a":"Old oak raises the acidity of a low-acid grape","b":"New oak is not permitted in Southern Rhône AOCs","c":"New oak can mask Grenache's delicate red fruit","d":"Old oak adds more tannin to a thin-skinned grape"},"notes":{"a":"Oak does not add acidity; the book's reason is the delicate red fruit.","b":"No such rule is given; it is a stylistic choice by some producers.","c":"Correct: the book cites Grenache's delicate red-fruit flavours.","d":"Used barrels add less flavour than new oak (p. 47); the reason given is the delicate fruit."},"answer":"c","ctx":"With bottle age, good Grenache develops earth, meat and dried fruit (L2 book p. 96).","src":"L2 book p. 96; p. 47 (Oak vessels)","cards":"L2-card-76"},{"id":"Q-L2-18-06","level":"L2","lo":"LO4","ch":"18","topic":"Châteauneuf-du-Pape stones","trap":"","stem":"How do the large, round stones in many Châteauneuf-du-Pape vineyards help Grenache?","options":{"a":"They absorb heat by day and radiate it at night.","b":"They reflect sunlight away to keep the grapes cool.","c":"They shelter the vines from cold northerly winds.","d":"They shade the soil and keep the roots cool."},"notes":{"a":"Correct: this helps Grenache achieve full ripeness.","b":"The reverse: the stones store heat and release it at night, helping ripening.","c":"Not the book's explanation; the book credits stored heat.","d":"The stones add warmth; their role is to help ripening."},"answer":"a","ctx":"Result: full ripeness -> high sugar -> the full-bodied, high-alcohol style the book describes.","src":"L2 book p. 97","cards":"L2-card-77"},{"id":"Q-L2-18-07","level":"L2","lo":"LO4","ch":"18","topic":"Côtes du Rhône style","trap":"MOST LIKELY stem","stem":"An inexpensive, simple, medium-bodied red blend has red-fruit and white pepper flavours. Which GI is it MOST LIKELY from?","options":{"a":"Priorat","b":"Châteauneuf-du-Pape","c":"Côtes du Rhône","d":"Ribera del Duero"},"notes":{"a":"Spain's most powerful and full-bodied Garnacha-based wines.","b":"Full-bodied and high in alcohol; not simple or inexpensive.","c":"Correct: the book's description of the least expensive Southern Rhône reds.","d":"Very full-bodied Tempranillo with fresh black fruit."},"answer":"c","ctx":"","src":"L2 book p. 97","cards":"L2-card-77"},{"id":"Q-L2-18-08","level":"L2","lo":"LO4","ch":"18","topic":"Rhône labelling hierarchy","trap":"Côtes du Rhône covers the whole valley","stem":"Which list shows these Rhône appellations in hierarchy order, from the broadest to the most prestigious?","options":{"a":"Côtes du Rhône Villages, Côtes du Rhône, Châteauneuf-du-Pape","b":"Côtes du Rhône, Châteauneuf-du-Pape, Côtes du Rhône Villages","c":"Châteauneuf-du-Pape, Côtes du Rhône Villages, Côtes du Rhône","d":"Côtes du Rhône, Côtes du Rhône Villages, Châteauneuf-du-Pape"},"notes":{"a":"Côtes du Rhône is the broadest regional AOC, so it comes first.","b":"Châteauneuf-du-Pape is a cru, above Côtes du Rhône Villages.","c":"This is the reverse: the crus are at the top.","d":"Correct: regional AOC, then Villages (more intensity and complexity), then the crus."},"answer":"d","ctx":"Trap: Côtes du Rhône covers the entire valley, but almost all of it is grown in the Southern Rhône (p. 98).","src":"L2 book p. 98 (Labelling in the Rhône Valley)","cards":"L2-card-20, L2-card-77"},{"id":"Q-L2-18-09","level":"L2","lo":"LO4","ch":"18","topic":"Priorat Garnacha","trap":"","stem":"Why does Priorat DOCa produce Spain's most powerful and full-bodied Garnacha-based wines?","options":{"a":"Its moderate climate allows a long, slow ripening season.","b":"Its grapes are partially dried before fermentation.","c":"Very old vines in a warm, dry area give tiny yields.","d":"High-altitude vineyards give warm days and cool nights."},"notes":{"a":"The book calls Rioja moderate; Priorat is warm and dry.","b":"Drying grapes is the Amarone and Recioto method, not Priorat's.","c":"Correct: tiny yields of concentrated grapes; usually blended with other black grapes.","d":"That is the book's explanation for Ribera del Duero Tempranillo."},"answer":"c","ctx":"With long maturation, Priorat develops dried fruit and caramel in the bottle (L2 book p. 98).","src":"L2 book p. 98 (Spain)","cards":"L2-card-77"},{"id":"Q-L2-18-10","level":"L2","lo":"LO4","ch":"18","topic":"Grenache spec GIs","trap":"NOT stem; Ribera del Duero = Tempranillo only","stem":"Which of these GIs is NOT listed for Grenache/Garnacha in the Level 2 specification?","options":{"a":"Navarra","b":"McLaren Vale","c":"Barossa Valley","d":"Ribera del Duero"},"notes":{"a":"Listed: Garnacha reds, and also known for dry rosé.","b":"Listed: a warm South Australian region with many very old Grenache vines.","c":"Listed: old vines give concentrated red fruit, spice and long ageing potential.","d":"Correct: listed for Tempranillo only."},"answer":"d","ctx":"Australian old-vine Grenache-Shiraz blends can match Châteauneuf-du-Pape in style and quality (L2 book p. 98).","src":"L2 spec p. 12; L2 book p. 97-99","cards":"L2-card-37, L2-card-77, L2-card-77b"},{"id":"Q-L2-18-11","level":"L2","lo":"LO4","ch":"18","topic":"Côtes de Provence rosé","trap":"Côtes de Provence is a Grenache GI (known gap)","stem":"A dry, pale-coloured rosé in which Grenache is a key part of the blend is MOST LIKELY from which GI?","options":{"a":"Barossa Valley","b":"Priorat","c":"Côtes de Provence","d":"Châteauneuf-du-Pape"},"notes":{"a":"Known for concentrated old-vine Grenache reds and Shiraz blends.","b":"Known for Spain's most powerful, full-bodied Garnacha-based reds.","c":"Correct: Provence is best known for dry, pale rosé, mostly from Côtes de Provence AOC.","d":"Known for full-bodied, high-alcohol reds."},"answer":"c","ctx":"Location hook: Provence lies east of Languedoc-Roussillon, home of Minervois.","src":"L2 book p. 97 (Languedoc-Roussillon and Provence)","cards":"L2-card-77, L2-card-37"},{"id":"Q-L2-19-02","level":"L2","lo":"LO4","ch":"19","topic":"Tempranillo profile","trap":"","stem":"Which description BEST fits a typical wine made from Tempranillo?","options":{"a":"Full body, high tannin, green bell pepper and blackberry","b":"Light body, high acidity, low tannin and red fruit only","c":"Medium to full body, medium acidity, red and black fruit","d":"Full body, low acidity, strawberry and white pepper spice"},"notes":{"a":"Closer to Carmenère, especially when not fully ripe.","b":"Closer to Gamay (Beaujolais).","c":"Correct: also medium tannins; strawberry, red cherry, blackberry, black plum.","d":"Closer to Grenache (ripe: high sugar, low acidity)."},"answer":"c","ctx":"Best examples develop mushroom, leather and dried fruit in bottle (L2 book p. 99).","src":"L2 book p. 99","cards":"L2-card-78"},{"id":"Q-L2-19-03","level":"L2","lo":"LO4","ch":"19","topic":"Catalunya DO","trap":"Catalunya = Tempranillo only (known gap)","stem":"Which broad Spanish DO produces high volumes of Tempranillo and Tempranillo-based blends, in styles from simple and fruity to powerful and oak-aged?","options":{"a":"Priorat","b":"Catalunya","c":"Ribera del Duero","d":"Navarra"},"notes":{"a":"Within Catalunya, but known for powerful Garnacha-based wines from tiny yields.","b":"Correct: a broad DO; the spec lists it for Tempranillo only.","c":"High-altitude DO known for very full-bodied Tempranillo, not high volumes.","d":"Known for Garnacha reds and dry rosé; listed for Garnacha only."},"answer":"b","ctx":"Hook: Catalunya = big volumes of Tempranillo; Priorat, inside it, = Garnacha power.","src":"L2 book p. 99; L2 spec p. 12","cards":"L2-card-78, L2-card-37"},{"id":"Q-L2-19-04","level":"L2","lo":"LO4","ch":"19","topic":"Ribera del Duero","trap":"","stem":"Why can Ribera del Duero produce very full-bodied Tempranillo that still has fresh black-fruit flavours?","options":{"a":"Sea breezes from the nearby coast cool its vineyards.","b":"Its high altitude gives warm days, cool nights.","c":"Morning fogs slow ripening through the season.","d":"Very old vines on stony soils give tiny yields."},"notes":{"a":"Ribera del Duero lies further inland; the book credits altitude, not the sea.","b":"Correct: as the book says; warm days ripen the grapes, cool nights help keep the fruit fresh.","c":"Fog is not mentioned for Ribera del Duero; the book credits altitude.","d":"That is closer to the book's explanation for Priorat."},"answer":"b","ctx":"Causal chain: altitude -> cool nights -> acidity and fresh fruit kept; warm days -> ripeness and body.","src":"L2 book p. 99","cards":"L2-card-78"},{"id":"Q-L2-19-05","level":"L2","lo":"LO4","ch":"19","topic":"Rioja blends","trap":"early-drinking vs long-ageing blends","stem":"In Rioja, for which style of wine is Tempranillo sometimes blended with Garnacha?","options":{"a":"Wines intended for long-term ageing","b":"Wines intended for early drinking","c":"Wines labelled as Gran Reserva only","d":"The region's dry white wines"},"notes":{"a":"For these, other local grapes are added to provide tannin and acidity.","b":"Correct: per the book; other local grapes add tannin and acidity for long-ageing wines.","c":"Gran Reserva is the longest-aged style; the book links Garnacha to early drinking.","d":"Garnacha is a black grape; the book is describing Rioja's red blends."},"answer":"b","ctx":"Rioja is usually a blend; Tempranillo dominates the best wines (L2 book p. 99).","src":"L2 book p. 99 (Spain)","cards":"L2-card-78"},{"id":"Q-L2-19-06","level":"L2","lo":"LO4","ch":"19","topic":"Spanish ageing terms order","trap":"","stem":"Which list puts the Spanish ageing terms in order, from the shortest to the longest ageing?","options":{"a":"Joven, Crianza, Gran Reserva, Reserva","b":"Crianza, Joven, Reserva, Gran Reserva","c":"Joven, Crianza, Reserva, Gran Reserva","d":"Joven, Reserva, Crianza, Gran Reserva"},"notes":{"a":"Gran Reserva has the highest minimum ageing requirements.","b":"Joven has no minimum ageing, so it comes first.","c":"Correct: the book says the order, and the style each term indicates, matter most.","d":"Crianza is aged for the shortest period of the three oak-aged terms."},"answer":"c","ctx":"These are national Spanish terms, not just Rioja's; some regions are stricter, and many producers exceed the minimums.","src":"L2 book p. 99-100 (Labelling in Spain)","cards":"L2-card-17, L2-card-78"},{"id":"Q-L2-19-07","level":"L2","lo":"LO4","ch":"19","topic":"Joven and Genérico","trap":"Genérico = Rioja's name for Joven","stem":"What does the term Joven indicate on a Spanish wine label, and what is the equivalent term in Rioja?","options":{"a":"Young and fruity, no minimum ageing; Genérico in Rioja","b":"Young and fruity, no minimum ageing; Crianza in Rioja","c":"Aged in oak barrels before release; Genérico in Rioja","d":"Aged in oak barrels before release; Crianza in Rioja"},"notes":{"a":"Correct: typically released the year after the vintage, with primary fruit flavours.","b":"Crianza is the oak-aged term, used throughout Spain.","c":"Oak ageing before release defines Crianza; Joven has no minimum ageing.","d":"Both halves wrong: oak ageing defines Crianza, a national term; Rioja's Joven is Genérico."},"answer":"a","ctx":"","src":"L2 book p. 100 (Labelling in Spain)","cards":"L2-card-17"},{"id":"Q-L2-19-08","level":"L2","lo":"LO4","ch":"19","topic":"Crianza style","trap":"MOST LIKELY stem","stem":"A Spanish red shows primary red and black fruit with vanilla, smoke and coconut from oak, but no tertiary notes. Which label term is it MOST LIKELY to carry?","options":{"a":"Gran Reserva","b":"Crianza","c":"Reserva","d":"Joven"},"notes":{"a":"The longest ageing gives the most pronounced secondary AND tertiary aromas.","b":"Correct: aged in oak before release, gaining vanilla, smoke and coconut alongside primary fruit.","c":"Extended oak and bottle ageing adds tertiary notes such as dried fruit and mushroom.","d":"Joven wines show primary fruit flavours and have no ageing requirement."},"answer":"b","ctx":"Ladder: Joven = primary; Crianza = + oak; Reserva = + some tertiary; Gran Reserva = most pronounced secondary and tertiary.","src":"L2 book p. 100 (Labelling in Spain)","cards":"L2-card-17, L2-card-78"},{"id":"Q-L2-19-09","level":"L2","lo":"LO4","ch":"19","topic":"Gran Reserva and quality","trap":"","stem":"Why might a Spanish producer decide not to make a Gran Reserva in a particular vintage?","options":{"a":"The wine must first spend a year sold as a Reserva.","b":"The Gran Reserva term may only be used in Rioja DOCa.","c":"Its grapes lacked the quality for long ageing.","d":"The law caps how many Gran Reserva vintages are made."},"notes":{"a":"No such rule is given; the book's reason is the quality of the grapes.","b":"The ageing terms are national Spanish terms, not specific to Rioja.","c":"Correct: an inferior wine aged for long tastes stale and lacking in fruit (p. 100).","d":"No such cap is given; the book describes the producer's choice in weaker years."},"answer":"c","ctx":"Only wines with enough flavour intensity, acidity and (in reds) tannin suit long-term ageing.","src":"L2 book p. 100 (A note on quality)","cards":"L2-card-17"},{"id":"Q-L2-20-01","level":"L2","lo":"LO4","ch":"20","topic":"Carmenère spec GI","trap":"Carmenère = Central Valley only (known gap)","stem":"Which GI is listed for Carmenère in the Level 2 specification?","options":{"a":"Central Valley","b":"Western Cape","c":"Casablanca Valley","d":"Mendoza"},"notes":{"a":"Correct: its only spec GI; it ripens best in the warmest, sunniest Central Valley sites (p. 101).","b":"Pinotage's spec GI; Pinotage is grown throughout the Western Cape (p. 102).","c":"Coastal, cooled by sea breezes and fog; listed for Chardonnay, Pinot Noir, Sauvignon Blanc.","d":"Malbec's spec GI, in Argentina; most Malbec plantings are in high-altitude Mendoza (p. 102)."},"answer":"a","ctx":"Ch 20 trio: Carmenère = Central Valley; Malbec = Mendoza; Pinotage = Western Cape. Maipo and Colchagua lie within Central Valley.","src":"L2 spec p. 13; L2 book p. 101-102","cards":"L2-card-37, L2-card-79"},{"id":"Q-L2-20-02","level":"L2","lo":"LO4","ch":"20","topic":"Western Cape grapes","trap":"Western Cape trio (known gap)","stem":"In the Level 2 specification, which three grape varieties have Western Cape listed as a GI?","options":{"a":"Chardonnay, Pinot Noir and Pinotage","b":"Chenin Blanc, Chardonnay and Cabernet Sauvignon","c":"Chenin Blanc, Sauvignon Blanc and Pinotage","d":"Chenin Blanc, Chardonnay and Pinotage"},"notes":{"a":"Pinot Noir's South African GI is Walker Bay.","b":"Cabernet Sauvignon's South African GI is Stellenbosch.","c":"Sauvignon Blanc's South African GIs are Elgin and Constantia.","d":"Correct: spec p. 11 (Chardonnay) and p. 13 (Chenin Blanc, Pinotage)."},"answer":"d","ctx":"Book link: inexpensive Western Cape Chenin and Chardonnay come from warm inland areas, often blended together (p. 63, 71).","src":"L2 spec p. 11, 13; L2 book p. 63, 71, 102","cards":"L2-card-37, L2-card-38, L2-card-35, L2-card-80"},{"id":"Q-L2-20-03","level":"L2","lo":"LO4","ch":"20","topic":"Where Carmenère ripens","trap":"","stem":"Carmenère needs a long, sunny growing season. Where in Chile does it ripen MOST successfully?","options":{"a":"The warmest, sunniest sites of the Central Valley","b":"Short-season sites, since it ripens early and easily","c":"Coastal sites cooled by Pacific breezes and fog","d":"The coolest and highest sites in the Andes foothills"},"notes":{"a":"Correct: even in Chile it struggles

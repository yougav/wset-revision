articularly susceptible to botrytis. Sweet, medium to high alcohol, full body, high acidity; pronounced apricot plus oak (smoke, vanilla). Very good/outstanding; ages for many years to dried fruit, honey, caramel.\n- Hunter Valley (Australia): dry, single-varietal, light body, low alcohol. Warm climate, so harvested EARLY (low sugar, high acid); inert vessels, bottled young; neutral at first, then several years -> pronounced honey and nuts."},"L2-card-55b":{"head":"CH 9: SÉMILLON/SEMILLON","src":"L2 book p. 64-65","body":"- Barossa Valley: range from Hunter-like styles to full-bodied, oak-matured.\n- Spelling: Sémillon in France, Semillon in English-speaking countries. Australia: significant plantings; often blended (e.g. with Sauvignon Blanc); used for botrytised sweet and various dry styles (p. 64-65)."},"L2-card-56":{"head":"CH 9: FURMINT AND TOKAJI ASZÚ","src":"L2 book p. 66","body":"- White grape, mainly Hungary; naturally high acidity, very susceptible to botrytis -> ideal for sweet wines. Most planted grape in Tokaj (north-east Hungary).\n- Tokaj also makes dry and medium wines but is most famous for Tokaji Aszú: sweet, from botrytis-affected grapes; Furmint principal, often blended with other local grapes for aroma complexity.\n- Always sweet. Puttonyos indicate sweetness: most labelled 5 or 6 Puttonyos; 6 is sweeter than 5.\n- Amber colour (significant time ageing in oak). Pronounced nose with primary, secondary and tertiary aromas: fresh and dried apricot, citrus, oak (vanilla, smoke), tertiary (dried fruit, caramel, nuts). Sweet, full body, balanced by high acidity; long, intense finish.\n- Among the world's best and most complex sweet wines; usually very good or outstanding; develop for many years in bottle."},"L2-card-57":{"head":"CH 10: CHARDONNAY - THE GRAPE","src":"L2 book p. 67-68","body":"- White grape; outstanding wines in cool, moderate AND warm climates. Climate strongly affects fruit, alcohol, body, acidity.\n- Cool: high acid, light to medium body; green fruit (apple, pear), citrus (lemon), wet stones.\n- Moderate: medium to high acid, medium to full body; lemon, stone fruit (peach), sometimes melon.\n- Warm: full body, medium acid; stone fruit (peach), tropical (pineapple, banana).\n- Acidification common in warm-climate Chardonnay, to balance alcohol and body.\n- Optional secondary flavours: MLF (butter, cream; softens harsh acid); lees (body, bread, biscuit); oak fermentation/maturation (body, smoke, vanilla, coconut); chips/staves cheaper. Only wines with enough intensity benefit. Unoaked styles labelled \"unoaked\" or \"unwooded\".\n- Very good/outstanding age for years: hazelnut, mushroom.\n- More likely to show oak than Pinot Grigio or Sauvignon Blanc; suffered from heavily oaked 1980s-90s styles; Chablis popular (unoaked, labelled by region) (p. 71)."},"L2-card-58":{"head":"CH 10: CHARDONNAY - FRANCE","src":"L2 book p. 68-69","body":"- Burgundy: cool Chablis in the north, moderate Côte d'Or, Mâconnais in the south.\n- Bourgogne AOC: simple apple, lemon, high acid.\n- Chablis AOC (village appellation): cool; dry, light to medium body, high acid, apple, lemon, wet stones. Premier/Grand Cru on south/south-west-facing hillsides: riper, more flavourful. Frost a key concern. With very few exceptions no detectable oak; inert vessels preserve delicacy.\n- Chardonnay is Burgundy's main white grape. Bourgogne AOC: grapes from anywhere in Burgundy (p. 68)."},"L2-card-59":{"head":"CH 10: CHARDONNAY - FRANCE","src":"L2 book p. 68-69","body":"- Côte d'Or: moderate; more body, riper (peach, melon). Chardonnay focus is the Côte de Beaune: Meursault and Puligny-Montrachet. Oak fermentation/maturation and lees ageing add complexity and body. Premier and grand crus develop hazelnut, mushroom for decades; considered the pinnacle of Chardonnay.\n- Mâconnais: fruity, mostly unoaked, simple (lemon, peach, melon) = Mâcon AOC. Pouilly-Fuissé: steep east and south-east slopes; concentrated stone and tropical fruit; often oak.\n- Languedoc-Roussillon: warm; mostly Pays d'Oc IGP; peach, pineapple, banana; chips/staves in cheaper wines.\n- Languedoc-Roussillon: Mediterranean coast of southern France, from the Spanish border to the Rhône; AOCs plus Pays d'Oc IGP; best may be barrel-fermented/matured (p. 69)."},"L2-card-60":{"head":"CH 10: CHARDONNAY - OUTSIDE FRANCE","src":"L2 book p. 69-71","body":"- California Central Valley: very warm, dry, irrigated, high yields; labelled California; peach, pineapple, medium acid and body; oak from chips/staves.\n- Coastal California: Los Carneros (San Pablo Bay fog), Sonoma (Pacific breezes); Napa gets warmer going north: full body, pronounced tropical fruit, new oak vanilla and spice. Santa Barbara County: breezes funnelled inland by lateral valleys.\n- Oregon: generally moderate; high acidity, lemon to melon; small production.\n- California Central Valley is cut off from sea influence by mountains; coastal influences slow ripening and keep acidity. Santa Barbara ranges from Côte de Beaune-like to tropical-fruit styles (p. 69)."},"L2-card-61":{"head":"CH 10: CHARDONNAY - OUTSIDE FRANCE","src":"L2 book p. 69-71","body":"- Australia: South Eastern Australia (high volume, warm irrigated inland, sometimes blended with Semillon). Adelaide Hills (altitude) and Yarra Valley (ocean currents): ripe peach, sometimes pineapple, banana, medium-high acid, balanced oak. Margaret River (warm, sea breezes; smaller volume, consistently high quality): medium-full body, peach, pineapple.\n- New Zealand: Marlborough (cool, sunny, sea breezes, plentiful rain; ripe lemon, peach, melon, high acid, subtle oak); Hawke's Bay (North Island east coast; moderate; Chardonnay its most planted white; full body, high acid, pronounced stone fruit).\n- Chile: Casablanca Valley (sea breezes, fog; lemon, peach); Central Valley (all quality levels; altitude moderates the best).\n- South Africa: hot inland Western Cape (high-volume brands, sometimes blended with Chenin); Walker Bay (cool, sea breezes; high acid, peach, pineapple, oak)."},"L2-card-62":{"head":"CH 11: SAUVIGNON BLANC - THE GRAPE","src":"L2 book p. 72","body":"- Aromatic white grape; grows best in cool and moderate climates. Usually dry, light to medium body, high acidity.\n- Pronounced herbaceous aromas: grass, green bell pepper (capsicum), asparagus.\n- By ripeness: green fruit (apple, gooseberry), citrus (grapefruit), wet stones -> stone fruit (peach), tropical (passion fruit). Blending sites of different ripeness adds complexity.\n- Usually single-varietal; sometimes blended with Semillon.\n- Mostly inert vessels; new oak can overwhelm the herbaceous character. Oak use shown by terms such as \"barrel aged\".\n- Best drunk young; even outstanding examples can lose fresh aromas within a couple of years and develop unattractive vegetal notes."},"L2-card-63":{"head":"CH 11: SAUVIGNON BLANC - REGIONS","src":"L2 book p. 73-74","body":"- Loire: Sancerre AOC and Pouilly-Fumé AOC face each other across the Loire; cool; Sauvignon the only white permitted. Dry, high acid, apple, grass, asparagus, sometimes wet stones. Touraine AOC: wider sub-region west of Sancerre; fruity, inexpensive.\n- Bordeaux: Bordeaux AOC (grass, green apple; varietal or with Sémillon). Graves and Pessac-Léognan: more concentrated, complex blends with Sémillon (adds body, ageing); best oak-matured, develop honey and nuts.\n- Languedoc-Roussillon: mostly too warm; best where cooled by altitude; tropical (passion fruit) and grass; Pays d'Oc IGP."},"L2-card-64":{"head":"CH 11: SAUVIGNON BLANC - REGIONS","src":"L2 book p. 73-74","body":"- New Zealand Marlborough: cool; more pronounced than Loire; blending sites/ripeness gives grapefruit, peach, passion fruit plus pronounced green bell pepper and asparagus. Some experiment with Loire-like styles, oak or lees.\n- Australia: Margaret River (often blended with Semillon; concentrated grass); Adelaide Hills (most planted variety there; altitude; citrus to tropical; some blended with Semillon for fuller, more age-worthy wines). Some Margaret River has oak contact.\n- Chile: Casablanca Valley (sea breezes, fog); Central Valley (range of quality).\n- South Africa: coastal only. Constantia (south of Cape Town; Southern Ocean breezes; tropical and herbaceous). Elgin (altitude; often cited as coolest; apple, wet stones).\n- USA California: mostly too warm; cooler parts of Napa Valley; may be harvested early; sometimes oak (smoke)."},"L2-card-65":{"head":"CH 12: PINOT GRIGIO/PINOT GRIS","src":"L2 book p. 76-78","body":"- Same white grape: Pinot Grigio (Italian name), Pinot Gris (French). Cool or moderate climates. Two styles decided mainly in the vineyard.\n- Most common: high yields, picked early to keep acid -> dry, light body, medium to high acid, simple pear and lemon. Usually inert vessels, fermented dry. Drink young.\n- Riper: controlled yields, delayed harvest -> more sugar, less acid, more complex: powerful, full body, medium acid, pronounced lemon, peach, mango, banana. Sometimes off-dry/medium (yeast removed). Can develop ginger and honey."},"L2-card-66":{"head":"CH 12: PINOT GRIGIO/PINOT GRIS","src":"L2 book p. 76-78","body":"- Italy: mostly simple, unoaked, light; Veneto, labelled delle Venezie DOC or Veneto IGT; inexpensive, high volume, short finish, acceptable to good. Fuller style in Friuli-Venezia Giulia.\n- Alsace AOC: later-picked extra-ripe grapes; medium acid; dry to medium; medium to full body, pronounced peach and mango; honey and ginger with age; best from grand cru vineyards.\n- Elsewhere: \"Pinot Grigio\" signals higher-acid, lighter; \"Pinot Gris\" more body and complexity.\n- Riper Pinot Gris styles give exceptional complexity and pair well with strongly flavoured food (p. 78)."},"L2-card-67":{"head":"CH 13: GEWURZTRAMINER, VIOGNIER, ALBARIÑO","src":"L2 book p. 79-80","body":"- Gewurztraminer: aromatic; cool to moderate climates; dry to sweet. High sugar -> high alcohol when dry; full body, LOW to medium acidity; pronounced rose, peach, apricot, lychee. Typically unoaked. Best develop honey, dried fruit. Most famous in Alsace AOC (grand crus alongside Riesling and Pinot Gris).\n- Viognier: aromatic; mainly moderate climates. Dry, low to medium acid, high alcohol, medium to full body; pronounced blossom, peach, apricot. Mostly inert vessels, but unusually for an aromatic grape some are oaked. Condrieu AOC (Northern Rhône) is dedicated to single-varietal Viognier; light vanilla from oak common.\n- Albariño: Rías Baixas DO, north-west Spain; Atlantic influence -> moderate, notably cooler, wetter, cloudier than many of Spain's other wine regions. Dry, high acid, medium body; lemon, grapefruit, peach, apricot. Usually unoaked, drunk young; sometimes a little lees contact to add body and complexity."},"L2-card-67b":{"head":"CH 13: GEWURZTRAMINER, VIOGNIER, ALBARIÑO","src":"L2 book p. 79-80","body":"- Gewurztraminer and Viognier make some of the world's fullest-bodied, most floral whites (p. 79). Viognier is now widely planted; used single-varietal or as a blending partner to add floral notes and body (p. 80)."},"L2-card-68":{"head":"CH 14: MERLOT","src":"L2 book p. 81-84","body":"- Black grape; moderate and warm climates. Single-varietal typically dry, medium acidity, medium tannins.\n- Just-ripe: light to medium body, fresh red fruit (strawberry, red plum), herbaceous (green bell pepper). Riper: medium to full body, cooked black fruit (blackberry, black plum) - easy in warm climates or by later harvest in moderate ones.\n- Often blended with higher-tannin grapes like Cabernet Sauvignon: Merlot adds red fruit and lowers tannin, making wines ready sooner. Lighter styles need little oak; fuller-bodied styles may gain softness and flavour complexity from oak. Best age to dried fruit and tobacco."},"L2-card-69":{"head":"CH 14: MERLOT","src":"L2 book p. 81-84","body":"- Bordeaux: moderate climate, high rainfall (Atlantic). Most widely planted variety. Left Bank (west/south of Gironde/Garonne: Médoc, Graves, Sauternes); Right Bank (north/east of Gironde and Dordogne: Saint-Émilion, Pomerol). Bordeaux AOC and Bordeaux Supérieur AOC typically Merlot-dominated. Most famous Merlot-dominated: Saint-Émilion and Pomerol; full body, pronounced black fruit, oak; age to dried fruit, tobacco.\n- Bordeaux wines are typically blends, mainly Merlot and Cabernet Sauvignon; proportions depend on intended style, but soil types and each year's weather also matter (p. 82)."},"L2-card-69b":{"head":"CH 14: MERLOT","src":"L2 book p. 81-84","body":"- Languedoc-Roussillon: single-varietal Merlot at all quality levels, or blended with Cabernet Sauvignon, Grenache, Syrah; Pays d'Oc IGP. California: styles from fruity, medium-bodied 'California' to concentrated, full-bodied Napa Valley and Sonoma; blends common but single-varietal Merlot important; pronounced oak (vanilla, coconut, smoke); best often in new barrels, high-volume producers use chips or staves. Chile Central Valley: warm, dry; high yields of fully ripe fruit every year; soft, medium-bodied, high-volume; altitude allows fresher styles. South Africa Stellenbosch: known for complex, age-worthy Bordeaux-variety reds; moderate to warm depending on altitude and sea breezes. Australia: blended with Cabernet, e.g. Margaret River. NZ: most Merlot comes from Hawke's Bay (North Island); moderate, plentiful rainfall; more widely grown there than Cabernet; single-varietal or blended with Cabernet; light to full-bodied."},"L2-card-70":{"head":"CH 15: CABERNET SAUVIGNON - THE GRAPE","src":"L2 book p. 85-86","body":"- Black grape from south-west France; pronounced black fruit and herbaceous aromas, high tannins, high acidity.\n- Moderate and warm climates; in moderate climates struggles to ripen except in the warmest sites. THICK skins: high colour, flavour, tannin. Needs a long, warm season.\n- Single-varietal: deep colour, dry, high acid, high tannin, medium to full body; pronounced blackcurrant, black cherry; usually mint or green bell pepper. Warm climates: fruit can turn cooked.\n- Often blended (e.g. with Merlot) to soften tannin and acid - especially in cool vintages in moderate regions.\n- Newly fermented can taste very tannic; oak matured months or years: oxygen softens tannin; new oak adds smoke, vanilla, cloves, cedar.\n- Tannin and acid act as preservatives; best age many years: dried fruit, earth, forest floor."},"L2-card-71":{"head":"CH 15: CABERNET SAUVIGNON - REGIONS","src":"L2 book p. 86-89","body":"- Bordeaux Left Bank: gravel soils drain quickly after rain and hold heat into the evening, helping Cabernet ripen in a maritime climate. Haut-Médoc (incl. Margaux, Pauillac), Graves (incl. Pessac-Léognan). Weather varies a lot; in poor years more Merlot goes into the blend.\n- Languedoc-Roussillon: warm, reliable; Pays d'Oc IGP.\n- California: Napa Valley (warm, sunny, long season): Oakville and Rutherford (full body, ripe black fruit, high ripe tannins); Calistoga in the far north is warmer still, ripest. Warmer inland Sonoma similar. \"California\" = blends from across the state, much from hot Central Valley; oak via chips/staves.\n- Napa/Sonoma wines labelled Cabernet Sauvignon may contain small quantities of other grapes (p. 87)."},"L2-card-72":{"head":"CH 15: CABERNET SAUVIGNON - REGIONS","src":"L2 book p. 86-89","body":"- Chile: most planted variety. Maipo and Colchagua Valleys within Central Valley, Andes to Coastal Ranges. Foothill wines: mint and green bell pepper with black fruit.\n- South Africa Stellenbosch: mountainous, moderate to warm by altitude; fresh herbal to full-bodied cooked fruit. Cape Blend with Pinotage.\n- Australia: Margaret River (warm, coastal breezes, winter rain; sometimes blended with Merlot; ripe black fruit, subtle oak); Coonawarra (cloud cover and cool southern breezes; mint, pronounced blackcurrant, smoke, cedar; ages long).\n- NZ Hawke's Bay: needs the warmest sites; blended with Merlot; red and black fruit, green bell pepper.\n- Chile: single-varietal or blended with Merlot and Carmenère; flatter, more fertile valley-floor sites too (p. 88).\n- Food can sometimes help soften Cabernet's high tannin and acidity. Gentler, low-extraction winemaking gives wines to enjoy younger; Chile is having success with this style (p. 89)."},"L2-card-73":{"head":"CH 16: SYRAH/SHIRAZ","src":"L2 book p. 90-93","body":"- Same black grape: Syrah (France), Shiraz (Australia). Thick-skinned, small grapes; needs moderate to warm climate; medium to high tannin and acidity.\n- Moderate climate (Northern Rhône style, \"Syrah\"): medium body, fresh black cherry, blackberry, herbal notes, black pepper. Warm climate (Australian style, \"Shiraz\"): full body, high alcohol, cooked black fruit, liquorice. Outside France and Australia the name used hints at style.\n- Adds colour, black fruit, tannin to blends, often with Grenache (\"Rhône Blends\"). Oak common (softens tannin; smoke, spice). Best age a decade or more: dried fruit, leather, meat, earth."},"L2-card-74":{"head":"CH 16: SYRAH/SHIRAZ","src":"L2 book p. 90-93","body":"- Northern Rhône: only black grape permitted in AOC wines; narrow valley, steep slopes, moderate climate, aspect aids ripening; hand-worked, expensive. Côte Rôtie: far north, northern limit for ripening Syrah; exceptionally steep, stony slopes -> complex, peppery, long-lived; some (not all) co-ferment a little Viognier (floral). Hermitage: one steep south-facing hill. Crozes-Hermitage: larger, flatter, surrounds Hermitage; less intense, cheaper (higher yields, mechanisation).\n- Languedoc-Roussillon: ripens reliably; blends (e.g. Minervois AOC) or Pays d'Oc IGP."},"L2-card-74b":{"head":"CH 16: SYRAH/SHIRAZ","src":"L2 book p. 90-93","body":"- Australia: most planted grape. South Eastern Australia (warm inland, high volume). Barossa Valley (warm): some of the world's oldest Shiraz vines, low yields, full body, high ripe tannins, cooked black fruit, black pepper, often vanilla/coconut oak. Hunter Valley: very hot summers (relatively northerly latitude) but cloud cover and sea breezes slow ripening; medium body, fresh black fruit; ages to earth, meat.\n- Australia has by far the largest Shiraz plantings outside France. Most often single-varietal; also commonly blended with Cabernet Sauvignon and Grenache; some sparkling red Shiraz (p. 92-93)."},"L2-card-75":{"head":"CH 17: GAMAY AND BEAUJOLAIS","src":"L2 book p. 94-95","body":"- Black grape; wines almost exclusively from one region, Beaujolais (moderate climate, directly south of Burgundy).\n- High acidity, low to medium tannins, red fruit (raspberry, red cherry, red plum). Usually inert vessels; rarely shows oak.\n- Winemakers use techniques that maximise colour and minimise tannin; these can create banana and candy aromas.\n- Beaujolais wines: light to medium body, low to medium tannin, red fruit. Sometimes served lightly chilled. Most for immediate drinking; lose fresh fruit quickly.\n- Hierarchy: Beaujolais AOC (flat, fertile south; high yields; lightest, simplest) -> Beaujolais Villages AOC (northern villages; slopes give more sun exposure, warm well-drained soils; more intensity and body) -> 10 crus with own appellations, all within the Beaujolais Villages area, e.g. Fleurie AOC (most concentrated and structured; medium to pronounced red fruit, medium to long finish; some can develop in bottle)."},"L2-card-76":{"head":"CH 18: GRENACHE/GARNACHA","src":"L2 book p. 96-98","body":"- Black grape, probably evolved in Spain (Garnacha); \"Grenache\" in France and most of the world. Needs a warm climate. Ripe grapes: high sugar, low acidity. Thin-skinned: low to medium tannin; red fruit (strawberry, red plum, red cherry), sometimes white pepper, liquorice. Finest from controlled yields.\n- Much used for short-maceration rosé (dry to medium; drink chilled and young).\n- Often blended with Syrah (France) or Tempranillo (Spain), which add colour, acid, tannin. Simple versions unoaked; best often barrel-matured, some prefer old oak over new, to protect Grenache's delicate red fruit. Ages to earth, meat, dried fruit."},"L2-card-77":{"head":"CH 18: GRENACHE/GARNACHA","src":"L2 book p. 96-98","body":"- Southern Rhône: valley flattens, warm southerly climate; blends with local grapes incl. Syrah. Côtes du Rhône (simple, medium body, red fruit, white pepper) -> Côtes du Rhône Villages -> Châteauneuf-du-Pape (full body, high alcohol; large round stones absorb heat by day and radiate it at night).\n- Languedoc-Roussillon: Grenache important for south-of-France reds and rosés; Minervois AOC is one of the most important red AOCs (Grenache with Syrah etc.). Provence (east of Languedoc-Roussillon; Grenache often key in its rosé blends): dry, pale rosé, mostly Côtes de Provence AOC.\n- Spain: Rioja DOCa and Navarra DO (body, red fruit; Navarra rosé too); Priorat DOCa in Catalunya (warm, dry; very old vines, tiny yields; most powerful; typically blended with other black grapes; can mature for long periods; dried fruit, caramel with age)."},"L2-card-77b":{"head":"CH 18: GRENACHE/GARNACHA","src":"L2 book p. 96-98","body":"- Australia: Barossa Valley and McLaren Vale; very old vines give concentrated red fruit, spice, long ageing; Shiraz blends can resemble Châteauneuf-du-Pape in style and quality.\n- Best Châteauneuf-du-Pape develops dried fruit, earth and meat with bottle age (p. 97)."},"L2-card-78":{"head":"CH 19: TEMPRANILLO","src":"L2 book p. 99-100","body":"- Spain's most prized black grape. Medium to full body, medium acid, medium tannin; red fruit (strawberry, red cherry) and black fruit (blackberry, black plum).\n- Simple to complex age-worthy; other grapes sometimes added for acid and tannin in long-ageing wines.\n- Traditional: small new-oak barrels (vanilla, smoke, cedar; softens tannin); best often bottle-aged before release. Very good/outstanding develop mushroom, leather, dried fruit.\n- Catalunya DO: broad region, high volumes of Tempranillo and blends; simple to powerful oak-aged.\n- Rioja DOCa (north-east Spain, moderate): usually a blend, Tempranillo dominant in the best; Garnacha for early-drinking wines; other local grapes for tannin and acid in long-ageing wines.\n- Crianza, Reserva, Gran Reserva are national Spanish ageing terms, not just Rioja.\n- Ribera del Duero DO: high-altitude, further inland; warm days and cool nights -> very full-bodied with fresh black fruit."},"L2-card-79":{"head":"CH 20: CARMENÈRE, MALBEC, PINOTAGE","src":"L2 book p. 101-102","body":"- Each a \"regional speciality\" tied to one country: Carmenère - Chile; Malbec - Argentina; Pinotage - South Africa.\n- Carmenère: native to Bordeaux, now rare there; needs a long sunny season; struggles except in the warmest, sunniest Central Valley sites. Unripe: pungent green bell pepper, tomato leaf. Ripe: fresh blackberry. Deep colour, medium to high acid, high tannin, full body; oak softens tannins (coffee, chocolate). Ages to leather, earth. Widely grown in Chile. More commonly blended (Cabernet Sauvignon, Merlot) than single-varietal."},"L2-card-80":{"head":"CH 20: CARMENÈRE, MALBEC, PINOTAGE","src":"L2 book p. 101-102","body":"- Malbec: Argentina's most important black grape; native to south-west France; most plantings in high-altitude Mendoza. Deep colour, full body, high tannin, blackberry, black plum; new oak softness and clove, vanilla; ages to dried fruit, meat. Varietal or blended with Cabernet/Merlot.\n- Pinotage: developed for South Africa's warm, dry climate; closely related to Pinot Noir; red fruit (strawberry, raspberry, red cherry). Medium tannin, high acidity. Fruity medium-bodied to full-bodied (red plum, blackberry). With oak: pronounced coffee, chocolate, smoke. Grown throughout Western Cape. Blends with Cabernet and Merlot = Cape Blends."},"L2-card-81":{"head":"CH 21: CORTESE, GARGANEGA, VERDICCHIO, FIANO","src":"L2 book p. 103-104","body":"- Cortese: dry, light body, high acid; blossom, apple, pear, lemon. Gavi DOCG (Piemonte, north-west Italy); inert vessels, no oak; most ready on release, not for ageing.\n- Garganega: dry, medium body, high acid; apple, pear, lemon, peach. Veneto (north-east); Soave DOC and Soave DOC Classico; inert vessels, no oak. Most Soave drunk young; best Classico gains honey, almonds. Recioto di Soave DOCG = sweet white from grapes dried by appassimento.\n- Verdicchio: dry, high acid, medium body; apple, pear, lemon, fennel. Mostly simple, fruity; outstanding can develop honey, nuts. Central Italy, especially Marche (east coast); Verdicchio dei Castelli di Jesi DOC.\n- Fiano: medium acid, medium to full body; peach, melon, mango. Mostly inert vessels; some lees (bread, biscuit) or oak (smoke). Usually drunk young; best develop honey. Southern Italy; Fiano di Avellino DOCG in mountainous Campania."},"L2-card-82":{"head":"CH 22: NEBBIOLO, BARBERA, CORVINA","src":"L2 book p. 105-107","body":"- Northern Italy: Alps foothills and river plains; mountains protect from the north; generally moderate.\n- Nebbiolo: high acid, high tannin; red cherry, red plum, dried herbs, sometimes rose, violet. Long oak (old or new) to soften tannin; improves with age: mushroom, tobacco, leather. Barolo DOCG (Piemonte, north-west Italy; perhaps Piemonte's most famous wine; only Nebbiolo; horseshoe-shaped valley, steep south-facing slopes; full body, pronounced, high tannin and acid, long-lived). Barbaresco DOCG (smaller, north-east of Barolo; similarly powerful).\n- Barbera: high acid, low to medium tannin; red cherry, red plum, sometimes black pepper; many unoaked and fruity, some oak-matured for complexity. Piemonte; Barbera d'Asti DOCG (seen by many as Barbera's highest quality). Drinkable younger than Nebbiolo; shorter ageing potential."},"L2-card-83":{"head":"CH 22: NEBBIOLO, BARBERA, CORVINA","src":"L2 book p. 105-107","body":"- Corvina: low to medium tannin, high acid, red cherry, red plum. Valpolicella (Veneto): Valpolicella DOC (light, fruity, simple; rarely new oak; drink young); Valpolicella DOC Classico (hillier heartland; more body, complexity).\n- Appassimento: pick and dry grapes indoors to concentrate sugar, acid, tannin, flavour. Amarone della Valpolicella DOCG: dry to off-dry, full body, high alcohol (~15%), high tannin, red cherry plus prune, raisin, fig; can age. Recioto della Valpolicella DOCG: sweet red; yeast can't ferment all the sugar.\n- Corvina: most important Valpolicella grape; typically dominates the blend, other local grapes permitted (p. 106)."},"L2-card-84":{"head":"CH 23: SANGIOVESE AND MONTEPULCIANO","src":"L2 book p. 108-109","body":"- Central Italy's two key black grapes; warm climate; Apennines divide Tuscany (Sangiovese) from Abruzzo (Montepulciano).\n- Sangiovese: dry, high tannin, high acid; red cherry, red plum, dried herbs. Dominant in Chianti (central Tuscany), often with small amounts of other black grapes.\n- Chianti DOCG: wide area in the Apennine foothills; varied quality; many simple, inexpensive, not for ageing.\n- Chianti Classico DOCG: higher altitude, long ripening season; medium body, pronounced red fruit, dried herbs; often oak (cloves, cedar); best develop meat, leather.\n- Chianti Classico DOCG Riserva: stricter ageing requirements; may show some tertiary character on release."},"L2-card-85":{"head":"CH 23: SANGIOVESE AND MONTEPULCIANO","src":"L2 book p. 108-109","body":"- Brunello di Montalcino DOCG: warm, sunny southern Tuscany; powerful, full body, very high tannin and acid; must mature in oak for an extended period before release; very long-lived. Brunello = local name for Sangiovese.\n- Montepulciano: deep colour, medium acid, high tannin, black plum, black cherry. Montepulciano d'Abruzzo DOC (east-central Italy); high volumes, mostly simple and fruity; more concentrated ones get short oak.\n- Wider context (not from the L2 book): Montepulciano the grape is unrelated to the Tuscan town of Montepulciano, whose wines are Sangiovese-based."},"L2-card-86":{"head":"CH 24: SPARKLING - PRINCIPLES AND TRADITIONAL METHOD","src":"L2 book p. 111-113","body":"- Bubbles = dissolved CO2. Can be pumped in, but most premium producers use CO2 from a second fermentation in a sealed vessel (bottle or tank).\n- Base wine: typically dry, high acid, low alcohol; usually a blend (vintages, varieties, vineyards).\n- Second fermentation: add sugar and yeast; adds about 1.5% abv."},"L2-card-87":{"head":"CH 24: SPARKLING - PRINCIPLES AND TRADITIONAL METHOD","src":"L2 book p. 111-113","body":"- Traditional method (e.g. Champagne, Cava): bottle sealed with crown cap -> second fermentation in bottle -> lees (must be removed or the wine is hazy) -> yeast autolysis (biscuit, bread; longer on lees = more intense) -> riddling (bottle moved slowly from horizontal to inverted; traditionally by hand, now mostly automated by gyropalette, a machine moving hundreds of bottles at once) -> disgorgement (neck frozen, ice plug of lees ejected) -> dosage (liqueur d'expédition: wine plus usually sugar; sets final sweetness) -> resealed with thick cork and wire cage."},"L2-card-88":{"head":"CH 24: SPARKLING - PRINCIPLES AND TRADITIONAL METHOD","src":"L2 book p. 111-113","body":"- Brut: very small amount of sugar but tastes dry (high acid, lively bubbles). Demi-Sec: medium sweetness.\n- Champagne AOC: northern France; cool climate gives low-alcohol, high-acid base. Chardonnay, Pinot Noir, Meunier. Most non-vintage (blends of vintages for consistency). Legal minimum 12 months on lees for the cheapest (apple, light autolytic). Very good: apple, lemon, toasted bread, biscuit. Vintage Champagne: exceptional years; long on lees plus bottle age; nuts and honey; small quantities, very high prices.\n- 'Dosage' also means the amount of sugar added. Most traditional-method wines are labelled Brut. Better Champagnes: riper grapes, longer on lees (p. 113)."},"L2-card-89":{"head":"CH 24: SPARKLING - CAVA, NEW WORLD, TANK METHOD","src":"L2 book p. 114-115","body":"- Cava: Spanish term for traditional-method sparkling from certain regions; vast majority from Catalunya. Mainly local Spanish grapes; Chardonnay and Pinot Noir also permitted (add fruit flavour and acidity). Warm climate -> grapes may be picked early to keep acid; base wine light apple and lemon. Shorter on lees than Champagne -> very subtle autolytic character. Big brands dominate; some smaller producers age long on lees.\n- South Africa, USA, Australia, NZ: best from coolest regions; often Chardonnay and Pinot Noir; slightly riper fruit than Champagne (extra sunlight and warmth); best are intense, complex, long finish. Cap Classique = South African traditional method (Champagne grapes or e.g. Chenin Blanc)."},"L2-card-90":{"head":"CH 24: SPARKLING - CAVA, NEW WORLD, TANK METHOD","src":"L2 book p. 114-115","body":"- Tank method (dry): base wine, sugar, yeast in sealed tank; lees removed by filtration; bottled under pressure. No autolytic character; tastes of the base wine; good for aromatic grapes; cheaper, less labour.\n- Asti method (sweet): starts from juice not base wine; CO2 escapes at first, then tank sealed; stopped by filtering out yeast -> low alcohol, sweet, sparkling.\n- Prosecco DOC: north-east Italy; typically tank method; Glera (pear, melon, blossom); light to medium body; dry or off-dry; white and rosé (rosé mainly Glera with a little Pinot Noir).\n- Asti DOCG: Piemonte; Moscato; sweet, fruity, light body; blossom, grape, peach, pear; usually fully sparkling.\n- Champagne and Cava don't have to state PDO status on the label.\n- Trend: fully or lightly sparkling Moscato made worldwide; typically sweet, low alcohol, Asti method (p. 115)."},"L2-card-91":{"head":"CH 25: SHERRY","src":"L2 book p. 116-118","body":"- Fortified wine from around Jerez de la Frontera, southern Spain. Almost all start as a simple dry base wine from Palomino (white). Fortified after fermentation, then aged in the solera: old-oak casks of different ages, continually blended -> consistent, complex style.\n- Fino: biological ageing under flor (thick layer of yeast that protects from oxygen). Fortified to about 15%. Pale lemon; apple, almond, pronounced bread dough from flor. Loses freshness fast after bottling; drink early, serve chilled.\n- Fortification was traditionally used to protect wine from spoilage. All Port is sweet (fortification interrupts fermentation); most Sherry is dry, but some is sweetened later (p. 116).\n- Three key dry Sherry styles (Fino, Oloroso, Amontillado) differ mainly through ageing period and conditions in the solera (p. 116)."},"L2-card-92":{"head":"CH 25: SHERRY","src":"L2 book p. 116-118","body":"- Oloroso: no flor; fortified to about 17% (flor can't survive) -> oxidative ageing. Turns brown; raisin, prune, walnut, caramel.\n- Amontillado: under flor for a time, then refortified to about 17% (kills flor) -> oxidative ageing. Deeper than Fino; bread dough plus walnut, caramel.\n- Sweetened: Pale Cream = sweetened Fino; Medium and Cream = often sweetened Amontillado or Oloroso.\n- PX (Pedro Ximénez): white PX grapes sun-dried; fortified, aged oxidatively; deep brown, sweet, fig, prune, raisin, liquorice, molasses. Often the sweetener in Cream Sherry.\n- Dry Sherries can be sweetened, but must then carry a different or supplementary label term (p. 118)."},"L2-card-93":{"head":"CH 25: PORT","src":"L2 book p. 118-119","body":"- Sweet fortified wine from grapes grown in the Upper Douro, Portugal; blend of local black grapes; most Ports blend several vintages.\n- Process: rapid extraction of colour and tannin (traditionally foot treading, now also machines) -> fermentation interrupted by adding grape spirit (kills yeast) -> sweet, high alcohol -> matured, then blended and bottled.\n- Ruby styles: deep colour, fruity; aged in large vessels (old-oak casks or steel) then bottled ready to drink; cooked black cherry, blackberry."},"L2-card-94":{"head":"CH 25: PORT","src":"L2 book p. 118-119","body":"- Ruby: sweet, simple, fruity, lower tannin, some red fruit. Reserve Ruby: better wines, more intensity, sometimes longer maturation to soften and integrate the spirit. LBV: like Reserve Ruby but from a single vintage.\n- Vintage Port: best wines of a single exceptional vintage; high tannin, very concentrated; matures in bottle 20+ years: ruby to garnet, dried fruit, leather, forest floor; thick deposit, must be decanted. Only \"declared\" in the best years.\n- Tawny styles: best get colour from long oxidative ageing in small barrels; increasingly brown; dried fruit, walnut, coffee, caramel; age indications 10, 20, 30, 40 years. Inexpensive \"Tawny Port\": simple, fruity, low tannin, pale."},"L3-stretch-01":{"head":"L2 CH 1 STRETCH: L3 TASTING SCALES","src":"L3 book p. 2-10","body":"- L3 adds medium(-) and medium(+) to most scales: acidity, tannin, body, intensity, finish = five points (low/light/short, medium(-), medium, medium(+), high/full/pronounced/long).\n- Not five equal parts: (-)/(+) are the ends of medium.\n- L3 adds a Development line on the nose: youthful -> developing -> fully developed -> tired/past its best.\n- L3 adds readiness for drinking: too young; can drink now but has potential for ageing; drink now, not suitable for ageing or further ageing; too old.\n- L3 sweetness: dry, off-dry, medium-dry, medium-sweet, sweet, luscious. L3 rosé colours: pink, salmon, orange.\n- EXAM NOTE: for the L2 exam use the L2 scales (three points; rosé \"pink-orange\"; sweetness dry, off-dry, medium, sweet)."},"L3-stretch-02":{"head":"L2 CH 1 STRETCH: DEVELOPMENT AND READINESS","src":"L3 book p. 6-10","body":"- Youthful = mainly primary/secondary (oak may still stand apart). Developing = mostly primary/secondary with some tertiary. Fully developed = tertiary predominate. Tired = attractive aromas fade, unpleasant ones appear.\n- Some wines are not \"youthful\" even on release: Rioja Reserva is \"developing\"; age-indicated Tawny Port and all Sherries are \"fully developed\".\n- Almost all rosés, most inexpensive whites and many inexpensive reds go from youthful to tired, sometimes within months.\n- Why some wines age: they need a firm structure of acid or tannin AND enough flavour concentration. With age, aromas move from primary to tertiary and tannins soften; alcohol does not change; acid and sugar change very little (sweet wines very slowly taste drier).\n- Trap: dried or cooked fruit can be primary, not tertiary, in young wines from dried grapes or hot climates."},"L3-stretch-03":{"head":"L2 CH 2 STRETCH: FOOD AND WINE IN MORE DEPTH","src":"L3 book p. 11-12","body":"- Sweetness in food increases perceived bitterness, astringency, acidity and alcohol burn; decreases body, sweetness, fruitiness.\n- Umami does the same. Why some foods are \"hard\" with wine: high umami but little salt (asparagus, eggs, mushrooms, ripe soft cheese). Cured or smoked meats and seafood and hard cheese like Parmesan have umami AND salt, so are easier.\n- Bitterness in wine comes from tannin (grapes or oak). Balanced high-tannin reds cope with umami; low-tannin reds, or whites with oak or skin contact, can turn surprisingly bitter.\n- Acid in food increases body, sweetness, fruitiness in wine and lowers perceived acidity; but makes a low-acid wine taste flat and flabby.\n- Bitterness in food adds to bitterness in wine. Chilli increases bitterness, astringency, acidity, alcohol burn; decreases body, richness, sweetness, fruitiness."},"L3-stretch-03b":{"head":"L2 CH 2 STRETCH: FOOD AND WINE IN MORE DEPTH","src":"L3 book p. 12-13","body":"- Red with red meat: salt probably softens tannin more than protein does.\n- Red with oily fish tends to taste metallic.\n- High-risk wines: oaky, tannic, high acid and alcohol. Low-risk: simple, unoaked, a little sugar.\n- Chilli: avoid high alcohol.\n- Flavour matching only helps once the structural match works."},"L3-stretch-04":{"head":"L2 CH 3 STRETCH: STORAGE AND SERVICE DETAIL","src":"L3 book p. 15-16","body":"- Long-term storage: cool and constant, ideally 10-15°C. Kitchens are among the worst places (temperature swings). Long refrigeration hardens corks so the seal can fail; sparkling wines lose fizz. Keep away from vibration. Artificial light can cause unpleasant flavours.\n- Reds served too cold taste thin and harsh; warm gently in the room or by cupping the glass, never on a radiator. Above about 18°C reds lose freshness and taste muddled.\n- Decanting removes deposit; some young wines also benefit from aeration (swirling in the glass does this too). Opening a bottle early to \"breathe\" does nothing - too little wine touches the air.\n- EXAM NOTE: the 2016 L3 table gives light-bodied reds as \"lightly chilled 13°C\". For L2 answer \"room temperature or lightly chilled, 13-18°C\" (L2 book p. 21)."},"L3-stretch-05":{"head":"L2 CH 3 STRETCH: MORE WINE FAULTS","src":"L3 book p. 4","body":"- L2 faults: cork taint (TCA), failure of closure (oxidation), heat damage. L3 adds:\n- Reduction: a \"stinky\" character - rotten eggs, boiled cabbage or onions, blocked drains. Very low levels can add complexity; some dissipates once the bottle is open.\n- Sulfur dioxide: added to almost all wines, highest in sweet whites; very high levels smell of struck matches; lower levels can mask fruit; too little risks oxidation.\n- Out of condition: dull and stale from age or bad storage (too hot, bright, variable).\n- Volatile acidity (VA): low levels add lift; high levels smell of vinegar or nail polish remover.\n- Brettanomyces (\"Brett\"): a yeast giving sticking plaster, hot vinyl, smoked meat, leather, sweaty horse aromas; some drinkers enjoy low levels.\n- Oxidation: opposite of reduction, typically a failed closure; deeper, browner; toffee, honey, caramel, coffee; lacks fruit. Not a fault in deliberately oxidative styles."},"L3-stretch-06":{"head":"L2 CH 4 STRETCH: VINE SPECIES, CLONES, CROSSINGS","src":"L3 book p. 19-23","body":"- Vitis vinifera: the Eurasian species behind nearly all wine. American species are rarely used for wine (flavours widely considered unattractive) but resist phylloxera, so are used as rootstocks.\n- Clones: genetically the same variety, but mutations give variations; growers propagate the best (clonal selection). Some mutations are treated as new varieties: Pinot Blanc and Pinot Gris are mutations of Pinot Noir.\n- Crossing: two parents of the same species. Cabernet Sauvignon = Cabernet Franc x Sauvignon Blanc. Bred examples: Müller-Thurgau; PINOTAGE = Pinot Noir x Cinsault (links to L2 ch 20)."},"L3-stretch-07":{"head":"L2 CH 4 STRETCH: VINE SPECIES, CLONES, CROSSINGS","src":"L3 book p. 19-23","body":"- Hybrid: parents from two different species (usually one American); rarely used for wine (exception: Vidal in Canada) but central as rootstocks.\n- Phylloxera: North American insect feeding on vine roots; destroyed Europe's vineyards in the 19th century; no chemical cure. Solution: graft vinifera onto American or hybrid rootstock. A problem almost everywhere; exceptions include Chile, parts of Argentina and South Australia (strict quarantine).\n- Rootstocks also resist nematodes or drought, so are used even without phylloxera. Head grafting switches a vine's variety by the next vintage; replanting takes 3+ years to crop."},"L3-stretch-08":{"head":"L2 CH 4 STRETCH: HEAT, CONTINENTALITY, DIURNAL RANGE","src":"L3 book p. 24-26","body":"- Below about 10°C the vine does not grow (why it is dormant in winter). Heat in the growing season decides which grapes can ripen: Riesling thrives where Grenache cannot.\n- Ocean currents: Humboldt (Chile) and Benguela (South Africa) cool; Gulf Stream warms north-west Europe.\n- Dark or stony soils absorb and reradiate heat (vital in cool climates); wet soils warm slowly and can delay budburst.\n- Aspect matters most in cool climates; steep slopes multiply it (e.g. Mosel).\n- Altitude allows vines near the Equator (Cafayate). Long summer days far from the Equator help Riesling ripen in Germany; intense sun can sunburn grapes (bitter)."},"L3-stretch-09":{"head":"L2 CH 4 STRETCH: HEAT, CONTINENTALITY, DIURNAL RANGE","src":"L3 book p. 24-26","body":"- Continentality: gap between hottest and coldest months. Near seas/lakes = low; far inland = high. Sets the length of the growing season.\n- Diurnal range: day-night gap. Cool nights slow the loss of aroma and acidity -> fresher, more aromatic wines even in warm climates. Water and cloud cover reduce diurnal range; clear nights increase it.\n- CAUSAL CHAIN: high altitude -> cool nights -> slower loss of acid and aroma -> fresher wine (e.g. Ribera del Duero, Mendoza's Uco Valley - from the L3 regional chapters). Central Otago: inland and continental, with a large diurnal range."},"L3-stretch-10":{"head":"L2 CH 4 STRETCH: CLIMATE TYPES AND HAZARDS","src":"L3 book p. 26-31","body":"- L3 adds HOT climates (above 21°C average growing season) to cool, moderate, warm.\n- Continental: big seasonal swing, short summers, rapid autumn cool-down; spring frost risk (Chablis, Champagne); suits grapes that bud late (avoiding spring frost) and ripen early (before autumn cools). Continental summers are dry, so warm sites may need irrigation.\n- Maritime: low continentality, rain spread through the year; ripening continues late into autumn -> lets Bordeaux ripen thick-skinned Cabernet Sauvignon; but rain can harm flowering, fruit set and health."},"L3-stretch-11":{"head":"L2 CH 4 STRETCH: CLIMATE TYPES AND HAZARDS","src":"L3 book p. 26-31","body":"- Mediterranean: low continentality, warm dry summers (Mediterranean, coastal California, Chile, South Africa, SE Australia) -> fuller body, riper tannin, higher alcohol, lower acid; drought risk.\n- Spring frost protection: heaters, wind machines (draw down warmer air), sprinklers (freezing water releases heat), site choice (mid-slope; cold air sinks).\n- Winter below -20°C can kill vines (graft most at risk). No winter = no dormancy, shorter vine life.\n- Climate = average pattern over years; weather = this year's variation (Bordeaux varies a lot; Central Valley California barely).\n- Also: train vines high against frost; earth up grafts. Pre-harvest rain can split berries -> rot. Hail (Mendoza): netting or scattered sites. Extreme heat stops the vine."},"L3-stretch-12":{"head":"L2 CH 4 STRETCH: WATER AND THE CANOPY","src":"L3 book p. 27, 31-35","body":"- Once the canopy is big enough, mild water shortage helps: the vine keeps photosynthesising but puts energy into ripening grapes, not shoots, and the canopy stays small (less shade).\n- Too much water: shoots keep growing in the ripening season, using sugar and shading grapes; waterlogging can kill roots.\n- Irrigation: drip (most precise, expensive), sprinklers (cheaper, wasteful, raise disease risk, can protect from frost), flood (cheap, flat land only). Irrigation is legal only where local law allows; some bans exempt young vines (2016 edition, may have changed).\n- Soil: clay and humus hold water (excess clay -> waterlogging); sand and stones drain; loam balances both. Ideal = good water early, mild stress after véraison. Excess nutrients -> vigour, shade; lack -> chlorosis."},"L3-stretch-13":{"head":"L2 CH 4 STRETCH: WATER AND THE CANOPY","src":"L3 book p. 27, 31-35","body":"- Canopy management: open canopy maximises sunlight and airflow (vital in cool or wet regions against fungal disease); shade protects grapes from sunburn in intense sun. Vertical Shoot Positioning (VSP) is most common. Hot sites may let VSP shoot tops flop over for shade.\n- Bush vines (untrellised, typically head-trained, spur-pruned) suit warm, dry, sunny regions like the Southern Rhône and Barossa; shade protects grapes. Beaujolais ties the shoots together (\"gobelet\").\n- Yields: green harvesting removes immature bunches shortly after véraison; mistimed, the vine swells the remaining berries, restoring yield and diluting flavour. L3 says it is very hard to make a solid link between low yields and quality. EXAM NOTE: for L2, too-high yields can dilute flavour."},"L3-stretch-14":{"head":"L2 CH 5 STRETCH: SO2, OAK AND MLF","src":"L3 book p. 43-48","body":"- Sulfur dioxide: antioxidant and antiseptic. Once it reacts it becomes \"bound\" and stops protecting, so levels are monitored and topped up. Fermentation yeast tolerate levels that kill spoilage yeasts and bacteria. Too much makes wine harsh and less fruity.\n- Oak gives tannin (structure, texture) and flavour (toast, vanilla, smoke, cloves) and allows slow oxidation. Hygiene is hard; tainted wood can ruin wine.\n- Four oak factors: species/origin (European or American); size (barrique 225 L, pièce 228 L, large vessels over 2,000 L - smaller = bigger effect); toast level; age (by about the fourth use little flavour or tannin).\n- EXAM NOTE: L2 says two or three uses - use that."},"L3-stretch-15":{"head":"L2 CH 5 STRETCH: SO2, OAK AND MLF","src":"L3 book p. 43-48","body":"- Chips and staves give flavour cheaply; adding small controlled amounts of oxygen can mimic barrel oxidation; premium wines are not normally made this way.\n- MLF (L2 says 'malolactic conversion' - use that in the exam): lactic acid bacteria turn tart malic acid (apples) into softer lactic acid (milk); lowers acid, adds butter, releases CO2. Encouraged by warmth and no SO2; blocked by cool storage, SO2 or filtration. Standard in reds; a style choice in whites.\n- Gross lees settle in hours and can cause off-aromas; fine lees settle slowly; sometimes kept with white wines for texture and flavour."},"L3-stretch-16":{"head":"L2 CH 5 STRETCH: WHITE AND SWEET WINEMAKING","src":"L3 book p. 55-58","body":"- White juice usually spends little time on skins to limit oxidation; whole-bunch pressing is gentler and can give more purity. Some aromatic grapes get a few hours' cold skin contact for flavour and texture.\n- Juice is clarified before fermentation; leaving some solids adds complexity and texture but risks off-flavours.\n- White ferments best at 12-22°C: too cold gives pear-drop aromas and loses varietal fruit; warmer gives complex non-fruit aromas but loses varietal fruit. Barrel ferments run at the warmer end.\n- Aromatic (Sauvignon Blanc, Riesling): keep primary fruit - inert vessels (old foudres in Alsace), cool ferment, MLF blocked with SO2, bottle early. Non-aromatic (Chardonnay): may build character - some solids, new barriques, MLF (almost all premium white Burgundy, Chablis too), lees stirring. Cheap whites: clarified juice, cultured yeast, acid often added, sterile filtered."},"L3-stretch-17":{"head":"L2 CH 5 STRETCH: WHITE AND SWEET WINEMAKING","src":"L3 book p. 55-58","body":"- Stopping fermentation: fortification (Port), or a high dose of SO2 or chilling plus filtration (high-quality German Kabinett and Spätlese, Asti) -> typically low alcohol.\n- Süssreserve: unfermented grape juice added to dry wine (Germany). Rectified concentrated grape must (RCGM) used for cheap wines.\n- Noble rot (Botrytis cinerea) - same fungus as grey rot. Needs fully ripe grapes first, then misty humid mornings and sunny dry afternoons. Adds its own honey, apricot, citrus zest flavours. Used for Sauternes, Tokaji, BA and TBA.\n- WHY concentrated-grape sweet wines are low in alcohol: yeast struggle in very sugary must, sometimes stopping at 7% abv (TBA).\n- Noble rot: patchy, so several hand pickings; not every vintage.\n- Passerillage = drying on the vine; passito = drying after picking (Recioto)."},"L3-stretch-18":{"head":"L2 CH 5 STRETCH: RED AND ROSÉ WINEMAKING","src":"L3 book p. 63-67","body":"- Carbonic maceration: whole uncrushed bunches in a vat filled with CO2 -> fermentation inside each berry (intracellular). At about 2% alcohol skins split; grapes pressed; yeast finish off the skins. Extracts colour but little tannin; soft, fruity wines with kirsch, banana, bubble gum, cinnamon. Carbonic or semi-carbonic maceration is widely used on basic Beaujolais (and cheap Grenache) - likely behind L2's 'banana and candy'.\n- Semi-carbonic: whole bunches, no added CO2; bottom grapes crushed, their fermentation makes the CO2.\n- Whole bunches with crushed fruit: silkier texture, fresher fruit; stems must be ripe or they add bitter tannin. Some notable premium Pinot Noirs use semi-carbonic or whole-bunch techniques.\n- Rosé methods: direct pressing (often the palest), short maceration, blending red and white (L3: EU ban except rosé Champagne - 2016 edition, may have changed; L2 exam: 'not permitted in many parts of Europe')."},"L3-stretch-19":{"head":"L2 CH 6 STRETCH: BURGUNDY - WHY","src":"L3 book p. 85-86","body":"- Climate: cool continental around Chablis, moderate continental further south. Rain can disrupt flowering and harvest; Pinot Noir is particularly prone to grey rot; spring frosts (Chablis, as late as May) and summer hail are hazards.\n- WHY slopes matter: village vineyards tend to sit on flat land or slope bottoms; premier and grand crus are often mid-slope, less prone to frost, facing south or east, sheltered from westerly winds. Hillside soils are shallower and better drained; flat-land soils deeper and more fertile.\n- Many small geological faults mean soils change over short distances, often linked to subtle style differences (soil's exact role much debated).\n- Classic Pinot Noir: red fruit young -> earth, game, mushroom with age. Whole bunches increasingly used. Best wines usually 16-18 months in barrel, some new oak.\n- EXAM NOTE: L2 says best sites face south or south-east; some village vineyards are on good slopes."},"L3-stretch-20":{"head":"L2 CH 6/10 STRETCH: CALIFORNIA AND OREGON - WHY","src":"L3 book p. 143-148","body":"- California: latitude matters less than the very cold California Ocean Current. Coastal mountains block it, but where gaps let it in, cold air and fog are drawn inland in the evening; fog burning off late extends cooling into the day. Valleys in Monterey and Santa Barbara Counties act as funnels for cold air.\n- Where there's no ocean influence (Central Valley) the climate is hot.\n- Little rain in the ripening season -> drip irrigation; long \"hang time\" gives very ripe grapes, concentrated flavour, high sugar; now many pick slightly earlier for freshness.\n- Napa Valley: about 50 km long, 5 km wide, between the Mayacamas and Vaca Mountains; most expensive vineyard land; several cooling influences give varied styles.\n- Oregon Willamette Valley: west of the Cascades; moderate, Pacific breezes, dry growing season, long sunny days, cool nights; Pinot Noir by far most planted: ripe red fruit, cinnamon spice, high acidity."},"L3-stretch-21":{"head":"L2 CH 6/10/11 STRETCH: NEW ZEALAND - WHY","src":"L3 book p. 170-172","body":"- Isolated in the Pacific -> maritime overall. South Island cool, North Island a little warmer.\n- CAUSAL CHAIN: long sunshine hours + nights cooled by sea breezes + long ripening period -> high sugar and flavour ripeness while keeping acidity.\n- South Island vineyards mostly on the east side, sheltered from rain-bearing westerlies by mountains.\n- Marlborough: the major centre; mostly Sauvignon Blanc. Wairau Valley (largest; side valleys give varied aspects) vs Awatere Valley (drier, cooler, windier -> higher acid, more herbaceous, less tropical).\n- Sauvignon Blanc: North Island more tropical; South higher acid, green pepper, gooseberry. Pinot Noir: second most planted; vibrant fruit, fine ripe tannins, often quite high alcohol."},"L3-stretch-22":{"head":"L2 CH 6/10/11 STRETCH: NEW ZEALAND - WHY","src":"L3 book p. 170-172","body":"- Hawke's Bay: warmest main area, longest sunshine. Gimblett Gravels: well-drained, heat-absorbing gravel -> reputation for black grapes (Merlot, Cabernet, Syrah).\n- Central Otago: inland, foothills of the Southern Alps; CONTINENTAL (unlike the rest of NZ); frost risk spring and autumn; large diurnal range; very intense sunlight -> often high alcohol.\n- Martinborough (southern North Island): global Pinot Noir name; wide diurnal range; ripe, dark plum, spice. Wairau's climate is similar.\n- Pinot: Marlborough medium-bodied, cherry, cranberry; Central Otago full, juicy.\n- Fertile flat land gives vigour, so NZ growers became canopy experts."},"L3-stretch-23":{"head":"L2 CH 8 STRETCH: GERMANY AND ALSACE - WHY","src":"L3 book p. 92-93, 108-110","body":"- Germany: mostly cool continental. Summers can be wet but rain usually falls off in autumn. CAUSAL CHAIN: long, cool ripening -> sugar ripeness while keeping acidity. Noble rot possible in every region when conditions allow; big vintage variation.\n- Best sites: steep, stony, south-facing slopes; worked by hand (winches on the steepest). Rivers reflect sunlight and moving air helps prevent frost. Long summer days at high latitude help Riesling ripen.\n- Regions: Mosel (very steep slate slopes by the river; lighter, lower alcohol, higher acid, floral/green fruit). Rheingau (south-facing north bank of the Rhine, Taunus hills shelter; mostly dry, medium-full, ripe peach). Pfalz (lee of the Haardt Mountains, continuation of the Vosges -> driest region; riper, fuller; mostly drier styles). Steep-slope vines head-pruned and individually staked for light and air."},"L3-stretch-24":{"head":"L2 CH 8 STRETCH: GERMANY AND ALSACE - WHY","src":"L3 book p. 92-93, 108-110","body":"- Classified by must weight (sugar in the juice), so pickers make several passes to pick grapes for each Prädikat.\n- Trend in Germany is towards dry wines, often sold simply as Qualitätswein.\n- Alsace: cool to moderate continental. Vosges create a rain shadow: sunny summers, dry autumns, high sugar ripeness; drought possible. Low disease pressure -> organic and biodynamic common. Best: steepest slopes, east/south-east. Sélection de grains nobles = a further sweet category based on sugar ripeness (L3 only; not on the L2 spec).\n- Grand cru: 50+ vineyards, normally one noble grape (Riesling, Muscat, Gewurztraminer, Pinot Gris). VT: noble grapes, minimum sugar, often passerillage; L3: dry to medium-sweet (L2: typically medium to sweet - L2 wins). MLF usually avoided. 2016 L3: no official sweetness labelling (L2: sweetness scale required from 2021 vintage - L2 wins)."},"L3-stretch-25":{"head":"L2 CH 8/9/16/18 STRETCH: AUSTRALIA - WHY","src":"L3 book p. 165-169","body":"- Australian Riesling (Eden, Clare): pronounced lime, lemon, grapefruit young, quickly developing toast, honey and petrol; unoaked, high acid, usually dry or slightly off-dry (some sweet). Eden Valley: hills east of Barossa, cool to moderate depending on altitude; steely; marmalade and toast after ten years.\n- Hunter Semillon: picked early (low sugar, high acid); minimal oxygen, inert vessels; light, almost neutral when bottled; develops honey and toast; best age 20+ years.\n- Barossa Semillon: traditionally fuller-bodied and softer; early-picked, unoaked, fresh versions increasingly made (p. 165-166).\n- Clare: warm, tempered by cool afternoon breezes, cold nights, 300-400 m (L2 calls Eden and Clare moderate - L2 wins). Hunter: hot, humid; cloud cover and sea breezes; harvest rain -> canopy management vs rot."},"L3-stretch-26":{"head":"L2 CH 8/9/16/18 STRETCH: AUSTRALIA - WHY","src":"L3 book p. 164-169","body":"- Barossa Valley: warm, dry; old bush vines; Shiraz full-bodied, soft tannin, ripe black fruit, sweet American oak; leather and spice with age. \"Barossa\" label = Barossa zone (Barossa Valley + Eden Valley).\n- Coonawarra: strip of red terra rossa soil over limestone; cold Antarctic currents -> moderate maritime; cloud cover; Cabernet with cassis and eucalyptus/menthol; ages very well.\n- Adelaide Hills: moderate; the benchmark for Australian Sauvignon Blanc (passion fruit, high acid).\n- South Eastern Australia: a \"super-zone\" allowing blending across most of Australia's regions.\n- Adelaide Hills: all vineyards above 400 m. McLaren Vale: ocean breezes; old-vine Shiraz and Grenache (Barossa too). Margaret River: warm maritime; Cabernet-Merlot, Chardonnay, Semillon-Sauvignon."},"L3-stretch-27":{"head":"L2 CH 9 STRETCH: LOIRE, SAUTERNES AND TOKAJ - WHY","src":"L3 book p. 79, 82, 95-96, 116-117","body":"- Loire: overall cool; Central Vineyards (Sancerre, Pouilly-Fumé) are inland and continental; the coast is maritime. Northern limit for its grapes -> big vintage variation; high rainfall -> fungal disease. Best sites: southerly, mid-slope, facing the river (heat and reflected light). Sancerre and Pouilly-Fumé: chalky, well-drained, stony soils; Pouilly-Fumé often said to be subtly smoky.\n- Sauternes CAUSAL CHAIN: Garonne + Ciron rivers -> misty autumns -> noble rot on fully ripe grapes; level varies by year; passerillage concentrates sugar when rot is scarce. Selective hand-picking. Barsac may use its own name or Sauternes."},"L3-stretch-28":{"head":"L2 CH 9 STRETCH: LOIRE, SAUTERNES AND TOKAJ - WHY","src":"L3 book p. 79, 95-96, 116-117","body":"- Sauternes: Sémillon chosen for its thin skin and affinity for noble rot; Sauvignon Blanc adds the acidity sweet wines need; Muscadelle a little grapey-floral. Best fermented and matured in new oak for up to three years.\n- Tokaj: moderate climate; best on south-facing hills; the Bodrog and Tisza rivers create the morning humidity for noble rot. Grapes: Furmint (most planted; late-ripening, high acid, botrytis-prone; apple young, nuts and honey with age), Hárslevelű (perfume), Sárga Muskotály (aromatics). Pickers select individual aszú (rotten) berries. Dry Furmint is a growing category.\n- Aszú: base wine from healthy grapes; aszú berries macerated in it 12-60 hours, pressed, oak-aged. 2013 rules (2016 edition, then awaiting EU approval; may have changed): min 120 g/L sugar, 18 months oak. Eszencia: free-run juice, min 450 g/L, usually under 5% abv."},"L3-stretch-29":{"head":"L2 CH 14/15 STRETCH: BORDEAUX - WHY","src":"L3 book p. 78-79","body":"- Moderate maritime, warmed by the Gulf Stream: long season, ripening into October, spring frost rarely a problem. But Atlantic rain and humidity disrupt flowering and fruit set, promote rot, dilute flavour -> vintage variation. Landes forest and dunes shelter it from storms.\n- WHY blends: grapes flower and ripen at different times, so one frost or shower won't ruin everything.\n- CAUSAL CHAIN Left Bank: stony gravel -> warmer vineyard -> only place Cabernet Sauvignon reliably ripens -> up to three-quarters of top Médoc blends.\n- CAUSAL CHAIN Right Bank: cooler clay soils -> Cabernet struggles -> Merlot (ripens on cooler soils) dominates Saint-Émilion and Pomerol.\n- Cabernet Franc: lighter, less tannic; herbaceous if unripe, fruity and floral when ripe; key in Saint-Émilion. Petit Verdot: ripens fully only in very hot years; small amounts for colour, tannin, spice.\n- Top reds: 225-litre barriques, sometimes 100% new. Second wines protect the grand vin."},"L3-stretch-30":{"head":"L2 CH 14/15 STRETCH: BORDEAUX CLASSIFICATIONS","src":"L3 book p. 79","body":"- Classifications rank estates (châteaux), not vineyards; a château name is more a brand. Mostly outside the appellation system - except Saint-Émilion.\n- 1855 Classification: Médoc reds in five ranks; top rank Lafite Rothschild, Latour, Margaux, Mouton Rothschild, plus Haut-Brion from Graves. Sauternes in three ranks, Château d'Yquem at the top. Listed châteaux = crus classés.\n- Cru Bourgeois: introduced later for other Médoc châteaux; (2016 edition) awarded per vintage, so wines are submitted yearly. May have changed since.\n- Graves: separate red and white lists, no ranking; all classed growths now within Pessac-Léognan.\n- Saint-Émilion: built into the appellations - Saint-Émilion Grand Cru AOC, within it Grand Cru Classé, then Premier Grand Cru Classé B and A; reclassified at least once every ten years (2016 edition; may have changed).\n- EXAM NOTE: L2 needs only Bordeaux, Bordeaux Supérieur, Cru Bourgeois, Grand Cru Classé."},"L3-stretch-31":{"head":"L2 CH 16/18 STRETCH: RHÔNE - WHY","src":"L3 book p. 99-104","body":"- Northern Rhône: narrow, steep valley; moderate continental, similar to Beaujolais; noticeably cooler than the south. Best sites steep, south-facing, often in side valleys sheltered from the cold north wind, the mistral. Vines on individual stakes.\n- CAUSAL CHAIN: latitude + mistral -> Syrah at its northern limit -> only the steepest south-facing slopes ripen it fully.\n- Co-fermenting white grapes (e.g. Viognier) can stabilise colour and add aroma; now rare in most crus, but Côte-Rôtie may add up to 20% Viognier (usually a few %). L2: a Côte-Rôtie tradition, not all producers - L2 wins.\n- Viognier: develops signature aromas only at very high sugar -> low acid, high alcohol.\n- Crus: Côte-Rôtie (most northerly; red only). Condrieu (100% Viognier). Hermitage (one steep south-facing hill; fullest reds). Crozes-Hermitage (largest; flat south = lighter, northern slopes = more concentrated). Cornas (warmest; 100% Syrah)."},"L3-stretch-32":{"head":"L2 CH 16/18 STRETCH: RHÔNE - WHY","src":"L3 book p. 99-104","body":"- Southern Rhône: flatter, Mediterranean (mild winters, warm dry summers, drought risk); mistral stronger -> windbreaks; Grenache bush-trained low for wind protection and soil warmth. Galets (stones) in Châteauneuf-du-Pape store heat.\n- Grenache dominates; can get baked and jammy in hot years. Syrah adds colour and tannin; Mourvèdre (at its northern limit) adds deep colour, high tannin, gamey notes; Cinsault for red fruit and rosé. Some blends use a dozen or more grapes.\n- Syrah trellised (wind damage). Côtes du Rhône: over half of output. Villages: stricter alcohol and yields, more Grenache/Syrah/Mourvèdre; a named village needs 100% from it. Châteauneuf-du-Pape: largest cru, 13 varieties, first AC. Gigondas, Vacqueyras similar. Tavel: rosé only."},"L3-stretch-33":{"head":"L2 CH 17 STRETCH: BEAUJOLAIS - WHY","src":"L3 book p. 90","body":"- Climate like the southern Mâconnais: suits early-budding, early-ripening Gamay.\n- CAUSAL CHAIN: Gamay can crop heavily -> best wines from GRANITE soils, low in nutrients -> lower yields -> more concentrated flavour. The north and west (Beaujolais Villages, crus) are granite hills; the south and east is an alluvial plain (Beaujolais AOC).\n- Gobelet: spur-pruned bush vines with shoots tied together vertically; more growers now use wires for mechanisation.\n- Basic Beaujolais and Beaujolais Nouveau: mostly carbonic and semi-carbonic maceration -> kirsch, banana, cinnamon. Nouveau released the third Thursday of November; only Beaujolais or Beaujolais Villages quality (never crus).\n- 39 villages may use Beaujolais Villages; 10 crus have their own appellations.\n- Crus: Moulin-à-Vent, Morgon often most structured, can age; Fleurie, Brouilly lighter, perfumed. Many crus use normal crushed-fruit fermentation; some oak-aged, often in large vats."},"L3-stretch-34":{"head":"L2 CH 18/19 STRETCH: SPAIN - WHY","src":"L3 book p. 131-138","body":"- Three zones: wet, moderate maritime north-west (Rías Baixas); warm Mediterranean east coast (Catalunya); hot continental Meseta Central plateau (cut off by mountains; freezing winters, very hot dry summers; altitude gives cool nights). Apart from the north-west, heat and lack of water are the main challenges; fungal disease is low. Low-density bush vines save water and shade fruit.\n- Rioja: Rioja Alavesa and Rioja Alta (west; 500-800 m; Atlantic-moderated, sheltered by the Cantabrian Mountains; Tempranillo does best) vs Rioja Baja (east; hotter, drier; Garnacha does best, adds body and alcohol). Graciano and Mazuelo support. Early-drinking reds may use semi-carbonic maceration.\n- CAUSAL CHAIN: Tempranillo thick skin, medium acid -> hot sites without big diurnal range lack acid -> best where sea or altitude moderate heat."},"L3-stretch-35":{"head":"L2 CH 18/19 STRETCH: SPAIN - WHY","src":"L3 book p. 131-138","body":"- Ribera del Duero: ringed by mountains, no maritime influence; some vineyards above 850 m -> cool nights keep acid and fresh fruit; Tempranillo dark and tannic.\n- Rías Baixas: damp Atlantic climate -> mildew and rot risk -> pergolas for airflow.\n- Priorat: low-yielding old vines -> intense, complex, full-bodied reds.\n- Ageing minimums for REDS (2016 edition; may have changed; some regions such as Rioja are stricter): Crianza 24 months total, 6 in barrel; Reserva 36, 12 in barrel; Gran Reserva 60, 18 in barrel. Gran Reserva only in exceptional vintages.\n- Priorat: llicorella slate reflects and keeps heat, deep enough to hold water; bush vines, steep slopes. Albariño: thick skin resists fungal disease. DOCa (2016 edition): only Rioja and Priorat."},"L3-stretch-36":{"head":"L2 CH 20 STRETCH: CHILE, ARGENTINA, SOUTH AFRICA - WHY","src":"L3 book p. 152-163","body":"- Chile: long and narrow between the Pacific, Coastal Range and Andes; Central Valley lies between the ranges. Warm Mediterranean; dry, sunny season -> reliable ripening, little disease; irrigation fills the rain gap. Humboldt Current and fog cool coastal valleys (Casablanca, San Antonio: Sauvignon Blanc, Chardonnay, Pinot Noir). Maipo is the classic heartland near Santiago, surrounded by mountains; Colchagua gives more intense black fruit and body. Optional label terms (from 2012) added to the DO: Costa, Entre Cordilleras, Andes (2016 edition; may have changed).\n- Second cooling: cold Andean air descends at night -> large diurnal range in the foothills (Maipo's best sites)."},"L3-stretch-37":{"head":"L2 CH 20 STRETCH: CHILE, ARGENTINA, SOUTH AFRICA - WHY","src":"L3 book p. 152-163","body":"- Argentina: irrigated desert oases near the Andes; most vineyards 600 m+ (2,000 m+ near Cafayate in Salta) -> cool sites close to the equator. Parral (pergola) shaded grapes from heat. Hail is a risk (netting). Dry climate -> little rot, much organic. Largest Malbec plantings in the world.\n- South Africa: 27-34°S \"should be hot\", but the cold Benguela Current plus the strong south-easterly \"Cape Doctor\" wind cool many areas. Stellenbosch: moderate to warm; False Bay winds funnelled by mountains. Constantia: constantly cooled by the Cape Doctor; Sauvignon Blanc; Vin de Constance (sweet Muscat). Elgin: altitude cooling; intense, fresh Sauvignon Blanc. Walker Bay (Hemel-en-Aarde): some of the best Chardonnay and Pinot Noir."},"L3-stretch-38":{"head":"L2 CH 21-23 STRETCH: ITALY - WHY","src":"L3 book p. 121-130","body":"- North: Alps shelter vineyards from rain; Po and lakes (e.g. Garda) moderate. Traditional pergola: high canopy shades grapes from sunburn and lets air flow (still used for high-acid sparkling grapes and drying grapes).\n- Piemonte: moderate continental, long cold winters; mountains give a rain shadow; summer storms, hail, fog. All Piemonte wines are DOC or DOCG (no IGT) (2016 edition; may have changed). Barolo: steep (300-500 m) south-facing slopes; Nebbiolo has high acid and tannin but LITTLE COLOUR; slow ripening gives sour cherry, herbs, dried flowers. Barolo needs 3 years' ageing before release, 18 months in oak (2016 edition; may have changed); ages to truffles, tar, leather. Gavi: altitude and sea breezes -> slow ripening keeps Cortese's acidity.\n- Barbaresco: lower (200-400 m) + river -> ripens earlier, fruitier, less perfumed; 2 years, 9 months oak (2016 edition)."},"L3-stretch-39":{"head":"L2 CH 21-23 STRETCH: ITALY - WHY","src":"L3 book p. 121-130","body":"- Veneto: Soave and Valpolicella hills have cool limestone, clay and volcanic soils -> slower ripening, more acid; the plain gives fruitier, lower-acid wines. Corvina: thin skin, moderate colour, low-medium tannin, high acid. The 2016 L3 book calls drying grapes the \"passito\" method (L2 uses \"appassimento\"). Ripasso: Valpolicella refermented on Amarone skins (L3 only).\n- Tuscany: Sangiovese is late ripening so needs warmth; altitude moderates heat. Chianti has seven sub-zones; Chianti Classico DOCG is its own DOCG, not a sub-zone. Campania: Aglianico (Taurasi) is the south's prestige black grape.\n- Amarone: grapes picked early, dried indoors, fermented in winter; dry/off-dry. Recioto: so sweet fermentation stops. Chianti Classico: higher -> more acid, more herbal."},"L3-stretch-40":{"head":"L2 CH 24 STRETCH: SPARKLING - WHY","src":"L3 book p. 173-183","body":"- Autolysis: dead yeast break down over months, releasing bread, biscuit, toast compounds; usually lasts 4-5 years (up to 10). Once complete, lees contact keeps the wine fresh for years.\n- Reserve wines (older wines kept back) add dried-fruit notes and keep house style consistent; some blend in oak-aged wine for texture and spice.\n- Transfer method: traditional method up to riddling, then bottles emptied into a pressurised tank, filtered and rebottled (avoids riddling and disgorgement).\n- Tank method suits strongly flavoured grapes (Muscat, Riesling) and fruity styles like Prosecco; cheaper and faster.\n- Asti: only ONE alcoholic fermentation; Muscat Blanc à Petits Grains; about 7% abv; no autolysis; doesn't improve with age."},"L3-stretch-41":{"head":"L2 CH 24 STRETCH: SPARKLING - WHY","src":"L3 book p. 173-183","body":"- Champagne: even in warm years sugar stays low and acid high -> ideal base. Chalk soils drain yet store water. Chardonnay (Côte des Blancs: light, high acid, floral, citrus); Pinot Noir (Montagne de Reims, Côte des Bar: body, backbone, red fruit); Meunier (Vallée de la Marne; buds late, avoids frost; fruity, for early drinking). Hand-picked; first pressing (cuvée) purest, later (taille).\n- Cava (2016 edition): minimum 9 months on lees; Macabeo, Xarel-lo, Parellada (whites), Garnacha and Monastrell (rosé). Crémant (2016 edition) (Alsace, Bourgogne, Loire): traditional method, 9 months minimum.\n- Champagne (2016 edition): NV min 15 months, 12 on lees; vintage 36 months. Prosecco: Glera, tank method; DOC vs Conegliano-Valdobbiadene DOCG."},"L3-stretch-42":{"head":"L2 CH 25 STRETCH: SHERRY - WHY","src":"L3 book p. 184-189","body":"- Jerez: hot, sunny Mediterranean; coastal vineyards slightly cooler, cooled by the humid poniente wind; the hot, drying levante can stress vines.\n- Albariza soil: very high chalk; drains well but stores enough winter rain to carry vines through dry summers.\n- Palomino: naturally low in acid and lacking obvious varietal aromas -> ideal, because style comes from ageing. PX: thin skin, ideal for sun-drying.\n- Flor needs precise alcohol, temperature and humidity: cannot thrive above 15.5% abv (Fino base fortified to 15-15.5%; 17% kills it); prefers cool to moderate temperatures and high humidity; strongest in spring and autumn. It consumes alcohol and oxygen and produces acetaldehyde, the source of Fino's distinctive flavour.\n- Wines from cooler coastal vineyards or cooler ferments tend to go to biological ageing (Fino); warmer inland or warmer ferments to oxidative (Oloroso).\n- Must be matured in Jerez, Sanlúcar de Barrameda or El Puerto de Santa María."},"L3-stretch-43":{"head":"L2 CH 25 STRETCH: PORT - WHY","src":"L3 book p. 190-194","body":"- Douro: Baixo Corgo (west) coolest and wettest; hotter and drier further east. Very hot, dry summers. Vines survive thanks to SCHIST bedrock, which fractures vertically so roots reach deep winter water.\n- Steep slopes worked as terraces: walled terraces, patamares (no walls, road access), vinha ao alto (vines planted up the slope; not on the steepest).\n- CAUSAL CHAIN: fortification stops fermentation at about 5-9% abv -> fermentation lasts only 24-36 hours -> normal extraction too slow -> foot treading or machines extract colour and tannin fast.\n- Warm continental: Serra do Marão blocks Atlantic rain. Five preferred grapes: Touriga Franca, Touriga Nacional, Tinta Roriz, Tinta Barroca, Tinto Cão (thick skins, tannic). Fortified to 19-22% with spirit of at most 77% (L2 general fortified range: 15-20%)."},"L3-stretch-44":{"head":"L2 CH 25 STRETCH: PORT - WHY","src":"L3 book p. 190-194","body":"- No new-oak flavour is wanted in any Port. Ruby styles minimise oxygen to keep primary fruit; tawny styles embrace it. Douro warehouses' heat speeds ageing and colour loss.\n- LBV: single vintage, 4-6 years before bottling, typically in large oak; most fined and filtered, ready to drink. Unfiltered LBVs are closer to Vintage Port.\n- Vintage declarations are each house's decision. Single Quinta Vintage Ports come from one estate, often in non-declared years.\n- Cheap Tawny: no long ageing; colour from lighter wines, white Port, hot Douro storage or fining. Aged Tawny (10/20/30/40) = average age, bottling year on label. Vintage: declared about three times a decade; bottled by year three; unfiltered (2016 edition rules)."},"L3-stretch-45":{"head":"L2 CH 4 STRETCH: THE VINEYARD CYCLE","src":"L3 book p. 38-39","body":"- Dormancy (NH Dec-Mar / SH Jul-Sep): shoots turn woody (canes), leaves fall, carbohydrate stored in roots. In continental climates winter freeze can kill buds.\n- Budburst (NH Mar-Apr / SH Sep-Oct): generally once mean daily temp tops 10°C. Early budders: Chardonnay, Pinot Noir; late: Cabernet Sauvignon. Spring frost kills new shoots, esp. early budders\n- Shoot growth (NH Mar-May / SH Sep-Nov): fuelled by stored carbohydrate, then photosynthesis; needs water and nutrients.\n- Flowering and fruit set (NH May-Jun / SH Nov-Dec): needs warmth, sun, little rain. Coulure = more flowers than normal fail to fertilise; millerandage = small seedless berries. Both cut yield; usually cold, cloudy or rainy weather.\n- Véraison and ripening (NH Jul-Sep / SH Jan-Mar): 6-8 weeks after fruit set; sugar up, acid down, colour, flavour, tannin develop; mild water stress helps.\n- Harvest (NH Sep-Oct / SH Mar-Apr): ideally dry; rain swells and dilutes grapes, raises rot risk."},"L3-stretch-46":{"head":"L2 CH 4 STRETCH: TRAINING, PRUNING, DENSITY","src":"L3 book p. 20-21, 33-37","body":"- Vines normally fruit only on shoots from buds formed the previous year (one-year-old wood). Cane = 8-20 buds; spur = 2-3. Permanent wood = trunk and arms (cordons).\n- Head training: little permanent wood; spur- or cane-pruned. Cordon training: permanent horizontal arms, usually spur-pruned; slower to establish, easier to mechanise. Either can be low (soil heat) or high (avoid frost).\n- Winter pruning sets bud number and position. Replacement cane pruning (single or double Guyot) needs skilled labour. Summer pruning trims canopy; leaf stripping exposes bunches.\n- Too few buds -> vigorous growth; too many -> vine struggles to ripen.\n- Density 1,000-10,000 vines/ha. Little water -> low density. Low fertility + enough rain -> high density curbs vigour (common in Europe). Very fertile soils -> low density with multiple cordons or canes."},"L3-stretch-47":{"head":"L2 CH 4 STRETCH: PESTS, FARMING, HARVEST","src":"L3 book p. 37-42","body":"- Nematodes: root worms, can spread viruses; sanitise soil, resistant rootstocks. Insects: sprays or integrated pest management.\n- Downy and powdery mildew: warm, humid; mouldy, bitter taint. Traditional sprays: sulfur (powdery), Bordeaux mixture, a copper spray (downy). Grey rot: damp; taints, strips colour.\n- More spraying in maritime climates; stops before harvest. Open canopy cuts disease and spraying.\n- Viruses and bacterial diseases: no cure; dig up and sanitise.\n- Sustainable: chemicals restricted, timed by forecasts, biodiversity. Organic: few traditional treatments, conversion period, certification for the label. Biodynamic: organic plus cosmic cycles and 'preparations'.\n- Machine harvest: fast, works at night (cool fruit, less oxidation); unselective (MOG); flat or gentle slopes only; no whole bunches (Beaujolais, Champagne). Hand: selective, essential for noble rot; may be the only option on steep slopes."},"L3-stretch-48":{"head":"L2 CH 5 STRETCH: OXYGEN, ADJUSTMENTS, FERMENTATION","src":"L3 book p. 43-48","body":"- Protective (anaerobic) winemaking: SO2, night picking, chilled fruit, CO2 or nitrogen in equipment. Some argue a little oxygen adds complexity.\n- Oak lets in small amounts of oxygen: softens red tannin; reds go paler and browner, whites deeper. Wine rarely spends over two years in barrique. Part-filled casks for Oloroso, Tawny Port, Rutherglen Muscat.\n- Reception: first SO2; sorting for premium. Crushing must not break seeds (bitter oils). Press fractions may be kept apart.\n- Enrichment: add RCGM; non-grape sugar = chaptalisation; abused, wine tastes hard and thin. Acidification (tartaric): in Europe warm regions only. Deacidification: more common in cool regions. 2016 edition, may have changed.\n- Yeast: Saccharomyces cerevisiae. Won't start below 5°C; can stop above 35°C or in very sweet must. Ambient yeast = complexity, less control; cultured = reliable."},"L3-stretch-49":{"head":"L2 CH 5 STRETCH: CLARIFYING, STABILISING, CLOSURES","src":"L3 book p. 50-54","body":"- Clarify: settling and racking (some fine wines get nothing else); centrifuge (fast, costly); fining (agent clumps particles); depth filtration (cloudy wine); surface and sterile filtration (removes yeast, bacteria). Some skip these, believing they harm texture.\n- Tartrates: harmless crystals (purple in reds); forced out by chilling below 0°C.\n- Microbes: fortified wines safe; dry, high-acid, post-MLF wines resistant; off-dry, low-acid, non-MLF wines need SO2 and sterile filtration.\n- Plastic bottles let air in (fade in months); bag-in-box: use within about 18 months.\n- Cork: a little oxygen (tertiary development) but TCA (mouldy cardboard) and oxidation risk. Screw cap: no taint, keeps fruit longer; long ageing under it still debated.\n- Most wines best within a year of bottling."},"L3-stretch-50":{"head":"L2 CH 5 STRETCH: CRUSHED-FRUIT RED WINEMAKING","src":"L3 book p. 63-70","body":"- Cold soak (cold maceration): crushed grapes held cool before fermentation to extract colour and flavour; tannin dissolves better in alcohol, so little comes out yet.\n- Ferment 20-32°C; above 35°C can kill yeast. Cooling late in the ferment limits tannin.\n- Cap management: punching down (very extractive; overdone late -> bitter, astringent); pumping over (cools, aerates); rack and return (very extractive, once or twice); rotary fermenters.\n- Post-fermentation maceration

to ripen in all but these sites.","b":"The reverse: it needs a long, sunny growing season (p. 101).","c":"Cooling slows ripening (e.g. Casablanca Valley, p. 70); Carmenère needs warmth.","d":"Not given; the book says it needs the warmest, sunniest sites."},"answer":"a","ctx":"Carmenère is native to Bordeaux but is rarely found there now (L2 book p. 101).","src":"L2 book p. 101","cards":"L2-card-79"},{"id":"Q-L2-20-04","level":"L2","lo":"LO4","ch":"20","topic":"Unripe Carmenère","trap":"MOST LIKELY stem","stem":"A deeply coloured Chilean Carmenère shows pungent green bell pepper and tomato leaf aromas. What is the MOST LIKELY explanation?","options":{"a":"The wine was aged for many years in the bottle.","b":"The grapes were picked before fully ripe.","c":"The grapes were left on the vine until very ripe.","d":"The wine was matured for a long time in new oak."},"notes":{"a":"Bottle age brings tertiary notes such as leather and earth.","b":"Correct: unripe Carmenère gives pungent herbaceous notes; ripe gives fresh blackberry.","c":"Ripe Carmenère gives fresh black fruit (blackberry), not green notes.","d":"Oak softens its tannins and adds coffee and chocolate, not green notes."},"answer":"b","ctx":"Full profile: deep colour, medium to high acidity, high tannins and full body.","src":"L2 book p. 101","cards":"L2-card-79"},{"id":"Q-L2-20-05","level":"L2","lo":"LO4","ch":"20","topic":"Cape Blend","trap":"Cape Blend = a Pinotage blend","stem":"What does the term 'Cape Blend' usually refer to on a South African red wine?","options":{"a":"Chenin Blanc blended with Chardonnay for volume brands","b":"A single-varietal Pinotage from old Western Cape vines","c":"Pinotage blended with grapes such as Cabernet Sauvignon","d":"A blend of Cabernet Sauvignon and Merlot, without Pinotage"},"notes":{"a":"That describes some inexpensive Western Cape whites (p. 63), not Cape Blends.","b":"A single-varietal wine is not a blend; Pinotage is also made this way.","c":"Correct: Pinotage blends with e.g. Cabernet Sauvignon and Merlot are commonly called Cape Blends.","d":"The book uses Cape Blend for Pinotage blends; without Pinotage it is not one."},"answer":"c","ctx":"","src":"L2 book p. 102; L2 spec p. 13","cards":"L2-card-80, L2-card-37"},{"id":"Q-L2-20-06","level":"L2","lo":"LO4","ch":"20","topic":"Mendoza Malbec style","trap":"MOST LIKELY stem","stem":"A deeply coloured, full-bodied red has high tannins, blackberry and black plum fruit, and clove and vanilla from new oak. Which wine is it MOST LIKELY to be?","options":{"a":"Beaujolais Villages","b":"Côtes du Rhône","c":"Mendoza Malbec","d":"Rioja Genérico"},"notes":{"a":"Gamay: low to medium tannin and red fruit; rarely oaked.","b":"Simple and medium-bodied, with red fruit and white pepper.","c":"Correct: the book's description of Malbec, most of which is planted in high-altitude Mendoza.","d":"Young and fruity with primary fruit, not new-oak spice."},"answer":"c","ctx":"With bottle age, very good Malbec can develop dried fruit and meat (L2 book p. 102).","src":"L2 book p. 102","cards":"L2-card-80"},{"id":"Q-L2-20-07","level":"L2","lo":"LO4","ch":"20","topic":"Malbec in Argentina","trap":"","stem":"Which statement about Malbec in Argentina is correct?","options":{"a":"It gives pale, light-bodied wines with low tannin.","b":"It was developed specially for Argentina's climate.","c":"It is only made as part of Bordeaux-style blends.","d":"Most plantings are in high-altitude Mendoza."},"notes":{"a":"Malbec gives deeply coloured, full-bodied wines with high tannins.","b":"That is true of Pinotage in South Africa; Malbec is native to south-west France.","c":"Often blended with Cabernet Sauvignon and/or Merlot, but also frequently single-varietal.","d":"Correct: grown widely in Argentina, but the majority of plantings are in Mendoza."},"answer":"d","ctx":"Malbec is Argentina's most important black grape; it adapted well to the warmer South American climate.","src":"L2 book p. 102","cards":"L2-card-80"},{"id":"Q-L2-20-08","level":"L2","lo":"LO4","ch":"20","topic":"Pinotage origin","trap":"","stem":"How does the origin of Pinotage differ from that of Carmenère and Malbec?","options":{"a":"It is native to south-west France, like Malbec.","b":"It is native to Burgundy, alongside Pinot Noir.","c":"It was developed specially for South Africa.","d":"It is native to Bordeaux but now rare there."},"notes":{"a":"Carmenère and Malbec are French in origin; Pinotage is not.","b":"Closely related to Pinot Noir, but developed for South Africa.","c":"Correct: for South Africa's warm, dry climate; it is closely related to Pinot Noir.","d":"That describes Carmenère."},"answer":"c","ctx":"Pinotage is grown throughout the Western Cape, its only spec GI.","src":"L2 book p. 101-102","cards":"L2-card-80, L2-card-79"},{"id":"Q-L2-20-09","level":"L2","lo":"LO4","ch":"20","topic":"Pinotage structure","trap":"NOT stem; structure reversed","stem":"Which of these is NOT typical of Pinotage?","options":{"a":"Low acidity and high tannins","b":"Coffee, chocolate and smoke when made with oak","c":"Styles from medium-bodied to powerful, full-bodied","d":"Red fruit such as strawberry and red cherry"},"notes":{"a":"Correct to choose: Pinotage typically has medium tannins and HIGH acidity.","b":"Typical: oak contact can give pronounced coffee, chocolate and smoke.","c":"Typical: from fruity and medium-bodied to powerful and full-bodied.","d":"Typical: similar red fruit to its relative Pinot Noir."},"answer":"a","ctx":"","src":"L2 book p. 102","cards":"L2-card-80"},{"id":"Q-L2-20-10","level":"L2","lo":"LO4","ch":"20","topic":"Carmenère blends","trap":"","stem":"In what form is Carmenère MOST commonly found?","options":{"a":"Made into a light rosé by short maceration","b":"As an unoaked, light-bodied single varietal","c":"Blended with Pinotage as a Cape Blend","d":"Blended with Cabernet Sauvignon and Merlot"},"notes":{"a":"Not described; Carmenère gives deeply coloured, full-bodied reds.","b":"It is full-bodied and high in tannin, and often matured in oak.","c":"Cape Blends are South African Pinotage blends.","d":"Correct: it can be single-varietal but is more commonly part of a blend."},"answer":"d","ctx":"Oak use: it softens Carmenère's high tannins and adds coffee and chocolate (L2 book p. 101).","src":"L2 book p. 101","cards":"L2-card-79"},{"id":"Q-L3-17-01","level":"L3","lo":"Stretch (L2 LO4)","ch":"17","topic":"Beaujolais granite soils","trap":"","stem":"According to the L3 book, why are the best Beaujolais wines made from grapes grown on granite soils?","options":{"a":"Granite soils are flat, which allows machine harvesting.","b":"Granite holds water, protecting the vines in drought.","c":"Granite is very fertile, so the vines ripen more fruit.","d":"Low nutrients limit yields, concentrating the flavours."},"notes":{"a":"The granite is on rolling hills in the north and west; the flat alluvial plain is south and east.","b":"Not the reason given; the L3 book links granite to low nutrients and yields.","c":"The reverse: these granite soils are low in nutrients, which limits yields.","d":"Correct: Gamay can crop heavily; poor granite soils keep yields down."},"answer":"d","ctx":"Links to L2: Villages and crus lie in the north (L2 book p. 95); L3 adds that these hills are granite.","src":"L3 book (2016) ch 16, p. 90-91","cards":"L3-stretch-33, L2-card-75"},{"id":"Q-L3-17-02","level":"L3","lo":"Stretch (L2 LO4)","ch":"17","topic":"Beaujolais Nouveau","trap":"","stem":"According to the L3 book, which quality levels may be sold as Beaujolais Nouveau?","options":{"a":"Beaujolais, Villages or any of the crus","b":"Beaujolais or Beaujolais Villages","c":"Only Beaujolais Villages from the north","d":"Only wines from the ten Beaujolais crus"},"notes":{"a":"The L3 book says the crus cannot be sold as Nouveau.","b":"Correct: the ten crus cannot be sold in this way.","c":"Beaujolais AOC qualifies too; the alluvial south is Nouveau's major source.","d":"The crus are excluded; Nouveau is Beaujolais or Villages quality."},"answer":"b","ctx":"Not in the L2 book. Released from the third Thursday of November after the vintage (2016 edition; may have changed).","src":"L3 book (2016) ch 16, p. 90","cards":"L3-stretch-33"},{"id":"Q-L3-18-01","level":"L3","lo":"Stretch (L2 LO4)","ch":"18","topic":"Southern Rhône bush vines","trap":"","stem":"Why is Grenache usually bush-trained low to the ground in the Southern Rhône?","options":{"a":"To shade the grapes so that they keep high acidity.","b":"To raise yields on the region's flat, fertile soils.","c":"To make machine harvesting easier on the flat land.","d":"To shelter from the mistral and gain soil warmth."},"notes":{"a":"Not the reason given; the L3 book cites wind protection and soil warmth.","b":"Not the reason given; the L3 book cites wind protection and soil warmth.","c":"Bush vines hinder machines; the L3 book links wire training to mechanisation.","d":"Correct: per the L3 book; the mistral gains speed in the flatter south."},"answer":"d","ctx":"Syrah is more easily damaged by wind, so it benefits from the support of trellising (L3 p. 102).","src":"L3 book (2016) ch 20, p. 102","cards":"L3-stretch-32"},{"id":"Q-L3-18-02","level":"L3","lo":"Stretch (L2 LO4)","ch":"18","topic":"Rioja Baja Garnacha","trap":"","stem":"In Rioja, why does Garnacha grow best in Rioja Baja, while Tempranillo does best in the western sub-regions?","options":{"a":"Rioja Baja is hotter and drier, and less maritime.","b":"Rioja Baja is cooler, with more Atlantic influence.","c":"Rioja Baja has higher vineyards with cooler nights.","d":"Rioja Baja is wetter, and Garnacha tolerates damp."},"notes":{"a":"Correct: per L3 p. 134; Garnacha adds body and alcohol to Rioja blends.","b":"Reversed: Rioja Alta and Alavesa in the west are Atlantic-moderated.","c":"Not given; Alta and Alavesa are at 500-800 m, and Baja is hotter and drier.","d":"The reverse: Baja's rainfall can be low, making drought an issue."},"answer":"a","ctx":"Links to L2: Garnacha gives body and fresh red fruit to Rioja (L2 book p. 98).","src":"L3 book (2016) ch 30, p. 134","cards":"L3-stretch-34"},{"id":"Q-L3-18-03","level":"L3","lo":"Stretch (L2 LO4)","ch":"18","topic":"Priorat llicorella","trap":"","stem":"According to the L3 book, how do Priorat's llicorella soils help its old Garnacha vines?","options":{"a":"They store heat and, being deep, retain water.","b":"They are cool clay soils that slow ripening in the heat.","c":"They drain so fast that the vines must be irrigated.","d":"They are fertile, so the vines give generous yields."},"notes":{"a":"Correct: red slate with mica reflects and conserves heat; deep soils hold water all season.","b":"Llicorella is slate, not clay, and it aids ripening.","c":"The L3 book says their depth lets them retain enough water.","d":"The soils are low in nutrients; with old vines, yields are very small."},"answer":"a","ctx":"Bush vines on steep slopes make mechanisation almost impossible, so Priorat is never cheap (L3 p. 136).","src":"L3 book (2016) ch 30, p. 135-136","cards":"L3-stretch-35"},{"id":"Q-L3-19-01","level":"L3","lo":"Stretch (L2 LO4)","ch":"19","topic":"Tempranillo and climate","trap":"","stem":"According to the L3 book, why is Tempranillo at its best where summer heat is moderated by the sea or by altitude?","options":{"a":"Its thin skins scorch easily in strong sunshine.","b":"It ripens so late that it needs cool nights to finish.","c":"High heat gives it pungent green pepper flavours.","d":"With medium acidity, it can lack balance in heat."},"notes":{"a":"The L3 book calls Tempranillo thick-skinned.","b":"Not the reason given; the issue is keeping enough acidity.","c":"Green pepper is a sign of unripe Carmenère, not of heat.","d":"Correct: hot climates without a high diurnal range can leave it short of acidity."},"answer":"d","ctx":"Apply it: Rioja Alta (Atlantic-moderated, 500-800 m) and Ribera del Duero (some vines over 850 m) both supply that cooling.","src":"L3 book (2016) ch 30, p. 131-132","cards":"L3-stretch-34, L3-stretch-35"},{"id":"Q-L3-19-02","level":"L3","lo":"Stretch (L2 LO4)","ch":"19","topic":"Reserva minimum ageing","trap":"Crianza vs Reserva vs Gran Reserva minimums","stem":"Under Spanish law as given in the L3 book, what are the minimum ageing periods for a red Reserva?","options":{"a":"18 months in total, including 6 in barrel","b":"36 months in total, including 12 in barrel","c":"60 months in total, including 18 in barrel","d":"24 months in total, including 6 in barrel"},"notes":{"a":"These are the white and rosé Crianza minimums.","b":"Correct: per the L3 table; some regions, such as Rioja, are stricter.","c":"These are the red Gran Reserva minimums.","d":"These are the red Crianza minimums."},"answer":"b","ctx":"Hook for reds: 2, 3, 5 years in total; 6, 12, 18 months in barrel (2016 edition; may have changed).","src":"L3 book (2016) ch 30, p. 132 (Spanish wine laws)","cards":"L3-stretch-35, L2-card-17"},{"id":"Q-L3-19-03","level":"L3","lo":"Stretch (L2 LO4)","ch":"19","topic":"Semi-carbonic Joven","trap":"","stem":"Why do some Spanish producers use semi-carbonic maceration for early-drinking Tempranillo, such as Joven wines?","options":{"a":"It gives vibrant red fruit and low, smooth tannins.","b":"It raises acidity by halting ripening in the vat.","c":"It adds vanilla and coconut flavours to the wine.","d":"It extracts more tannin to allow longer bottle ageing."},"notes":{"a":"Correct: per the L3 book (fresh strawberry-scented Joven; early-drinking Rioja).","b":"Not a feature of the technique; it is used for fruit and soft tannin.","c":"These come from oak (traditionally American oak in Rioja).","d":"The reverse: long-ageing Rioja is usually destemmed, crushed and fermented traditionally."},"answer":"a","ctx":"Same family of techniques as the Beaujolais 'banana and candy' methods (see L3-stretch-18).","src":"L3 book (2016) ch 30, p. 131-132, 134","cards":"L3-stretch-34, L3-stretch-18"},{"id":"Q-L3-20-01","level":"L3","lo":"Stretch (L2 LO4)","ch":"20","topic":"Pinotage parentage","trap":"","stem":"Pinotage is a crossing bred in South Africa. According to the L3 book, which two varieties are its parents?","options":{"a":"Pinot Noir and Pinot Gris","b":"Pinot Noir and Syrah","c":"Pinot Noir and Cinsault","d":"Cinsault and Grenache"},"notes":{"a":"Pinot Gris is a mutation of Pinot Noir, not a parent of Pinotage.","b":"Pinot Noir is right, but the other parent is Cinsault.","c":"Correct: given in the L3 book (p. 22 and p. 160).","d":"Cinsault is right, but the other parent is Pinot Noir."},"answer":"c","ctx":"Links to L2: the L2 book says only that Pinotage is closely related to Pinot Noir (p. 102).","src":"L3 book (2016) ch 4, p. 22; ch 38, p. 160","cards":"L3-stretch-06"},{"id":"Q-L3-20-02","level":"L3","lo":"Stretch (L2 LO4)","ch":"20","topic":"Carmenère ripening","trap":"","stem":"According to the L3 book, why does Carmenère often show overtly herbaceous aromas?","options":{"a":"It ripens early, so it loses its fruit in the heat.","b":"It ripens late, so it may not reach full ripeness.","c":"Its thin skins let it overripen quickly in the sun.","d":"Long ageing in oak adds herbal and green notes."},"notes":{"a":"The reverse: the L3 book calls it a late-ripening variety.","b":"Correct: a late-ripening variety, most successful in the warmest, sunniest sites.","c":"Herbaceous aromas come from under-ripe, not over-ripe, fruit.","d":"Oak adds coffee and chocolate (L2 p. 101); green notes come from unripe fruit."},"answer":"b","ctx":"Good examples balance black fruit and herbal aromas; it is often thought of as Chile's signature grape (L3 p. 153).","src":"L3 book (2016) ch 36, p. 153","cards":"L3-stretch-36, L2-card-79"},{"id":"Q-L3-20-03","level":"L3","lo":"Stretch (L2 LO4)","ch":"20","topic":"Malbec and altitude","trap":"","stem":"According to the L3 book, how does Malbec from higher-altitude Argentine vineyards usually differ from Malbec grown lower down?","options":{"a":"Lighter, with green pepper and tomato leaf","b":"More elegant, with fresher, more floral aromas","c":"Fuller-bodied, with richer and riper black fruit","d":"Softer, with lower acidity and jammy fruit"},"notes":{"a":"Herbaceous notes are linked to unripe Carmenère, not to Malbec.","b":"Correct: lower sites give fuller body and richer black fruit (L3 p. 156).","c":"This describes Malbec from lower-altitude vineyards.","d":"Cool nights at altitude help keep acidity and fresh fruit (L3 p. 159, Uco Valley)."},"answer":"b","ctx":"Most Argentine vineyards lie at 600 m or more; in Salta they reach 2,000 m+, giving cool sites near the Equator (L3 p. 156).","src":"L3 book (2016) ch 37, p. 156, 159","cards":"L3-stretch-37, L2-card-80"},{"id":"Q-L3-20-04","level":"L3","lo":"Stretch (L2 LO4)","ch":"20","topic":"Western Cape GI","trap":"","stem":"According to the L3 book, why do some South African producers use the broad Western Cape GI even for premium wines?","options":{"a":"It allows blending of the best parcels from many areas.","b":"It shows that the wine is a Pinotage-based Cape Blend.","c":"It requires lower yields than the smaller district GIs.","d":"It guarantees all fruit is from cool coastal vineyards."},"notes":{"a":"Correct: Western Cape is a catch-all 'geographical unit' (L3 p. 160).","b":"Cape Blend is a style term for Pinotage blends, not a GI.","c":"No such rule is given; its value is the freedom to blend.","d":"It covers many regions, including hot inland areas (L2 p. 63)."},"answer":"a","ctx":"Contrast: cheap volume Chenin is often labelled Western Cape (L2 p. 63); same GI, both ends of quality (2016 edition; may have changed).","src":"L3 book (2016) ch 38, p. 160 (South African wine laws)","cards":"L3-stretch-37, L2-card-80"},{"id":"Q-L2-21-01","level":"L2","lo":"LO4","ch":"21","topic":"Gavi grape variety","trap":"","stem":"Which white grape variety is used to make Gavi DOCG?","options":{"a":"Fiano","b":"Verdicchio","c":"Garganega","d":"Cortese"},"notes":{"a":"Fiano is a southern Italian grape; its spec GI is Fiano di Avellino, in Campania.","b":"Verdicchio is grown mainly in the Marche; its famous wine is Verdicchio dei Castelli di Jesi.","c":"Garganega is the most important grape of Soave, in the Veneto.","d":"Correct: the book says Cortese is best known as the variety used in Gavi DOCG, in Piemonte."},"answer":"d","ctx":"Spec pairs: Gavi = Cortese; Soave = Garganega; Castelli di Jesi = Verdicchio; Avellino = Fiano.","src":"L2 book p. 103 (Cortese)","cards":"L2-card-81, L2-card-38"},{"id":"Q-L2-21-02","level":"L2","lo":"LO4","ch":"21","topic":"Italian white GI regions","trap":"NOT stem","stem":"Which of these pairings of an Italian white-wine GI and its region is NOT correct?","options":{"a":"Gavi - Veneto","b":"Verdicchio dei Castelli di Jesi - Marche","c":"Soave - Veneto","d":"Fiano di Avellino - Campania"},"notes":{"a":"Correct: this pairing is wrong. Gavi DOCG is in Piemonte, north-west Italy.","b":"This pairing IS correct: Verdicchio is grown particularly in the Marche, on the east coast.","c":"This pairing IS correct: Garganega is widely planted in the Veneto, north-east Italy.","d":"This pairing IS correct: Fiano di Avellino DOCG is from mountainous Campania."},"answer":"a","ctx":"Map it: Piemonte (north-west) Gavi; Veneto (north-east) Soave; Marche (east coast) Verdicchio; Campania (south) Fiano.","src":"L2 book p. 103-104","cards":"L2-card-81"},{"id":"Q-L2-21-03","level":"L2","lo":"LO4","ch":"21","topic":"Recioto di Soave","trap":"Recioto di Soave (white) vs Recioto della Valpolicella (red)","stem":"What style of wine is Recioto di Soave DOCG?","options":{"a":"A sweet white made from grapes dried by appassimento.","b":"A sweet red made from partially dried Corvina grapes.","c":"A dry white from the hilly historic centre of Soave.","d":"A sweet white made from grapes affected by noble rot."},"notes":{"a":"Correct: the book says the grapes are harvested and then dried using appassimento.","b":"That is Recioto della Valpolicella. Recioto di Soave is a white wine.","c":"That describes Soave DOC Classico, not Recioto di Soave.","d":"Recioto uses grapes dried after harvest, not botrytis (the Sauternes and Tokaji route)."},"answer":"a","ctx":"Recioto = sweet, from dried grapes: 'di Soave' is white, 'della Valpolicella' is red.","src":"L2 book p. 103, 107; L2 spec p. 13","cards":"L2-card-81, L2-card-38"},{"id":"Q-L2-21-04","level":"L2","lo":"LO4","ch":"21","topic":"Soave Classico ageing","trap":"","stem":"How can the best Soave DOC Classico wines differ from most Soave DOC?","options":{"a":"They can gain honey and almond flavours in bottle.","b":"They are sweet, from grapes dried after harvest.","c":"They gain vanilla and smoke from new-oak maturation.","d":"They are made from Cortese rather than Garganega."},"notes":{"a":"Correct: the book says most Soave DOC is drunk young, but the best Classico gains honey and almonds.","b":"That is Recioto di Soave DOCG, made by appassimento.","c":"Soave is typically fermented in inert vessels and is not matured in oak.","d":"Garganega is the most important variety in both Soave DOC and Soave DOC Classico."},"answer":"a","ctx":"Classico = historic centre, often the hilliest part; typically more concentrated (L2 book p. 109).","src":"L2 book p. 103 (Garganega)","cards":"L2-card-81, L2-card-18"},{"id":"Q-L2-21-05","level":"L2","lo":"LO4","ch":"21","topic":"Fiano di Avellino style","trap":"MOST LIKELY stem","stem":"A white wine has medium acidity, a medium to full body and flavours of peach, melon and mango. Which GI is it MOST LIKELY from?","options":{"a":"Gavi","b":"Soave","c":"Verdicchio dei Castelli di Jesi","d":"Fiano di Avellino"},"notes":{"a":"Cortese is light-bodied with high acidity: blossom, apple, pear and lemon.","b":"Garganega has high acidity: apple, pear, lemon and peach, but no tropical fruit.","c":"Verdicchio has high acidity and medium body: apple, pear, lemon and fennel.","d":"Correct: the book gives Fiano medium acidity, medium to full body, peach, melon and mango."},"answer":"d","ctx":"Fiano winemaking: mostly inert vessels, but some show lees (bread, biscuit) or oak (smoke); the best gain honey.","src":"L2 book p. 103-104","cards":"L2-card-81, L2-card-38"},{"id":"Q-L2-21-06","level":"L2","lo":"LO4","ch":"21","topic":"Gavi winemaking","trap":"","stem":"How is most Gavi typically made, and when is it best drunk?","options":{"a":"Matured in new oak, then aged for several years before release.","b":"Made from dried grapes, giving a sweet wine that ages for decades.","c":"Aged on its lees in bottle, giving a sparkling wine with biscuit notes.","d":"Fermented in inert vessels, unoaked, ready to drink on release."},"notes":{"a":"Gavi is not matured in oak, and most is not intended to age.","b":"That is the appassimento route, used for Recioto di Soave, not Gavi.","c":"That is the traditional method for sparkling wine; Gavi is a still, dry white.","d":"Correct: the book says Gavi is not matured in oak, and most is ready on release, not for ageing."},"answer":"d","ctx":"Cortese style: dry, light-bodied, high acidity; blossom, apple, pear, lemon.","src":"L2 book p. 103 (Cortese)","cards":"L2-card-81"},{"id":"Q-L2-21-07","level":"L2","lo":"LO4","ch":"21","topic":"Verdicchio style","trap":"MOST LIKELY stem; Verdicchio vs Garganega","stem":"A dry white has high acidity, a medium body and flavours of apple, pear and lemon with a herbal note of fennel. Which grape variety is it MOST LIKELY made from?","options":{"a":"Verdicchio","b":"Fiano","c":"Cortese","d":"Garganega"},"notes":{"a":"Correct: the book gives Verdicchio high acid, medium body, apple, pear, lemon and fennel.","b":"Fiano has medium acidity and stone and tropical fruit (peach, melon, mango).","c":"Also high in acid, but light-bodied, with blossom rather than a herbal note.","d":"Close: also dry, high acid and medium body, but the book gives it peach, not fennel."},"answer":"a","ctx":"Memory hook: fennel = Verdicchio (Marche, east coast); its famous GI is Verdicchio dei Castelli di Jesi.","src":"L2 book p. 103-104","cards":"L2-card-81"},{"id":"Q-L2-21-08","level":"L2","lo":"LO4","ch":"21","topic":"Verdicchio ageing","trap":"","stem":"How do most wines labelled Verdicchio differ from outstanding examples?","options":{"a":"Most are simple and fruity; the best can gain honey and nuts.","b":"Most are sweet whites made from grapes dried indoors after harvest.","c":"Most are full-bodied and oaked, with flavours of mango and smoke.","d":"Most are low in acidity and need many years in bottle to soften."},"notes":{"a":"Correct: most are not intended for ageing, but outstanding examples develop honey and nuts.","b":"That describes Recioto di Soave. The book describes Verdicchio as dry.","c":"Closer to some Fiano: medium to full body, tropical fruit, sometimes oak (smoke).","d":"Verdicchio has high acidity, and most is not intended for ageing."},"answer":"a","ctx":"","src":"L2 book p. 104 (Verdicchio)","cards":"L2-card-81, L2-card-38"},{"id":"Q-L2-22-02","level":"L2","lo":"LO4","ch":"22","topic":"Barolo grape rules","trap":"","stem":"Which grape variety or varieties may be used to make Barolo DOCG?","options":{"a":"Mainly Corvina, with Nebbiolo","b":"Nebbiolo only","c":"Nebbiolo with some Barbera","d":"Mainly Barbera, with Nebbiolo"},"notes":{"a":"Corvina is the main grape of Valpolicella, in the Veneto.","b":"Correct: the book says Nebbiolo is the only variety permitted in Barolo DOCG.","c":"Barbera is grown in Piemonte, but Nebbiolo is the only variety permitted in Barolo.","d":"Barbera's best wines are seen as Barbera d'Asti DOCG; Barolo is Nebbiolo only."},"answer":"b","ctx":"Spec: the Nebbiolo GIs are Barolo and Barbaresco.","src":"L2 book p. 105 (Nebbiolo)","cards":"L2-card-82, L2-card-37"},{"id":"Q-L2-22-03","level":"L2","lo":"LO4","ch":"22","topic":"Nebbiolo and oak","trap":"","stem":"Why is Nebbiolo often matured for extended periods in oak?","options":{"a":"To raise its naturally low acidity.","b":"To deepen its colour before bottling.","c":"To add banana and candy aromas.","d":"To soften its high levels of tannin."},"notes":{"a":"Nebbiolo has high acidity; oak maturation does not raise acidity.","b":"Not the book's reason: the long oak maturation is to soften the high tannins.","c":"Those aromas come from Beaujolais-style techniques, not from oak.","d":"Correct: as stated in the book; some use old oak, others new oak to add oak aromas."},"answer":"d","ctx":"With bottle age the best gain tertiary aromas of mushroom, tobacco and leather.","src":"L2 book p. 105 (Nebbiolo)","cards":"L2-card-82"},{"id":"Q-L2-22-04","level":"L2","lo":"LO4","ch":"22","topic":"Barolo vineyard site","trap":"","stem":"Which description of the Barolo DOCG region is correct?","options":{"a":"A horseshoe-shaped valley of steep, south-facing slopes.","b":"A broad, flat river plain with fertile soils and high yields.","c":"A high plateau with north-facing, cool vineyards.","d":"A coastal strip of low hills cooled by sea breezes."},"notes":{"a":"Correct: as described in the book.","b":"Not Barolo: the book describes a valley of steep, south-facing vineyards.","c":"The book says Barolo's vineyards face south, not north.","d":"Not the book's description: Barolo is a horseshoe-shaped valley with steep slopes."},"answer":"a","ctx":"Link to ch 4: slopes facing the equator receive more heat and sunlight, so grapes ripen more fully.","src":"L2 book p. 105 (Nebbiolo)","cards":"L2-card-82"},{"id":"Q-L2-22-05","level":"L2","lo":"LO4","ch":"22","topic":"Barbaresco DOCG","trap":"","stem":"Where does Barbaresco DOCG lie in relation to Barolo, and what style of wine does it make?","options":{"a":"A larger region south-west of Barolo, making lighter Nebbiolo.","b":"A hilly zone in the Veneto, making dry Corvina from dried grapes.","c":"A smaller region north-east of Barolo, making fruity Barbera.","d":"A smaller region north-east of Barolo, making powerful Nebbiolo."},"notes":{"a":"It is smaller, lies north-east of Barolo, and its wines are similarly powerful.","b":"That is closer to Amarone della Valpolicella.","c":"Location right, grape wrong: Barbaresco is a Nebbiolo GI.","d":"Correct: the book says it makes similarly powerful and long-lived wines from Nebbiolo."},"answer":"d","ctx":"","src":"L2 book p. 105 (Nebbiolo)","cards":"L2-card-82, L2-card-37"},{"id":"Q-L2-22-06","level":"L2","lo":"LO4","ch":"22","topic":"Barbera d'Asti vs Asti","trap":"Barbera d'Asti, not Asti (known gap)","stem":"Which of these GIs is listed for the Barbera grape in the Level 2 specification?","options":{"a":"Barbaresco","b":"Barbera d'Asti","c":"Valpolicella Classico","d":"Asti"},"notes":{"a":"Barbaresco is a Nebbiolo GI, north-east of Barolo.","b":"Correct: the book says many see Barbera d'Asti DOCG as Barbera's highest-quality wines.","c":"A Corvina GI from the hillier heartland of Valpolicella, in the Veneto.","d":"Asti DOCG is a sweet, light, sparkling Piemonte wine made from Moscato (L2 book p. 115)."},"answer":"b","ctx":"Barbera d'Asti means 'Barbera from Asti' (grape plus place). Asti on its own = sweet sparkling Moscato.","src":"L2 spec p. 12; L2 book p. 106, 115","cards":"L2-card-82, L2-card-37, L2-card-18"},{"id":"Q-L2-22-07","level":"L2","lo":"LO4","ch":"22","topic":"Barbera vs Nebbiolo","trap":"","stem":"Why is Barbera generally enjoyable to drink at a younger stage than Nebbiolo?","options":{"a":"It is made from partly dried grapes.","b":"It has lower levels of tannin.","c":"It has lower levels of acidity.","d":"It spends longer maturing in oak."},"notes":{"a":"Drying (appassimento) is a Veneto technique for Amarone and Recioto, not Barbera.","b":"Correct: the book gives Barbera's lower tannin levels as the reason.","c":"Barbera has high acidity, like Nebbiolo; the difference is tannin.","d":"Many Barbera wines are unoaked; it is Nebbiolo that often has long oak maturation."},"answer":"b","ctx":"Trade-off: lower tannin means earlier drinking, but generally a shorter ageing potential than Nebbiolo.","src":"L2 book p. 105-106 (Barbera)","cards":"L2-card-82"},{"id":"Q-L2-22-08","level":"L2","lo":"LO4","ch":"22","topic":"Corvina structure","trap":"","stem":"Corvina is the most important grape of Valpolicella. What tannin and acidity does the L2 book give its wines?","options":{"a":"Medium to high tannins, high acidity","b":"Low to medium tannins, high acidity","c":"Low to medium tannins, low acidity","d":"High tannins, medium acidity"},"notes":{"a":"Too much tannin: the book gives Corvina low to medium tannins.","b":"Correct: with red-fruit flavours of red cherry and red plum.","c":"Tannin right, acidity wrong: Corvina is high in acidity.","d":"That is Montepulciano, which also has deep colour and black fruit."},"answer":"b","ctx":"Corvina typically dominates the Valpolicella blend, though other local grapes are permitted.","src":"L2 book p. 106 (Corvina)","cards":"L2-card-83"},{"id":"Q-L2-22-09","level":"L2","lo":"LO4","ch":"22","topic":"Classico labelling term","trap":"Classico vs Riserva","stem":"What does the term 'Classico' indicate on a label such as Valpolicella DOC Classico?","options":{"a":"A wine made only from the Corvina grape","b":"Grapes dried indoors before fermentation","c":"Grapes grown in the historic centre of the region","d":"Ageing for at least a set number of months"},"notes":{"a":"Classico is about where the grapes are grown, not the grape variety.","b":"That is appassimento, used for Amarone and Recioto.","c":"Correct: often the hilliest part, typically giving more concentrated wines.","d":"That is Riserva."},"answer":"c","ctx":"Valpolicella Classico (hillier heartland) typically has more body and complexity than Valpolicella DOC.","src":"L2 book p. 106, 109","cards":"L2-card-18, L2-card-83"},{"id":"Q-L2-22-10","level":"L2","lo":"LO4","ch":"22","topic":"Appassimento wines","trap":"NOT stem","stem":"Which of these wines is NOT made using the appassimento method?","options":{"a":"Recioto di Soave","b":"Amarone della Valpolicella","c":"Valpolicella DOC Classico","d":"Recioto della Valpolicella"},"notes":{"a":"A sweet white made from grapes dried by appassimento.","b":"Made from partially dried grapes: dry to off-dry, full-bodied, about 15% abv.","c":"Correct: made from fresh grapes; Classico refers to the hillier heartland, not drying.","d":"A sweet red made from partially dried grapes."},"answer":"c","ctx":"Appassimento: pick, then dry indoors to concentrate sugars, acids, tannins and flavours.","src":"L2 book p. 103, 106-107","cards":"L2-card-83, L2-card-81"},{"id":"Q-L2-22-11","level":"L2","lo":"LO4","ch":"22","topic":"Barolo tasting note","trap":"MOST LIKELY stem","stem":"A full-bodied red has high tannin and acidity, red cherry, dried herbs and rose, with mushroom and leather from age. Which GI is it MOST LIKELY from?","options":{"a":"Valpolicella","b":"Barolo","c":"Barbera d'Asti","d":"Montepulciano d'Abruzzo"},"notes":{"a":"Basic Valpolicella is light-bodied, fruity and simple, made to drink young.","b":"Correct: Nebbiolo's red fruit, dried herbs and rose; full body, high tannin and acid; aged mushroom, leather.","c":"Barbera has low to medium tannins, not high, and sometimes black pepper.","d":"Montepulciano gives black fruit (black plum, black cherry); mostly simple and fruity."},"answer":"b","ctx":"Floral notes (rose, violet) are the Nebbiolo clue in the book.","src":"L2 book p. 105-106","cards":"L2-card-82, L2-card-83, L2-card-85"},{"id":"Q-L2-22-12","level":"L2","lo":"LO4","ch":"22","topic":"Recioto della Valpolicella","trap":"","stem":"Why is Recioto della Valpolicella sweet?","options":{"a":"Sweet juice is added to the wine before bottling.","b":"Grape spirit is added to stop the fermentation early.","c":"Dried grapes hold more sugar than the yeast can ferment.","d":"Its grapes are concentrated by noble rot on the vine."},"notes":{"a":"Not the book's method for Recioto; its sweetness comes from dried grapes.","b":"That is fortification, as used for Port; Recioto is not fortified.","c":"Correct: per the book, the sugars are so concentrated that the yeast cannot ferment them to dryness.","d":"Recioto uses grapes dried indoors (appassimento), not botrytis."},"answer":"c","ctx":"","src":"L2 book p. 106 (Corvina)","cards":"L2-card-83"},{"id":"Q-L2-23-01","level":"L2","lo":"LO4","ch":"23","topic":"Sangiovese characteristics","trap":"","stem":"Which description best fits wines made from Sangiovese?","options":{"a":"Deep colour, high tannin, medium acidity, black plum and black cherry","b":"Dry, high tannin, high acidity, red cherry and dried herbs","c":"High acidity, low to medium tannin, red cherry and black pepper","d":"Low to medium tannin, high acidity, light body and simple red fruit"},"notes":{"a":"That is Montepulciano.","b":"Correct: the book adds red plum; often blended with small amounts of other black grapes.","c":"That is Barbera.","d":"Closer to basic Valpolicella (Corvina)."},"answer":"b","ctx":"Nebbiolo's profile is near-identical (plus rose, violet): place decides - Tuscany = Sangiovese, Piemonte = Nebbiolo.","src":"L2 book p. 108 (Sangiovese)","cards":"L2-card-84"},{"id":"Q-L2-23-02","level":"L2","lo":"LO4","ch":"23","topic":"Chianti Classico vs Chianti","trap":"","stem":"How do the growing conditions of Chianti Classico DOCG differ from those of the wider Chianti DOCG?","options":{"a":"It lies lower, on flat and fertile land near the coast.","b":"It sits at higher altitude, with a long ripening season.","c":"It is warmer and lower, so the grapes ripen faster.","d":"It lies east of the Apennines, in the Abruzzo region."},"notes":{"a":"No: Classico sits at HIGHER altitude than the wider Chianti area.","b":"Correct: as stated in the book.","c":"The reverse: higher altitude and a long ripening season.","d":"That is Montepulciano country; Chianti is in central Tuscany, west of the Apennines."},"answer":"b","ctx":"Result: a typical Chianti Classico is medium-bodied with pronounced red fruit and dried-herb notes.","src":"L2 book p. 108 (Sangiovese)","cards":"L2-card-84"},{"id":"Q-L2-23-03","level":"L2","lo":"LO4","ch":"23","topic":"Chianti DOCG quality","trap":"","stem":"Which statement best describes wines labelled Chianti DOCG?","options":{"a":"Varied quality; many are simple, inexpensive and not for ageing.","b":"Sweet reds made from grapes that are dried after harvest.","c":"Full-bodied wines that must mature in oak for an extended period.","d":"Made from Montepulciano and sold mostly in high volumes."},"notes":{"a":"Correct: Chianti DOCG covers a wide area in the Apennine foothills, with varied quality.","b":"That is Recioto della Valpolicella, from the Veneto.","c":"The L2 book gives this oak requirement for Brunello di Montalcino; many Chianti DOCG wines are simple, not for ageing.","d":"Chianti is Sangiovese-dominant; high-volume Montepulciano is Montepulciano d'Abruzzo."},"answer":"a","ctx":"","src":"L2 book p. 108 (Sangiovese)","cards":"L2-card-84"},{"id":"Q-L2-23-04","level":"L2","lo":"LO4","ch":"23","topic":"Chianti Classico and oak","trap":"","stem":"Which flavours does oak maturation typically add to Chianti Classico DOCG?","options":{"a":"Banana and candy","b":"Meat and leather","c":"Cloves and cedar","d":"Bread and biscuit"},"notes":{"a":"These come from Beaujolais-style techniques (L2 book p. 94), not oak.","b":"These develop later in the bottle in the best wines, not from oak.","c":"Correct: oak also softens Sangiovese's high tannins (L2 book p. 108).","d":"These come from lees contact or autolysis, not oak."},"answer":"c","ctx":"Oak also softens the tannins; the best wines then gain meat and leather in bottle.","src":"L2 book p. 108 (Sangiovese)","cards":"L2-card-84"},{"id":"Q-L2-23-05","level":"L2","lo":"LO4","ch":"23","topic":"Riserva labelling term","trap":"Riserva vs Classico","stem":"What does 'Riserva' indicate on an Italian DOC or DOCG wine label?","options":{"a":"Grapes harvested from a single named vineyard.","b":"Grapes grown in the historic centre of the region.","c":"Grapes dried indoors to concentrate their sugars.","d":"Ageing for a set minimum time before release."},"notes":{"a":"Not the book's definition; Riserva is about minimum ageing before release.","b":"That is Classico.","c":"That is appassimento.","d":"Correct: the book defines it as aged for at least a set number of months before release."},"answer":"d","ctx":"Spec: Riserva is listed under Sangiovese; Classico under Corvina and Garganega.","src":"L2 book p. 109; L2 spec p. 12","cards":"L2-card-18, L2-card-37"},{"id":"Q-L2-23-06","level":"L2","lo":"LO4","ch":"23","topic":"Chianti Classico Riserva","trap":"","stem":"Why may a Chianti Classico DOCG Riserva already show some tertiary characters when it is released?","options":{"a":"Its grapes are partially dried before fermentation.","b":"It is made only from very old Sangiovese vines.","c":"Its grapes come from the historic centre.","d":"It is subject to stricter ageing requirements."},"notes":{"a":"That is appassimento, used in the Veneto for Amarone and Recioto.","b":"Riserva relates to ageing before release, not to vine age.","c":"That is what Classico means; it does not explain tertiary character.","d":"Correct: per the book, so it may show some tertiary characters on release."},"answer":"d","ctx":"","src":"L2 book p. 108-109","cards":"L2-card-84, L2-card-18"},{"id":"Q-L2-23-07","level":"L2","lo":"LO4","ch":"23","topic":"Brunello = Sangiovese","trap":"","stem":"In Brunello di Montalcino DOCG, what is 'Brunello'?","options":{"a":"A term for oak-aged Riserva wine","b":"The local name for Nebbiolo","c":"The local name for Sangiovese","d":"The local name for Montepulciano"},"notes":{"a":"Riserva is the ageing term; Brunello is a grape name.","b":"Nebbiolo is the Piemonte grape of Barolo and Barbaresco.","c":"Correct: as stated in the book.","d":"Montepulciano is the grape of Abruzzo, east of the Apennines."},"answer":"c","ctx":"Spec Sangiovese GIs: Chianti, Chianti Classico, Brunello di Montalcino.","src":"L2 book p. 108 (Sangiovese)","cards":"L2-card-85"},{"id":"Q-L2-23-08","level":"L2","lo":"LO4","ch":"23","topic":"Brunello di Montalcino style","trap":"MOST LIKELY stem","stem":"A powerful, full-bodied red from a warm, sunny part of southern Tuscany has very high tannin and acidity and long ageing potential. Which GI is it MOST LIKELY to be?","options":{"a":"Montepulciano d'Abruzzo","b":"Chianti Classico","c":"Brunello di Montalcino","d":"Chianti"},"notes":{"a":"Abruzzo is in east-central Italy, not Tuscany; mostly simple and fruity.","b":"Typically medium-bodied, from higher-altitude vineyards in central Tuscany.","c":"Correct: it must also mature in oak for an extended period before release.","d":"Many are simple, inexpensive and not intended for ageing."},"answer":"c","ctx":"Causal chain: warm, sunny Montalcino -> riper Sangiovese -> powerful, full-bodied wine.","src":"L2 book p. 108-109","cards":"L2-card-85, L2-card-84"},{"id":"Q-L2-23-09","level":"L2","lo":"LO4","ch":"23","topic":"Montepulciano style","trap":"MOST LIKELY stem; black vs red fruit","stem":"A deeply coloured red has medium acidity, high tannins and black plum and black cherry flavours. Which GI is it MOST LIKELY from?","options":{"a":"Valpolicella Classico","b":"Chianti Classico","c":"Montepulciano d'Abruzzo","d":"Barbera d'Asti"},"notes":{"a":"Corvina has high acidity, low to medium tannins and red fruit.","b":"Sangiovese has high acidity and red fruit (red cherry, red plum).","c":"Correct: Montepulciano gives deep colour, medium acidity, high tannins and black fruit.","d":"Barbera has high acidity, low to medium tannins and red fruit."},"answer":"c","ctx":"Of the ch 22-23 black grapes, only Montepulciano is black-fruited; the others give red fruit.","src":"L2 book p. 109 (Montepulciano)","cards":"L2-card-85"},{"id":"Q-L2-23-10","level":"L2","lo":"LO4","ch":"23","topic":"Montepulciano d'Abruzzo DOC","trap":"NOT stem; grape vs region name","stem":"Which of these statements about Montepulciano d'Abruzzo DOC is NOT correct?","options":{"a":"Some is matured briefly in oak.","b":"It is made mainly from Sangiovese.","c":"It comes from east-central Italy.","d":"Much of it is simple and fruity."},"notes":{"a":"True: the more concentrated wines may be matured for a short time in oak.","b":"Correct: this is the false statement. It is made from the Montepulciano grape.","c":"True: from the Abruzzo region, east of the Apennines.","d":"True: Abruzzo makes high volumes of inexpensive wine, typically for early drinking."},"answer":"b","ctx":"The name is grape plus region: Montepulciano (grape) from Abruzzo (region).","src":"L2 book p. 108-109","cards":"L2-card-85, L2-card-37"},{"id":"Q-L2-23-11","level":"L2","lo":"LO4","ch":"23","topic":"Italian naming conventions","trap":"Barbera d'Asti, not Asti (known gap)","stem":"Barbera d'Asti DOCG is named after what?","options":{"a":"Its region only","b":"Its grape and its producer","c":"Its grape variety only","d":"Its grape variety and its region"},"notes":{"a":"That is how Barolo, Barbaresco and Valpolicella are named.","b":"Not the book's convention: the name is grape plus region.","c":"Asti is a place; the name combines grape and region.","d":"Correct: it means 'Barbera from Asti' (L2 book p. 109)."},"answer":"d","ctx":"The book's region-only examples: Barolo DOCG, Barbaresco DOCG, Valpolicella DOC.","src":"L2 book p. 109 (Labelling in Italy)","cards":"L2-card-18"},{"id":"Q-L3-21-01","level":"L3","lo":"Stretch (L2 LO4)","ch":"21","topic":"Gavi acidity","trap":"","stem":"According to the L3 book, why does Cortese in Gavi keep its naturally high acidity?","options":{"a":"Altitude and sea breezes give a long, slow ripening.","b":"Fermentation in new oak barrels preserves the acidity.","c":"The grapes are dried indoors before fermentation.","d":"Warm, sandy plain soils speed up the ripening."},"notes":{"a":"Correct: per the L3 book, this emphasises Cortese's high acidity and floral character.","b":"Not the reason; cool fermentation in stainless steel is the norm for Gavi.","c":"Drying (passito) is a Veneto method for sweet or rich wines, not used for Gavi.","d":"Faster ripening would lower acidity, as on the warmer Soave plain."},"answer":"a","ctx":"L2 level: you only need Gavi = Cortese; dry, light-bodied, high acidity (L2 book p. 103).","src":"L3 book (2016) ch 27, p. 125","cards":"L3-stretch-38"},{"id":"Q-L3-21-02","level":"L3","lo":"Stretch (L2 LO4)","ch":"21","topic":"Soave hills vs plain","trap":"","stem":"Why do Soave grapes from the foothills tend to have higher acidity than those from the plain?","options":{"a":"Cool soils and altitude slow ripening, so acidity is kept.","b":"Hillside vines give higher yields, which dilutes sugar.","c":"Warm, sandy alluvial soils on the hills hold back sugar.","d":"Fog from the River Po shades the hillside vineyards."},"notes":{"a":"Correct: limestone, clay and volcanic soils plus altitude; full flavour ripeness yet high acidity.","b":"Not the L3 book's reason; it credits cool soils and altitude.","c":"Sandy, alluvial soils are on the plain, and they aid ripening.","d":"The L3 book links Po fog to disease on the flat plain, not hillside acidity."},"answer":"a","ctx":"Fits L2 Classico: L3 says foothill wines can be labelled Soave Classico. (2016 edition; may have changed)","src":"L3 book (2016) ch 27, p. 122-123","cards":"L3-stretch-39"},{"id":"Q-L3-22-01","level":"L3","lo":"Stretch (L2 LO4)","ch":"22","topic":"Nebbiolo colour","trap":"big structure, little colour","stem":"According to the L3 book, which of these black grapes is high in acidity and tannin but has little colour?","options":{"a":"Montepulciano","b":"Barbera","c":"Nebbiolo","d":"Dolcetto"},"notes":{"a":"High levels of colour and tannins, medium acidity (L3 p. 128).","b":"Medium to deep colour, low to medium tannins (L3 p. 124).","c":"Correct: per the L3 book (p. 124); big structure, little colour.","d":"Deep, often purple colour; medium to high tannins, medium acidity (L3 p. 124)."},"answer":"c","ctx":"The L2 book does not mention Nebbiolo's colour, so don't rely on it in the L2 exam.","src":"L3 book (2016) ch 27, p. 124","cards":"L3-stretch-38"},{"id":"Q-L3-22-02","level":"L3","lo":"Stretch (L2 LO4)","ch":"22","topic":"Ripasso method","trap":"Ripasso is L3 only","stem":"How is Valpolicella Ripasso DOC made, according to the L3 book?","options":{"a":"Valpolicella grapes are dried indoors before a slow fermentation.","b":"Finished Amarone is blended with a share of young Valpolicella.","c":"Fermentation stops naturally because the grapes are so sweet.","d":"Finished Valpolicella is refermented on unpressed Amarone skins."},"notes":{"a":"That is the passito (L2: appassimento) method for Amarone and Recioto.","b":"Ripasso uses the Amarone skins, not Amarone wine.","c":"That describes Recioto della Valpolicella, not Ripasso.","d":"Correct: yeast on the skins ferment the remaining sugar, adding colour, flavour and tannin."},"answer":"d","ctx":"Not in the L2 book or spec. Medium to full body, stewed red cherry and plum. (2016 edition; may have changed)","src":"L3 book (2016) ch 27, p. 123","cards":"L3-stretch-39"},{"id":"Q-L3-22-03","level":"L3","lo":"Stretch (L2 LO4)","ch":"22","topic":"Barbaresco vs Barolo","trap":"","stem":"According to the L3 book, why does Nebbiolo ripen earlier in Barbaresco than in Barolo?","options":{"a":"Lower altitude and the influence of a local river","b":"Higher altitude, which gives more intense sunlight","c":"North-facing slopes that receive more afternoon sun","d":"Warm sea breezes from the nearby Mediterranean coast"},"notes":{"a":"Correct: 200-400 m vs 300-500 m; the wines are fruitier and less perfumed.","b":"Barbaresco's slopes are lower (200-400 m) than Barolo's (300-500 m).","c":"Both regions have south-facing slopes.","d":"Not the L3 explanation, which gives lower altitude and a local river."},"answer":"a","ctx":"L2 says only that Barbaresco makes similarly powerful, long-lived Nebbiolo (L2 book p. 105).","src":"L3 book (2016) ch 27, p. 124","cards":"L3-stretch-38"},{"id":"Q-L3-23-01","level":"L3","lo":"Stretch (L2 LO4)","ch":"23","topic":"Chianti Classico status","trap":"","stem":"According to the L3 book, how is Chianti Classico DOCG related to Chianti DOCG?","options":{"a":"It is the Riserva level of Chianti DOCG.","b":"It has its own DOCG; it is not a sub-zone of Chianti.","c":"It is the name for Chianti from the flat coast.","d":"It is the best of the seven Chianti sub-zones."},"notes":{"a":"Riserva is an ageing term; Chianti Classico DOCG has its own Riserva.","b":"Correct: per the L3 book, which says Chianti DOCG has seven sub-zones.","c":"It sits at higher altitude; the flat Tuscan coast grows Bordeaux varieties.","d":"The L3 book says the sub-zones do not include Chianti Classico."},"answer":"b","ctx":"Well-known sub-zones: Chianti Rufina, Chianti Colli Senesi. (2016 edition; may have changed)","src":"L3 book (2016) ch 28, p. 126-127","cards":"L3-stretch-39"},{"id":"Q-L3-23-02","level":"L3","lo":"Stretch (L2 LO4)","ch":"23","topic":"Sangiovese and warmth","trap":"","stem":"Why, according to the L3 book, is Sangiovese suited to the warm climate of central Italy?","options":{"a":"Its thin skins need heat to build deep colour.","b":"Its low acidity needs warmth to be balanced.","c":"It is late ripening, so it needs a warm climate.","d":"It is early ripening, so it suits a short season."},"notes":{"a":"Not the reason given; the L3 book cites late ripening.","b":"Sangiovese has high acidity, not low.","c":"Correct: as stated in the L3 book.","d":"The reverse: the L3 book says it is late to ripen."},"answer":"c","ctx":"The moderator: altitude in the Apennine hills tempers the heat.","src":"L3 book (2016) ch 28, p. 126","cards":"L3-stretch-39"},{"id":"Q-L3-23-03","level":"L3","lo":"Stretch (L2 LO4)","ch":"23","topic":"Vino Nobile di Montepulciano","trap":"Montepulciano town vs grape","stem":"Vino Nobile di Montepulciano DOCG is made around the Tuscan town of Montepulciano. Which grape is it based on?","options":{"a":"Nebbiolo","b":"Sangiovese","c":"Montepulciano","d":"Corvina"},"notes":{"a":"Nebbiolo is Piemonte's grape (Barolo, Barbaresco).","b":"Correct: per the L3 book, it can be a blend of Sangiovese with other permitted varieties.","c":"The trap: the L3 book says Montepulciano d'Abruzzo has no relation to the Tuscan town.","d":"Corvina is the main grape of Valpolicella, in the Veneto."},"answer":"b","ctx":"Not on the L2 spec. Montepulciano: a grape in Abruzzo, a Sangiovese town in Tuscany. (2016 edition; may have changed)","src":"L3 book (2016) ch 28, p. 127-128","cards":"L3-stretch-39, L2-card-85"},{"id":"Q-L2-24-02","level":"L2","lo":"LO5","ch":"24","topic":"Source of the bubbles","trap":"","stem":"How do most premium-quality sparkling wine producers create the bubbles in their wines?","options":{"a":"By ageing the wine on its lees in an open tank for many months.","b":"By adding a sparkling liqueur d'expédition after disgorgement.","c":"By trapping CO2 from a second fermentation in a sealed vessel.","d":"By pumping carbon dioxide gas through the finished still wine."},"notes":{"a":"An open vessel lets the CO2 escape; the second fermentation must take place in a sealed vessel.","b":"The liqueur d'expédition sets the final sweetness; it does not create the bubbles.","c":"Correct: sugar and yeast are added to the dry base wine in a sealed bottle or tank; this also adds about 1.5% abv.","d":"Possible, but the book says most premium producers harness the CO2 made by fermentation instead."},"answer":"c","ctx":"Second fermentation: sugar + yeast added to a dry base wine -> alcohol (about +1.5% abv) and CO2.","src":"L2 book p. 111 (Second fermentation)","cards":"L2-card-86"},{"id":"Q-L2-24-03","level":"L2","lo":"LO5","ch":"24","topic":"Prosecco rosé","trap":"","stem":"Prosecco DOC rosé is made mainly from the same white grape as white Prosecco. Which grape is added in a small proportion to give the pink colour?","options":{"a":"Garnacha","b":"Meunier","c":"Corvina","d":"Pinot Noir"},"notes":{"a":"Not a Prosecco grape in the book; Garnacha is linked to Spain and the Rhône.","b":"A black Champagne grape, but the book names Pinot Noir for Prosecco rosé.","c":"The main Valpolicella grape of north-east Italy, but not used for Prosecco rosé.","d":"Correct: the book says rosé Prosecco is mainly Glera with a small proportion of Pinot Noir."},"answer":"d","ctx":"Prosecco DOC: north-east Italy, tank method, Glera; white or rosé; typically dry or off-dry.","src":"L2 book p. 115 (Tank-fermented sparkling wines)","cards":"L2-card-90"},{"id":"Q-L2-24-04","level":"L2","lo":"LO5","ch":"24","topic":"Autolysis intensity","trap":"","stem":"In a traditional-method sparkling wine, what mainly determines how intense its autolytic (biscuit, bread) flavours are?","options":{"a":"How much Chardonnay is used in the base wine blend","b":"Whether riddling is done by hand or by gyropalette","c":"How long the wine spends in contact with its lees","d":"How much sugar is added in the liqueur d'expédition"},"notes":{"a":"The grape mix shapes fruit character; autolytic intensity depends on time on the lees.","b":"Riddling only moves the lees into the neck of the bottle; it adds no flavour.","c":"Correct: the book says the number of months or years on the lees determines the intensity.","d":"Dosage sets the final sweetness, not the intensity of autolytic flavours."},"answer":"c","ctx":"Autolysis = the dead yeast (lees) breaking down after the second fermentation.","src":"L2 book p. 112 (The traditional method)","cards":"L2-card-87"},{"id":"Q-L2-24-05","level":"L2","lo":"LO5","ch":"24","topic":"Prosecco style","trap":"MOST LIKELY stem","stem":"A sparkling wine is light-bodied and off-dry, with pear, melon and blossom aromas and no autolytic notes. Which wine is it MOST LIKELY to be?","options":{"a":"Cava","b":"Asti DOCG","c":"Prosecco DOC","d":"Champagne AOC"},"notes":{"a":"Traditional method, so it has (subtle) autolytic character; light apple and lemon.","b":"Asti is sweet, not off-dry, with grape, peach and pear flavours from Moscato.","c":"Correct: Glera gives pear, melon and blossom; the tank method leaves no autolytic character; dry or off-dry.","d":"Traditional method, so it shows autolytic notes (biscuit, toast); usually Brut."},"answer":"c","ctx":"The tank method keeps the taste of the base wine, so Glera's pear and blossom show through.","src":"L2 book p. 115 (Tank-fermented sparkling wines)","cards":"L2-card-90"},{"id":"Q-L2-24-06","level":"L2","lo":"LO5","ch":"24","topic":"Traditional method order","trap":"order of stages","stem":"Which sequence correctly shows the traditional-method stages that follow the second fermentation in bottle?","options":{"a":"Dosage, autolysis, riddling, disgorgement","b":"Autolysis, disgorgement, riddling, dosage","c":"Riddling, autolysis, dosage, disgorgement","d":"Autolysis, riddling, disgorgement, dosage"},"notes":{"a":"Dosage is added after disgorgement, just before the bottle is resealed.","b":"The lees must be riddled into the neck before they can be disgorged.","c":"Autolysis happens while the wine rests on its lees, before riddling; dosage comes last.","d":"Correct: the lees break down, are moved into the neck, are ejected, then the bottle is topped up."},"answer":"d","ctx":"Riddling is now mostly done by gyropalette, a machine that can process hundreds of bottles at a time.","src":"L2 book p. 112-113 (The traditional method)","cards":"L2-card-87"},{"id":"Q-L2-24-07","level":"L2","lo":"LO5","ch":"24","topic":"Dosage","trap":"","stem":"In the traditional method, what does the dosage stage determine?","options":{"a":"The final alcohol level of the wine","b":"The pressure of the bubbles in the wine","c":"The intensity of the autolytic flavours","d":"The final sweetness of the wine"},"notes":{"a":"The second fermentation raises the abv (by about 1.5%); dosage is about sweetness.","b":"The pressure comes from CO2 trapped during the second fermentation.","c":"This is set by the time on the lees, before riddling and disgorgement.","d":"Correct: the liqueur d'expédition (wine plus, usually, sugar) sets the final sweetness."},"answer":"d","ctx":"'Dosage' also means the amount of sugar added at this stage.","src":"L2 book p. 113 (Dosage)","cards":"L2-card-87, L2-card-88"},{"id":"Q-L2-24-08","level":"L2","lo":"LO5","ch":"24","topic":"Brut","trap":"Brut has a little added sugar","stem":"Wines labelled 'Brut' have a very small amount of sugar added at dosage. Why do they still taste dry?","options":{"a":"Their high acidity and lively bubbles mask it.","b":"The yeast ferment the added sugar in the bottle.","c":"Their high alcohol balances out the sugar.","d":"Their autolytic flavours hide the sweetness."},"notes":{"a":"Correct: as stated in the book.","b":"No: dosage comes after disgorgement, once the lees (yeast) have been removed.","c":"Sparkling base wines are low in alcohol; the book credits acidity and bubbles.","d":"The book credits the acidity and bubbles, not autolysis."},"answer":"a","ctx":"Most traditional-method wines are labelled Brut.","src":"L2 book p. 113 (Dosage)","cards":"L2-card-88, L2-card-22"},{"id":"Q-L2-24-09","level":"L2","lo":"LO5","ch":"24","topic":"Demi-Sec","trap":"'Sec' sounds dry","stem":"What level of sweetness does the term 'Demi-Sec' indicate on a sparkling wine label?","options":{"a":"Medium sweetness","b":"No sweetness at all","c":"Full, luscious sweetness","d":"Very slight sweetness, tasting dry"},"notes":{"a":"Correct: the liqueur d'expédition contains more sugar for these wines.","b":"Demi-Sec has more sugar added at dosage than Brut, so it is not bone dry.","c":"Too sweet: the book says Demi-Sec indicates medium sweetness.","d":"That describes Brut: a very small amount of sugar, but it tastes dry."},"answer":"a","ctx":"Memory hook: 'demi-sec' is literally 'half-dry', but on sparkling wine it means medium sweet.","src":"L2 book p. 113 (Dosage)","cards":"L2-card-88, L2-card-22"},{"id":"Q-L2-24-10","level":"L2","lo":"LO5","ch":"24","topic":"Traditional Method term","trap":"","stem":"What does the term 'Méthode traditionnelle' on a sparkling wine label tell you?","options":{"a":"The second fermentation took place in the bottle.","b":"The second fermentation took place in a sealed tank.","c":"The wine was aged for at least three years on its lees.","d":"The wine was made in the Champagne region of France."},"notes":{"a":"Correct: all wines labelled Traditional Method or Méthode traditionnelle are made this way.","b":"That is the tank method (e.g. Prosecco).","c":"No lees time is implied; even Champagne's legal minimum is 12 months.","d":"The method is used worldwide, e.g. for Cava and Cap Classique."},"answer":"a","ctx":"","src":"L2 book p. 112 (The traditional method)","cards":"L2-card-87, L2-card-22"},{"id":"Q-L2-24-11","level":"L2","lo":"LO5","ch":"24","topic":"Champagne grapes","trap":"NOT stem; Chenin is a Cap Classique option","stem":"Which of these grape varieties is NOT one of the three typically blended to make Champagne?","options":{"a":"Pinot Noir","b":"Chardonnay","c":"Meunier","d":"Chenin Blanc"},"notes":{"a":"One of the three Champagne varieties.","b":"One of the three Champagne varieties.","c":"One of the three Champagne varieties, with Chardonnay and Pinot Noir.","d":"Correct: the book mentions it for some South African Cap Classique, not Champagne."},"answer":"d","ctx":"","src":"L2 book p. 113 (Bottle-fermented sparkling wines)","cards":"L2-card-88, L2-card-38"},{"id":"Q-L2-24-12","level":"L2","lo":"LO5","ch":"24","topic":"Champagne climate","trap":"","stem":"Why is the Champagne region well suited to making base wines for sparkling wine?","options":{"a":"Its warm climate gives very ripe grapes with high levels of sugar.","b":"Its cool climate gives base wines with high alcohol and full body.","c":"Its cool climate gives base wines low in alcohol and high in acidity.","d":"Its cool climate gives grapes with low acidity and soft, ripe fruit."},"notes":{"a":"Sparkling base wines should be low in alcohol, so very ripe grapes are not wanted.","b":"Cool climates give modest sugar, so the base wine is low in alcohol.","c":"Correct: the book says this provides ideal conditions for the base wine.","d":"Cool climates retain acidity; the base wine should be high in acid."},"answer":"c","ctx":"Causal chain: cool climate -> slower ripening -> grapes keep acid, sugar stays modest -> low-alcohol, high-acid base.","src":"L2 book p. 111, 113 (The base wine; Bottle-fermented sparkling wines)","cards":"L2-card-86, L2-card-88"},{"id":"Q-L2-24-13","level":"L2","lo":"LO5","ch":"24","topic":"Non-vintage Champagne","trap":"","stem":"Why are most Champagnes made as non-vintage wines?","options":{"a":"Blending several vintages adds autolytic biscuit and toast notes.","b":"Blending several vintages gives a consistent style each year.","c":"Blending several vintages raises the alcohol of the base wine.","d":"Blending several vintages lets them spend less time on lees."},"notes":{"a":"Autolytic notes come from time on the lees, not from blending vintages.","b":"Correct: the book says most Champagnes blend base wines from several vintages to achieve consistency.","c":"Base wines are meant to be low in alcohol; the blend is for consistency.","d":"Lees time is separate; even the cheapest Champagnes spend the 12-month legal minimum."},"answer":"b","ctx":"","src":"L2 book p. 113 (Bottle-fermented sparkling wines)","cards":"L2-card-88, L2-card-22"},{"id":"Q-L2-24-14","level":"L2","lo":"LO5","ch":"24","topic":"Vintage Champagne","trap":"Vintage vs non-vintage (known gap)","stem":"What does 'Vintage' on a bottle of Champagne indicate?","options":{"a":"The wine was aged for a stated time on its lees.","b":"The wine is a blend of the producer's best recent years.","c":"The wine is made every year from the best grapes.","d":"The grapes all come from a single exceptional year."},"notes":{"a":"Vintage refers to the harvest year, not lees time (though these wines do age long on lees).","b":"A blend of several vintages is non-vintage, the style of most Champagne.","c":"No: Vintage Champagne is made only in exceptional years (p. 113).","d":"Correct: best grapes of an exceptional year (p. 113); 'vintage' is the year the grapes were harvested (p. 38)."},"answer":"d","ctx":"L3 (2016) p. 178 confirms that in Champagne, Vintage means a single year. Vintage usually costs more than NV.","src":"L2 book p. 113, 115 (Bottle-fermented sparkling wines; Labelling)","cards":"L2-card-88, L2-card-22, L2-card-22b"},{"id":"Q-L2-24-15","level":"L2","lo":"LO5","ch":"24","topic":"Vintage Champagne style","trap":"nuts and honey = bottle age; Vintage Champagne (known gap)","stem":"A traditional-method sparkling wine shows pronounced apple, citrus and toasted-bread notes, with nuts and honey. Which is it MOST LIKELY to be?","options":{"a":"A high-volume non-vintage Cava","b":"An inexpensive non-vintage Champagne","c":"A very good non-vintage Champagne","d":"A Vintage Champagne"},"notes":{"a":"Simple, high-volume Cava has light apple and lemon with very subtle autolytic notes.","b":"These have apple and only light autolytic notes, after the 12-month legal minimum on lees.","c":"Apple, lemon, toast and biscuit, but the book links nuts and honey to Vintage bottle age.","d":"Correct: long lees ageing gives pronounced autolytic notes; extended bottle age after disgorgement adds nuts and honey."},"answer":"d","ctx":"Vintage Champagne: exceptional years only, small quantities, very high prices.","src":"L2 book p. 113-114 (Bottle-fermented sparkling wines; Cava)","cards":"L2-card-88, L2-card-89"},{"id":"Q-L2-24-16","level":"L2","lo":"LO5","ch":"24","topic":"Champagne lees minimum","trap":"","stem":"What is the legal minimum time that Champagne must spend ageing on its lees?","options":{"a":"24 months","b":"12 months","c":"5 years","d":"6 months"},"notes":{"a":"Longer than the legal minimum; many better wines do age for longer.","b":"Correct: the least expensive Champagnes usually spend this legal minimum.","c":"Far longer than the legal minimum, though top wines may age this long.","d":"Too short; the book gives a legal minimum of 12 months."},"answer":"b","ctx":"These cheapest Champagnes are dry, high in acid, with apple and light autolytic notes.","src":"L2 book p. 113 (Bottle-fermented sparkling wines)","cards":"L2-card-88"},{"id":"Q-L2-24-17","level":"L2","lo":"LO5","ch":"24","topic":"Cava harvest timing","trap":"","stem":"Why may grapes for Cava in Catalunya need to be harvested early?","options":{"a":"Early picking builds the sugar needed for the second fermentation.","b":"The warm climate means they must be picked to keep high acidity.","c":"Early picking adds the autolytic notes typical of Cava.","d":"The cool climate brings a risk of autumn frosts and rot."},"notes":{"a":"Sugar for the second fermentation is added with the yeast; early picking keeps acid.","b":"Correct: per the book; the base wine typically has light apple and lemon flavours.","c":"Autolytic notes come from lees ageing, and Cava's are very subtle.","d":"The book describes Catalunya's climate as warm, not cool."},"answer":"b","ctx":"Causal chain: warm climate -> sugar rises and acid falls quickly -> pick early -> high-acid base wine.","src":"L2 book p. 114 (Cava)","cards":"L2-card-89"},{"id":"Q-L2-24-18","level":"L2","lo":"LO5","ch":"24","topic":"Tank vs bottle character","trap":"LEAST stem","stem":"Which of these sparkling wines is LEAST likely to show any autolytic (bread, biscuit) character?","options":{"a":"Cava","b":"Cap Classique","c":"Prosecco DOC","d":"Non-vintage Champagne"},"notes":{"a":"Traditional method; shorter lees ageing than Champagne gives subtle, but present, autolytic notes.","b":"South African traditional method, so the wine ages on its lees in bottle.","c":"Correct: typically tank method; the lees are filtered out, so it tastes of the base wine.","d":"Traditional method, with at least 12 months on the lees."},"answer":"c","ctx":"","src":"L2 book p. 113-115","cards":"L2-card-89, L2-card-90"},{"id":"Q-L2-24-19","level":"L2","lo":"LO5","ch":"24","topic":"PDO labelling exemption","trap":"","stem":"Which pair of sparkling wines is exempt from having to state its PDO status on the label?","options":{"a":"Cava and Asti","b":"Champagne and Cava","c":"Champagne and Prosecco","d":"Prosecco and Asti"},"notes":{"a":"Cava is exempt, but the book does not name Asti.","b":"Correct: the book names Champagne as exempt and Cava as another notable exemption.","c":"Champagne is exempt, but the book does not name Prosecco.","d":"Neither is named as exempt in the book."},"answer":"b","ctx":"So you will never see 'Appellation Champagne Contrôlée' on a Champagne label.","src":"L2 book p. 115 (Labelling for sparkling wines)","cards":"L2-card-90, L2-card-22"},{"id":"Q-L2-24-20","level":"L2","lo":"LO5","ch":"24","topic":"New World vs Champagne","trap":"","stem":"Compared with Champagne, how do the best traditional-method wines from South Africa, the USA, Australia and New Zealand typically differ?","options":{"a":"Stronger autolytic notes, from a longer legal lees time.","b":"Higher acidity, from a much cooler growing season.","c":"Slightly riper fruit, from extra sunlight and warmth.","d":"Lower alcohol, from grapes picked at lower sugar levels."},"notes":{"a":"No lees rule is given for them; the book's difference is riper fruit.","b":"Champagne is the cooler region; these wines show riper fruit.","c":"Correct: per the book; the best come from the coolest regions and are intense with a long finish.","d":"Not the book's comparison; extra warmth gives riper fruit."},"answer":"c","ctx":"Many use the Champagne grapes Chardonnay and Pinot Noir.","src":"L2 book p. 114 (South Africa, USA, Australia and New Zealand)","cards":"L2-card-89"},{"id":"Q-L2-24-21","level":"L2","lo":"LO5","ch":"24","topic":"Cap Classique","trap":"","stem":"Which statement about South African Cap Classique is correct?","options":{"a":"It is tank-method wine, made mainly from Moscato for sweetness.","b":"It is traditional-method wine, made only from Champagne grapes.","c":"It is traditional-method wine, sometimes made from Chenin Blanc.","d":"It is tank-method wine, made mainly from Pinotage for colour."},"notes":{"a":"Cap Classique signifies the traditional method; sweet Moscato suggests the Asti method.","b":"Too narrow: other varieties such as Chenin Blanc may also be used.","c":"Correct: sometimes the Champagne grapes are used, other times varieties such as Chenin Blanc.","d":"Cap Classique signifies the traditional method (second fermentation in bottle)."},"answer":"c","ctx":"","src":"L2 book p. 114 (South Africa, USA, Australia and New Zealand)","cards":"L2-card-89, L2-card-22, L2-card-38"},{"id":"Q-L2-24-22","level":"L2","lo":"LO5","ch":"24","topic":"Tank method","trap":"NOT stem","stem":"Which of these is NOT a feature of the tank method for dry sparkling wines?","options":{"a":"Second fermentation in a sealed tank, not a bottle","b":"Lower cost and less labour than bottle fermentation","c":"Autolytic flavours from long contact with the lees","d":"Removal of the lees by filtration before bottling"},"notes":{"a":"This IS a feature: base wine, yeast and sugar go into a sealed tank.","b":"This IS a feature: the book says it is significantly less expensive and labour intensive.","c":"Correct: tank-method wines have no autolytic character and taste mainly of the base wine.","d":"This IS a feature: the lees are filtered out and the wine is bottled under pressure."},"answer":"c","ctx":"Why choose it: aromatic grape varieties keep their character without autolytic notes.","src":"L2 book p. 114 (Tank method - dry wines)","cards":"L2-card-90"},{"id":"Q-L2-24-23","level":"L2","lo":"LO5","ch":"24","topic":"Asti method","trap":"","stem":"In the Asti method, how is the fermentation stopped so the wine stays sweet and low in alcohol?","options":{"a":"Sugar is added to the tank after the yeasts have finished.","b":"The yeasts are filtered out before all the sugar has fermented.","c":"The tank is opened so that the CO2 escapes and the yeasts die.","d":"Grape spirit is added to kill the yeasts part-way through."},"notes":{"a":"The sweetness is grape sugar left unfermented, not sugar added afterwards.","b":"Correct: per the book; the tank is sealed part-way through so the CO2 is kept.","c":"CO2 escapes at the START; the tank is then sealed to keep the bubbles.","d":"That is fortification, as for Port; it would also raise the alcohol."},"answer":"b","ctx":"The Asti method starts from juice, not a dry base wine.","src":"L2 book p. 115 (The Asti method - sweet wines)","cards":"L2-card-90"},{"id":"Q-L2-24-24","level":"L2","lo":"LO5","ch":"24","topic":"Asti DOCG style","trap":"","stem":"A sparkling wine is sweet, light-bodied and low in alcohol, with pronounced blossom, grape and peach aromas. Which wine is it MOST LIKELY to be?","options":{"a":"Asti DOCG","b":"Cava","c":"Cap Classique","d":"Prosecco DOC"},"notes":{"a":"Correct: Moscato from Piemonte, made by the Asti method; usually fully sparkling.","b":"Traditional method: light apple and lemon with subtle autolytic notes; not grapey or sweet.","c":"Traditional method, so it has autolytic notes; not grapey and sweet.","d":"Glera gives pear, melon and blossom, but Prosecco is typically dry or off-dry."},"answer":"a","ctx":"A trend: sweet, low-alcohol, fully or lightly sparkling Moscato made worldwide by the Asti method.","src":"L2 book p. 115 (Tank-fermented sparkling wines)","cards":"L2-card-90, L2-card-38"},{"id":"Q-L2-25-03","level":"L2","lo":"LO5","ch":"25","topic":"Timing of fortification","trap":"","stem":"What is the key difference in when Sherry and Port are fortified?","options":{"a":"Each is fortified during fermentation, Sherry earlier than Port.","b":"Sherry during fermentation; Port after fermentation is complete.","c":"Each is fortified after fermentation, Port longer after than Sherry.","d":"Sherry after fermentation is complete; Port during fermentation."},"notes":{"a":"Sherry is fortified only after fermentation is complete.","b":"Reversed. That is why all Port is sweet while most Sherry is dry.","c":"Port is fortified to interrupt fermentation, which leaves sugar in the wine.","d":"Correct: Sherry is fortified once fermentation is complete; grape spirit interrupts Port's fermentation."},"answer":"d","ctx":"Fortification was traditionally used to protect wine from spoilage.","src":"L2 book p. 116, 118 (Sherry production; Port production)","cards":"L2-card-91, L2-card-93"},{"id":"Q-L2-25-04","level":"L2","lo":"LO5","ch":"25","topic":"Why Port is sweet","trap":"","stem":"What does the grape spirit added during Port fermentation do?","options":{"a":"It speeds up fermentation, so all the sugar is used.","b":"It sweetens the wine, as it is made from sun-dried grapes.","c":"It adds oxidative flavours to create the tawny styles.","d":"It kills the yeast, leaving a sweet wine high in alcohol."},"notes":{"a":"The reverse: it stops fermentation, leaving sugar unfermented.","b":"Grape spirit adds alcohol, not sugar; PX wine is used to sweeten some Sherries.","c":"Tawny character comes from long barrel ageing, not from the spirit.","d":"Correct: the fermentation is interrupted, so sugar remains (p. 118)."},"answer":"d","ctx":"","src":"L2 book p. 116, 118 (Fortified wines; Port production)","cards":"L2-card-91, L2-card-93"},{"id":"Q-L2-25-05","level":"L2","lo":"LO5","ch":"25","topic":"Sherry base grape","trap":"","stem":"From which grape variety is the base wine for almost all Sherry made?","options":{"a":"Moscato","b":"Palomino","c":"Pedro Ximénez","d":"Albariño"},"notes":{"a":"In the L2 book this is a grape for sweet sparkling wines such as Asti, not Sherry.","b":"Correct: a local white grape that gives a simple, dry base wine.","c":"Used for the sweet PX style, from sun-dried grapes; not the base for most Sherry.","d":"A Spanish white grape from Rías Baixas, used for still, unfortified wines."},"answer":"b","ctx":"Sherry comes from around Jerez de la Frontera in southern Spain.","src":"L2 book p. 116 (Sherry production)","cards":"L2-card-91"},{"id":"Q-L2-25-06","level":"L2","lo":"LO5","ch":"25","topic":"Solera system","trap":"","stem":"What is the main purpose of the solera system in Sherry production?","options":{"a":"To ferment the base wine slowly at a cool temperature.","b":"To add new-oak flavours such as vanilla to the maturing wine.","c":"To keep each vintage separate so it can be sold with its year.","d":"To blend wines of different ages for a consistent, complex style."},"notes":{"a":"The wine is fortified after fermentation, before it enters the solera.","b":"The solera uses OLD-oak casks; its purpose is blending, not oak flavour.","c":"The reverse: continual blending of different ages gives consistency.","d":"Correct: old-oak casks of wines of different ages are continually blended as they age."},"answer":"d","ctx":"It is in the solera that Sherry develops its distinctive flavours.","src":"L2 book p. 116 (Sherry production)","cards":"L2-card-91"},{"id":"Q-L2-25-07","level":"L2","lo":"LO5","ch":"25","topic":"Flor","trap":"","stem":"In biological ageing, how does the layer of flor affect a Fino Sherry?","options":{"a":"It shields the wine from oxygen and adds bread-dough notes.","b":"It adds sweetness and dried fruit such as fig and raisin.","c":"It exposes the wine to oxygen and adds walnut and caramel.","d":"It raises the alcohol and gives a deep brown colour."},"notes":{"a":"Correct: flor forms on the surface, protecting from oxygen, and gives Fino's bread-dough character.","b":"These describe PX; Fino is a dry style.","c":"These are oxidative notes, as in Oloroso, where there is no flor.","d":"Fino is pale lemon; a brown colour comes from oxidative ageing."},"answer":"a","ctx":"Flor is a thick white layer of yeast; ageing under it is called biological ageing.","src":"L2 book p. 116 (Dry Sherry styles)","cards":"L2-card-91"},{"id":"Q-L2-25-08","level":"L2","lo":"LO5","ch":"25","topic":"Fino style","trap":"Fino vs Amontillado","stem":"A dry Sherry is pale lemon, with aromas of apple, almonds and pronounced bread dough. Which style is it MOST LIKELY to be?","options":{"a":"Pale Cream","b":"Fino","c":"Oloroso","d":"Amontillado"},"notes":{"a":"A sweetened Fino; the stem says the wine is dry.","b":"Correct: biological ageing under flor gives bread dough; protection from oxygen keeps it pale.","c":"Brown, with raisin, prune, walnut and caramel; no flor character.","d":"Has bread dough too, but is notably deeper in colour, with walnut and caramel."},"answer":"b","ctx":"","src":"L2 book p. 116-118 (Sherry styles)","cards":"L2-card-91, L2-card-92"},{"id":"Q-L2-25-09","level":"L2","lo":"LO5","ch":"25","topic":"Fino after bottling","trap":"","stem":"When should a Fino Sherry be drunk after bottling, and how should it be served?","options":{"a":"Drunk as early as possible, at room temperature","b":"Cellared for several years, and decanted first","c":"Cellared for several years, and served chilled","d":"Drunk as early as possible, and served chilled"},"notes":{"a":"Right on timing, but the book says Fino is best served chilled.","b":"Decanting off a deposit applies to Vintage Port, not Fino.","c":"Fino loses its freshness rapidly after bottling; it does not improve.","d":"Correct: Fino rapidly loses its freshness after bottling and is best served chilled."},"answer":"d","ctx":"","src":"L2 book p. 116 (Dry Sherry styles)","cards":"L2-card-91"},{"id":"Q-L2-25-10","level":"L2","lo":"LO5","ch":"25","topic":"Amontillado production","trap":"","stem":"How is Amontillado Sherry made?","options":{"a":"Made from sun-dried grapes, then fortified and aged oxidatively.","b":"Aged under flor, then refortified so it ages oxidatively.","c":"Aged under flor throughout, then sweetened before bottling.","d":"Fortified to about 17% at the start, so flor never grows on it."},"notes":{"a":"That is PX (Pedro Ximénez).","b":"Correct: refortifying to about 17% abv kills the flor; it gains walnut and caramel on top of bread dough.","c":"That is Pale Cream (a sweetened Fino).","d":"That is Oloroso."},"answer":"b","ctx":"Amontillado sits between Fino and Oloroso in style: deeper in colour than Fino.","src":"L2 book p. 117 (Dry Sherry styles)","cards":"L2-card-92"},{"id":"Q-L2-25-11","level":"L2","lo":"LO5","ch":"25","topic":"Oloroso style","trap":"","stem":"A dry Sherry is brown, with aromas of raisin, prune, walnut and caramel and no bread-dough character. Which style is it MOST LIKELY to be?","options":{"a":"Fino","b":"Oloroso","c":"PX","d":"Amontillado"},"notes":{"a":"Pale lemon, with apple, almond and bread dough from flor.","b":"Correct: fortified to about 17% so no flor grows; oxidative ageing gives these notes.","c":"Brown, with dried fruit, but sweet; the stem says the wine is dry.","d":"Would also show bread-dough notes from its time under flor."},"answer":"b","ctx":"","src":"L2 book p. 116-118 (Sherry styles)","cards":"L2-card-92"},{"id":"Q-L2-25-12","level":"L2","lo":"LO5","ch":"25","topic":"Pale Cream","trap":"Pale Cream vs Cream","stem":"What is a Pale Cream Sherry?","options":{"a":"A dry, pale Amontillado","b":"A naturally sweet PX","c":"A sweetened Fino","d":"A sweetened Oloroso"},"notes":{"a":"Amontillado is dry and deeper than Fino; Pale Cream is sweet.","b":"PX is labelled PX (Pedro Ximénez): sun-dried grapes, deep brown.","c":"Correct: per the book.","d":"Sweetened Oloroso is usually labelled Medium or Cream."},"answer":"c","ctx":"Memory hook: PALE Cream comes from the PALE style, Fino.","src":"L2 book p. 118 (Sweet Sherry styles)","cards":"L2-card-92, L2-card-22"},{"id":"Q-L2-25-13","level":"L2","lo":"LO5","ch":"25","topic":"Medium and Cream","trap":"Pale Cream vs Cream","stem":"The terms 'Medium' and 'Cream' on a Sherry label are often used for which wines?","options":{"a":"Sweetened Fino Sherries","b":"Naturally sweet PX wines","c":"

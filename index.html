topic":"Rosé by short maceration","trap":"","stem":"When a rosé is made by short maceration, how does its production differ from that of a red wine?","options":{"a":"It is fermented on the skins at hotter temperatures.","b":"It is made from white grapes rather than black.","c":"It is drained off the skins after a few hours.","d":"It is pressed and blended with a white wine."},"notes":{"a":"After draining it ferments at white-wine temperatures, which are cooler than red.","b":"Short-maceration rosés are made from black grapes.","c":"Correct: it starts like a red but is drained after a few hours; fermentation goes on without the skins.","d":"Blending red with white is the other rosé method, not short maceration."},"answer":"c","ctx":"","src":"L2 book p. 42, 46 (Making dry rosé wines; Temperatures)","cards":"L2-card-43, L2-card-45"},{"id":"Q-L2-05-10","level":"L2","lo":"LO2","ch":"5","topic":"Rosé winemaking facts","trap":"NOT stem","stem":"Which of these statements about dry rosé winemaking is NOT correct?","options":{"a":"Most rosés are matured for a time in new oak barrels.","b":"Once drained, short-maceration rosé ferments cool.","c":"Short-maceration rosés are made from black grapes.","d":"Rosé can be made by blending red and white wine."},"notes":{"a":"Correct (the false statement): the book says rosés are rarely stored or matured in oak.","b":"True: it continues at white-wine temperatures (12-22°C).","c":"True: they start like a red wine, then are drained off the skins.","d":"True, though not permitted in many parts of Europe."},"answer":"a","ctx":"","src":"L2 book p. 42, 46 (Making dry rosé wines)","cards":"L2-card-43"},{"id":"Q-L2-05-11","level":"L2","lo":"LO2","ch":"5","topic":"Concentrated grape sugars","trap":"","stem":"Why does fermentation stop naturally, leaving residual sugar, in a sweet wine such as Tokaji Aszú?","options":{"a":"Sweet grape juice is added after the wine is fermented dry.","b":"Grape spirit is added, raising the alcohol and killing the yeast.","c":"Very fine filters remove the yeast while sugar still remains.","d":"The juice has so much sugar that the yeast cannot eat it all."},"notes":{"a":"That is adding sweetness to a dry wine; it does not stop a fermentation.","b":"That is fortification, as used for Port; the stem says it stops naturally.","c":"Removing the yeast is the book's method for White Zinfandel.","d":"Correct: juice from botrytised, extra-ripe or frozen grapes is too sugary for the yeast to finish."},"answer":"d","ctx":"Residual sugar = the sugar left in a wine after fermentation.","src":"L2 book p. 44 (Concentrated grape sugars)","cards":"L2-card-44"},{"id":"Q-L2-05-12","level":"L2","lo":"LO2","ch":"5","topic":"Removing the yeast","trap":"MOST stem","stem":"A winemaker wants to stop a pink wine's fermentation while sugar remains, without adding alcohol. Which technique is MOST appropriate?","options":{"a":"Remove the yeast from the juice using very fine filters.","b":"Ferment it at the cooler end of the white range.","c":"Add grape spirit to kill the yeast before they finish.","d":"Keep the wine in contact with its lees and stir them."},"notes":{"a":"Correct: the book's example is White Zinfandel from California.","b":"Cool fermentation can give fruity aromas; it does not stop the fermentation.","c":"Fortification raises the alcohol to 15-20% abv, which the winemaker wants to avoid.","d":"Lees stirring adds body and bread or biscuit flavours; it does not stop fermentation."},"answer":"a","ctx":"Four sweet routes: concentrated sugars, remove yeast, kill yeast (fortify), add sweetness to a dry wine.","src":"L2 book p. 44-45 (Removing the yeast)","cards":"L2-card-44"},{"id":"Q-L2-05-13","level":"L2","lo":"LO2","ch":"5","topic":"Fortification","trap":"","stem":"Why is there no risk that a fortified wine such as Port will start fermenting again in the bottle?","options":{"a":"All of its sugar has been fermented out before it is bottled.","b":"Its yeast are removed with fine filters before fortification.","c":"Its alcohol, at 15-20% abv, is high enough to kill the yeast.","d":"It is stored in airtight steel tanks that keep oxygen away."},"notes":{"a":"Port is sweet: fortification kills the yeast before all the sugar is fermented.","b":"Filtering out yeast is the White Zinfandel method; Port relies on added alcohol.","c":"Correct: the book says the high alcohol means there is no risk of further fermentation.","d":"Keeping out oxygen protects flavour; the book credits the high alcohol."},"answer":"c","ctx":"Compare: most dry wines are 11.5-16% abv; fortification takes a wine to 15-20% abv.","src":"L2 book p. 44 (Killing the yeast)","cards":"L2-card-44, L2-card-30"},{"id":"Q-L2-05-14","level":"L2","lo":"LO2","ch":"5","topic":"Adding sweetness","trap":"MOST stem","stem":"A producer wants an off-dry white with exactly the same level of sweetness every year. Which method gives the MOST precise control?","options":{"a":"Add sugar to the juice before fermentation.","b":"Ferment it dry, then add sweetness from grapes.","c":"Wait for noble rot to concentrate the sugars.","d":"Encourage full malolactic conversion."},"notes":{"a":"That raises the alcohol; the yeast ferment the extra sugar.","b":"Correct: the book says this lets winemakers precisely control the sweetness.","c":"Fermentation just stops when the yeast can eat no more; the book credits ADDING sweetness with precise control.","d":"MLF lowers acidity and can add buttery notes; it adds no sweetness."},"answer":"b","ctx":"Sweetener sources: unfermented grape juice, concentrated grape juice, or blending with a sweet wine.","src":"L2 book p. 44 (Adding sweetness to a dry wine)","cards":"L2-card-44"},{"id":"Q-L2-05-15","level":"L2","lo":"LO2","ch":"5","topic":"Adding sugar","trap":"adding sugar ≠ sweeter wine","stem":"In a cool vintage, why might a winemaker increase the level of sugar in the grape juice?","options":{"a":"To balance the low acidity of grapes from a cool vintage.","b":"To leave the finished wine noticeably sweeter on the palate.","c":"To raise the alcohol of a wine that would be thin and light.","d":"To help the yeast extract more colour from the black grape skins."},"notes":{"a":"Cool vintages give HIGH acidity; low acidity is a warm-climate problem.","b":"The yeast ferment the added sugar, so it raises alcohol, not sweetness.","c":"Correct: low-sugar grapes give low-alcohol wines lacking body; added sugar becomes alcohol.","d":"Colour extraction depends on skin contact and heat, not added sugar."},"answer":"c","ctx":"Causal chain: cool vintage -> low grape sugar -> low alcohol, light body -> add sugar -> more alcohol.","src":"L2 book p. 45 (Adjustments: Sugar)","cards":"L2-card-45"},{"id":"Q-L2-05-16","level":"L2","lo":"LO2","ch":"5","topic":"Acid adjustment","trap":"which climate adds vs neutralises acid","stem":"Which of these correctly matches a climate with the acid adjustment the book links to it?","options":{"a":"Warm climate: neutralise some of the acid","b":"Cool climate: add acid to the grape juice","c":"Cool climate: neutralise some of the acid","d":"Warm climate: add sugar to raise acidity"},"notes":{"a":"Warm-climate grapes are LOW in acid, so acid is added, not neutralised.","b":"Cool-climate grapes already have high acid; adding more would unbalance the wine.","c":"Correct: cool-climate grapes can be too high in acid, so some is neutralised.","d":"Adding sugar raises alcohol, not acidity; warm climates add acid."},"answer":"c","ctx":"Memory hook: warm = add acid; cool = add sugar and/or neutralise acid.","src":"L2 book p. 45 (Adjustments: Acid)","cards":"L2-card-45"},{"id":"Q-L2-05-17","level":"L2","lo":"LO2","ch":"5","topic":"Red fermentation temperature","trap":"","stem":"Why are red wines usually fermented at higher temperatures than white wines?","options":{"a":"To stop the fermentation while sugar remains.","b":"To produce more notable fruity aromas in the wine.","c":"To raise the final alcohol level of the wine.","d":"To help extract colour and tannin from the skins."},"notes":{"a":"Higher temperatures are used for extraction, not to stop fermentation.","b":"Fruity aromas are linked to the COOLER end of the white range.","c":"Alcohol depends on how much sugar is in the grapes.","d":"Correct: reds ferment at 20-32°C to help extraction from the skins."},"answer":"d","ctx":"","src":"L2 book p. 46 (Temperatures during the alcoholic fermentation)","cards":"L2-card-45, L2-card-30"},{"id":"Q-L2-05-18","level":"L2","lo":"LO2","ch":"5","topic":"White fermentation temperature","trap":"red vs white temperature ranges","stem":"What is the typical fermentation temperature range for white wines, and what can fermenting at the cooler end produce?","options":{"a":"20-32°C; notable fruity aromas","b":"12-22°C; notable fruity aromas","c":"12-22°C; deeper colour and tannin","d":"20-32°C; buttery, toasty flavours"},"notes":{"a":"20-32°C is the red-wine range.","b":"Correct: as given in the book.","c":"Colour and tannin extraction is the reason reds ferment warmer.","d":"Wrong range; buttery notes come from MLF and toast from oak."},"answer":"b","ctx":"Short-maceration rosé, once drained, ferments at white-wine temperatures.","src":"L2 book p. 46 (Temperatures during the alcoholic fermentation)","cards":"L2-card-45, L2-card-30"},{"id":"Q-L2-05-19","level":"L2","lo":"LO2","ch":"5","topic":"Inert vessels","trap":"","stem":"Which statement about stainless steel and concrete winery vessels is correct?","options":{"a":"Concrete adds flavour; stainless steel does not.","b":"They are inert and can also be made airtight.","c":"They let in oxygen, which softens tannins.","d":"They are used for storage but not fermentation."},"notes":{"a":"Both are inert: neither adds any flavour.","b":"Correct: neither adds flavour, and made airtight they stop oxygen changing the flavours.","c":"That describes oak, which is watertight but not airtight.","d":"The book says both can be used for fermentation and storage."},"answer":"b","ctx":"","src":"L2 book p. 46 (Winery vessels)","cards":"L2-card-45"},{"id":"Q-L2-05-20","level":"L2","lo":"LO2","ch":"5","topic":"Barrel toasting","trap":"","stem":"In barrel-making, what is meant by the 'level of toasting'?","options":{"a":"How long and how hot the staves are heated.","b":"How many times the barrel has been used.","c":"How long the wine is matured in the barrel.","d":"How much oxygen the barrel lets into the wine."},"notes":{"a":"Correct: staves are heated over a flame to bend them; time and heat set the toast level.","b":"That is the barrel's age (new oak vs old oak).","c":"That is the length of maturation, not toasting.","d":"Oxygen passes through all oak barrels; toast is about heating the staves."},"answer":"a","ctx":"Toasting can give sweet-spice and charred-wood aromas and flavours.","src":"L2 book p. 47 (Oak vessels)","cards":"L2-card-46"},{"id":"Q-L2-05-21","level":"L2","lo":"LO2","ch":"5","topic":"Oak and oxygen","trap":"oak flavour vs oxygen effect","stem":"During oak maturation, which flavours develop from the wine's interaction with oxygen?","options":{"a":"Biscuit, bread and fuller body","b":"Caramel, dried fruit and nuts","c":"Vanilla, coconut and charred wood","d":"Butter and softer acidity"},"notes":{"a":"These come from stirring the lees.","b":"Correct: oxygen entering the barrel can develop caramel, dried fruit and nut (hazelnut, almond, walnut).","c":"These are flavours added directly by new oak.","d":"These come from malolactic conversion (bacteria)."},"answer":"b","ctx":"Oxygen also helps soften the tannins in red wines.","src":"L2 book p. 47 (Oak vessels)","cards":"L2-card-46"},{"id":"Q-L2-05-22","level":"L2","lo":"LO2","ch":"5","topic":"Barrel size","trap":"","stem":"Why do oxygen-related changes happen more quickly in small barrels than in large oak vessels?","options":{"a":"More of the wine is in contact with the wood.","b":"Small barrels are airtight but not watertight.","c":"Small barrels are normally made of newer oak.","d":"Small barrels are usually given a heavier toast."},"notes":{"a":"Correct: the book says more of the wine's surface area is in contact with the barrel.","b":"Reversed: oak is watertight but not airtight.","c":"Barrel age affects oak flavour; size affects how fast changes happen.","d":"Toast affects flavour, not the rate of the oxygen changes."},"answer":"a","ctx":"","src":"L2 book p. 47 (Oak vessels)","cards":"L2-card-46"},{"id":"Q-L2-05-23","level":"L2","lo":"LO2","ch":"5","topic":"Large old oak","trap":"MOST stem","stem":"A winemaker wants a red's tannins to soften slowly through gentle contact with oxygen, with little added oak flavour. Which vessel is MOST suitable?","options":{"a":"An airtight concrete tank","b":"A large, old oak vessel","c":"A steel tank with oak chips","d":"A small, new oak barrel"},"notes":{"a":"Airtight inert vessels prevent oxygen interacting with the wine.","b":"Correct: oak lets oxygen in; large vessels are rarely used for oak flavour, and old oak has little left.","c":"Chips are used to ADD oak flavour; an airtight steel tank lets no oxygen in.","d":"New oak adds a great deal of flavour, and small barrels change the wine faster."},"answer":"b","ctx":"After two or three uses a barrel has very little flavour left to give the wine.","src":"L2 book p. 46-48 (Winery vessels; Oak vessels)","cards":"L2-card-46, L2-card-45"},{"id":"Q-L2-05-24","level":"L2","lo":"LO2","ch":"5","topic":"Malolactic conversion basics","trap":"bacteria, not yeast","stem":"Which microorganisms carry out malolactic conversion, and when does it take place?","options":{"a":"Yeast, after the alcoholic fermentation","b":"Bacteria, after the alcoholic fermentation","c":"Bacteria, before alcoholic fermentation","d":"Yeast, during the alcoholic fermentation"},"notes":{"a":"Yeast carry out the alcoholic fermentation; MLF is done by bacteria.","b":"Correct: it is not carried out by yeast but by bacteria, once fermentation has finished.","c":"The book says it takes place after the alcoholic fermentation has finished.","d":"Wrong on both counts: bacteria, and afterwards."},"answer":"b","ctx":"Effect: lowers acidity and can give buttery flavours.","src":"L2 book p. 48 (Malolactic conversion)","cards":"L2-card-46"},{"id":"Q-L2-05-25","level":"L2","lo":"LO2","ch":"5","topic":"Buttery Chardonnay","trap":"MOST LIKELY stem","stem":"A Chardonnay has softer acidity than expected and noticeable buttery flavours. Which winemaking step MOST LIKELY caused this?","options":{"a":"Malolactic conversion","b":"Maturing in new oak","c":"A cool fermentation","d":"Stirring the lees"},"notes":{"a":"Correct: bacteria lower acidity and can give buttery flavours; it suits certain Chardonnay styles.","b":"New oak adds vanilla, coconut, charred wood and spice.","c":"Cool fermentation is linked to notable fruity aromas.","d":"Lees stirring adds body and biscuit or bread flavours, not lower acidity."},"answer":"a","ctx":"","src":"L2 book p. 48 (Malolactic conversion)","cards":"L2-card-46"},{"id":"Q-L2-05-26","level":"L2","lo":"LO2","ch":"5","topic":"Blocking MLF in Riesling","trap":"","stem":"A winemaker making a dry Riesling wants to keep its high acidity and pure fruit. What should they do about malolactic conversion?","options":{"a":"Carry it out in new oak barrels.","b":"Encourage it to run to completion.","c":"Prevent it from taking place at all.","d":"Carry it out before fermentation."},"notes":{"a":"New oak would add oak flavours and MLF would still lower acidity.","b":"MLF lowers acidity and can add buttery notes, the opposite of the aim.","c":"Correct: the book says preventing MLF is a common choice for aromatic varieties such as Riesling.","d":"MLF follows the alcoholic fermentation; it would still lower acidity."},"answer":"c","ctx":"Reds: MLF nearly always happens and the buttery notes are not really noticeable. Whites: a choice.","src":"L2 book p. 48 (Malolactic conversion)","cards":"L2-card-46"},{"id":"Q-L2-05-27","level":"L2","lo":"LO2","ch":"5","topic":"Lees","trap":"","stem":"What are lees, and what can stirring them through a white wine during maturation add?","options":{"a":"Bacteria; lower acidity and buttery flavours","b":"Grape skins; deeper colour and more tannin","c":"Dead yeast; more body and biscuit or bread notes","d":"Oak chips; vanilla, toast and sweet-spice flavours"},"notes":{"a":"That describes malolactic conversion.","b":"Lees are dead yeast cells, not skins; white grapes are pressed before fermentation.","c":"Correct: as described in the book.","d":"Oak chips are an oak alternative, not lees."},"answer":"c","ctx":"Link to Ch 24: lees contact in bottle (autolysis) gives sparkling wines their bread and biscuit notes.","src":"L2 book p. 48 (Lees)","cards":"L2-card-46"},{"id":"Q-L2-05-28","level":"L2","lo":"LO2","ch":"5","topic":"Reasons for blending","trap":"NOT stem","stem":"Which of these is NOT a reason for blending given in the Level 2 book?","options":{"a":"To define and maintain a style","b":"To make the wine more complex","c":"To keep a brand tasting the same each year","d":"To add biscuit and bread flavours"},"notes":{"a":"A reason: the book says blending defines and maintains a wine's style.","b":"A reason: blending varieties, sites or techniques adds complexity.","c":"A reason: consumers expect some brands to taste the same each year (consistency).","d":"Correct (not a reason): biscuit and bread flavours come from stirring the lees, not from blending."},"answer":"d","ctx":"Spec: blending for consistency, complexity, style.","src":"L2 book p. 48 (Blending)","cards":"L2-card-46"},{"id":"Q-L2-05-29","level":"L2","lo":"LO2","ch":"5","topic":"Unfiltered wine","trap":"MOST LIKELY stem; haze is not always a fault","stem":"A premium red is slightly hazy in the glass but smells clean, with fresh fruit. Which explanation is MOST LIKELY?","options":{"a":"It has oxidised through a faulty closure.","b":"It has been damaged by too much heat.","c":"The winemaker chose not to filter it.","d":"It is affected by TCA cork taint."},"notes":{"a":"Oxidation shows browner colour, caramel notes and a lack of fresh fruit.","b":"Heat damage makes a wine lose freshness and fruit character.","c":"Correct: some winemakers skip filtration, so the wine may be less than perfectly clear.","d":"TCA gives damp-cardboard aromas and muted fruit, which the stem rules out."},"answer":"c","ctx":"Haze may mean a fault or simply no clarification; check the nose and palate.","src":"L2 book p. 49 (Clarification); p. 8 (Clarity); p. 23 (Faults)","cards":"L2-card-46, L2-card-29"},{"id":"Q-L2-05-30","level":"L2","lo":"LO2","ch":"5","topic":"Which wines age well","trap":"EXCEPT stem","stem":"Wines that can improve in bottle often have all of the following EXCEPT:","options":{"a":"high tannin (in reds)","b":"high sugar (in sweet wines)","c":"concentrated flavours","d":"low levels of acidity"},"notes":{"a":"They do: high tannin helps preserve red wines.","b":"They do: high residual sugar helps preserve sweet wines.","c":"They do: the book says enough flavour concentration to evolve positively matters above all.","d":"Correct (the exception): ageworthy wines often have HIGH acidity, which helps preserve them."},"answer":"d","ctx":"Most wines do NOT improve in bottle: fruit fades and is replaced by vegetal notes.","src":"L2 book p. 49 (Maturation in the bottle)","cards":"L2-card-10"},{"id":"Q-L2-05-31","level":"L2","lo":"LO2","ch":"5","topic":"White wine bottle ageing","trap":"whites deepen, reds pale","stem":"How does a white wine typically change as it matures in bottle?","options":{"a":"Its colour stays the same; vanilla and coconut notes develop.","b":"Its colour moves towards garnet; fig and prune notes develop.","c":"Its colour pales towards lemon; citrus and green apple develop.","d":"Its colour deepens towards amber; honey and nut notes develop."},"notes":{"a":"Colour changes with age; vanilla and coconut come from new oak.","b":"Garnet, fig and prune describe an ageing RED wine.","c":"Reversed: whites deepen with age, and fresh fruit gives way to tertiary notes.","d":"Correct: lemon -> gold -> amber and deeper; dried apricot, honey, nut and spice develop."},"answer":"d","ctx":"Trap: whites get DEEPER with age; reds get PALER.","src":"L2 book p. 49 (Changes to white wines)","cards":"L2-card-10"},{"id":"Q-L2-05-32","level":"L2","lo":"LO2","ch":"5","topic":"Aged red tasting note","trap":"MOST LIKELY stem","stem":"A red wine is pale garnet, with soft tannins and aromas of fig, prune, meat and wet leaves. Which explanation is MOST LIKELY?","options":{"a":"It was made by short maceration.","b":"It is a young wine matured in new oak barrels.","c":"It was fermented at a cool temperature.","d":"It has matured for many years in bottle."},"notes":{"a":"Short maceration makes rosé, not red; it does not explain tertiary notes.","b":"New oak adds vanilla, coconut, charred wood and spice; young reds are ruby or purple.","c":"Cooler fermentation is linked to fruity aromas in whites, not tertiary notes.","d":"Correct: garnet colour, softer tannins and fig, prune, meat and wet leaves are bottle-age signs."},"answer":"d","ctx":"Aged reds may throw a deposit; if it is heavy, decant before serving.","src":"L2 book p. 49 (Changes to red wines)","cards":"L2-card-10"},{"id":"Q-L3-05-02","level":"L3","lo":"Stretch (L2 LO2)","ch":"5","topic":"Sulfur dioxide","trap":"","stem":"Why must a winemaker keep monitoring and topping up sulfur dioxide (SO2) levels during winemaking?","options":{"a":"The fermentation yeast slowly consume it as a nutrient.","b":"It turns into acid, so the wine needs it to keep its acidity.","c":"It evaporates along with the carbon dioxide as fermentation proceeds.","d":"Once it reacts with oxygen it becomes 'bound' and stops protecting."},"notes":{"a":"The main yeast simply tolerates SO2; it does not feed on it.","b":"SO2 is an antioxidant and antiseptic, not a source of acidity.","c":"Not the reason given; the L3 book explains it by SO2 becoming bound.","d":"Correct: per the L3 book, SO2 then loses its protective effect, so levels need replenishing."},"answer":"d","ctx":"It is also antiseptic: the main fermentation yeast tolerates levels that kill spoilage yeasts and bacteria.","src":"L3 book (2016) ch 7, p. 44","cards":"L3-stretch-14"},{"id":"Q-L3-05-03","level":"L3","lo":"Stretch (L2 LO2)","ch":"5","topic":"Barrique and oxidation","trap":"","stem":"Why are wines rarely kept in 225-litre barriques for longer than about two years?","options":{"a":"Barriques are inert, so longer ageing adds nothing more.","b":"Small barrels have a strong oxidative effect on the wine.","c":"Barriques stop being watertight after two years of use.","d":"The law allows only two years in oak for most wines."},"notes":{"a":"Barriques are not inert; they add flavour and let oxygen in.","b":"Correct: per the L3 book, more wood surface per litre gives more oxidation, so time in barrique is limited.","c":"Oak is watertight; the limit comes from the oxidative effect.","d":"Not given; the L3 book explains it by the oxidative effect."},"answer":"b","ctx":"Wines in larger oak vessels (which can exceed 2,000 L) may be matured for longer.","src":"L3 book (2016) ch 7, p. 44","cards":"L3-stretch-14"},{"id":"Q-L3-05-04","level":"L3","lo":"Stretch (L2 LO2)","ch":"5","topic":"Cold soaking","trap":"","stem":"A red winemaker leaves crushed grapes at a low temperature before fermentation starts (cold soaking). Why does this extract little tannin?","options":{"a":"The cold temperature destroys the tannins in the grape skins.","b":"Tannins dissolve more readily once there is alcohol present.","c":"Cold soaking is done after pressing, so the skins are gone.","d":"The stems are removed first, and all tannin is in the stems."},"notes":{"a":"Tannins are not destroyed; they are simply extracted later, once alcohol forms.","b":"Correct: per the L3 book, the soak extracts colour and flavour; tannins are more soluble in alcohol.","c":"It happens on the crushed grapes, with the skins, before fermentation.","d":"Skins and seeds also contain tannins, not only the stems."},"answer":"b","ctx":"Purpose of the cold soak: extract colour and flavour compounds.","src":"L3 book (2016) ch 9, p. 63","cards":"L3-stretch-18"},{"id":"Q-L3-05-05","level":"L3","lo":"Stretch (L2 LO2)","ch":"5","topic":"Controlling red extraction","trap":"MOST stem","stem":"Near the end of a red fermentation, tannins are more easily extracted. Which step would MOST help a winemaker limit tannin extraction?","options":{"a":"Lower the temperature of the ferment.","b":"Raise the temperature above 35°C.","c":"Punch down the cap more often and harder.","d":"Add whole bunches with green stems."},"notes":{"a":"Correct: per the L3 book, lowering the temperature near the end can reduce tannin extraction.","b":"Above 35°C the yeast may be killed; heat also aids extraction.","c":"Punching down is very extractive; overworking the cap at the end gives bitter, astringent wine.","d":"Unripe stems give bitter tannins; the L3 book says stems must be fully ripe."},"answer":"a","ctx":"L2 link: reds ferment warm (20-32°C) precisely because heat helps extract colour and tannin.","src":"L3 book (2016) ch 9, p. 63-64","cards":"L3-stretch-18"},{"id":"Q-L3-05-06","level":"L3","lo":"Stretch (L2 LO2)","ch":"5","topic":"White fermentation too cold","trap":"","stem":"What does the L3 book say is the risk of fermenting a white wine below its optimum temperature range of 12-22°C?","options":{"a":"Too much colour and tannin extracted from the grape skins.","b":"More complex non-fruit aromas, and the varietal fruit may be lost.","c":"Buttery flavours, because malolactic conversion is triggered.","d":"Pear-drop aromas, and the varietal fruit may not come through."},"notes":{"a":"White juice is fermented without the skins; extraction is a red concern.","b":"That is the risk of fermenting too WARM.","c":"Warmth encourages MLF; cool storage is a way to prevent it.","d":"Correct: as stated in the L3 book."},"answer":"d","ctx":"L2 link: the cooler end of 12-22°C gives notable fruity aromas (L2 p. 46); 'too cold' means below that.","src":"L3 book (2016) ch 8, p. 55","cards":"L3-stretch-16"},{"id":"Q-L3-05-07","level":"L3","lo":"Stretch (L2 LO2)","ch":"5","topic":"Preventing MLF","trap":"","stem":"According to the L3 book, how can a winemaker prevent malolactic fermentation in a white wine?","options":{"a":"Store it cool, add SO2, or filter out the bacteria.","b":"Warm the wine and add no SO2 after fermentation.","c":"Mature the wine in small, new oak barrels.","d":"Keep the wine on its fine lees and stir them regularly."},"notes":{"a":"Correct: all three are given in the L3 book.","b":"These ENCOURAGE MLF.","c":"Oak adds flavour and oxygen; it does not block MLF.","d":"Lees contact adds flavour and texture; it is not a way to block MLF."},"answer":"a","ctx":"The why: bacteria turn tart malic acid (apples) into softer lactic acid (milk), lowering acidity.","src":"L3 book (2016) ch 7, p. 49","cards":"L3-stretch-15"},{"id":"Q-L3-05-08","level":"L3","lo":"Stretch (L2 LO2)","ch":"5","topic":"Gross vs fine lees","trap":"gross vs fine lees","stem":"Why is a wine usually separated from its gross lees soon after fermentation, while fine lees may be kept?","options":{"a":"Gross lees stay suspended for months, making the wine cloudy.","b":"Gross lees can cause unpleasant aromas if they are left in the wine.","c":"Gross lees contain the bacteria that would start malolactic conversion.","d":"Gross lees add too much tannin, while fine lees add only body."},"notes":{"a":"Gross lees are heavy and settle within hours; fine lees settle more slowly.","b":"Correct: per the L3 book; fine lees can be kept to add flavour and a richer texture.","c":"Not the L3 book's reason; it says gross lees can cause unpleasant aromas.","d":"Lees are dead yeast and grape fragments; tannin is not the issue given."},"answer":"b","ctx":"Removing the wine from its settled lees into another vessel is called racking (L3 p. 50).","src":"L3 book (2016) ch 7, p. 49","cards":"L3-stretch-15"},{"id":"Q-L3-05-09","level":"L3","lo":"Stretch (L2 LO2)","ch":"5","topic":"Stopping fermentation","trap":"","stem":"When a sweet wine's fermentation is stopped by chilling or adding SO2, why must it then be filtered and kept away from yeast?","options":{"a":"The chilled wine would otherwise begin malolactic conversion.","b":"Any yeast left in the wine could restart the fermentation.","c":"The yeast would turn the remaining sugar into acid.","d":"Filtering raises the alcohol to a level that kills the yeast."},"notes":{"a":"MLF is done by bacteria, and cool storage helps to prevent it.","b":"Correct: per the L3 book, fermentation will resume if any yeast come into contact with the wine.","c":"Yeast turn sugar into alcohol and carbon dioxide, not acid.","d":"Filtering removes yeast; only fortification raises alcohol to kill them."},"answer":"b","ctx":"Used for high-quality German Kabinett and Spätlese, and Asti; such wines are typically low in alcohol.","src":"L3 book (2016) ch 8, p. 58","cards":"L3-stretch-17"},{"id":"Q-L2-06-02","level":"L2","lo":"LO3","ch":"6","topic":"Pinot Noir tasting profile","trap":"","stem":"A red wine is pale ruby, with high acidity, low tannin, fresh strawberry and raspberry fruit and subtle smoke and clove. Which grape is it MOST LIKELY made from?","options":{"a":"Syrah","b":"Cabernet Sauvignon","c":"Zinfandel","d":"Pinot Noir"},"notes":{"a":"Syrah is known for black fruit and black pepper aromas, not fresh strawberry and raspberry (L2 book p. 90).","b":"Cabernet is deeply coloured and high in tannin, with black fruit, not a pale, low-tannin red.","c":"Red Zinfandel is full-bodied and high in alcohol with medium to high tannin, not pale and low-tannin (L2 book p. 56).","d":"Correct: pale to medium colour, high acid, low to medium tannin, red fruit; the best show subtle oak (smoke, cloves, vanilla)."},"answer":"d","ctx":"","src":"L2 book p. 51 (The characteristics of Pinot Noir)","cards":"L2-card-47"},{"id":"Q-L2-06-03","level":"L2","lo":"LO3","ch":"6","topic":"Pinot Noir in warm climates","trap":"","stem":"What is the MOST LIKELY result of growing Pinot Noir in a climate that is too warm for it?","options":{"a":"Cooked fruit flavours and too much alcohol","b":"Higher acidity and green, herbal flavours","c":"Botrytis that makes it suited to sweet wines","d":"Deeper colour and much firmer tannins"},"notes":{"a":"Correct: it loses fresh fruit and tastes cooked (p. 51); too-warm sites give overly alcoholic wines (p. 55).","b":"These are signs of under-ripeness in cool conditions, not of too much heat.","c":"Botrytis is not mentioned for Pinot Noir; heat causes cooked flavours.","d":"Pinot Noir is pale to medium with low to medium tannin; warmth does not give it firm tannins."},"answer":"a","ctx":"Causal chain: too warm -> fresh red fruit lost -> cooked flavours and high alcohol, out of balance.","src":"L2 book p. 51, 55 (Pinot Noir today)","cards":"L2-card-47"},{"id":"Q-L2-06-04","level":"L2","lo":"LO3","ch":"6","topic":"Oak and Pinot Noir","trap":"","stem":"Why do many producers mature Pinot Noir in older and/or larger oak barrels?","options":{"a":"They add tannin to balance the high acidity.","b":"They give stronger smoke and vanilla aromas.","c":"They extract more colour from the thin Pinot skins.","d":"They give less flavour, so the fruit is not masked."},"notes":{"a":"Not the reason given; the aim is to avoid strong oak flavour, not to add tannin.","b":"The reverse: older and larger barrels give LESS oak flavour than small new ones.","c":"Colour is extracted during fermentation on the skins, not in maturation barrels.","d":"Correct: strong flavours from small new-oak barrels can easily overwhelm delicate Pinot Noir."},"answer":"d","ctx":"With bottle age, the best Pinot Noirs develop tertiary forest floor and mushroom.","src":"L2 book p. 51 (Winemaking and maturation options)","cards":"L2-card-47"},{"id":"Q-L2-06-05","level":"L2","lo":"LO3","ch":"6","topic":"Burgundy hierarchy","trap":"","stem":"Which of these puts the Burgundy appellation hierarchy in order from the bottom to the top?","options":{"a":"Village, regional, premier cru, grand cru","b":"Regional, village, grand cru, premier cru","c":"Regional, village, premier cru, grand cru","d":"Regional, premier cru, village, grand cru"},"notes":{"a":"Regional appellations such as Bourgogne AOC are below the village appellations.","b":"Grand cru is the top of the hierarchy, above premier cru.","c":"Correct: Bourgogne AOC at the bottom, grand crus at the top.","d":"Premier cru vineyards lie WITHIN village appellations and rank above them."},"answer":"c","ctx":"Burgundy labelling terms on the spec: Premier Cru and Grand Cru.","src":"L2 book p. 53 (Labelling in Burgundy)","cards":"L2-card-19, L2-card-48"},{"id":"Q-L2-06-06","level":"L2","lo":"LO3","ch":"6","topic":"Burgundy Premier Cru label","trap":"","stem":"A label reads 'Gevrey-Chambertin Clos Saint-Jacques, Appellation Gevrey-Chambertin Premier Cru Contrôlée'. What does this tell you about the wine?","options":{"a":"It is from one premier cru vineyard in Gevrey-Chambertin.","b":"It is a blend of premier crus from several Côte d'Or villages.","c":"It is from a grand cru vineyard with its own appellation.","d":"It is a regional wine that can come from all of Burgundy."},"notes":{"a":"Correct: Premier Cru goes with the village name; a single-vineyard wine may also name the vineyard.","b":"The label names one village and one vineyard, so it is not a multi-village blend.","c":"Grand cru labels show the vineyard name with 'Grand Cru', e.g. Le Chambertin Grand Cru.","d":"That describes Bourgogne AOC, the broadest regional appellation."},"answer":"a","ctx":"","src":"L2 book p. 53 (Labelling in Burgundy)","cards":"L2-card-19"},{"id":"Q-L2-06-07","level":"L2","lo":"LO3","ch":"6","topic":"Burgundy grand crus","trap":"NOT stem","stem":"Which statement about Burgundy's grand cru vineyards is NOT correct?","options":{"a":"They make the rarest, most age-worthy Burgundies.","b":"Their wines command exceptionally high prices.","c":"Each has been awarded its own appellation.","d":"They lie mostly on flat, fertile valley land."},"notes":{"a":"True: they give the most concentrated, complex wines with the greatest ageing potential.","b":"True: because of their quality and rarity.","c":"True: the vineyard name appears on the label with the term 'Grand Cru AOC'.","d":"Correct (the false statement): they are well-situated plots, commonly on south- or south-east-facing slopes."},"answer":"d","ctx":"","src":"L2 book p. 52-53 (Premier cru and grand cru wines; Labelling in Burgundy)","cards":"L2-card-19, L2-card-48"},{"id":"Q-L2-06-08","level":"L2","lo":"LO3","ch":"6","topic":"Village vs Bourgogne AOC","trap":"","stem":"Compared with a typical red Bourgogne AOC, a red Pommard AOC is MOST LIKELY to show:","options":{"a":"a lower price, as it is a broader area.","b":"less ageing potential and less tannin.","c":"more intensity, complexity and length.","d":"lighter body and simpler, fresher fruit."},"notes":{"a":"Pommard is a single village, narrower than Bourgogne AOC, which covers all of Burgundy.","b":"Bourgogne AOC lacks the intensity to age; the best village wines can age in bottle.","c":"Correct: village vineyards are better sited and give more flavour intensity, complexity and length.","d":"That describes Bourgogne AOC: light to medium body, fresh red fruit, drink young."},"answer":"c","ctx":"Pommard and Beaune: Côte de Beaune villages. Gevrey-Chambertin and Nuits-Saint-Georges: Côte de Nuits.","src":"L2 book p. 52-53 (Bourgogne AOC; Village wines)","cards":"L2-card-48, L2-card-19"},{"id":"Q-L2-06-09","level":"L2","lo":"LO3","ch":"6","topic":"Côte de Beaune villages","trap":"Pommard is Côte de Beaune; Burgundy Pinot villages (known gap)","stem":"Which pair of Pinot Noir village appellations are BOTH in the Côte de Beaune?","options":{"a":"Gevrey-Chambertin and Nuits-Saint-Georges","b":"Nuits-Saint-Georges and Beaune","c":"Beaune and Pommard","d":"Gevrey-Chambertin and Pommard"},"notes":{"a":"Both are in the Côte de Nuits, the northern half of the Côte d'Or.","b":"Beaune is Côte de Beaune, but Nuits-Saint-Georges is in the Côte de Nuits.","c":"Correct: the book gives Beaune AOC and Pommard AOC as the Côte de Beaune examples.","d":"Pommard is Côte de Beaune, but Gevrey-Chambertin is in the Côte de Nuits."},"answer":"c","ctx":"Hook: each Côte is named after a village in it - Beaune for the Côte de Beaune, Nuits for the Côte de Nuits.","src":"L2 book p. 52 (Village wines)","cards":"L2-card-48, L2-card-34"},{"id":"Q-L2-06-10","level":"L2","lo":"LO3","ch":"6","topic":"Nuits-Saint-Georges label","trap":"Burgundy Pinot villages (known gap)","stem":"A red Burgundy is labelled 'Nuits-Saint-Georges AOC' with no other quality term. Which description fits it?","options":{"a":"A grand cru wine from the Côte de Nuits","b":"A regional wine from all over Burgundy","c":"A village wine from the Côte de Beaune","d":"A village wine from the Côte de Nuits"},"notes":{"a":"Grand cru labels name the vineyard and state 'Grand Cru'; this names a village only.","b":"The broadest regional appellation is Bourgogne AOC.","c":"Wrong half: the Côte de Beaune examples are Beaune and Pommard.","d":"Correct: Nuits-Saint-Georges is a village appellation in the Côte de Nuits."},"answer":"d","ctx":"","src":"L2 book p. 52-53 (Village wines; Labelling in Burgundy)","cards":"L2-card-48, L2-card-19"},{"id":"Q-L2-06-12","level":"L2","lo":"LO3","ch":"6","topic":"Burgundy site aspect","trap":"","stem":"Why are Burgundy's best Pinot Noir vineyards commonly on south- or south-east-facing slopes?","options":{"a":"They are cooled by breezes from the Atlantic.","b":"They receive less sunlight, slowing ripening.","c":"They receive extra sunlight and warmth.","d":"They have deeper and more fertile soils."},"notes":{"a":"Not the book's explanation; the benefit is extra sunlight and warmth.","b":"The reverse: these slopes get EXTRA sunlight, which a cool to moderate climate needs.","c":"Correct: this lets them produce concentrated, complex wines suitable for bottle ageing.","d":"The book links these sites to sunlight; fertile soils are not the reason given."},"answer":"c","ctx":"Burgundy runs from cool in the north to moderate further south; Pinot is best where it can fully ripen.","src":"L2 book p. 52 (Burgundy, France)","cards":"L2-card-48"},{"id":"Q-L2-06-13","level":"L2","lo":"LO3","ch":"6","topic":"California Pinot Noir regions","trap":"","stem":"Which of these correctly matches a Pinot Noir region with the cooling influence the book describes for it?","options":{"a":"Santa Barbara County: sea breezes from west and south","b":"Oregon: morning fogs drifting in from San Pablo Bay","c":"Western Sonoma: a ring of mountains blocking the sea","d":"Los Carneros: cool breezes blowing from the Southern Ocean"},"notes":{"a":"Correct: in California's Central Coast, cooled by sea breezes from the west and south.","b":"Oregon is cooler due to its northerly latitude and Pacific exposure.","c":"Western Sonoma is cooled by Pacific Ocean breezes; the ring of mountains is Central Otago.","d":"Los Carneros is cooled by morning fogs from the San Pablo Bay."},"answer":"a","ctx":"Californian Pinot: ripe strawberry and red cherry, often notable oak (smoke, cloves, vanilla).","src":"L2 book p. 54 (USA)","cards":"L2-card-49"},{"id":"Q-L2-06-14","level":"L2","lo":"LO3","ch":"6","topic":"Oregon Pinot Noir","trap":"","stem":"Why is Oregon generally cooler than California, with a mostly moderate climate ideal for Pinot Noir?","options":{"a":"Its morning fogs drawn in from the San Pablo Bay","b":"Its cooling breezes blowing off the Southern Ocean","c":"Its northerly latitude and Pacific Ocean exposure","d":"Its ring of mountains blocking rain and sea breezes"},"notes":{"a":"That describes Los Carneros in California.","b":"That describes Yarra Valley and Mornington Peninsula in Australia.","c":"Correct: as the book states; best wines show complex fresh red fruit and subtle oak.","d":"That describes Central Otago in New Zealand."},"answer":"c","ctx":"Oregon Pinot can develop earth and mushroom with bottle age.","src":"L2 book p. 54 (Oregon)","cards":"L2-card-49"},{"id":"Q-L2-06-15","level":"L2","lo":"LO3","ch":"6","topic":"Casablanca Valley Pinot Noir","trap":"MOST LIKELY stem","stem":"A Pinot Noir with strawberry fruit and sometimes herbal notes comes from a coastal region cooled by Pacific sea breezes and morning fogs, and offers excellent value. Where is it MOST LIKELY from?","options":{"a":"Mornington Peninsula","b":"Central Otago","c":"Casablanca Valley","d":"Walker Bay"},"notes":{"a":"Cooled by breezes from the Southern Ocean, not the Pacific.","b":"Protected FROM sea breezes by mountains; New Zealand's ripest, most powerful Pinot.","c":"Correct: Chile's coastal Casablanca Valley; red fruit, sometimes herbal, excellent value.","d":"Walker Bay is cooled by strong southerly sea breezes, not Pacific fogs; vibrant red fruit."},"answer":"c","ctx":"","src":"L2 book p. 54-55 (Chile)","cards":"L2-card-49, L2-card-50"},{"id":"Q-L2-06-16","level":"L2","lo":"LO3","ch":"6","topic":"South African Pinot Noir","trap":"Elgin/Constantia = Sauvignon Blanc (known gap)","stem":"Which South African GI is listed for Pinot Noir in the Level 2 specification?","options":{"a":"Constantia","b":"Walker Bay","c":"Stellenbosch","d":"Elgin"},"notes":{"a":"Constantia is listed for Sauvignon Blanc (Southern Ocean breezes).","b":"Correct: strong southerly sea breezes encourage vibrant red fruit; very good to outstanding wines.","c":"Stellenbosch is listed for Cabernet Sauvignon and Merlot.","d":"Elgin is listed for Sauvignon Blanc (cooled by altitude)."},"answer":"b","ctx":"Walker Bay is also listed for Chardonnay.","src":"L2 spec p. 10; L2 book p. 54 (South Africa)","cards":"L2-card-50, L2-card-34"},{"id":"Q-L2-06-17","level":"L2","lo":"LO3","ch":"6","topic":"Australian Pinot Noir","trap":"","stem":"Which two Australian regions are listed for Pinot Noir in the Level 2 specification?","options":{"a":"Eden Valley and Hunter Valley","b":"Barossa Valley and Clare Valley","c":"Yarra Valley and Mornington Peninsula","d":"Coonawarra and Margaret River"},"notes":{"a":"Eden is a Riesling region; Hunter is listed for Semillon and Shiraz.","b":"Barossa is warm (Shiraz); Clare is a Riesling region in South Australia.","c":"Correct: in Victoria, among the few Australian regions cool enough for Pinot Noir, thanks to Southern Ocean breezes.","d":"Both are listed for Cabernet Sauvignon, not Pinot Noir."},"answer":"c","ctx":"Style range: light and fragrant to riper, cooked red fruit (red plum, strawberry), medium tannins.","src":"L2 book p. 54 (Australia); L2 spec p. 10","cards":"L2-card-50, L2-card-34"},{"id":"Q-L2-06-18","level":"L2","lo":"LO3","ch":"6","topic":"Central Otago Pinot Noir","trap":"Central Otago diurnal range (known gap)","stem":"Despite its southerly latitude, Central Otago makes New Zealand's ripest Pinot Noir. Which conditions explain this?","options":{"a":"A ring of mountains, very sunny days and cool nights","b":"Morning fogs from the Pacific and gravel soils","c":"Low altitude near the coast and high rainfall","d":"Warm sea breezes and mild, cloudy nights throughout the year"},"notes":{"a":"Correct: mountains block sea breezes and rain; intense sun ripens, cool nights keep freshness.","b":"Fogs are a feature of Casablanca and Los Carneros, not Central Otago.","c":"It is shielded from rain; low coastal sites are not the explanation.","d":"The mountains PROTECT it from sea breezes; nights are cool."},"answer":"a","ctx":"Style: pronounced strawberry and red cherry, medium to full body, medium tannins; often oaked.","src":"L2 book p. 55 (New Zealand)","cards":"L2-card-50"},{"id":"Q-L2-06-19","level":"L2","lo":"LO3","ch":"6","topic":"New Zealand Pinot Noir GIs","trap":"NOT stem; Hawke's Bay is not a Pinot GI","stem":"Which of these New Zealand GIs is NOT listed for Pinot Noir in the Level 2 specification?","options":{"a":"Martinborough","b":"Hawke's Bay","c":"Central Otago","d":"Marlborough"},"notes":{"a":"Listed: a cool climate producing very good and outstanding Pinot Noir.","b":"Correct: Hawke's Bay is listed for Merlot, Cabernet Sauvignon and Chardonnay.","c":"Listed: New Zealand's ripest, most powerfully flavoured Pinot Noir.","d":"Listed: cool climate; also listed for Sauvignon Blanc and Chardonnay."},"answer":"b","ctx":"Pinot Noir is New Zealand's premier black grape.","src":"L2 spec p. 10; L2 book p. 55","cards":"L2-card-34, L2-card-50"},{"id":"Q-L2-07-01","level":"L2","lo":"LO4","ch":"7","topic":"Zinfandel ripening flavours","trap":"","stem":"Zinfandel/Primitivo needs a warm climate to ripen. How do its fruit flavours change as the grapes ripen?","options":{"a":"From red fruit to black fruit","b":"From black fruit to red fruit","c":"From red fruit to herbal notes","d":"From black fruit to forest floor"},"notes":{"a":"Correct: from strawberry and raspberry to black plum, blackberry and blueberry.","b":"Reversed: red fruit comes first, black fruit with more ripeness.","c":"Herbal notes are not described for Zinfandel; ripening moves to black fruit.","d":"Forest floor is a tertiary note from bottle age (typical of Pinot Noir)."},"answer":"a","ctx":"","src":"L2 book p. 56 (Zinfandel/Primitivo)","cards":"L2-card-51"},{"id":"Q-L2-07-02","level":"L2","lo":"LO4","ch":"7","topic":"Zinfandel uneven ripening","trap":"","stem":"Why can Zinfandel grapes reach high sugar levels and give wines dried-fruit flavours such as prune and raisin?","options":{"a":"Noble rot shrivels the berries late in the season.","b":"Some grapes raisin before the rest of the bunch ripens.","c":"The grapes are dried on mats for months after they are harvested.","d":"The grapes freeze on the vine before being picked."},"notes":{"a":"Botrytis is not part of the Zinfandel story; the cause is uneven ripening.","b":"Correct: uneven ripening within the bunch gives high sugar and dried-fruit flavours.","c":"Drying after harvest is the Amarone method (appassimento), not the book's explanation.","d":"Freezing on the vine is how icewine/Eiswein is made."},"answer":"b","ctx":"","src":"L2 book p. 56 (Zinfandel/Primitivo)","cards":"L2-card-51"},{"id":"Q-L2-07-03","level":"L2","lo":"LO4","ch":"7","topic":"White Zinfandel winemaking","trap":"","stem":"How are the low alcohol and medium sweetness of a typical White Zinfandel achieved?","options":{"a":"The yeasts are removed before fermentation finishes.","b":"Grape spirit is added to stop the fermentation.","c":"The grapes are left hanging on the vine until they freeze.","d":"The juice stays on the skins for several weeks."},"notes":{"a":"Correct: leaves residual sugar and low alcohol, typically 8-10%; made by short maceration.","b":"Adding spirit is fortification, which would RAISE the alcohol.","c":"That is how icewine is made, not White Zinfandel.","d":"Long skin contact is red winemaking; White Zinfandel uses short maceration."},"answer":"a","ctx":"White Zinfandel: pink, medium-sweet, simple strawberry and raspberry.","src":"L2 book p. 56 (USA)","cards":"L2-card-51"},{"id":"Q-L2-07-04","level":"L2","lo":"LO4","ch":"7","topic":"Zinfandel labels and abv","trap":"","stem":"Two Californian Zinfandels are on a shelf: one is labelled 8.5% abv, the other 15.5% abv. What is MOST LIKELY true?","options":{"a":"Each is a dry red; the 15.5% is from much older vines.","b":"The 8.5% is a medium-sweet rosé; the 15.5% is a dry red.","c":"The 8.5% is a dry red; the 15.5% is a medium-sweet rosé.","d":"The 8.5% is a light, dry red; the 15.5% is fortified."},"notes":{"a":"An 8.5% Zinfandel signals a rosé; the book does not link alcohol on the label to vine age.","b":"Correct: rosé (White) Zinfandels have low abv; red Zinfandels typically have high abv.","c":"Reversed: White Zinfandel is low in alcohol, red Zinfandel high.","d":"Low abv here signals White Zinfandel; 15.5% is a normal unfortified red Zinfandel."},"answer":"b","ctx":"","src":"L2 book p. 57 (Labelling for Zinfandel/Primitivo)","cards":"L2-card-51"},{"id":"Q-L2-07-05","level":"L2","lo":"LO4","ch":"7","topic":"Red Zinfandel style","trap":"","stem":"A dry, full-bodied red has high alcohol, medium to high tannin, pronounced blackberry and raspberry, raisin and prune, and vanilla and coffee. Which is it MOST LIKELY to be?","options":{"a":"A red Zinfandel from California","b":"A Bourgogne AOC Pinot Noir","c":"A Pinot Noir from Sonoma","d":"A White Zinfandel from California"},"notes":{"a":"Correct: matches the book's typical red Zinfandel, commonly matured in oak.","b":"Light to medium body, low tannin, fresh red fruit - the opposite of this wine.","c":"Californian Pinot has ripe red fruit (strawberry, red cherry) and low to medium tannin, not raisin and prune.","d":"White Zinfandel is a medium-sweet, low-alcohol rosé."},"answer":"a","ctx":"Very old Californian Zinfandel vines give low yields of concentrated fruit; wines can develop earth and meat.","src":"L2 book p. 56 (USA)","cards":"L2-card-51"},{"id":"Q-L2-07-06","level":"L2","lo":"LO4","ch":"7","topic":"Primitivo in Puglia","trap":"","stem":"In which Italian region is Zinfandel known as Primitivo, and what does it mainly produce there?","options":{"a":"Piemonte: tannic, long-lived reds for ageing","b":"Puglia: soft, fruity, dry reds for volume brands","c":"Veneto: reds made from partially dried grapes","d":"Tuscany: high-acid reds labelled as Riserva"},"notes":{"a":"Piemonte is home to Nebbiolo (Barolo, Barbaresco), not Primitivo.","b":"Correct: warm southern Puglia; top examples from controlled yields can be excellent value.","c":"That is Corvina in Valpolicella (Amarone, Recioto).","d":"Tuscany is Sangiovese country (Chianti, Brunello di Montalcino)."},"answer":"b","ctx":"Spec GIs: USA California; Italy Puglia.","src":"L2 book p. 57 (Italy); L2 spec p. 13","cards":"L2-card-51, L2-card-37"},{"id":"Q-L2-08-02","level":"L2","lo":"LO3","ch":"8","topic":"Riesling ripeness and flavour","trap":"","stem":"A Riesling is made from grapes picked when just ripe. Which flavours is it MOST LIKELY to show?","options":{"a":"Dried apricot, mango and peach","b":"Green apple, lime and blossom","c":"Peach, mango and pineapple","d":"Honey, petrol and dried apricot"},"notes":{"a":"Dried fruit can appear with extra-ripe grapes, not just-ripe ones.","b":"Correct: just-ripe grapes give green fruit, citrus and floral notes.","c":"Stone and tropical fruit come from EXTRA-ripe grapes.","d":"Honey and petrol are tertiary notes that develop with bottle age."},"answer":"b","ctx":"Riesling is aromatic: pronounced fruity and floral aromas with high acidity.","src":"L2 book p. 58 (Characteristics of Riesling)","cards":"L2-card-52"},{"id":"Q-L2-08-03","level":"L2","lo":"LO3","ch":"8","topic":"Süssreserve","trap":"","stem":"Some off-dry and medium Rieslings are made using Süssreserve. What is Süssreserve?","options":{"a":"Unfermented grape juice added to the wine","b":"Grape spirit added to stop the fermentation","c":"Yeast removed to stop fermentation early","d":"Grapes left on the vine to concentrate sugar"},"notes":{"a":"Correct: the alternative is to interrupt fermentation by removing the yeast.","b":"That is fortification, used for Port, not for Riesling.","c":"This is the OTHER method for off-dry styles, not Süssreserve itself.","d":"That is late harvesting, used for sweeter styles."},"answer":"a","ctx":"Sweetest styles: extra-ripe grapes so high in sugar that fermentation stops naturally.","src":"L2 book p. 58 (Winemaking and maturation options)","cards":"L2-card-52"},{"id":"Q-L2-08-04","level":"L2","lo":"LO3","ch":"8","topic":"Riesling winemaking vessels","trap":"","stem":"Why do winemakers typically ferment Riesling in inert vessels such as stainless-steel tanks?","options":{"a":"To develop nutty, oxidative notes","b":"To preserve its floral aromas","c":"To add smoke and vanilla flavours","d":"To soften its naturally high acidity"},"notes":{"a":"Inert, airtight vessels protect the wine from oxygen.","b":"Correct: as stated in the book.","c":"Those come from oak; stainless steel is inert and adds no flavour.","d":"Inert vessels do not lower acidity; Riesling keeps high acid."},"answer":"b","ctx":"The finest age for decades: high acid keeps them fresh while they develop honey and petrol.","src":"L2 book p. 59 (Winemaking and maturation options)","cards":"L2-card-52"},{"id":"Q-L2-08-05","level":"L2","lo":"LO3","ch":"8","topic":"Mosel Riesling style","trap":"MOST LIKELY stem","stem":"A light-bodied Riesling has medium sweetness balancing very high acidity. Which GI is it MOST LIKELY from?","options":{"a":"Clare Valley","b":"Alsace","c":"Pfalz","d":"Mosel"},"notes":{"a":"Clare Valley Riesling is dry, with pronounced lime and lemon.","b":"A typical Alsace Riesling is dry and medium-bodied with pronounced flavour.","c":"Pfalz is dry and sunny; typical Riesling is dry and medium-bodied.","d":"Correct: one of Germany's most northerly regions, so lighter body; medium sweetness balances very high acid."},"answer":"d","ctx":"Causal chain: northerly latitude -> less ripeness -> lighter body, very high acid, often balanced by sweetness.","src":"L2 book p. 59 (Mosel)","cards":"L2-card-53"},{"id":"Q-L2-08-06","level":"L2","lo":"LO3","ch":"8","topic":"Rheingau vs Mosel","trap":"","stem":"Compared with a typical Mosel Riesling, a typical Rheingau Riesling is:","options":{"a":"drier in style, with less body.","b":"sweeter in style, with less body.","c":"sweeter in style, with more body.","d":"drier in style, with more body."},"notes":{"a":"Half right: Rheingau is drier, but it has MORE body than Mosel.","b":"Reversed: Mosel is the lighter and commonly sweeter style.","c":"Half right: Rheingau has more body, but it is typically DRIER than Mosel.","d":"Correct: steep south-facing slopes on the Rhine's north bank maximise sun and warmth."},"answer":"d","ctx":"","src":"L2 book p. 60 (Rheingau)","cards":"L2-card-53"},{"id":"Q-L2-08-07","level":"L2","lo":"LO3","ch":"8","topic":"Pfalz Riesling","trap":"","stem":"The Pfalz is protected by mountains to the west and has a dry, sunny climate. What is the typical style of its Riesling?","options":{"a":"Sweet and full-bodied","b":"Off-dry and light-bodied","c":"Medium-sweet and light-bodied","d":"Dry and medium-bodied"},"notes":{"a":"Not the typical style: the book gives Pfalz Riesling as dry and medium-bodied.","b":"Light body is the Mosel; a typical Pfalz Riesling is dry and medium-bodied.","c":"That is the typical Mosel style.","d":"Correct: climatically like an extension of Alsace, with similar wines."},"answer":"d","ctx":"Pfalz lies towards the French border; think of it as Germany's Alsace.","src":"L2 book p. 60 (Pfalz)","cards":"L2-card-53"},{"id":"Q-L2-08-08","level":"L2","lo":"LO3","ch":"8","topic":"Alsace climate","trap":"","stem":"Why is Alsace one of the driest and sunniest wine regions in France?","options":{"a":"Its vineyards sit at a high altitude, above the rain clouds.","b":"The Vosges Mountains block rain-bearing westerly winds.","c":"Warm Mediterranean winds blow in from the south.","d":"The River Rhine reflects sunlight onto the slopes."},"notes":{"a":"The best vineyards are in the mountain foothills; altitude is not the reason given.","b":"Correct: dry autumns also extend ripening; best sites face east/south-east for morning sun.","c":"Not the book's explanation; the key is the Vosges rain shadow.","d":"Reflected river sunlight is described for the Mosel, not as the reason for Alsace."},"answer":"b","ctx":"Alsace Riesling: dry, pronounced ripe citrus and stone fruit. Best = grands crus; sweeter = Vendanges tardives.","src":"L2 book p. 62 (France)","cards":"L2-card-53"},{"id":"Q-L2-08-09","level":"L2","lo":"LO3","ch":"8","topic":"Clare and Eden Valleys","trap":"","stem":"Why do the Clare Valley and Eden Valley have moderate climates, unlike the nearby warm Barossa Valley?","options":{"a":"Their southerly latitude","b":"Their morning sea fogs","c":"Their higher altitude","d":"Their ring of mountains"},"notes":{"a":"Not the reason given; the book credits altitude.","b":"Fogs are given for Casablanca and Los Carneros, not these regions.","c":"Correct: giving refreshing dry Rieslings with pronounced lime, lemon and sometimes petrol.","d":"A ring of mountains is the Central Otago explanation (blocking sea breezes)."},"answer":"c","ctx":"Both are in South Australia; Barossa nearby is warm and known for Shiraz.","src":"L2 book p. 62 (Australia)","cards":"L2-card-53b"},{"id":"Q-L2-08-10","level":"L2","lo":"LO3","ch":"8","topic":"Riesling GIs","trap":"NOT stem; Barossa is not a Riesling GI","stem":"Which of these GIs is NOT listed for Riesling in the Level 2 specification?","options":{"a":"Pfalz","b":"Rheingau","c":"Clare Valley","d":"Barossa Valley"},"notes":{"a":"Listed: a dry, sunny German region giving dry, medium-bodied Riesling.","b":"Listed: steep south-facing slopes on the north bank of the Rhine.","c":"Listed: with Eden Valley, South Australia's premium Riesling centre.","d":"Correct: Barossa is warm; the book contrasts it with the moderate, higher-altitude Eden and Clare Valleys."},"answer":"d","ctx":"Riesling GIs: Alsace; Mosel, Rheingau, Pfalz; Clare Valley, Eden Valley.","src":"L2 spec p. 11; L2 book p. 62 (Australia)","cards":"L2-card-35, L2-card-53b"},{"id":"Q-L2-08-11","level":"L2","lo":"LO3","ch":"8","topic":"Qualitätswein vs Prädikatswein","trap":"","stem":"What is the key requirement that sets Prädikatswein above Qualitätswein?","options":{"a":"Grapes affected by noble rot in every category","b":"Grapes grown only in classified grand cru sites","c":"A minimum period of ageing in oak before release","d":"A higher minimum level of sugar in the grapes"},"notes":{"a":"Only some Prädikats (BA, TBA) rely on botrytis; Kabinett does not.","b":"German categories are ripeness-based, not vineyard-based.","c":"No oak ageing rule is given; the categories are based on grape sugar.","d":"Correct: Prädikatswein also needs grapes from a single winegrowing area."},"answer":"d","ctx":"Why ripeness? Germany's cool climate makes ripening hard. Ladder: Landwein (PGI) < Qualitätswein (PDO) < Prädikatswein.","src":"L2 book p. 60 (Labelling in Germany)","cards":"L2-card-14, L2-card-15"},{"id":"Q-L2-08-12","level":"L2","lo":"LO3","ch":"8","topic":"Prädikat order","trap":"Prädikat direction (known gap)","stem":"Which of these lists Prädikats in ASCENDING order of the minimum sugar level required at harvest?","options":{"a":"Spätlese, Kabinett, Auslese, TBA","b":"TBA, Auslese, Spätlese, Kabinett","c":"Kabinett, Auslese, Spätlese, TBA","d":"Kabinett, Spätlese, Auslese, TBA"},"notes":{"a":"Kabinett is the lowest Prädikat, below Spätlese.","b":"This is DESCENDING order - the right sequence, wrong direction.","c":"Spätlese (late harvest) comes before Auslese (selected harvest).","d":"Correct: Kabinett is the lowest (lightest); TBA the highest."},"answer":"d","ctx":"Full order: Kabinett, Spätlese, Auslese, then BA = Eiswein (same minimum), then TBA at the top.","src":"L2 book p. 60-61 (The six Prädikat categories)","cards":"L2-card-15, L2-card-16"},{"id":"Q-L2-08-13","level":"L2","lo":"LO3","ch":"8","topic":"Highest Prädikat","trap":"Prädikat direction (known gap)","stem":"Which Prädikat category requires the highest minimum sugar level in the grapes at harvest?","options":{"a":"Spätlese (late harvest)","b":"Beerenauslese (BA)","c":"Auslese (selected harvest)","d":"Trockenbeerenauslese (TBA)"},"notes":{"a":"Spätlese is second lowest, just above Kabinett.","b":"BA shares its minimum with Eiswein, below TBA.","c":"Auslese is third of six, below BA, Eiswein and TBA.","d":"Correct: individually selected berries dried by botrytis; rare and concentrated. (Kabinett is the lowest end.)"},"answer":"d","ctx":"Hook: the longest name (Trockenbeerenauslese) is the ripest; the shortest (Kabinett) the lightest.","src":"L2 book p. 60-61 (The six Prädikat categories)","cards":"L2-card-15, L2-card-16"},{"id":"Q-L2-08-14","level":"L2","lo":"LO3","ch":"8","topic":"Eiswein must weight","trap":"Eiswein and BA share a minimum (known gap)","stem":"How does the minimum sugar level required for Eiswein compare with the other Prädikat categories?","options":{"a":"It is the same as for Beerenauslese.","b":"It is the same as for Spätlese.","c":"It is higher than for Trockenbeerenauslese.","d":"It is lower than for Auslese."},"notes":{"a":"Correct: the one exception to the ascending order of the six Prädikats.","b":"Spätlese is second lowest; Eiswein matches BA, much higher.","c":"TBA has the highest requirement of all.","d":"Eiswein needs MORE sugar than Auslese; it equals BA."},"answer":"a","ctx":"BA, TBA and Eiswein: sugars concentrated on the vine; yeast cannot ferment it all, so low alcohol and sweet.","src":"L2 book p. 60 (Labelling in Germany)","cards":"L2-card-16"},{"id":"Q-L2-08-15","level":"L2","lo":"LO3","ch":"8","topic":"Eiswein production","trap":"NOT stem; Eiswein has no botrytis","stem":"Which statement about German Eiswein is NOT correct?","options":{"a":"Its yields are very small.","b":"It cannot be made in every year.","c":"Its grapes have frozen on the vine.","d":"Its grapes are concentrated by botrytis."},"notes":{"a":"True: labour-intensive with tiny yields, so prices are high.","b":"True: the weather it needs does not occur every year.","c":"True: Eiswein is made from grapes frozen on the vine.","d":"Correct (the false statement): botrytis plays no part in Eiswein."},"answer":"d","ctx":"Eiswein flavours: vibrant fresh peach, apricot, mango, pineapple.","src":"L2 book p. 61 (Eiswein)","cards":"L2-card-16"},{"id":"Q-L2-08-16","level":"L2","lo":"LO3","ch":"8","topic":"TBA vs BA","trap":"'Trocken' in TBA does not mean dry","stem":"How does a Trockenbeerenauslese (TBA) differ from a Beerenauslese (BA)?","options":{"a":"It needs a lower minimum sugar level at harvest.","b":"It uses individually selected botrytis-dried berries.","c":"It is made from grapes that froze on the vine.","d":"It is fermented fully dry, as 'trocken' suggests."},"notes":{"a":"TBA needs the HIGHEST minimum sugar level of all.","b":"Correct: TBA is rarer and more concentrated, with flavours like BA but more intense.","c":"That is Eiswein; TBA relies on botrytis.","d":"Here 'trocken' refers to berries dried by botrytis; TBA is sweet."},"answer":"b","ctx":"BA is always sweet: selected bunches or berries concentrated by botrytis (apricot, mango, honey).","src":"L2 book p. 61 (Beerenauslese; Trockenbeerenauslese)","cards":"L2-card-16"},{"id":"Q-L2-08-17","level":"L2","lo":"LO3","ch":"8","topic":"Auslese","trap":"","stem":"A German Riesling is made from carefully selected extra-ripe bunches and tastes of apricot, mango and dried fruit. Most such wines have some sweetness. Which Prädikat is it?","options":{"a":"Spätlese","b":"Eiswein","c":"Auslese","d":"Kabinett"},"notes":{"a":"Riper than Kabinett, but with citrus and some peach, not selected extra-ripe bunches.","b":"Made from grapes frozen on the vine, not selected extra-ripe bunches.","c":"Correct: 'selected harvest'; it can be trocken, but most have some sweetness.","d":"The lightest Prädikat: delicate green apple, lime and blossom."},"answer":"c","ctx":"Spätlese = late harvest; Auslese = selected harvest.","src":"L2 book p. 61 (Auslese)","cards":"L2-card-15"},{"id":"Q-L2-08-18","level":"L2","lo":"LO3","ch":"8","topic":"Dry Prädikat wines and alcohol","trap":"","stem":"Three dry (trocken) Rieslings from the same German region are labelled Kabinett, Spätlese and Auslese. Which is MOST LIKELY to be highest in alcohol?","options":{"a":"The Spätlese","b":"They will all be the same","c":"The Auslese","d":"The Kabinett"},"notes":{"a":"A dry Spätlese is above a dry Kabinett but below a dry Auslese.","b":"Prädikats need different sugar levels, so dry versions differ in alcohol.","c":"Correct: it needs the most sugar in the grapes, so fermented dry it has the most alcohol.","d":"The reverse: Kabinett needs the least sugar, so a dry Kabinett is lowest in alcohol."},"answer":"c","ctx":"Causal chain: more sugar in the grapes + full fermentation -> more alcohol.","src":"L2 book p. 60 (Labelling in Germany)","cards":"L2-card-16"},{"id":"Q-L2-08-19","level":"L2","lo":"LO3","ch":"8","topic":"Trocken and Halbtrocken","trap":"","stem":"On a German wine label, what does 'Halbtrocken' indicate?","options":{"a":"A wine with some sweetness","b":"A wine from botrytised grapes","c":"A wine from frozen grapes","d":"A completely dry wine"},"notes":{"a":"Correct: Trocken = dry; Halbtrocken = some sweetness.","b":"Botrytis is signalled by BA or TBA, not Halbtrocken.","c":"Frozen grapes are signalled by Eiswein.","d":"That is Trocken."},"answer":"a","ctx":"These terms help when the Prädikat alone leaves the sweetness unclear.","src":"L2 book p. 61 (Other key labelling terms)","cards":"L2-card-16b"},{"id":"Q-L3-06-01","level":"L3","lo":"Stretch (L2 LO3)","ch":"6","topic":"Burgundy mid-slope sites","trap":"","stem":"In Burgundy, why are premier and grand cru vineyards often mid-slope rather than on the flat land below?","options":{"a":"Less frost risk and shallower, better-drained soils","b":"More frequent rain that helps flowering go smoothly","c":"Deeper, more fertile soils that give higher yields","d":"Shelter from the prevailing easterly winds"},"notes":{"a":"Correct: per the L3 book; they also tend to face south or east.","b":"Rain disrupts flowering in Burgundy; it is a hazard, not a benefit.","c":"The reverse: the deeper, more fertile soils are on the flat land.","d":"The best sites face south or east, protected from prevailing WESTERLY winds."},"answer":"a","ctx":"Links to L2: village vineyards sit lower; crus on south/south-east slopes (L2 book p. 52).","src":"L3 book (2016) ch 15, p. 85","cards":"L3-stretch-19"},{"id":"Q-L3-06-02","level":"L3","lo":"Stretch (L2 LO3)","ch":"6","topic":"Côte de Nuits vs Côte de Beaune","trap":"","stem":"According to the L3 book, how does the Côte de Nuits differ from the Côte de Beaune?","options":{"a":"Nearly all the red grands crus are in the Côte de Nuits.","b":"Its Pinot Noirs are generally lighter and fruitier.","c":"Nearly all the white grands crus are in the Côte de Nuits.","d":"It lies to the south of the Côte de Beaune."},"notes":{"a":"Correct: all red grands crus but one; it makes many of the fullest, longest-lived Pinots.","b":"The Côte de Beaune reds are described as generally fruitier.","c":"Reversed: all white grands crus but one are in the Côte de Beaune.","d":"The Côte de Nuits is the northern half of the Côte d'Or."},"answer":"a","ctx":"(2016 edition; may have changed.)","src":"L3 book (2016) ch 15, p. 87","cards":"L3-stretch-19, L2-card-48"},{"id":"Q-L3-06-03","level":"L3","lo":"Stretch (L2 LO3)","ch":"6","topic":"Pommard red only","trap":"Pommard is Côte de Beaune (known gap)","stem":"According to the L3 book, which of these Côte de Beaune villages produces red wine only?","options":{"a":"Meursault","b":"Pommard","c":"Beaune","d":"Puligny-Montrachet"},"notes":{"a":"Meursault makes red too, but is most famous for its white wines.","b":"Correct: with Volnay, the exception among the main Côte de Beaune villages.","c":"Beaune produces white wine as well as red.","d":"Makes white as well as red; it shares the white grand cru Montrachet."},"answer":"b","ctx":"Hook: Pommard = Pinot only, in the Côte de Beaune. (2016 edition; may have changed.)","src":"L3 book (2016) ch 15, p. 88","cards":"L3-stretch-19, L2-card-48"},{"id":"Q-L3-06-04","level":"L3","lo":"Stretch (L2 LO3)","ch":"6","topic":"California ocean cooling","trap":"","stem":"According to the L3 book, what is the main reason parts of coastal California are cool enough for Pinot Noir?","options":{"a":"Regular rainfall during the grape-ripening season","b":"Cold air and fog drawn in from a very cold ocean current","c":"Their more northerly latitude compared with the inland areas","d":"High-altitude vineyards in the coastal mountain ranges"},"notes":{"a":"California lacks rain in the ripening season; drip irrigation is common.","b":"Correct: the California Ocean Current; fog burning off late extends cooling into the day.","c":"The L3 book says latitude plays a relatively small role in California.","d":"The mountains mostly SHIELD the state from the ocean's cooling; gaps let it in."},"answer":"b","ctx":"Valleys at right angles to the ocean, as in Santa Barbara County, funnel the cold air inland.","src":"L3 book (2016) ch 33, p. 143","cards":"L3-stretch-20"},{"id":"Q-L3-06-05","level":"L3","lo":"Stretch (L2 LO3)","ch":"6","topic":"Central Otago alcohol","trap":"","stem":"According to the L3 book, why are Central Otago Pinot Noirs often high in alcohol?","options":{"a":"Frost-free autumns allow very late harvesting.","b":"Its maritime climate keeps nights mild and warm.","c":"The intensity of sunlight there is very high.","d":"Warm north-westerly winds blow in from the coast."},"notes":{"a":"Frost is a real risk in both spring AND autumn.","b":"Unlike the rest of New Zealand, Central Otago is continental with cool nights.","c":"Correct: per the L3 book; the region is continental, with a large diurnal range.","d":"The L3 book gives that warming effect for Canterbury (Waipara), not Otago."},"answer":"c","ctx":"L2 level: you need the ring of mountains, sunny days and cool nights (L2 book p. 55).","src":"L3 book (2016) ch 40, p. 172","cards":"L3-stretch-22"},{"id":"Q-L3-08-02","level":"L3","lo":"Stretch (L2 LO3)","ch":"8","topic":"German selective harvesting","trap":"","stem":"Why do German pickers often pass through the same vineyard several times during the harvest?","options":{"a":"The law requires each variety to be picked on a single day.","b":"Botrytised bunches must all be removed before they can spoil the whole crop.","c":"Wines are classified by must weight, so grapes are picked per category.","d":"Heavy autumn rains force growers to pick in short dry spells."},"notes":{"a":"No such rule; the harvest can be spread over weeks and months.","b":"Noble rot is wanted: botrytised sweet wines can be made in every German region.","c":"Correct: a range of Qualitätsweine and Prädikatsweine can come from one vineyard.","d":"The L3 book says rain generally declines in autumn during final ripening."},"answer":"c","ctx":"Must weight = sugar in the grape juice. (2016 edition; may have changed.)","src":"L3 book (2016) ch 22, p. 108","cards":"L3-stretch-24"},{"id":"Q-L3-08-03","level":"L3","lo":"Stretch (L2 LO3)","ch":"8","topic":"Alsace organic viticulture","trap":"","stem":"Why is organic and biodynamic viticulture widely practised in Alsace?","options":{"a":"Sunny, dry conditions mean low disease pressure.","b":"Humid, wet summers make chemical sprays useless.","c":"Alsace Grand Cru rules require organic farming.","d":"Fertile plain soils need few treatments or inputs."},"notes":{"a":"Correct: per the L3 book; the Vosges rain shadow gives sunny summers and dry autumns.","b":"Alsace is sheltered from rain-bearing winds; summers are sunny.","c":"Not a rule given in the L3 book; the reason is low disease pressure.","d":"The plain is for lesser vineyards; the reason given is the dry climate."},"answer":"a","ctx":"Links to L2: the Vosges block rain-bearing westerly winds (L2 book p. 62).","src":"L3 book (2016) ch 17, p. 92","cards":"L3-stretch-24"},{"id":"Q-L3-08-04","level":"L3","lo":"Stretch (L2 LO3)","ch":"8","topic":"Sweet Kabinett winemaking","trap":"","stem":"According to the L3 book, how are the best sweet styles of Kabinett Riesling made?","options":{"a":"By using grapes concentrated by noble rot on the vine","b":"By stopping fermentation early, for better sugar/acid balance","c":"By leaving the grapes on the vine until they freeze","d":"By adding Süssreserve (unfermented grape juice) after fermentation"},"notes":{"a":"Botrytis is key for BA and TBA, not delicate Kabinett.","b":"Correct: the yeast is stopped before all the sugar is converted to alcohol.","c":"Frozen grapes make Eiswein, a much higher Prädikat.","d":"Possible, but the L3 book says it is not used to make high-quality wines."},"answer":"b","ctx":"Sweet Kabinett is about 8-9% abv; drier styles can reach 12% (L3 p. 109).","src":"L3 book (2016) ch 22, p. 108-109","cards":"L3-stretch-24, L2-card-52"},{"id":"Q-L2-09-02","level":"L2","lo":"LO4","ch":"9","topic":"Chenin Blanc styles","trap":"","stem":"Which two features of Chenin Blanc allow it to make wines ranging from dry right through to sweet?","options":{"a":"Low acidity that softens the sweetness, and botrytis-resistant skins.","b":"High acidity that suits late harvest, and susceptibility to botrytis.","c":"An aromatic, floral character, and a habit of ripening very early.","d":"Thin skins that dry easily in the sun, and a resistance to frost."},"notes":{"a":"Chenin has naturally high acidity and is susceptible to botrytis, not resistant to it.","b":"Correct: the book gives both features as the reason Chenin is made in a very broad range of styles, dry to sweet.","c":"Not the book's reasons. The floral style comes from blending with Viognier.","d":"Drying grapes is not mentioned for Chenin; the book's reasons are high acidity and botrytis."},"answer":"b","ctx":"High acidity also means very good or outstanding Chenin can age in bottle for many years.","src":"L2 book p. 63 (Chenin Blanc)","cards":"L2-card-54"},{"id":"Q-L2-09-03","level":"L2","lo":"LO4","ch":"9","topic":"Vouvray Demi-Sec","trap":"","stem":"On a bottle of still Vouvray AOC, what does the term 'Demi-Sec' indicate?","options":{"a":"The wine is off-dry or medium in sweetness.","b":"The wine is fully dry, with fresh apple fruit.","c":"The wine is lusciously sweet, from botrytis.","d":"The wine was partly matured in old oak."},"notes":{"a":"Correct: the book says off-dry or medium Vouvray is labelled Demi-Sec.","b":"Dry Vouvray often has fresh apple, but it is not labelled Demi-Sec.","c":"The sweeter styles come from extra-ripe or botrytis grapes; Demi-Sec means off-dry or medium.","d":"Demi-Sec is a sweetness term; Vouvray is typically unoaked anyway."},"answer":"a","ctx":"Demi-Sec is also a sparkling wine term, meaning medium sweetness (L2 book p. 113).","src":"L2 book p. 63 (Vouvray AOC)","cards":"L2-card-54, L2-card-22"},{"id":"Q-L2-09-04","level":"L2","lo":"LO4","ch":"9","topic":"Vouvray AOC","trap":"","stem":"Which statement about Vouvray AOC is correct?","options":{"a":"Only dry and off-dry still wines may be produced.","b":"Chenin Blanc is the only grape variety permitted.","c":"Its sweet wines are typically matured in new oak.","d":"Sémillon is often blended in to add body and ageing."},"notes":{"a":"Medium, sweet and sparkling Vouvray are all made too.","b":"Correct: per the book. Even so, styles range from dry to sweet, plus sparkling.","c":"Vouvray of every style is typically unoaked, to retain its fresh fruit.","d":"That is Sémillon's role in Bordeaux blends; only Chenin Blanc is permitted in Vouvray."},"answer":"b","ctx":"Why unoaked: to keep the fresh fruit. The best Vouvray of all styles ages to honey and dried fruit.","src":"L2 book p. 63 (Vouvray AOC)","cards":"L2-card-54"},{"id":"Q-L2-09-05","level":"L2","lo":"LO4","ch":"9","topic":"South African Chenin Blanc","trap":"","stem":"Why is Chenin Blanc particularly prized in South Africa?","options":{"a":"It keeps high acidity in a warm climate.","b":"It ripens fully in a very cool climate.","c":"It reliably develops noble rot each year.","d":"It gives low yields of very sweet grapes."},"notes":{"a":"Correct: the reason the book gives. It is also South Africa's most planted white grape.","b":"The book stresses a warm climate; the prized trait is keeping acidity there.","c":"Chenin can get botrytis, but the book prizes SA Chenin for its acidity in the heat.","d":"High-volume Western Cape brands are common; low yields come from old vines."},"answer":"a","ctx":"Old vines with small yields give very good/outstanding Chenin: tropical fruit, smoke and vanilla from oak.","src":"L2 book p. 63-64 (South Africa)","cards":"L2-card-54"},{"id":"Q-L2-09-06","level":"L2","lo":"LO4","ch":"9","topic":"Sémillon in Bordeaux blends","trap":"","stem":"In Bordeaux, Sémillon is commonly blended with Sauvignon Blanc for dry and sweet wines. What does Sémillon provide to these blends?","options":{"a":"Extra acidity and freshness.","b":"Herbaceous aromatic intensity.","c":"Pronounced floral perfume.","d":"Body and ageing potential."},"notes":{"a":"Not what the book gives. (L3: in Sauternes it is Sauvignon Blanc that adds acidity.)","b":"Herbaceous aromas are Sauvignon Blanc's hallmark (p. 72); the book credits Sémillon with body and ageing potential.","c":"Not given; Sémillon is described with apple, lemon and grass when young.","d":"Correct: per the book; very good or outstanding blends are often oak-matured and age for years."},"answer":"d","ctx":"Spelling: Sémillon in France, Semillon in English-speaking countries.","src":"L2 book p. 64 (Sémillon: France)","cards":"L2-card-55"},{"id":"Q-L2-09-07","level":"L2","lo":"LO4","ch":"9","topic":"Western Cape spec grapes","trap":"NOT stem; Western Cape trio (known gap)","stem":"Which of these grapes is NOT listed for the Western Cape GI in the Level 2 specification?","options":{"a":"Sauvignon Blanc","b":"Chenin Blanc","c":"Chardonnay","d":"Pinotage"},"notes":{"a":"Correct: the spec's South African Sauvignon Blanc GIs are Elgin and Constantia.","b":"Listed: Western Cape (high-volume wines from the warmer inland areas).","c":"Listed: Western Cape and Walker Bay.","d":"Listed: Western Cape, with the labelling term Cape Blend."},"answer":"a","ctx":"Western Cape trio on the spec: Chenin Blanc, Chardonnay, Pinotage.","src":"L2 spec p. 11, 13","cards":"L2-card-38, L2-card-35, L2-card-36, L2-card-37"},{"id":"Q-L2-09-08","level":"L2","lo":"LO4","ch":"9","topic":"Sémillon in Sauternes","trap":"Sauternes = Sémillon-led (known gap)","stem":"Why is Sémillon the most important grape variety in Sauternes?","options":{"a":"It has high acidity and thick, rot-resistant skins.","b":"It dries easily into raisins on the vine.","c":"It is particularly susceptible to botrytis.","d":"It ripens early, well before the autumn rains."},"notes":{"a":"Sémillon ranges from medium to high acidity, and is prone to botrytis, not resistant.","b":"Sauternes relies on noble rot, not on drying the grapes.","c":"Correct: Sauternes is made from grapes concentrated by noble rot, and Sémillon is particularly susceptible.","d":"Not the book's reason; the key is its susceptibility to botrytis."},"answer":"c","ctx":"Sauternes: sweet, full-bodied, high acid, apricot plus oak; ages for many years to dried fruit, honey, caramel.","src":"L2 book p. 65 (Sauternes AOC)","cards":"L2-card-55"},{"id":"Q-L2-09-09","level":"L2","lo":"LO4","ch":"9","topic":"Sauternes style","trap":"MOST LIKELY stem; Sauternes is full-bodied (known gap)","stem":"A sweet, full-bodied white wine has high acidity and pronounced apricot, smoke and vanilla flavours. Which GI is it MOST LIKELY from?","options":{"a":"Vouvray","b":"Hunter Valley","c":"Sauternes","d":"Barossa Valley"},"notes":{"a":"Sweet Vouvray has stone or tropical fruit, but it is typically unoaked, so no smoke or vanilla.","b":"Hunter Semillon is dry, light-bodied and low in alcohol, made in inert vessels.","c":"Correct: botrytised and Sémillon-led, with apricot plus oak (smoke, vanilla); very good to outstanding.","d":"Some Australian Semillon is botrytised, but the book gives Barossa only dry styles, Hunter-like to full and oaked."},"answer":"c","ctx":"Causal chain: noble rot concentrates sugar and acid -> sweet but balanced; oak adds smoke and vanilla.","src":"L2 book p. 63-65","cards":"L2-card-55, L2-card-55b, L2-card-54"},{"id":"Q-L2-09-10","level":"L2","lo":"LO4","ch":"9","topic":"Barossa vs Hunter Semillon","trap":"Hunter Semillon is dry, early-picked, unoaked (known gap)","stem":"Which statem

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3f4" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#161114" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WSET Revision"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>WSET Revision</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an app shell. Sticky header with three tabs (Home, Quiz, History) over a single 760px column.
   Home leads with the exam estimate gauge, then "what next", the 25-chapter map, exam areas and gaps; chapters and quizzes open into detail views. */
:root{
  --bg:#f5f3f4; --surface:#ffffff; --sunk:#efebed; --fg:#231c20; --muted:#6c6268; --line:#e3dde0;
  --accent:#7a1f3d; --accent-soft:#f3e4ea; --next-bg:#7a1f3d; --next-fg:#ffffff; --right:#2f6b4a; --right-soft:#e3f0e8; --wrong:#a3352b; --wrong-soft:#f8e5e2; --half:#8a6414; --half-soft:#f6edd8;
  --f-display:"Gloock", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161114; --surface:#201a1d; --sunk:#1b1518; --fg:#f0e9ec; --muted:#a99ca3; --line:#382d33;
  --accent:#e08aa6; --accent-soft:#3a2230; --next-bg:#4a1d2f; --next-fg:#f7e9ee; --right:#7ccf9e; --right-soft:#1d3327; --wrong:#f08e83; --wrong-soft:#3d2220; --half:#e6c06b; --half-soft:#3a3020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161114; --surface:#201a1d; --sunk:#1b1518; --fg:#f0e9ec; --muted:#a99ca3; --line:#382d33;
  --accent:#e08aa6; --accent-soft:#3a2230; --next-bg:#4a1d2f; --next-fg:#f7e9ee; --right:#7ccf9e; --right-soft:#1d3327; --wrong:#f08e83; --wrong-soft:#3d2220; --half:#e6c06b; --half-soft:#3a3020; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:400;font-size:22px}
.brand span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav{display:flex;gap:4px;background:var(--sunk);border-radius:999px;padding:4px}
nav a{font-weight:600;font-size:15px;color:var(--muted);text-decoration:none;padding:6px 14px;border-radius:999px}
nav a[aria-current="page"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.08)}
nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.save{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;width:100%}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--right)} .dot.off{background:var(--wrong)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
.view{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,36px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.cardhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.cardhead .link{margin-left:auto}
.link{background:none;border:0;padding:0;font:inherit;font-size:14.5px;font-weight:600;color:var(--accent);cursor:pointer;text-decoration:none}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.empty{color:var(--muted);font-size:15px;margin:0}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:999px;padding:9px 18px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,select:focus-visible,.tilebtn:focus-visible,.rowbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.avail{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.gauge{width:168px;height:168px;position:relative;flex:none}
.gauge svg{width:100%;height:100%;display:block}
.gauge .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.gauge .num b{font-family:var(--f-display);font-weight:400;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.gauge .num span{font-size:12px;color:var(--muted);max-width:9em;line-height:1.25;margin-top:4px}
.herotext{display:flex;flex-direction:column;gap:10px;min-width:0}
.verdictline{font-family:var(--f-display);font-size:24px;line-height:1.2;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:0;min-width:0}
.stat b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.btnlike{cursor:pointer;border:0;text-align:left;font:inherit;color:inherit}
@media (max-width:560px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.herotext{align-items:center}.stats{width:100%;text-align:left}}

/* next */
.next{background:var(--next-bg);color:var(--next-fg);border-color:var(--next-bg)}
.next .eyebrow{color:var(--next-fg);opacity:.75}
.next h2{color:var(--next-fg)}
.next .sub{color:var(--next-fg);opacity:.85}
.next .btn{background:var(--next-fg);color:var(--next-bg);border-color:var(--next-fg)}
.next .btn.ghost{background:transparent;color:var(--next-fg);border-color:var(--next-fg)}

/* chapter map */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.tilebtn{font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--sunk);border:1px solid transparent;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:86px}
.tilebtn:hover{border-color:var(--accent)}
.tilebtn .t1{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tilebtn .t2{font-size:14px;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tilebtn .t3{margin-top:auto;display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tilebtn.done{background:var(--right-soft)} .tilebtn.now{background:var(--accent-soft);border-color:var(--accent)}
.pill{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:999px;background:var(--surface);color:var(--muted)}
.pill.done{color:var(--right)} .pill.now{color:var(--accent)}
.mini{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.mini i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}

/* bars */
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:flex;flex-direction:column;gap:5px;font-size:15px}
.brow .lab{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.brow .line{display:flex;gap:12px;align-items:center}
.brow .line .track{flex:1}
.brow .val{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;min-width:6.5rem;flex:none;white-space:nowrap;line-height:1}
.track{display:block;height:10px;border-radius:5px;background:var(--sunk);position:relative;overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:5px}
.track .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.35}
.good{background:var(--right)} .mid{background:var(--half)} .low{background:var(--wrong)}

/* gaps */
.gaplist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.gaplist li{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.gaplist li:first-child{border-top:0}
.gaplist .chn{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-left:6px}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--right)}
.dots i.on{background:var(--right)}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14.5px}

/* list rows */
.rows{display:flex;flex-direction:column}
.rowbtn{font:inherit;color:inherit;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;display:grid;grid-template-columns:4.5rem 1fr auto;gap:12px;align-items:center;padding:11px 2px}
.rowbtn:first-child{border-top:0}
.rowbtn:hover .rl{color:var(--accent)}
.rowbtn .rd{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.rowbtn .rl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:999px}
.score.good{background:var(--right-soft);color:var(--right)} .score.mid{background:var(--half-soft);color:var(--half)} .score.low{background:var(--wrong-soft);color:var(--wrong)}
.qrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.qrow:first-child{border-top:0}
.mk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--surface);margin-top:1px}
.qrow .qid{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.back{align-self:flex-start}

/* quiz setup + runner */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:11.5px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
select{font:inherit;font-size:15px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.toggle{display:flex;gap:8px;align-items:flex-start;font-size:14.5px;color:var(--muted)}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin-top:3px;flex:none}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.preset{font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--sunk);border:1px solid transparent;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.preset:hover:not([disabled]){border-color:var(--accent)}
.preset[disabled]{opacity:.5;cursor:default}
.preset b{font-size:15.5px}
.preset span{font-size:13px;color:var(--muted)}
.pips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.pip{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:transparent;padding:0;cursor:pointer}
.pip.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pip.ok{background:var(--right);border-color:var(--right)} .pip.half{background:var(--half);border-color:var(--half)} .pip.bad{background:var(--wrong);border-color:var(--wrong)}
.runscore{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tag{background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:999px}
.tag.l3{background:var(--half-soft);color:var(--half)}
.stem{font-size:20px;line-height:1.4;font-weight:600;margin:0;text-wrap:pretty}
.stem em{font-style:normal;color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.letter{font-family:var(--f-mono);font-size:14px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.opt.right{border-color:var(--right);background:var(--right-soft)} .opt.right .letter{background:var(--right);border-color:var(--right);color:var(--surface)}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-soft)} .opt.wrong .letter{background:var(--wrong);border-color:var(--wrong);color:var(--surface)}
.opt .note{display:block;font-size:14.5px;color:var(--muted);margin-top:4px}
.verdict{font-family:var(--f-display);font-size:22px;margin:0}
.verdict.ok{color:var(--right)} .verdict.no{color:var(--wrong)} .verdict.half{color:var(--half)}
.explain{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.explain p{margin:0;max-width:65ch}
.ctx{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:15.5px}
.src{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.think{display:flex;flex-direction:column;gap:10px;align-items:flex-start;border:1px dashed var(--line);border-radius:10px;padding:14px}
.think p{margin:0;color:var(--muted);font-size:15.5px}
.big{font-family:var(--f-display);font-size:56px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.foot{color:var(--muted);font-size:13px;max-width:62ch;margin:0}
@media (max-width:480px){.card{padding:16px}.stem{font-size:18.5px}}

/* study */
.card.tight{padding:8px 20px}
.card.tight>.cardhead{padding-top:10px}
.facts{margin:0;font-size:14px;color:var(--muted)}
.sub.small{font-size:14.5px}
.trow,.crow,.srow{display:grid;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit;min-height:44px}
.rows>.trow:first-child,.rows>.srow:first-child{border-top:0}
.trow{grid-template-columns:auto 1fr auto}
.trow:has(.cn){grid-template-columns:2rem 1fr auto auto}
.trow:hover .tl,.crow:hover .tl,.srow:hover{color:var(--accent)}
.tl{display:flex;flex-direction:column;min-width:0;font-size:15.5px;line-height:1.3}
.tm{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}
.tm.l3{color:var(--half)}
.chev{color:var(--muted)}
.cn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.val{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.st{font-family:var(--f-mono);font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st.secure{background:var(--right-soft);color:var(--right)} .st.partly{background:var(--half-soft);color:var(--half)} .st.shaky{background:var(--wrong-soft);color:var(--wrong)} .st.none{background:var(--sunk);color:var(--muted)}
.seg{display:flex;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;width:100%;min-width:72px}
.seg i{display:block;height:100%}
.seg i.secure,.sw.secure{background:var(--right)} .seg i.partly,.sw.partly{background:var(--half)} .seg i.shaky,.sw.shaky{background:var(--wrong)}
.legend{margin-left:auto;display:flex;gap:10px;font-size:12px;color:var(--muted)} .legend span{display:flex;gap:5px;align-items:center}
.crow{grid-template-columns:2rem 1fr 6.5rem}
.crow .tm{text-align:right;margin:0}
.crow.now .tl{font-weight:700}
.tag{font-family:var(--f-mono);font-size:10.5px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:0 6px;font-weight:400}
.eyebrow.grp{padding:14px 0 4px}
.rows>.eyebrow.grp+.crow{border-top:0}
.srow{grid-template-columns:1fr;gap:2px;font-size:14.5px}
.srow mark{background:var(--half-soft);color:var(--fg);border-radius:2px}
.search{display:flex;flex-direction:column;gap:6px}
.search input{font:inherit;font-size:16px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#sres{display:flex;flex-direction:column;gap:18px}
.prog{display:flex;flex-direction:column;gap:6px}
.ptext{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14.5px}
.topics{display:flex;flex-direction:column}
.topic{border-top:1px solid var(--line);scroll-margin-top:140px}
.tl>.tag{align-self:flex-start;margin-top:3px} .topic:first-child{border-top:0}
.thead{width:100%;font:inherit;color:inherit;background:none;border:0;padding:12px 0;text-align:left;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;cursor:pointer;min-height:48px}
.thead .tl{font-weight:600}
.thead:hover .tl{color:var(--accent)}
.thead:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.tbody{display:flex;flex-direction:column;gap:14px;padding:2px 0 18px}
.cardtext{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5}
.ctl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.cardtext ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.cardtext li.sub{margin-left:16px;list-style:circle}
.cardtext li.plain{list-style:none;margin-left:-18px}
.stretch .cardtext{background:var(--half-soft)}
.stretch details{border-top:1px solid var(--line);padding:8px 0} .stretch details summary{color:var(--fg);font-weight:600;font-size:15px;padding:4px 0} .stretch details .cardtext{margin-top:8px}
.gapnote{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:15px}
.qlist{display:flex;flex-direction:column}
.qlist .eyebrow{margin-bottom:2px}
.acs{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
a.brow{text-decoration:none;color:inherit} a.brow:hover .lab{color:var(--accent)}

<script>/* WSET Revision standalone: local store + private GitHub repo sync, exposing the same db API the app uses. */
(function(){
const APP_VERSION="1.0.0";
const LS="wsetrev.store.v1", CFG="wsetrev.cfg.v1";
const load=(k,d)=>{ try{ return JSON.parse(localStorage.getItem(k))||d; }catch(e){ return d; } };
const saveLS=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } };
let S=load(LS,{docs:{},del:{}}); // docs: "attempts/ID" -> {...data,_ts}; del: path -> ts
let cfg=load(CFG,{repo:"",token:"",path:"data.json",lastSync:null,lastErr:null});
const subs=[]; // {kind:"doc"|"col", path, cb}
function now(){ return new Date().toISOString(); }
function strip(d){ const o={...d}; delete o._ts; return o; }
function notify(){ for(const s of subs){ try{
  if(s.kind==="doc"){ const d=S.docs[s.path]; s.cb({exists:!!d,data:()=>d?strip(d):undefined,id:s.path.split("/").pop(),metadata:{fromCache:false,hasPendingWrites:false}}); }
  else { const pre=s.path+"/"; const docs=Object.entries(S.docs).filter(([k])=>k.startsWith(pre)&&!k.slice(pre.length).includes("/")).map(([k,v])=>({id:k.slice(pre.length),data:()=>strip(v),exists:true}));
    s.cb({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false}}); } }catch(e){ console.error(e); } } }
function persist(){ if(!saveLS(LS,S)) throw {code:"storage_full",message:"Phone storage is full"}; notify(); schedulePush(); }
function docRef(path){ return {
  id:path.split("/").pop(), path,
  async get(){ const d=S.docs[path]; return {exists:!!d,data:()=>d?strip(d):undefined,id:path.split("/").pop()}; },
  async set(data){ S.docs[path]={...data,_ts:now()}; delete S.del[path]; persist(); },
  async update(data){ S.docs[path]={...(S.docs[path]||{}),...data,_ts:now()}; persist(); },
  async delete(){ delete S.docs[path]; S.del[path]=now(); persist(); },
  onSnapshot(cb,err){ const s={kind:"doc",path,cb}; subs.push(s); setTimeout(()=>notify(),0); return ()=>{ const i=subs.indexOf(s); if(i>=0) subs.splice(i,1); }; } }; }
const db={ doc:p=>docRef(p), collection:c=>({ doc:id=>docRef(c+"/"+id),
  onSnapshot(cb,err){ const s={kind:"col",path:c,cb}; subs.push(s); setTimeout(()=>notify(),0); return ()=>{ const i=subs.indexOf(s); if(i>=0) subs.splice(i,1); }; } }) };

// ---------- GitHub sync (contents API on a private repo) ----------
const b64e=s=>btoa(unescape(encodeURIComponent(s))), b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,""))));
function merge(a,b){ // both {docs,del}
  const out={docs:{},del:{...a.del}};
  for(const [k,t] of Object.entries(b.del||{})) if(!out.del[k]||t>out.del[k]) out.del[k]=t;
  const keys=new Set([...Object.keys(a.docs||{}),...Object.keys(b.docs||{})]);
  for(const k of keys){ const x=(a.docs||{})[k], y=(b.docs||{})[k]; const w=!x?y:!y?x:((y._ts||"")>(x._ts||"")?y:x);
    if(out.del[k]&&(!w||!w._ts||w._ts<=out.del[k])) continue; out.docs[k]=w; }
  return out; }
let pushT=null, syncing=false;
function schedulePush(){ if(!cfg.repo||!cfg.token) return; clearTimeout(pushT); pushT=setTimeout(()=>sync(),2500); }
async function gh(method,body){ const url=`https://api.github.com/repos/${cfg.repo}/contents/${encodeURIComponent(cfg.path)}`;
  const r=await fetch(url+(method==="GET"?`?t=${Date.now()}`:""),{method,headers:{Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined,cache:"no-store"});
  return r; }
async function sync(){
  if(!cfg.repo||!cfg.token||syncing||!navigator.onLine) return; syncing=true; setStatus("syncing");
  try{
    for(let attempt=0;attempt<3;attempt++){
      let remote={docs:{},del:{}}, sha;
      const g=await gh("GET");
      if(g.status===200){ const j=await g.json(); sha=j.sha; try{ remote=JSON.parse(b64d(j.content)); }catch(e){ remote={docs:{},del:{}}; } }
      else if(g.status!==404) throw new Error("GitHub said "+g.status+(g.status===401?" (check the token)":g.status===403?" (token lacks access to this repo)":""));
      const m=merge(S,remote); S=m; saveLS(LS,S); notify();
      const same=JSON.stringify(remote)===JSON.stringify(m);
      if(same) break;
      const p=await gh("PUT",{message:"sync from phone "+now(),content:b64e(JSON.stringify(m)),...(sha?{sha}:{})});
      if(p.status===200||p.status===201) break;
      if(p.status===409||p.status===422) continue;
      throw new Error("GitHub said "+p.status);
    }
    cfg.lastSync=now(); cfg.lastErr=null; saveLS(CFG,cfg); setStatus("ok");
  }catch(e){ cfg.lastErr=String(e.message||e); saveLS(CFG,cfg); setStatus("err"); }
  finally{ syncing=false; }
}
window.addEventListener("online",()=>sync());
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") sync(); });
setInterval(()=>{ if(document.visibilityState==="visible") sync(); },120000);

// ---------- settings sheet ----------
function setStatus(s){ const d=document.getElementById("saveDot"); if(!d) return; d.classList.remove("on","off","sync"); d.classList.add(s==="ok"?"on":s==="err"?"off":"sync");
  d.title=s==="ok"?"Synced "+new Date(cfg.lastSync).toLocaleTimeString():s==="err"?"Sync problem: "+cfg.lastErr:"Syncing…"; }
function fmtAgo(iso){ if(!iso) return "never"; const m=Math.round((Date.now()-new Date(iso))/60000); return m<1?"just now":m<60?m+" min ago":Math.round(m/60)+" h ago"; }
function openSettings(){
  let el=document.getElementById("wsSettings"); if(el) el.remove();
  el=document.createElement("div"); el.id="wsSettings"; el.className="ws-sheet";
  el.innerHTML=`<div class="ws-panel" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="ws-h"><b>Settings</b><button class="ws-x" aria-label="Close">✕</button></div>
    <p class="ws-p">Your results are saved on this phone and copied to your private GitHub data repo, so Claude can read them when you say "sync".</p>
    <label class="ws-f"><span>Data repo (owner/name)</span><input id="wsRepo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="yougav/wset-revision-data" value=""></label>
    <label class="ws-f"><span>Access token</span><input id="wsTok" type="password" autocomplete="off" placeholder="github_pat_…" value=""></label>
    <p class="ws-s" id="wsStat">Last sync: ${fmtAgo(cfg.lastSync)}${cfg.lastErr?` · Problem: ${cfg.lastErr.replace(/</g,"&lt;")}`:""}</p>
    <div class="ws-b"><button class="btn" id="wsSave">Save and sync</button><button class="btn ghost" id="wsNow">Sync now</button></div>
    <hr>
    <p class="ws-p"><b>Backup.</b> Download a copy of everything, or restore one.</p>
    <div class="ws-b"><button class="btn ghost" id="wsDl">Download backup</button><label class="btn ghost ws-up">Restore from file<input type="file" id="wsUp" accept="application/json,.json" hidden></label></div>
    <p class="ws-s">Version ${APP_VERSION} · ${Object.keys(S.docs).length} saved records</p></div>`;
  document.body.appendChild(el);
  el.querySelector("#wsRepo").value=cfg.repo||""; el.querySelector("#wsTok").value=cfg.token||"";
  const close=()=>el.remove(); el.querySelector(".ws-x").onclick=close; el.onclick=e=>{ if(e.target===el) close(); };
  el.querySelector("#wsSave").onclick=async()=>{ cfg.repo=el.querySelector("#wsRepo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/$/,""); cfg.token=el.querySelector("#wsTok").value.trim(); saveLS(CFG,cfg); await sync(); openSettings(); };
  el.querySelector("#wsNow").onclick=async()=>{ await sync(); openSettings(); };
  el.querySelector("#wsDl").onclick=()=>{ const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="wset-revision-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click(); a.remove(); };
  el.querySelector("#wsUp").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); if(!j.docs) throw 0; S=merge(S,j); persist(); alert("Restored and merged "+Object.keys(j.docs).length+" records."); openSettings(); }catch(_){ alert("That file isn't a WSET Revision backup."); } };
}
document.addEventListener("click",e=>{ if(e.target.closest&&e.target.closest("#saveDot,#wsGear")) openSettings(); });
window.WSREV={openSettings,sync};
// expose as the platform capability the app expects
window.claude={ use: async name=>name==="db"?db:null };
window.addEventListener("load",()=>{ setTimeout(()=>{ if(cfg.repo&&cfg.token) sync(); else setStatus("err"); },300); });
if("serviceWorker" in navigator && location.hostname!=="localhost" && location.hostname!=="127.0.0.1") navigator.serviceWorker.register("sw.js");
})();
</script>

<script>
const BANK = [{"id":"Q-L2-04-01","level":"L2","lo":"LO1","ch":"4","topic":"Slope and aspect","trap":"","stem":"Why does a vineyard on a slope facing the equator usually produce riper grapes than one on flat land at the same latitude?","options":{"a":"Its soils are deeper and more fertile.","b":"It receives more heat and sunlight.","c":"It is sheltered from rain-bearing winds.","d":"Its cooler nights help the grapes keep their acidity."},"notes":{"a":"No: the book links slopes to heat and light, not fertility. (L3, on Burgundy: hillside soils tend to be shallower.)","b":"Correct: the book says slopes facing the equator receive more heat and light, so they produce riper grapes than flat land or slopes facing away.","c":"That is the effect of mountains acting as a barrier, not of slope and aspect.","d":"Cooler nights are a diurnal-range effect, not what aspect does; aspect adds warmth."},"answer":"b","ctx":"","src":"L2 book p. 33 (Slope and aspect)","cards":"L2-card-40"},{"id":"Q-L2-04-02","level":"L2","lo":"LO1","ch":"4","topic":"PGI labelling terms","trap":"NOT stem; PGI terms (known gap)","stem":"Which of the following is NOT a labelling term for a PGI wine?","options":{"a":"Vino de la Tierra","b":"Qualitätswein","c":"Indicazione Geografica Tipica (IGT)","d":"Landwein"},"notes":{"a":"This IS a PGI term (Spain).","b":"Correct: Qualitätswein is a German PDO term (with Prädikatswein). The German PGI term is Landwein.","c":"This IS a PGI term (Italy).","d":"This IS a PGI term (Germany)."},"answer":"b","ctx":"Remember the full PGI set: IGP (France), IGT (Italy), Vino de la Tierra (Spain), Landwein (Germany).","src":"L2 book p. 37 (labelling terms table)","cards":"L2-card-12"},{"id":"Q-L2-04-03","level":"L2","lo":"LO1","ch":"4","topic":"Old Vine labelling","trap":"Old Vines definition (known gap)","stem":"Which statement about the term 'Old Vine' (vieilles vignes) on a label is correct?","options":{"a":"It may only be used on PDO wines.","b":"It shows the grapes were picked later than normal.","c":"The vines must be at least 35 years old.","d":"It is not legally defined, so its use can be disputed."},"notes":{"a":"No such restriction is given; the book says the term is not legally defined.","b":"That describes Late Harvest / Vendanges tardives, not Old Vine.","c":"No minimum age is set; the book says the term is not legally defined.","d":"Correct: the book says it is not a legally defined concept, so there can be disagreement over its use."},"answer":"d","ctx":"Why it matters: older vines give fewer grapes, which can be more concentrated and complex.","src":"L2 book p. 38 (Vine age)","cards":"L2-card-13"},{"id":"Q-L2-05-01","level":"L2","lo":"LO2","ch":"5","topic":"Oak alternatives","trap":"MOST stem","stem":"A winemaker wants to give an inexpensive white wine some oak flavour at low cost. Which option is MOST appropriate?","options":{"a":"Mature it for several months in new, small oak barrels.","b":"Add oak chips or staves to wine in a steel tank.","c":"Encourage full malolactic conversion after fermentation.","d":"Mature it in large, old oak vessels for a long period."},"notes":{"a":"This adds oak flavour, but barrels are expensive, so it is not the low-cost option.","b":"Correct: the book says staves or chips are much cheaper than barrels and add oak flavour to wine in inert vessels.","c":"MLF can add buttery flavours and lowers acidity, but it adds no oak flavour.","d":"Large vessels are rarely used to give oak flavour, and old oak has little flavour left."},"answer":"b","ctx":"","src":"L2 book p. 47-48 (Oak vessels; Oak alternatives)","cards":"L2-card-46"},{"id":"Q-L2-05-02","level":"L2","lo":"LO2","ch":"5","topic":"Bottle ageing of red wine","trap":"red vs white colour change","stem":"Which change typically happens to a red wine as it matures in bottle?","options":{"a":"Its tannins become firmer and more drying.","b":"Its fresh fruit flavours become more pronounced.","c":"Its colour becomes deeper and moves from ruby towards purple.","d":"Its colour becomes paler and moves from ruby towards garnet."},"notes":{"a":"The opposite: tannins become softer and smoother.","b":"Fresh fruit gives way to dried fruit and tertiary notes such as fig, prune, meat and wet leaves.","c":"Reversed: purple is youthful. Deepening colour with age is what happens to WHITE wines.","d":"Correct: reds go ruby -> garnet -> tawny -> brown and typically become paler; tannins soften."},"answer":"d","ctx":"Trap to remember: whites get DEEPER with age (lemon -> gold -> amber); reds get PALER.","src":"L2 book p. 49 (Changes to red wines)","cards":"L2-card-10"},{"id":"Q-L2-06-01","level":"L2","lo":"LO3","ch":"6","topic":"Burgundy Pinot Noir villages","trap":"Pommard is Côte de Beaune (known gap)","stem":"Which of these Burgundy village appellations is in the Côte de Beaune?","options":{"a":"Pommard","b":"Gevrey-Chambertin","c":"Nuits-Saint-Georges","d":"Chablis"},"notes":{"a":"Correct: the book gives Beaune and Pommard as Côte de Beaune examples.","b":"Côte de Nuits (the northern half of the Côte d'Or).","c":"Côte de Nuits - the name is the clue.","d":"Chablis is a separate cool area in northern Burgundy, known for Chardonnay, not part of the Côte d'Or."},"answer":"a","ctx":"Memory hook: the Côte de Nuits is north (N before B going south); its villages here are Gevrey-Chambertin and Nuits-Saint-Georges.","src":"L2 book p. 52","cards":"L2-card-48"},{"id":"Q-L2-10-01","level":"L2","lo":"LO3","ch":"10","topic":"Chardonnay and climate","trap":"MOST LIKELY stem","stem":"A dry Chardonnay has high acidity, a light to medium body and flavours of green apple, lemon and wet stones. Which GI is it MOST LIKELY from?","options":{"a":"Pays d'Oc","b":"Chablis","c":"Napa Valley","d":"Margaret River"},"notes":{"a":"Warm Languedoc-Roussillon gives ripe peach, pineapple and banana.","b":"Correct: the book describes Chablis as cool, giving dry, light- to medium-bodied wines with high acidity and apple, lemon, wet stones.","c":"Napa Chardonnay is described as full-bodied with pronounced tropical fruit and new-oak vanilla and spice.","d":"Warm (sea-breeze moderated); medium to full body with peach and pineapple."},"answer":"b","ctx":"Causal chain: cool climate -> slower ripening -> higher acid, lighter body, green-fruit and citrus flavours.","src":"L2 book p. 67-70","cards":"L2-card-57, L2-card-58, L2-card-61"},{"id":"Q-L2-08-01","level":"L2","lo":"LO3","ch":"8","topic":"Riesling and sweet wines","trap":"","stem":"Why is Riesling well suited to producing outstanding sweet wines?","options":{"a":"Its high acidity balances sweetness and it is prone to botrytis.","b":"Its thick skins resist noble rot, keeping the grapes healthy.","c":"It ripens quickly, building high sugar levels in hot climates.","d":"Its low acidity makes the sweetness taste richer and rounder."},"notes":{"a":"Correct: both reasons are given in the book; it also builds sugar slowly while keeping acid, so it suits late harvesting.","b":"The book says Riesling is susceptible to botrytis, which is an advantage for sweet wines.","c":"It prefers cool to moderate climates and builds sugar and flavour slowly.","d":"Riesling is high in acidity; low acid would leave a sweet wine unbalanced."},"answer":"a","ctx":"","src":"L2 book p. 58","cards":"L2-card-52"},{"id":"Q-L2-11-01","level":"L2","lo":"LO3","ch":"11","topic":"Sauvignon Blanc GIs","trap":"NOT stem; Elgin/Constantia = Sauvignon (known gap)","stem":"Which of the following GIs is NOT listed for Sauvignon Blanc in the Level 2 specification?","options":{"a":"Pessac-Léognan","b":"Walker Bay","c":"Elgin","d":"Constantia"},"notes":{"a":"Listed: blends of Sauvignon Blanc and Sémillon.","b":"Correct: Walker Bay is listed for Pinot Noir and Chardonnay, not Sauvignon Blanc.","c":"Listed: the book describes Elgin Sauvignon Blanc (cooled by altitude; green apple, wet stones).","d":"Listed: cooled by Southern Ocean breezes; tropical and herbaceous Sauvignon Blanc."},"answer":"b","ctx":"South Africa on the spec: Sauvignon = Elgin, Constantia; Pinot Noir = Walker Bay; Chardonnay = Western Cape, Walker Bay.","src":"L2 spec p. 11; L2 book p. 73-74","cards":"L2-card-36, L2-card-64"},{"id":"Q-L2-15-01","level":"L2","lo":"LO3","ch":"15","topic":"Left Bank gravel","trap":"","stem":"Why can Cabernet Sauvignon ripen successfully on Bordeaux's Left Bank despite the moderate maritime climate?","options":{"a":"Gravel soils drain quickly and hold heat into the evening.","b":"Morning fog from the Gironde estuary protects grapes from sunburn.","c":"Clay soils hold enough water to carry vines through dry summers.","d":"High altitude gives cool nights that help preserve acidity."},"notes":{"a":"Correct: the book gives both effects of gravel (drainage and heat retention).","b":"Not the book's explanation; the book credits the gravel soils.","c":"Not the book's explanation. (L3 p. 78: clay is the cooler Right Bank soil, where Merlot does better.)","d":"Altitude is not the explanation the book gives; it credits gravel soils."},"answer":"a","ctx":"Causal chain: gravel -> quick drainage + stored heat -> warmer vineyard -> thick-skinned, late-ripening Cabernet can ripen.","src":"L2 book p. 86","cards":"L2-card-71"},{"id":"Q-L2-14-01","level":"L2","lo":"LO3","ch":"14","topic":"Merlot-dominated appellations","trap":"LEAST stem","stem":"Which of these appellations would be LEAST likely to produce a Merlot-dominated red wine?","options":{"a":"Saint-Émilion","b":"Pomerol","c":"Bordeaux AOC","d":"Pauillac"},"notes":{"a":"Right Bank: Merlot-dominated.","b":"Right Bank: among the most famous Merlot-dominated wines.","c":"The book says Bordeaux AOC and Bordeaux Supérieur are typically Merlot-dominated blends.","d":"Correct: a Left Bank (Haut-Médoc) appellation where Cabernet Sauvignon is typically dominant."},"answer":"d","ctx":"Read the instruction word: LEAST likely means look for the Cabernet-led appellation.","src":"L2 book p. 82","cards":"L2-card-69, L2-card-21"},{"id":"Q-L2-16-01","level":"L2","lo":"LO3","ch":"16","topic":"Barossa Shiraz vs Northern Rhône Syrah","trap":"","stem":"Compared with a typical Northern Rhône Syrah, a typical Barossa Valley Shiraz is MOST likely to be:","options":{"a":"lower in alcohol, with more herbal and floral notes from a cooler climate.","b":"lighter-bodied, with fresh black fruit and more pronounced black pepper.","c":"fuller-bodied, with cooked black fruit and often vanilla or coconut.","d":"unoaked, lighter in tannin and intended to be drunk within a year."},"notes":{"a":"Warm Barossa gives riper grapes and higher alcohol.","b":"That is closer to the moderate-climate Northern Rhône style.","c":"Correct: the book describes Barossa Shiraz as full-bodied with high ripe tannins, cooked black fruit, black pepper and often vanilla/coconut oak.","d":"Barossa Shiraz commonly shows oak and the best can age."},"answer":"c","ctx":"Causal chain: warm Barossa + very old vines -> riper, concentrated grapes -> full body, cooked fruit, high alcohol.","src":"L2 book p. 90, 92","cards":"L2-card-73, L2-card-74"},{"id":"Q-L2-12-01","level":"L2","lo":"LO3","ch":"12","topic":"Pinot Grigio styles","trap":"","stem":"Which grape-growing choices produce the light, simple, high-volume style of Pinot Grigio?","options":{"a":"Controlled yields and a delayed harvest.","b":"Allowing the grapes to freeze on the vine.","c":"High yields and an early harvest to retain acidity.","d":"Leaving grapes on the vine until botrytis develops."},"notes":{"a":"This gives the riper, fuller, more complex style (e.g. Alsace Pinot Gris).","b":"This is how icewine is made.","c":"Correct: the book says this gives a dry, light-bodied wine with medium to high acidity and simple pear and lemon.","d":"Botrytis is used for sweet wines, not this style."},"answer":"c","ctx":"","src":"L2 book p. 76","cards":"L2-card-65"},{"id":"Q-L2-15-02","level":"L2","lo":"LO3","ch":"15","topic":"Bordeaux Supérieur","trap":"Bordeaux Supérieur vs Cru Bourgeois (known gap)","stem":"What does 'Bordeaux Supérieur' on a label indicate?","options":{"a":"A Médoc château that is not classified as Grand Cru Classé.","b":"A wine made only from grapes grown on the Right Bank.","c":"Slightly stricter rules than Bordeaux AOC (yields, ageing, alcohol).","d":"A château ranked in one of Bordeaux's official classifications."},"notes":{"a":"Closest to Cru Bourgeois: unclassified Médoc wines may APPLY to use that term.","b":"It can be made from grapes grown anywhere in Bordeaux.","c":"Correct: it can come from anywhere in Bordeaux, with slightly stricter rules on yields, ageing and minimum alcohol.","d":"That describes Grand Cru Classé / Cru Classé."},"answer":"c","ctx":"","src":"L2 book p. 82, 87","cards":"L2-card-21"},{"id":"Q-L2-19-01","level":"L2","lo":"LO4","ch":"19","topic":"Tempranillo vs Garnacha GIs","trap":"Catalunya = Tempranillo only (known gap)","stem":"Which of these Spanish GIs is listed for Tempranillo but NOT for Garnacha in the Level 2 specification?","options":{"a":"Rioja","b":"Navarra","c":"Priorat","d":"Catalunya"},"notes":{"a":"Listed for both Tempranillo and Garnacha.","b":"Listed for Garnacha only.","c":"Listed for Garnacha only (though it lies within Catalunya).","d":"Correct: listed for Tempranillo only."},"answer":"d","ctx":"Trap: Priorat sits in the Catalunya region, yet the spec ties Priorat to Garnacha and Catalunya DO to Tempranillo.","src":"L2 spec p. 12; L2 book p. 98-99","cards":"L2-card-37, L2-card-78"},{"id":"Q-L2-18-01","level":"L2","lo":"LO4","ch":"18","topic":"Grenache outside the Rhône","trap":"Grenache GIs outside the Rhône (known gap)","stem":"Which pair of French GIs outside the Rhône Valley is listed for Grenache in the Level 2 specification?","options":{"a":"Minervois and Côtes de Provence","b":"Minervois and Pays d'Oc","c":"Fleurie and Minervois","d":"Côtes de Provence and Châteauneuf-du-Pape"},"notes":{"a":"Correct: Languedoc-Roussillon and Provence.","b":"Pays d'Oc blends can contain Grenache (L2 book p. 83), but Pays d'Oc is not one of the spec's Grenache GIs.","c":"Fleurie is a Beaujolais cru (Gamay).","d":"Châteauneuf-du-Pape is a Grenache GI, but it is IN the Southern Rhône, so the stem rules it out."},"answer":"a","ctx":"","src":"L2 spec p. 12; L2 book p. 97","cards":"L2-card-37, L2-card-77"},{"id":"Q-L2-17-01","level":"L2","lo":"LO4","ch":"17","topic":"Beaujolais winemaking","trap":"","stem":"Beaujolais winemakers often use techniques that maximise colour extraction while minimising tannin. Which aromas can these techniques create?","options":{"a":"Leather and earth","b":"Bread and biscuit","c":"Vanilla and coconut","d":"Banana and candy"},"notes":{"a":"Tertiary aromas from ageing; most Beaujolais is drunk young.","b":"From lees/autolysis, not these red-winemaking techniques.","c":"These come from new oak; Gamay is usually made in inert vessels and rarely shows oak.","d":"Correct: stated in the book."},"answer":"d","ctx":"L3 stretch: this is carbonic maceration (whole bunches under CO2) - see L3-stretch-18 and 33.","src":"L2 book p. 94","cards":"L2-card-75"},{"id":"Q-L2-22-01","level":"L2","lo":"LO4","ch":"22","topic":"Amarone della Valpolicella","trap":"Amarone vs Recioto","stem":"Which statement best describes Amarone della Valpolicella DOCG?","options":{"a":"Light-bodied, simple and fruity, made to drink young.","b":"Sweet, full-bodied red made from partially dried grapes.","c":"Dry to off-dry, full-bodied and high in alcohol, from dried grapes.","d":"Full-bodied red made from grapes concentrated by noble rot."},"notes":{"a":"That is basic Valpolicella DOC.","b":"That is Recioto della Valpolicella.","c":"Correct: appassimento gives about 15% abv, high tannin, red cherry plus prune, raisin, fig.","d":"Amarone uses dried grapes (appassimento), not botrytis."},"answer":"c","ctx":"","src":"L2 book p. 106","cards":"L2-card-83"},{"id":"Q-L2-09-01","level":"L2","lo":"LO4","ch":"9","topic":"Hunter Valley Semillon","trap":"Hunter Semillon is dry, not botrytis (known gap)","stem":"Which description best fits a typical Hunter Valley Semillon?","options":{"a":"Dry and light-bodied from early-picked grapes; gains honey and nuts with age.","b":"Off-dry and rich, from extra-ripe grapes picked late in the season.","c":"Full-bodied and oak-matured, with ripe tropical fruit flavours.","d":"Sweet and full-bodied, from grapes concentrated by noble rot."},"notes":{"a":"Correct: picked early because the climate is warm; neutral when young, complex with age.","b":"Hunter Semillon is picked early, not late.","c":"Closer to some Barossa Valley styles; Hunter Semillon uses inert vessels.","d":"That describes Sauternes, not Hunter Valley."},"answer":"a","ctx":"Causal chain: warm climate -> pick early to keep acid -> low sugar = low alcohol -> neutral young, honey and nuts with age.","src":"L2 book p. 65","cards":"L2-card-55"},{"id":"Q-L2-24-01","level":"L2","lo":"LO5","ch":"24","topic":"Traditional method stages","trap":"riddling vs disgorgement","stem":"In the traditional method, which stage actually removes the yeast sediment from the bottle?","options":{"a":"Riddling","b":"Disgorgement","c":"Dosage","d":"Autolysis"},"notes":{"a":"Riddling only moves the sediment into the neck; it does not remove it.","b":"Correct: the frozen plug of lees is forced out by the pressure when the crown cap is removed.","c":"Dosage tops up the bottle and sets the sweetness after disgorgement.","d":"Autolysis is the breakdown of dead yeast that adds biscuit and bread flavours."},"answer":"b","ctx":"Order: second fermentation -> autolysis -> riddling -> disgorgement -> dosage -> cork and cage.","src":"L2 book p. 112-113","cards":"L2-card-86, L2-card-87"},{"id":"Q-L2-25-01","level":"L2","lo":"LO5","ch":"25","topic":"Reserve Ruby vs Ruby","trap":"Reserve Ruby vs Ruby (known gap)","stem":"What distinguishes a Reserve Ruby Port from a standard Ruby Port?","options":{"a":"It is made entirely from the wine of one single, stated vintage.","b":"It is only released in years that producers declare as exceptional.","c":"Better-quality wines with more intensity, sometimes matured longer.","d":"It is aged oxidatively in small barrels for many years before bottling."},"notes":{"a":"That describes LBV (and Vintage Port).","b":"That describes Vintage Port.","c":"Correct: as described in the book.","d":"That describes the best tawny-style Ports."},"answer":"c","ctx":"","src":"L2 book p. 118","cards":"L2-card-93"},{"id":"Q-L2-25-02","level":"L2","lo":"LO5","ch":"25","topic":"Oloroso and flor","trap":"","stem":"Why does flor not develop on Oloroso Sherry?","options":{"a":"It is aged in stainless steel tanks rather than in the oak-cask solera.","b":"It is fortified to only about 15% abv, which is too weak for flor to grow.","c":"It is made from sun-dried Pedro Ximénez grapes rather than Palomino.","d":"It is fortified to about 17% abv, too strong for flor to survive."},"notes":{"a":"All these Sherries age in the solera of old-oak casks.","b":"15% is the Fino level, where flor DOES grow.","c":"Oloroso is a dry style from the Palomino base wine.","d":"Correct: without flor's protection it ages oxidatively."},"answer":"d","ctx":"","src":"L2 book p. 116-117","cards":"L2-card-91"},{"id":"Q-L2-02-01","level":"L2","lo":"LO6","ch":"2","topic":"Umami and wine","trap":"","stem":"How will a dish high in umami usually make a wine taste?","options":{"a":"Fuller-bodied and fruitier, with noticeably softer tannins.","b":"Less bitter and drying, with softer and rounder acidity.","c":"Sweeter, fruitier and less acidic than on its own.","d":"More drying and bitter, more acidic, less sweet and fruity."},"notes":{"a":"That is the effect of salt.","b":"That is the softening effect of salt or acid in food.","c":"That is the effect of acid in food (and partly salt).","d":"Correct: umami (like sweetness) makes wine taste 'harder'."},"answer":"d","ctx":"Hardeners: sweetness, umami. Softeners: salt, acid.","src":"L2 book p. 16-17","cards":"L2-card-24"},{"id":"Q-L2-03-01","level":"L2","lo":"LO6","ch":"3","topic":"Opening sparkling wine","trap":"twist the bottle (known gap)","stem":"When opening a bottle of sparkling wine, what is the correct technique once the cage is loosened?","options":{"a":"Hold the bottle upright and ease the cork out with a waiter's friend.","b":"Hold the cork, tilt the bottle and turn the bottle, not the cork.","c":"Remove the cage fully, then let the gas pressure push the cork out.","d":"Hold the bottle still and steadily twist the cork until it comes free."},"notes":{"a":"Corkscrews are for still wines; sparkling bottles are held at an angle.","b":"Correct: releases the pressure with a quiet 'phut'.","c":"Dangerous: from loosening the cage the cork must stay in your hand.","d":"The book says hold the cork and turn the bottle."},"answer":"b","ctx":"","src":"L2 book p. 22","cards":"L2-card-28"},{"id":"Q-L3-01-01","level":"L3","lo":"Stretch (L2 ch 1 tasting)","ch":"1","topic":"Development scale","trap":"","stem":"A red Rioja Reserva tasted on release shows mostly primary and secondary aromas with some tertiary notes. On the L3 development scale it is best described as:","options":{"a":"tired/past its best","b":"fully developed","c":"developing","d":"youthful"},"notes":{"a":"Tired means the attractive aromas are fading and unpleasant ones appearing.","b":"Fully developed means tertiary aromas predominate (e.g. aged Tawny, all Sherries).","c":"Correct: mostly primary/secondary with some tertiary = developing. The L3 book uses Rioja Reserva as its example.","d":"Youthful means primary/secondary only, with no tertiary yet."},"answer":"c","ctx":"Not on the L2 tasting scale; L2 has no 'development' line.","src":"L3 book (2016) p. 6","cards":"L3-stretch-02"},{"id":"Q-L3-04-01","level":"L3","lo":"Stretch (L2 LO1)","ch":"4","topic":"Diurnal range","trap":"","stem":"Why can a vineyard with a large diurnal range in a warm region produce fresher, more aromatic wines?","options":{"a":"Very hot days stop photosynthesis, which keeps sugar levels low.","b":"Cool nights slow the loss of aroma and acidity in the grapes.","c":"Warm nights speed up sugar build-up, giving riper, fresher fruit.","d":"A large diurnal range brings more rain during the ripening season."},"notes":{"a":"Not the mechanism given; it is the cool nights that matter.","b":"Correct: as stated in the L3 book.","c":"The L3 book says warm nights accelerate ripening, which works against freshness.","d":"Diurnal range is about temperature, not rainfall."},"answer":"b","ctx":"Apply it: Ribera del Duero, Mendoza and Central Otago all use altitude or inland position for cool nights.","src":"L3 book (2016) p. 26","cards":"L3-stretch-08, L3-stretch-09"},{"id":"Q-L3-05-01","level":"L3","lo":"Stretch (L2 LO2)","ch":"5","topic":"Carbonic maceration","trap":"","stem":"What is the key stylistic effect of carbonic maceration on a red wine?","options":{"a":"Good colour but little tannin: soft, fruity, with kirsch and banana.","b":"Nutty, oxidative flavours from deliberate exposure to oxygen.","c":"Maximum tannin extraction, giving firm wines built for long ageing.","d":"Higher acidity, because malolactic conversion is blocked."},"notes":{"a":"Correct: per the L3 book, which also lists bubble gum and cinnamon-like spice.","b":"Carbonic maceration happens without oxygen (under CO2).","c":"The reverse: it extracts little tannin.","d":"Not a feature of the technique."},"answer":"a","ctx":"Links to L2: the 'banana and candy' techniques in Beaujolais (L2 book p. 94).","src":"L3 book (2016) p. 65","cards":"L3-stretch-18"},{"id":"Q-L3-14-01","level":"L3","lo":"Stretch (L2 LO3)","ch":"14","topic":"Right Bank soils","trap":"","stem":"Why does Merlot, rather than Cabernet Sauvignon, dominate in Saint-Émilion and Pomerol?","options":{"a":"Their cooler clay soils suit Merlot; Cabernet struggles to ripen.","b":"Their warm gravel soils cause Cabernet Sauvignon to over-ripen.","c":"Appellation rules there forbid the planting of Cabernet Sauvignon.","d":"Merlot ripens later, making full use of the long Atlantic autumn."},"notes":{"a":"Correct: per the L3 book.","b":"Gravel is the Left Bank soil, and it helps Cabernet ripen.","c":"No such ban; Cabernet Franc in particular is widely used in Saint-Émilion.","d":"Merlot is the variety that copes with the cooler soils; this reason is not given."},"answer":"a","ctx":"Pair with Q-L2-15-01 (Left Bank gravel) for the full causal contrast.","src":"L3 book (2016) p. 78","cards":"L3-stretch-29"},{"id":"Q-L3-25-01","level":"L3","lo":"Stretch (L2 LO5)","ch":"25","topic":"Port extraction","trap":"","stem":"Why does Port production rely on foot treading or special machines to extract colour and tannin?","options":{"a":"Fortification stops fermentation within 24-36 hours, leaving little time.","b":"The Douro grape varieties have thin, pale skins that need help.","c":"It adds oxygen to the must, creating the tawny style of Port.","d":"Treading lowers tannin so that the Port is drinkable when young."},"notes":{"a":"Correct: fermentation is stopped at about 5-9% abv, so there is little time on the skins.","b":"The reverse: the L3 book says Douro varieties tend to be thick-skinned and high in tannin.","c":"Tawny character comes from long oxidative ageing in barrel, not from treading.","d":"The aim is rapid extraction of MORE colour and tannin."},"answer":"a","ctx":"L2 level: you only need that colour and tannin are extracted rapidly (L2 book p. 118).","src":"L3 book (2016) p. 190-192","cards":"L3-stretch-43"},{"id":"Q-L3-08-01","level":"L3","lo":"Stretch (L2 LO3)","ch":"8","topic":"German Riesling sites","trap":"","stem":"How do Germany's best Riesling vineyards ripen grapes so far from the equator?","options":{"a":"Flat, fertile valley floors that warm up quickly in the spring sun.","b":"High-altitude sites that receive more intense summer sunlight.","c":"Steep, stony, south-facing slopes, often by sun-reflecting rivers.","d":"A Mediterranean climate that gives them long, warm, dry summers."},"notes":{"a":"The best sites are steep, stony, south-facing slopes, not flat valley floors.","b":"Not the explanation given for Germany.","c":"Correct: maximum heat and sunlight; rivers also help protect against frost.","d":"Germany is mostly cool continental."},"answer":"c","ctx":"","src":"L3 book (2016) p. 108; L2 book p. 59","cards":"L3-stretch-23, L2-card-53"},{"id":"Q-L2-01-01","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Clarity: hazy","trap":"","stem":"On the L2 SAT, what can a 'hazy' appearance indicate about a wine?","options":{"a":"That it has been aged for many years in bottle.","b":"That it is high in alcohol and full in body.","c":"That it has been matured in new oak barrels.","d":"A possible fault, or that it was not clarified."},"notes":{"a":"Age shows in the colour (e.g. garnet, tawny), not clarity; haze is suspended particles.","b":"Alcohol and body are judged on the palate; haze is caused by suspended particles.","c":"Oak shows as secondary aromas such as vanilla and smoke, not as haze.","d":"Correct: the book gives both; the precise fault is normally found on the nose and palate."},"answer":"d","ctx":"Haze is a clue, not a diagnosis: confirm any fault on the nose and palate.","src":"L2 book p. 8 (Clarity)","cards":"L2-card-03, L2-card-02"},{"id":"Q-L2-01-02","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"White intensity and colour","trap":"intensity vs colour","stem":"Tilted at 45°, a white wine shows a broad watery rim and a colour with a hint of orange. How should its appearance be described on the L2 SAT?","options":{"a":"Pale lemon","b":"Pale amber","c":"Deep gold","d":"Pale gold"},"notes":{"a":"Lemon has no hint of orange or brown; that hint makes it gold.","b":"Amber is for a very noticeable level of browning, not just a hint.","c":"Deep means the pigment reaches almost to the rim; a broad watery rim means pale.","d":"Correct: a broad watery rim = pale; a hint of orange or brown = gold."},"answer":"d","ctx":"Intensity = how much colour (pale - medium - deep); colour = which hue. Two separate SAT lines.","src":"L2 book p. 8 (Intensity; Colour)","cards":"L2-card-03, L2-card-02"},{"id":"Q-L2-01-03","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Red colour: garnet","trap":"garnet vs tawny","stem":"A red wine shows a noticeable orange or brown colour but is still more red than brown. Which L2 SAT colour term fits?","options":{"a":"Ruby","b":"Tawny","c":"Brown","d":"Garnet"},"notes":{"a":"Ruby is the most common red colour, without garnet's noticeable orange or brown.","b":"Tawny is for a wine that is more brown than red.","c":"Brown is only for wines where no redness remains.","d":"Correct: noticeable orange/brown, but still more red than brown."},"answer":"d","ctx":"Red scale: purple - ruby - garnet - tawny - brown. The garnet/tawny line is 'more red' vs 'more brown'.","src":"L2 book p. 9 (Colour)","cards":"L2-card-03, L2-card-02"},{"id":"Q-L2-01-04","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Rosé colour terms","trap":"L2 'pink-orange', not L3 'salmon'","stem":"Which L2 SAT term describes a pink rosé that shows a hint of orange?","options":{"a":"Pink-orange","b":"Orange","c":"Onion-skin","d":"Salmon"},"notes":{"a":"Correct: the L2 rosé scale is pink - pink-orange - orange.","b":"Orange is for a rosé where orange is the dominant colour; very rare.","c":"Not an SAT term; the L2 rosé scale is pink - pink-orange - orange.","d":"Not on the L2 SAT: it is the 2016 L3 term. For the L2 exam say pink-orange."},"answer":"a","ctx":"","src":"L2 book p. 9, 14 (Colour; SAT)","cards":"L2-card-02, L2-card-03"},{"id":"Q-L2-01-05","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Nose condition","trap":"","stem":"A taster finds honey, caramel and coffee on the nose. When should this be treated as a likely sign of a fault?","options":{"a":"Only when the aromas are of pronounced intensity.","b":"When these are not the expected style of the wine.","c":"Only when the wine also looks hazy in the glass.","d":"Whenever they appear, whatever the wine's style or age."},"notes":{"a":"Intensity is a separate line; the issue is whether the aromas fit the style.","b":"Correct: the book flags them as a likely fault only when that is not the expected style.","c":"Haze is a separate clue; the nose alone can signal a fault.","d":"No: deliberately oxidised wines list coffee and caramel among their aromas."},"answer":"b","ctx":"The book's three warning signs: damp cardboard; honey, caramel or coffee (if unexpected); lacking freshness and fruit.","src":"L2 book p. 9, 15 (Condition; Wine-Lexicon)","cards":"L2-card-04, L2-card-09"},{"id":"Q-L2-01-06","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Aroma intensity vs age","trap":"intensity vs development","stem":"Even after swirling, a red wine's aromas are faint and hard to detect, but they include leather, earth and mushroom. How should the nose be recorded?","options":{"a":"Light intensity, with secondary aromas","b":"Light intensity, with tertiary aromas","c":"Medium intensity, with primary aromas","d":"Pronounced intensity, with tertiary aromas"},"notes":{"a":"Secondary aromas come from winemaking (yeast, MLF, oak); these come from maturation.","b":"Correct: faint even after swirling = light; leather, earth, mushroom are red-wine tertiary aromas.","c":"Faint after swirling is light, and these are not grape or fermentation aromas.","d":"Confuses age with strength: tertiary aromas do not make a nose pronounced."},"answer":"b","ctx":"L2 has no development line: how old a nose smells is not how strong it is.","src":"L2 book p. 9-10, 15 (Aroma intensity; Wine-Lexicon)","cards":"L2-card-04, L2-card-09"},{"id":"Q-L2-01-07","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Butter and cream aromas","trap":"","stem":"A white wine smells of butter and cream. Which winemaking process is the MOST LIKELY source of these aromas?","options":{"a":"Maturation in new oak","b":"Long ageing in bottle","c":"Autolysis of dead yeast","d":"Malolactic conversion"},"notes":{"a":"Oak gives vanilla, cloves, coconut, cedar, smoke and the like, not butter or cream.","b":"Bottle ageing gives tertiary aromas such as petrol, honey and mushroom.","c":"Autolysis gives biscuit, bread and toasted-bread aromas.","d":"Correct: the Wine-Lexicon lists butter, cheese and cream under malolactic conversion (secondary)."},"answer":"d","ctx":"","src":"L2 book p. 10, 15 (Secondary aromas; Wine-Lexicon)","cards":"L2-card-04, L2-card-09"},{"id":"Q-L2-01-08","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Tertiary vs secondary aromas","trap":"NOT stem; toasty autolysis is secondary, not tertiary","stem":"Which of these aromas is NOT classed as tertiary in the L2 Wine-Lexicon?","options":{"a":"Forest floor","b":"Orange marmalade","c":"Hazelnut","d":"Toasted bread"},"notes":{"a":"This IS tertiary: listed for red wines.","b":"This IS tertiary: listed for white wines.","c":"This IS tertiary: listed for white wines and for deliberately oxidised wines.","d":"Correct: secondary, from yeast (lees, autolysis), e.g. in sparkling wines."},"answer":"d","ctx":"Toasty notes are secondary either way: yeast (toasted bread) or oak (charred wood, smoke).","src":"L2 book p. 10, 15 (Secondary aromas; Wine-Lexicon)","cards":"L2-card-09, L2-card-04"},{"id":"Q-L2-01-09","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Tertiary: protected ageing","trap":"oxidative vs protected ageing","stem":"Which tertiary aromas does the book link with ageing protected from oxygen, such as a long period in bottle?","options":{"a":"Petrol, honey and mushroom","b":"Biscuit, pastry and toasted bread","c":"Vanilla, smoke and cloves","d":"Coffee and caramel"},"notes":{"a":"Correct: as given in the book. In both kinds of ageing, fruit becomes less fresh.","b":"These are secondary aromas from autolysis in sparkling wines.","c":"These are secondary aromas from oak.","d":"These come from oxidative ageing, e.g. a long period in oak."},"answer":"a","ctx":"Oxidative (oak) -> coffee, caramel; protected (bottle) -> petrol, honey, mushroom. But oxidised faulty wines can also smell of honey (p. 23).","src":"L2 book p. 10 (Tertiary aromas)","cards":"L2-card-04"},{"id":"Q-L2-01-10","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Herbal vs herbaceous","trap":"NOT stem; herbaceous vs herbal","stem":"Which of these descriptors is NOT in the 'Herbal' cluster of the L2 Wine-Lexicon?","options":{"a":"Eucalyptus","b":"Mint","c":"Dill","d":"Tomato leaf"},"notes":{"a":"This IS herbal: listed with mint, fennel, dill and dried herbs.","b":"This IS herbal: listed with eucalyptus, fennel, dill and dried herbs.","c":"This IS herbal: listed with eucalyptus, mint, fennel and dried herbs.","d":"Correct: it is in the separate 'Herbaceous' cluster, with green bell pepper, grass and asparagus."},"answer":"d","ctx":"Herbaceous = green and leafy (capsicum, grass, tomato leaf, asparagus); herbal = herbs (mint, dill, eucalyptus).","src":"L2 book p. 15 (Wine-Lexicon)","cards":"L2-card-08"},{"id":"Q-L2-01-11","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Primary aromas defined","trap":"","stem":"In the L2 Wine-Lexicon, what are primary aromas and flavours?","options":{"a":"Those of maturation in barrel or bottle","b":"Those of the grape alone, before it is fermented","c":"Those of post-fermentation winemaking","d":"Those of the grape and alcoholic fermentation"},"notes":{"a":"That is tertiary, e.g. leather, petrol, honey, caramel.","b":"Too narrow: aromas created during fermentation are also primary.","c":"That is secondary: yeast (lees, autolysis, flor), MLF and oak.","d":"Correct: e.g. the fruit, floral, herbaceous, herbal and spice clusters."},"answer":"d","ctx":"Not every wine has all three types: a simple young wine may show only primary aromas.","src":"L2 book p. 10, 15 (Primary aromas; Wine-Lexicon)","cards":"L2-card-08, L2-card-04"},{"id":"Q-L2-01-12","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Sweetness scale","trap":"","stem":"On the L2 SAT, which sweetness term describes a wine with a distinct presence of sugar that is generally not sweet enough to partner most desserts?","options":{"a":"Sweet","b":"Medium-sweet","c":"Off-dry","d":"Medium"},"notes":{"a":"Sweet is where sugar is the prominent feature, e.g. Sauternes and Port.","b":"Not an L2 term: the L2 scale is dry - off-dry - medium - sweet.","c":"Off-dry is only a tiny amount of detectable sugar.","d":"Correct: as defined in the book."},"answer":"d","ctx":"","src":"L2 book p. 11 (Sweetness)","cards":"L2-card-05, L2-card-02"},{"id":"Q-L2-01-13","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Judging acidity","trap":"acidity vs alcohol burn; sugar masks acid","stem":"Sugar can mask acidity, and alcohol can burn like acidity. What does the book give as the reliable guide to a wine's acidity?","options":{"a":"How sweet the wine tastes on the tongue","b":"How much and how long the mouth waters","c":"How dry and rough the gums feel","d":"How hot the wine feels after spitting"},"notes":{"a":"Sugar masks acidity, so sweetness is no guide to it.","b":"Correct: the mouth-watering effect remains whatever the sugar level.","c":"Drying and roughness come from tannin binding to saliva.","d":"That burning sensation is alcohol, which can be mistaken for acidity."},"answer":"b","ctx":"This is why a sweet wine's acid seems less obvious than a dry Chablis's, yet can still be high.","src":"L2 book p. 11 (Acidity)","cards":"L2-card-05"},{"id":"Q-L2-01-14","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Tannin sensation","trap":"tannin vs acidity","stem":"Which sensation on the palate is caused mainly by tannin?","options":{"a":"The mouth watering for a long time","b":"A hot, burning feeling after swallowing","c":"The mouth drying up and feeling rough","d":"A taste of sugar on the tongue"},"notes":{"a":"That is acidity.","b":"That is high alcohol triggering pain receptors.","c":"Correct: tannins bind to saliva; they can also taste bitter.","d":"That is sweetness."},"answer":"c","ctx":"Tannins are mostly extracted from the grape skins during fermentation.","src":"L2 book p. 11 (Tannin)","cards":"L2-card-05"},{"id":"Q-L2-01-15","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Alcohol bands","trap":"still vs fortified bands","stem":"Which of these would be described as HIGH in alcohol on the L2 SAT?","options":{"a":"A fortified wine at 16% abv","b":"A fortified wine at 17% abv","c":"A still wine at 13.5% abv","d":"A still wine at 14% abv"},"notes":{"a":"Low: the fortified low band is 15-16.4% abv.","b":"Medium: the fortified medium band is 16.5-18.4% abv.","c":"Medium: the still-wine medium band is 11-13.9% abv.","d":"Correct: for still wines, high is 14% abv and above."},"answer":"d","ctx":"Still: low <11, medium 11-13.9, high 14+. Fortified: low 15-16.4, medium 16.5-18.4, high 18.5+.","src":"L2 book p. 12 (Alcohol)","cards":"L2-card-06, L2-card-30"},{"id":"Q-L2-01-16","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"What creates body","trap":"body vs alcohol","stem":"On the L2 SAT, what creates a wine's body?","options":{"a":"Sugar, acidity, tannin and alcohol together","b":"The intensity of the fruit flavours","c":"Alcohol alone, so body simply mirrors abv","d":"Acidity, with higher acid giving a fuller body"},"notes":{"a":"Correct: body is not a single component; alcohol is the main factor for most wines.","b":"Body is felt by touch, not taste; flavour intensity is a separate line.","c":"Alcohol is the main factor, but sugar, acidity and tannin also play a part.","d":"Reversed: high acidity makes a wine feel lighter in body."},"answer":"a","ctx":"Sugar adds body; ripe tannin adds body; high acid and low, unripe tannin make it feel lighter.","src":"L2 book p. 12 (Body)","cards":"L2-card-06"},{"id":"Q-L2-01-17","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Flavour vs aroma intensity","trap":"","stem":"According to the book, why might a wine's flavour intensity on the palate differ from its aroma intensity on the nose?","options":{"a":"Alcohol in the mouth hides all spice characteristics","b":"Floral aromas become much stronger on the palate","c":"Tannin coats the tongue and masks the fruit flavours","d":"Warming in the mouth can bring out some flavours"},"notes":{"a":"Reversed: some spice characteristics tend to be MORE prominent on the palate.","b":"Reversed: floral characteristics are sometimes LESS prominent on the palate.","c":"Not the book's reason; it cites the wine warming in the mouth.","d":"Correct: e.g. some spice is more prominent on the palate; floral can be less so."},"answer":"d","ctx":"","src":"L2 book p. 12 (Flavour intensity)","cards":"L2-card-06, L2-card-06b"},{"id":"Q-L2-01-18","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Judging the finish","trap":"only desirable sensations count","stem":"After spitting, a wine's fruit flavours vanish quickly but a bitter taste lingers for a long time. How should its finish be described?","options":{"a":"Short","b":"Pronounced","c":"Medium","d":"Long"},"notes":{"a":"Correct: only desirable sensations count; the lingering bitterness is a bitter aftertaste.","b":"Pronounced is an intensity term; the finish scale is short - medium - long.","c":"The pleasant flavours disappear quickly, so the finish is short.","d":"Bitterness is not counted, so its long linger does not make the finish long."},"answer":"a","ctx":"","src":"L2 book p. 13 (Finish)","cards":"L2-card-06"},{"id":"Q-L2-01-19","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Quality level grading","trap":"","stem":"A wine is well balanced, with a range of flavours of medium intensity, but has a short finish. Which quality level fits BEST?","options":{"a":"Good","b":"Very good","c":"Acceptable","d":"Outstanding"},"notes":{"a":"Good is positive on two criteria and short on two.","b":"Correct: positive on three criteria, short on one (length). This is the book's own example.","c":"Acceptable is positive on only one criterion and short on three.","d":"Outstanding must show positively on all four criteria."},"answer":"b","ctx":"Four criteria: balance, length (finish), intensity, complexity. Count the positives.","src":"L2 book p. 14 (Quality level)","cards":"L2-card-07"},{"id":"Q-L2-01-20","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"Quality criteria","trap":"","stem":"Which statement about assessing quality is correct, according to the L2 book?","options":{"a":"A long-lingering bitter aftertaste counts as a long finish.","b":"A wine out of balance is rarely more than acceptable.","c":"The more intense a wine's flavours, the higher its quality.","d":"Every premium wine must show a complex range of flavours."},"notes":{"a":"Only desirable sensations count towards length.","b":"Correct: stated under Balance.","c":"Only up to a point: beyond a certain level, more intensity is not necessarily better.","d":"No: some, e.g. ice wines, are great through purity and definition."},"answer":"b","ctx":"Quality scale: faulty - poor - acceptable - good - very good - outstanding.","src":"L2 book p. 13-14 (Quality level)","cards":"L2-card-07"},{"id":"Q-L2-02-02","level":"L2","lo":"LO6","ch":"2","topic":"Sweet food and red wine","trap":"","stem":"A dry, tannic red wine is served with a sweet dessert. How is the wine MOST LIKELY to taste?","options":{"a":"More drying and bitter, more acidic and less fruity","b":"Softer, sweeter and fruitier than on its own","c":"Fuller-bodied, with noticeably softer tannins","d":"Unchanged, because sweet food does not affect tannin at all"},"notes":{"a":"Correct: sweetness in food makes wine taste 'harder'.","b":"That is the effect of acid (and partly salt) in food.","c":"That is the effect of salty food.","d":"Sweet food makes a wine seem more drying and bitter, so tannin is affected."},"answer":"a","ctx":"Spec link: bitterness from tannins (and oak) is one of the wine components food affects.","src":"L2 book p. 16-17 (Food and wine interactions)","cards":"L2-card-23, L2-card-24"},{"id":"Q-L2-02-03","level":"L2","lo":"LO6","ch":"2","topic":"Pairing with sweet dishes","trap":"","stem":"What general rule does the book give for choosing a wine to drink with a sweet dish?","options":{"a":"Choose a wine slightly less sweet than the dish.","b":"Choose a wine that is sweeter than the dish.","c":"Choose a high-tannin red to balance the sugar.","d":"Choose a dry wine with high acid to cut the sugar."},"notes":{"a":"The rule is a wine with a HIGHER level of sweetness than the dish.","b":"Correct: otherwise a dry wine seems less fruity and unpleasantly acidic.","c":"Sweetness makes wine more drying and bitter, so the tannin is emphasised.","d":"Sweet food makes a dry wine taste unpleasantly acidic and less fruity."},"answer":"b","ctx":"","src":"L2 book p. 17 (Sweetness in food)","cards":"L2-card-24"},{"id":"Q-L2-02-04","level":"L2","lo":"LO6","ch":"2","topic":"Food components that soften","trap":"","stem":"Which two components in food tend to make a wine taste 'softer'?","options":{"a":"Salt and acid","b":"Sweetness and umami","c":"Salt and umami","d":"Acid and sweetness"},"notes":{"a":"Correct: they make wine less drying, bitter and acidic, and sweeter and fruitier.","b":"These two make wine taste 'harder'.","c":"Salt softens, but umami hardens.","d":"Acid softens, but sweetness hardens."},"answer":"a","ctx":"","src":"L2 book p. 16 (Food and wine interactions)","cards":"L2-card-23"},{"id":"Q-L2-02-05","level":"L2","lo":"LO6","ch":"2","topic":"Umami foods","trap":"","stem":"Which of these foods does the book give as an example of a food with umami taste?","options":{"a":"Fresh chilli","b":"Fresh lemon","c":"Aged cheese","d":"Clear honey"},"notes":{"a":"Chilli adds heat, not umami.","b":"Lemon is acidic, a 'softening' component.","c":"Correct: listed with cooked or dried mushrooms, air-dried meats and miso.","d":"Honey is sweet, the other 'hardening' component."},"answer":"c","ctx":"","src":"L2 book p. 17 (Umami in food)","cards":"L2-card-24"},{"id":"Q-L2-02-06","level":"L2","lo":"LO6","ch":"2","topic":"Umami and salt","trap":"","stem":"Why can umami be difficult to isolate in food, according to the book?","options":{"a":"It is the same taste as salt, so the two are confused.","b":"It disappears when food is cooked, so it is rarely tasted.","c":"It usually comes with tastes such as salt that offset it.","d":"It is only found in foods that also contain a lot of sugar."},"notes":{"a":"No: the book calls umami a taste distinct from the other primary tastes.","b":"No: cooked mushrooms are one of the book's umami examples.","c":"Correct: the salt balances umami's negative effects on wine.","d":"No: the examples (mushrooms, air-dried meats, aged cheeses, miso) are not sugary."},"answer":"c","ctx":"","src":"L2 book p. 17 (Umami in food)","cards":"L2-card-24"},{"id":"Q-L2-02-07","level":"L2","lo":"LO6","ch":"2","topic":"Salt and wine","trap":"NOT stem","stem":"Salty food tends to change how a wine tastes. Which of these is NOT one of those effects?","options":{"a":"The wine seems more fruity.","b":"Tannins in red wine seem softer.","c":"The wine seems more acidic.","d":"The wine seems fuller in body."},"notes":{"a":"This IS an effect of salt.","b":"This IS an effect: salt softens the tannin in red wines.","c":"Correct: salt makes a wine seem LESS acidic.","d":"This IS an effect: the book's table says 'more body'."},"answer":"c","ctx":"Salt is the wine-friendly component: it can rescue a tannic red.","src":"L2 book p. 17 (Salt in food)","cards":"L2-card-24"},{"id":"Q-L2-02-08","level":"L2","lo":"LO6","ch":"2","topic":"Acid in food","trap":"","stem":"A very high-acid white wine is paired with a dish dressed with lemon juice. How is the wine MOST LIKELY to taste?","options":{"a":"Hotter and more alcoholic","b":"Less acidic and more fruity","c":"More bitter and more drying","d":"More acidic and much less fruity"},"notes":{"a":"That is the effect of chilli heat.","b":"Correct: acid in food can balance a very high-acid wine and enhance its fruit.","c":"Acid in food makes wine LESS drying and bitter.","d":"That is the effect of sweet or umami food."},"answer":"b","ctx":"","src":"L2 book p. 17 (Acidity in food)","cards":"L2-card-24"},{"id":"Q-L2-02-09","level":"L2","lo":"LO6","ch":"2","topic":"Acid food, low-acid wine","trap":"the low-acid exception","stem":"A dish high in acidity is served with a wine that is LOW in acidity. According to the book, how may the wine seem?","options":{"a":"Higher in alcohol","b":"Less fruity than on its own","c":"More drying and tannic","d":"Sweeter and fruitier"},"notes":{"a":"That is the effect of chilli heat.","b":"Correct: the book's exception: high-acid food can make a low-acid wine seem less fruity.","c":"Acid in food makes wine less drying and bitter.","d":"That is the usual effect with a wine of very high acidity, not low."},"answer":"b","ctx":"L2 implies, and the L3 book (2016, p. 13) states: match high-acid food with a high-acid wine.","src":"L2 book p. 17 (Acidity in food)","cards":"L2-card-24"},{"id":"Q-L2-02-10","level":"L2","lo":"LO6","ch":"2","topic":"Chilli heat","trap":"LEAST stem","stem":"Which of these wines would be LEAST suitable for a guest eating a dish with strong chilli heat?","options":{"a":"A light rosé at 12% abv","b":"A full-bodied red at 15% abv","c":"An off-dry white at 11% abv","d":"A light-bodied white at 11.5% abv"},"notes":{"a":"Moderate alcohol, so chilli has less effect than in a 15% wine.","b":"Correct: chilli effects are greater in high-alcohol wines, and alcohol increases the chilli burn.","c":"Lower alcohol than 15%, so chilli heat has less effect.","d":"Lower alcohol than 15%, so chilli heat has less effect."},"answer":"b","ctx":"Spec link: chilli heat is the food component; alcohol is the wine component it affects.","src":"L2 book p. 17-18 (Chilli heat)","cards":"L2-card-24"},{"id":"Q-L2-02-11","level":"L2","lo":"LO6","ch":"2","topic":"Acid and fat","trap":"","stem":"Why do many people enjoy acidic wines with fatty or oily foods?","options":{"a":"Acidic wines add body to otherwis

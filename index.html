 extracts more tannin; very long periods can smooth it.\n- Later press fractions are deeper and more tannic than free run; fractions adjust the blend.\n- MLF is standard in reds.\n- Cabernet: thick skins, 26-30°C, 12-18 months oak. Pinot Noir: thin skins, hard to extract, often above 30°C, 12-24 months, little new oak. Grenache: usually large old oak."},"L3-stretch-51":{"head":"L2 CH 6/10 STRETCH: BURGUNDY CHARDONNAY AND HIERARCHY","src":"L3 book p. 85-89","body":"- Burgundy pioneered premium Chardonnay methods: barrel fermentation, barrel ageing (typically 6-9 months), MLF, lees. Best age a decade or more. Premature oxidation: known, cause unexplained.\n- Chablis: Chardonnay only; frost the main hazard (sprinklers, heaters). Village Chablis often on north-facing or flatter land; premier and grand cru on south-facing hillsides -> riper citrus, more body.\n- Pouilly-Fuissé, Saint-Véran: limestone suntrap slopes -> some of Burgundy's richest, ripest Chardonnay.\n- Hierarchy (2016 edition, may have changed): regional about half of output; commune about a third; 600+ premiers crus about a tenth (label says premier cru); grands crus just over 1% (33 in Côte d'Or, 1 in Chablis; vineyard name plus 'grand cru'). Reds at village level and above: Pinot Noir only."},"L3-stretch-52":{"head":"L2 CH 6/10 STRETCH: CALIFORNIA PINOT AND CHARDONNAY","src":"L3 book p. 142-147","body":"- Los Carneros: south Napa/Sonoma, cooled by San Pablo Bay; Pinot Noir, Chardonnay, still and sparkling.\n- Russian River Valley (Sonoma): Petaluma Gap -> very cool, foggy; elegant Pinot and Chardonnay. Sonoma Coast: cold Pacific; often south-facing slopes.\n- Santa Barbara: east-west mountains let ocean air in. Santa Maria Valley: fog slows ripening -> concentrated fruit, high acid. Sta. Rita Hills: much cooler; Pinot focus.\n- Chardonnay: Central Valley fruity, low-medium acid, sometimes chips or staves. Old premium style full, high alcohol, oaky, buttery; now more restrained from Carneros and Russian River.\n- AVA law (2016 edition, may have changed): AVAs vary in size and may overlap. Federal minimum percentages for variety, vintage and AVA; states may differ. Non-AVA wines name state or county, with laxer rules."},"L3-stretch-53":{"head":"L2 CH 4 STRETCH: GIs AND LABEL LAW","src":"L3 book p. 72-75","body":"- GI = defined vineyard area, from a region (Bordeaux) to one vineyard (La Romanée). Trade deals protect GIs abroad (Australia dropped 'Chablis').\n- Typically at least 85% must come from the stated GI (some laws stricter or laxer); similar rules can apply to vintage and variety. EU PDO = 100%.\n- PDO: smaller, tight rules on varieties and methods; variety often not on label (Chablis, Meursault); traditional terms (AC) used. PGI: larger, looser, allows non-traditional varieties, variety usually shown; IGP replacing Vin de Pays. No GI: most flexible, multi-region or multi-country blends.\n- Non-EU: no laws on which varieties are planted; legal terms (AVA, Zone, Ward) rarely on labels.\n- 'Contains sulfites' needed above a set SO2 level in most countries.\n- Co-operative, merchant (négociant), estate (domaine): no legal meaning.\n- 2016 edition, may have changed."},"L3-stretch-54":{"head":"L2 CH 8 STRETCH: GERMAN LABELS AND PRÄDIKAT - WHY","src":"L3 book p. 108-112","body":"- Kabinett: lightest; sweet versions 8-9% abv, dry up to 12%. Best sweet ones made by stopping fermentation early (better sugar/acid balance); Süssreserve not used for top wines.\n- Spätlese: riper, more body than Kabinett from the same region. Auslese: selected extra-ripe bunches; noble rot can be important.\n- BA: noble rot typical, not essential. TBA: essential. Eiswein: noble rot not key; varietal purity; no MLF or new oak.\n- Label: village + vineyard (Piesporter Goldtröpfchen); the same form can hide a collective site (Piesporter Michelsberg). Trocken, halbtrocken legal; feinherb not legally defined.\n- GG: dry wines from VDP top sites; a VDP trademark, not German law (2016 edition, may have changed)."},"L3-stretch-55":{"head":"L2 CH 11/14/15 STRETCH: BORDEAUX APPELLATIONS AND WHITES","src":"L3 book p. 79-82","body":"- Bordeaux Supérieur: slightly stricter rules, higher minimum alcohol; both mostly early-drinking medium-bodied reds.\n- Haut-Médoc communes (N to S): Saint-Estèphe, Pauillac, Saint-Julien, Margaux; high Cabernet, blackcurrant, cedar, grippy young. Bas-Médoc (\"Médoc\"): more clay, more Merlot. Pessac-Léognan: gravel; a little lighter, more fragrant.\n- Saint-Émilion: plateau gravel/limestone and clay-limestone escarpment = best; sandy foot of slope = lighter. Pomerol: richer, spicier blackberry.\n- Merlot: most planted; dominates cheap wines for softness.\n- Whites: Sémillon body, Sauvignon acidity. Entre-Deux-Mers, Graves mostly unoaked Sauvignon; Pessac-Léognan blends, often new oak, toasty, nutty."},"L3-stretch-56":{"head":"L2 CH 9 STRETCH: CHENIN BLANC - WHY","src":"L3 book p. 96-97, 161-162","body":"- Grapes in one bunch ripen unevenly -> green, herbaceous notes unless pickers make several passes.\n- Ripeness sets style: barely ripe (10-11% abv potential) for sparkling; riper for dry, medium, sweet; shrivelled or nobly rotten for sweetest.\n- Vouvray: cool, clay -> light-medium body, fruity, floral; rarely new oak; dry to sweet plus sparkling.\n- Anjou-Saumur warmer, drier: Savennières full-bodied dry (airflow stops noble rot); Coteaux du Layon sweet (sheltered valley).\n- Ages for decades: honey, toast, hay.\n- South Africa: most planted variety; basic = simple stone fruit; old bush vines (Swartland, often dry-farmed) more concentrated; some barrel-fermented."},"L3-stretch-57":{"head":"L2 CH 7 STRETCH: ZINFANDEL/PRIMITIVO - WHY","src":"L3 book p. 129, 144, 146-147","body":"- Ripens unevenly: one bunch can hold raisined and underripe grapes -> high alcohol, full body, sometimes a little residual sugar; dried berries, liquorice; underripe grapes may add a herbaceous note.\n- White Zinfandel: rosé from early-picked grapes; pale, medium-sweet, low alcohol.\n- Old-vine Zinfandel: Sonoma (Dry Creek hillsides above the fog; Sonoma Valley), Lodi (Bay breezes; some of the oldest vines). Western Paso Robles (marine air): high-quality Zinfandel.\n- Puglia: hot; high yields -> simple Puglia IGT; controlled yields -> full body, high alcohol, very ripe berry fruit, medium tannin and acid."},"L3-stretch-58":{"head":"L2 CH 10 STRETCH: CHARDONNAY OUTSIDE BURGUNDY","src":"L3 book p. 60, 107, 144, 153, 161-163, 165","body":"- Early budding -> spring frost risk. In warm climates loses acid fast near harvest, so timing is critical.\n- Neutral \"blank canvas\": style outside Burgundy follows the winemaker; now moving away from heavy oak.\n- California: most planted grape; Central Valley fruity, low-medium acid, sometimes chips; Carneros, Russian River more restrained.\n- Australia: cheap blends unoaked or chips; Adelaide Hills, Yarra, Mornington, Margaret River balanced (careful lees, MLF, oak).\n- Chile: Limarí (structure, restraint), Casablanca. South Africa: cooler sites, barrel ferment, lees stirring; Walker Bay.\n- Languedoc: Pays d'Oc IGP; Limoux (altitude) premium oaked."},"L3-stretch-59":{"head":"L2 CH 12 STRETCH: PINOT GRIGIO/PINOT GRIS - WHY","src":"L3 book p. 60-61, 94, 121-122","body":"- Early budding, early ripening; warm climate or late picking -> high sugar, low acid.\n- WHY Italy differs: Veneto plain uses a pale, large-berried clone + high yields + early picking -> neutral, cheap (Veneto IGT). Alpine north-east uses smaller-berried clones -> more concentration.\n- Alto Adige: terraced valley sides, large diurnal range -> dry, light-medium, high acid, citrus. Trentino slightly warmer. Friuli: some of Italy's richest, peach and tropical; Collio, Colli Orientali hills for premium.\n- Alsace: dry or off-dry, oily, ripe tropical fruit, ginger, honey; deep skins can give golden wines; often more acid than Gewurztraminer."},"L3-stretch-60":{"head":"L2 CH 13 STRETCH: GEWURZTRAMINER, VIOGNIER, ALBARIÑO - WHY","src":"L3 book p. 93-94, 100, 133, 137","body":"- Gewurztraminer (Alsace): lychee, rose, sweet spice; pink-tinged skin -> golden wines; full, oily, low-medium acid; 14% abv not uncommon; MLF avoided to keep aroma.\n- Viognier: signature aromas only at very high sugar -> low acid, high alcohol; can turn oily, so handle carefully; new oak used with care. Condrieu: 100% Viognier; best from old low-yield vines on steep terraces.\n- Albariño (Rías Baixas): thick skin resists rot in the damp Atlantic climate; pergolas for airflow; high acid, citrus and stone fruit; mostly unoaked, some lees stirring or oak."},"L3-stretch-61":{"head":"L2 CH 20 STRETCH: CARMENÈRE, MALBEC, PINOTAGE - WHY","src":"L3 book p. 153, 156-161","body":"- Carmenère: late ripening -> warmest, sunniest sites; herbaceous if underripe; full body, often high tannin; often called Chile's signature grape.\n- Malbec: Argentina has the world's largest plantings; deep colour, full body, black fruit, often high but smooth tannins (L2: high tannins); new oak for the best. Lower altitude -> fuller, richer; higher (Uco Valley 900-1,500 m) -> more elegant, floral. Luján de Cuyo: old vines.\n- Pinotage: Pinot Noir x Cinsault, bred in South Africa; light and fruity to full-bodied old-bush-vine styles; heavily toasted staves -> coffee, chocolate; used in Cape blends."},"L3-stretch-62":{"head":"L2 CH 21-23 STRETCH: MORE ITALIAN GRAPES AND TUSCANY","src":"L3 book p. 124, 127-129","body":"- Barbera: late ripening; medium-deep colour, low-medium tannin, high acid; unoaked or barrel-aged. Barbera d'Asti DOCG, d'Alba DOC.\n- Verdicchio (Marche): high acid, green apple, lemon, fennel, almond; best gain honey.\n- Fiano (Campania): medium acid, medium-full, stone fruit, melon; some oak; wax and honey with age.\n- Montepulciano (Abruzzo): deep colour, high tannin, medium acid, black plum; not the Tuscan town.\n- Southern Tuscany warmer -> fuller. Brunello 100% Sangiovese, 5 years incl. 2 oak; Vino Nobile 2 years; Rosso di = declassified. Chianti Classico Riserva 24 months; Gran Selezione single estate (all 2016 edition, may have changed).\n- Super-Tuscans: coast; Bolgheri allows all-international blends."},"L3-stretch-63":{"head":"L2 CH 10/11/14/16/18 STRETCH: SOUTHERN FRANCE - WHY","src":"L3 book p. 105-107","body":"- Warm Mediterranean, low growing-season rain -> drought the main risk; least fungal disease in France. Inland foothills cooler, poorer soils; mistral and tramontane cool the ends.\n- Grenache suits heat; Syrah cooler sites; Mourvèdre only the warmest. Carignan: high tannin, acid, colour, can lack fruit; semi-carbonic softens it.\n- Pays d'Oc IGP: wider grape choice, varietal labels, big volumes of ripe fruity wine -> value.\n- Minervois: Massif Central slopes; varies with altitude and Atlantic influence.\n- Provence: mostly pale, dry, light rosé (Côtes de Provence); Bandol reds from Mourvèdre."},"L3-stretch-64":{"head":"L2 CH 25 STRETCH: SHERRY SOLERA AND STYLES","src":"L3 book p. 185-189","body":"- Palomino fermented at 20-25°C for a neutral base, 11-12% abv. First classification: lighter, finer -> flor; richer -> oxidative.\n- Solera: wine drawn from the oldest level, refilled from the next criadera, and so on -> consistent average-age blend; young wine takes on older wine's character.\n- 600-litre butts, five-sixths full; old oak, no oak flavour.\n- Flor needs nutrients -> frequent top-ups; Fino soleras rarely over 3-4 years average.\n- Manzanilla: matured in Sanlúcar; cooler, humid -> thicker year-round flor, tangier.\n- Amontillado: flor, then refortified to 17%. Oxidative wines can reach 22% as water evaporates.\n- PX: sun-dried, part-fermented, fortified to 17%; often about 500 g/L.\n- VOS 20, VORS 30 years (2016 edition, may have changed)."},"L3-stretch-65":{"head":"L2 CH 24 STRETCH: SPARKLING VINEYARD AND METHOD DETAIL","src":"L3 book p. 173-177","body":"- CAUSAL CHAIN: second fermentation adds 1.2-1.3% abv (L2 says about 1.5% - L2 wins) -> base wine 10-11% -> need low sugar and high acid but ripe, not green, flavour -> cool climate essential; warm regions pick early and risk green flavours.\n- Best grapes hand-picked as whole bunches; gentle pressing limits colour and tannin from black grapes.\n- Tirage: wine, sugar, yeast, nutrients, clarifier; 5-6 atmospheres. Riddling by pupitre (up to 8 weeks) or gyropalette (days). Frozen neck plug disgorged; liqueur d'expédition sets dosage.\n- EU terms (2016 edition): Brut Nature 0-3 g/L, Brut 0-12, Demi-Sec 32-50.\n- Transfer method often labelled \"bottle-fermented\". Carbonation: cheapest."}},"topics":{"1":[{"key":"t01","name":"Preparing for tasting","cards":["L2-card-01"]},{"key":"t02","name":"The systematic approach","cards":["L2-card-02"]},{"key":"t03","name":"Appearance","cards":["L2-card-03"]},{"key":"t04","name":"Nose","cards":["L2-card-04","L2-card-04b"]},{"key":"t05","name":"Palate: sweetness, acidity, tannin","cards":["L2-card-05"]},{"key":"t06","name":"Palate: alcohol, body, flavour, finish","cards":["L2-card-06","L2-card-06b"]},{"key":"t07","name":"Quality","cards":["L2-card-07"]},{"key":"t08","name":"Primary aromas","cards":["L2-card-08"]},{"key":"t09","name":"Secondary and tertiary aromas","cards":["L2-card-09"]}],"2":[{"key":"t23","name":"Food and wine","cards":["L2-card-23"]},{"key":"t24","name":"Food is… wine seems…","cards":["L2-card-24"]}],"3":[{"key":"t25","name":"Storage","cards":["L2-card-25"]},{"key":"t26","name":"Service temperatures","cards":["L2-card-26"]},{"key":"t27","name":"Glasses and serving","cards":["L2-card-27"]},{"key":"t28","name":"Opening and decanting","cards":["L2-card-28"]},{"key":"t29","name":"Faults","cards":["L2-card-29"]}],"4":[{"key":"t39","name":"The grape and ripening","cards":["L2-card-39","L2-card-39b"]},{"key":"t40","name":"Climate influences","cards":["L2-card-40","L2-card-40b"]},{"key":"t41","name":"Weather hazards and vineyard management","cards":["L2-card-41","L2-card-42"]},{"key":"t11","name":"Geographical indications", function bulletHtml(txt){
  const m=txt.match(/^([^:]{2,48}):\s+(.+)$/); const label=m&&!/[.;]/.test(m[1])?m[1]:null; let rest=label?m[2]:txt;
  const cap=x=>x.charAt(0).toUpperCase()+x.slice(1); rest=cap(rest); const parts=rest.split(/;\s+/).map(cap); let body;
  if(parts.length>=3&&rest.length>110) body=`<ul class="parts">${parts.map(p=>`<li>${inl(p)}</li>`).join("")}</ul>`; else body=`<span>${inl(rest)}</span>`;
  if(/^EXAM NOTE/i.test(txt)) return `<li class="note">${inl(txt)}</li>`;
  return label?`<li><span class="term">${inl(label)}</span>${body}</li>`:`<li>${body}</li>`;
}
function cardHtml(id){ const c=CARD[id]; if(!c) return ""; const lines=c.body.split("\n").filter(l=>l.trim()); let out="";
  for(const l of lines){ let m;
    if((m=l.match(/^\s+(\d+)\.\s+(.*)$/))){ const mm=m[2].match(/^(.{2,40}?) - (.*)$/); out+=`<li class="num"><span class="n">${m[1]}</span><span>${mm?`<strong>${inl(mm[1])}</strong> ${inl(mm[2])}`:inl(m[2])}</span></li>`; continue; }
    if((m=l.match(/^\s*[-•]\s+(.*)$/))){ out+=bulletHtml(m[1]); continue; }
    out+=`<li class="plain">${inl(l)}</li>`; }
  return out; }

function hashFor(){ if(detail&&detail.type==="ch") return "#ch-"+detail.ch+(open?"/"+open:""); if(detail&&detail.type==="att") return "#att-"+detail.id; if(detail&&detail.type==="lo") return "#lo-"+detail.lo; return "#"+tab; }
function go(t,d,o){ tab=t; detail=d||null; open=o||null; const want=hashFor(); if(location.hash!==want){ try{history.pushState(null,"",want);}catch(e){} } render(); window.scrollTo({top:0}); }
function readHash(){ const h=(location.hash||"").slice(1); let m;
  if((m=h.match(/^ch-(\d{1,2})(?:\/([\w-]+))?$/))&&CHN[+m[1]]){tab="study";detail={type:"ch",ch:+m[1]};open=m[2]||null;}
  else if((m=h.match(/^att-([\w-]+)$/))){tab="history";detail={type:"att",id:m[1]};open=null;}
  else if((m=h.match(/^lo-(LO[1-6])$/))){tab="home";detail={type:"lo",lo:m[1]};open=null;}
  else {tab=VALID.includes(h)?h:"home";detail=null;open=null;} }
window.addEventListener("hashchange",()=>{readHash();render();});
document.querySelectorAll(".tabbar a").forEach(a=>a.addEventListener("click",e=>{e.preventDefault(); if(a.dataset.tab==="quiz"&&run&&!run.done){tab="quiz";detail=null;render();return;} go(a.dataset.tab);}));
function render(){
  document.querySelectorAll(".tabbar a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===tab?"page":"false"));
  document.body.classList.toggle("running",tab==="quiz"&&((!!run&&!run.done)||(!!drill&&drill.i<drill.qs.length)));
  if(tab==="home") (detail&&detail.type==="lo")?renderLO(detail.lo):renderHome();
  else if(tab==="study") (detail&&detail.type==="ch")?renderChapter(detail.ch):renderStudy();
  else if(tab==="quiz") run?renderRun():drill?renderDrill():renderSetup();
  else (detail&&detail.type==="att")?renderAttempt(detail.id):renderHistory();
}

function gauge(p,early){
  const r=70, c=2*Math.PI*r, v=p==null?0:Math.max(0,Math.min(1,p));
  const tick=f=>{const a=-Math.PI/2+2*Math.PI*f; const x1=84+62*Math.cos(a),y1=84+62*Math.sin(a),x2=84+80*Math.cos(a),y2=84+80*Math.sin(a); return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--fg)" stroke-opacity=".45" stroke-width="2"/>`;};
  const col=p==null?"var(--line)":early?"var(--muted)":p>=0.85?"var(--right)":p>=0.7?"var(--half)":"var(--wrong)";
  return `<div class="gauge"><svg viewBox="0 0 168 168" role="img" aria-label="Estimated exam score ${p==null?"not available yet":pct(p)}">
    <circle cx="84" cy="84" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="14"/>
    <circle cx="84" cy="84" r="${r}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${(c*v).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 84 84)"/>
    ${tick(0.55)}${tick(0.70)}${tick(0.85)}
  </svg><div class="num"><b>${p==null?"–":Math.round(p*100)}</b><span>${p==null?"no data yet":early?"% early estimate":"% estimate"}</span></div></div>`;
}

function studyChapters(){ const d=new Set(doneList()); const nx=nextChapter(); if(TOP[nx]&&TOP[nx].some(t=>t.qids.some(id=>QST[id]))) d.add(nx); return [...d]; }
function mixedSet(n=20,lo){ const s=stats(), chs=new Set(studyChapters()); let pool=BANK.filter(q=>q.level==="L2"&&(chs.has(+q.ch)||!chs.size)&&(!lo||q.lo===lo));
  const now=Date.now(), st=id=>QST[id];
  const due=pool.filter(q=>st(q.id)&&st(q.id).due<=now).sort((a,b)=>st(a.id).due-st(b.id).due);
  const unseen=shuffle(pool.filter(q=>!st(q.id))), rest=pool.filter(q=>st(q.id)&&st(q.id).due>now).sort((a,b)=>st(a.id).last.at.localeCompare(st(b.id).last.at));
  const pick=[]; for(const q of [...due,...unseen,...rest]){ if(pick.length>=n) break; if(!pick.includes(q.id)) pick.push(q.id); }
  return shuffle(pick); }
function startDue(){ const s=stats(); startQuiz(s.due.slice(0,20),"Due for review",{mixed:true}); }
function startMixed(lo){ startQuiz(mixedSet(lo?10:20,lo),lo?`Mixed · ${LON[lo]}`:"Mixed review",{mixed:true}); }

// ---------- running ----------
function newId(){ return new Date().toISOString().replace(/[-:.TZ]/g,"").slice(0,14)+"-"+Math.random().toString(36).slice(2,6); }
function startQuiz(qids,label,opts){
  if(!qids.length){ toast("No questions match that."); return; }
  drill=null; run={id:newId(),label,qids,i:0,picks:{},credit:{},shown:{},at:{},done:false,started:new Date().toISOString(),think:!!(opts&&opts.exam)?false:setup.think,exam:!!(opts&&opts.exam),mixed:!!(opts&&(opts.exam||opts.mixed)),showPips:false};
  if(run.exam){ run.deadline=Date.now()+60*60*1000; run.sel={}; }
  go("quiz");
}
function startMock(){ const q=[]; for(const [lo,k] of Object.entries(MOCK)) q.push(...shuffle(BANK.filter(x=>x.level==="L2"&&x.lo===lo)).slice(0,k).map(x=>x.id)); startQuiz(shuffle(q),"Timed mock exam · 50 · L2",{exam:true}); }
async function persist(){
  if(!db||!run) return; if(!answered()) return;
  const answers={}; for(const qid of run.qids){ if(run.picks[qid]){ const q=byId[qid]; answers[qid]={pick:run.picks[qid],answer:q.answer,credit:run.credit[qid],at:run.at[qid],ch:+q.ch,level:q.level,topic:q.topic}; } }
  const got=Object.values(answers);
  const doc={label:run.label,started:run.started,updated:new Date().toISOString(),total:run.qids.length,answered:got.length,score:got.reduce((s,r)=>s+r.credit,0),think:run.think,qids:run.qids,answers,done:run.done};
  if(run.examInfo) doc.exam=run.examInfo;
  try{ await db.collection("attempts").doc(run.id).set(doc); setDot("on","Saved"); }
  catch(e){ setDot("off","Couldn't save that answer ("+(e&&e.code||"error")+"). It still counts on this page."); }
}
function total(){return run.qids.reduce((s,q)=>s+(run.credit[q]||0),0);}
function answered(){return run.qids.filter(q=>run.picks[q]).length;}
let examTimer=null;
function mmss(ms){ ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return m+":"+String(s).padStart(2,"0"); }
function paceText(){ const used=60*60*1000-(run.deadline-Date.now()), expect=used/72000, got=Object.keys(run.sel).length; return got+2<expect?`<span class="pace warn">Behind pace</span>`:`<span class="pace">On pace</span>`; }
function pipsHtml(k){ return `<div class="pips">${run.qids.map((x,j)=>{ let c=""; if(run.exam) c=run.sel[x]?"ans":""; else if(run.picks[x]) c=run.credit[x]===1?"ok":run.credit[x]===0.5?"half":"bad"; return `<button class="pip ${j===k?"cur":""} ${c}" data-j="${j}" aria-label="Question ${j+1}"></button>`; }).join("")}</div>`; }

      <p><strong>Why:</strong> ${esc(q.notes[q.answer])}</p>

  h+=`</article><div class="actionbar">${run.confirmEnd?`<span class="abtext">End now? ${answered()} of ${n} answered.</span><button class="btn ghost" id="keep">Keep going</button><button class="btn" id="endY">End quiz</button>`
    :`<button class="btn ghost" id="prev" ${k===0?"disabled":""}>Previous</button><button class="btn ghost" id="quit">End</button><button class="btn" id="next" ${locked?"":"disabled"}>${k===n-1?"Results":"Next"}</button>`}</div>`;

function bindRunCommon(k){

  V().querySelectorAll(".pip").forEach(b=>b.onclick=()=>{run.i=+b.dataset.j;run.showPips=false;renderRun();window.scrollTo({top:0});});
  const pv=document.getElementById("prev"); if(pv) pv.onclick=()=>{run.i=Math.max(0,k-1);renderRun();window.scrollTo({top:0});};
  const nx=document.getElementById("next"); if(nx) nx.onclick=()=>{ if(!run.exam&&k===n-1){run.done=true; if(!run.reviewing) persist();} else run.i=Math.min(n-1,k+1); renderRun(); window.scrollTo({top:0}); };
  const qt=document.getElementById("quit"); if(qt) qt.onclick=()=>{ if(!run.exam&&!answered()){ run=null; document.body.classList.remove("running"); go("quiz"); return; } run.confirmEnd=true; renderRun(); };
  const kp=document.getElementById("keep"); if(kp) kp.onclick=()=>{run.confirmEnd=false;renderRun();};
  const ey=document.getElementById("endY"); if(ey) ey.onclick=()=>{ run.confirmEnd=false; if(run.exam){ submitExam(false); return; } run.done=true; persist(); renderRun(); };
}
function submitExam(timeUp){
  clearInterval(examTimer);
  const used=Math.min(60*60*1000,60*60*1000-(run.deadline-Date.now()));
  for(const qid of run.qids){ const l=run.sel[qid]; if(l){ run.picks[qid]=l; run.credit[qid]=l===byId[qid].answer?1:0; } }
  run.exam=false; run.done=true; run.examInfo={usedMs:used,timeUp:!!timeUp,unanswered:run.qids.filter(q=>!run.sel[q]).length}; persist(); renderRun(); window.scrollTo({top:0});
  if(timeUp) toast("Time's up. Your exam was submitted.");
}
function renderResults(){
  document.body.classList.remove("running");
  const t=total(), a=answered(), n=run.qids.length, miss=run.qids.filter(x=>run.picks[x]&&run.credit[x]!==1);
  let extra="";
  if(run.examInfo){ const p=t/n, bandTxt=p>=0.85?"Distinction":p>=0.7?"Merit":p>=0.55?"Pass":"Below pass";
    const lo=Object.keys(MOCK).map(L0=>{ const ids=run.qids.filter(x=>byId[x].lo===L0), sc=ids.reduce((s,x)=>s+(run.credit[x]||0),0); return `<tr><td>${esc(LON[L0])}</td><td>${sc} / ${ids.length}</td></tr>`; }).join("");
    extra=`<p class="verdictline">${bandTxt} · ${pct(p)}</p><p class="facts">Time used ${mmss(run.examInfo.usedMs)} of 60:00${run.examInfo.unanswered?` · ${run.examInfo.unanswered} unanswered (count as wrong)`:""}. Marks: Pass 55%, Merit 70%, Distinction 85%.</p>
      <table class="mini-t"><thead><tr><th>Exam area</th><th>Score</th></tr></thead><tbody>${lo}</tbody></table>`; }
  V().innerHTML=`<section class="card"><div class="eyebrow">${esc(run.label)}</div><div class="big">${fmt(t)} / ${run.examInfo?n:a}</div>
    ${extra||(a?`<p class="sub">${pct(t/a)}${a<n?` · ${n-a} not answered`:""} · Distinction is 85%.</p>`:"")}
    ${miss.length?`<div><div class="eyebrow" style="margin-bottom:6px">To review</div>${miss.map(x=>qRow(byId[x],{credit:run.credit[x],pick:run.picks[x],at:run.at[x]})).join("")}</div>`:`<p>Nothing missed.</p>`}
    <div class="bar"><button class="btn" id="review">Review answers</button><button class="btn ghost" id="again">Practise</button><button class="btn ghost" id="home">Home</button></div></section>`;
  document.getElementById("home").onclick=()=>{run=null;go("home");};
  document.getElementById("again").onclick=()=>{run=null;go("quiz");};
  document.getElementById("review").onclick=()=>{run.done=false;run.reviewing=true;run.i=0;run.qids.forEach(q=>{ if(!run.picks[q]){} });renderRun();};
}

// ---------- drills ----------
let drill=null, drillDocs=[];
function splitList(s){ const out=[]; let depth=0,cur=""; for(const ch of s){ if(ch==="(") depth++; if(ch===")") depth--; if(ch===","&&!depth){ out.push(cur.trim()); cur=""; } else cur+=ch; } if(cur.trim()) out.push(cur.trim()); return out; }
let _gi=null;
function giItems(){ if(_gi) return _gi; const map={};
  for(const [ch,gs] of Object.entries(STUDY.spec||{})){ if(+ch>=24) continue;
    for(const g of gs){ for(const [lab,val] of g.r){ if(!/GI|PDO|PGI|Outside/.test(lab)) continue;
      for(const part of val.split(" · ")){ const i=part.indexOf(": "); const country=i>0?part.slice(0,i):""; const list=part.slice(part.lastIndexOf(": ")+2);
        for(const name of splitList(list)){ const key=name+"|"+country.split(":")[0]; (map[key]=map[key]||{gi:name,country:country.split(":")[0],grapes:new Set(),chs:new Set()}); map[key].grapes.add(g.g); map[key].chs.add(+ch); } } } } }
  _gi=Object.values(map).map(x=>({...x,grapes:[...x.grapes],chs:[...x.chs]})); return _gi; }
function allGrapes(){ return [...new Set(giItems().flatMap(x=>x.grapes))]; }
function giHistory(){ const m={}; for(const d of drillDocs.filter(d=>d.type==="gi").sort((a,b)=>a.at.localeCompare(b.at))) for(const [k,v] of Object.entries(d.results||{})) m[k]=v; return m; }
function startGIDrill(){
  const chs=new Set(studyChapters()); let items=giItems().filter(x=>x.chs.some(c=>chs.has(c))); const scope=items.length>=8?"covered":"all"; if(scope==="all") items=giItems();
  const hist=giHistory(), key=x=>x.gi+"|"+x.country;
  const wrong=shuffle(items.filter(x=>hist[key(x)]&&!hist[key(x)].ok)), unseen=shuffle(items.filter(x=>!hist[key(x)])), rest=shuffle(items.filter(x=>hist[key(x)]&&hist[key(x)].ok));
  const pick=[...wrong,...unseen,...rest].slice(0,15), G=allGrapes();
  const qs=pick.map(x=>{ const right=x.grapes[Math.floor(Math.random()*x.grapes.length)]; const ds=shuffle(G.filter(g=>!x.grapes.includes(g))).slice(0,3); return {x,right,opts:shuffle([right,...ds])}; });
  run=null; drill={type:"gi",scope,qs,i:0,ans:{},started:new Date().toISOString()}; go("quiz");
}
function startOrderDrill(){ run=null; drill={type:"order",qs:shuffle(STUDY.orders||[]).map(o=>({o,pool:shuffle(o.items),placed:[]})),i:0,ans:{},started:new Date().toISOString()}; go("quiz"); }
function renderDrill(){
  const d=drill, n=d.qs.length, k=d.i, q=d.qs[k], done=k>=n;
  if(done){ const sc=Object.values(d.ans).filter(Boolean).length;
    V().innerHTML=`<section class="card"><div class="eyebrow">${d.type==="gi"?"GI match":"Put in order"}</div><div class="big">${sc} / ${n}</div>
      <p class="sub">${d.type==="gi"?(d.scope==="covered"?"GIs from the chapters you've covered. Missed ones come back first next time.":"GIs from every chapter (cover a few more chapters and this narrows to yours)."):"Sequences you got wrong come back first next time."}</p>
      <div class="bar"><button class="btn" id="dAgain">Go again</button><button class="btn ghost" id="dBack">Practise</button></div></section>`;
    document.getElementById("dAgain").onclick=()=>d.type==="gi"?startGIDrill():startOrderDrill(); document.getElementById("dBack").onclick=()=>{drill=null;renderSetup();}; return; }
  let h=`<div class="qhead"><div class="qprog"><i style="width:${(k+1)/n*100}%"></i></div><div class="qmeta"><span>${d.type==="gi"?"GI match":"Put in order"} · ${k+1} of ${n}</span><span>${Object.keys(d.ans).length?`Score ${Object.values(d.ans).filter(Boolean).length} / ${Object.keys(d.ans).length}`:""}</span></div></div><article class="card">`;
  const ans=d.ans[k];
  if(d.type==="gi"){ const x=q.x;
    h+=`<div class="meta"><span class="tag">Spec GI</span></div><p class="stem">Which of these grapes is <em>${esc(x.gi)}</em>${x.country?` (${esc(x.country)})`:""} listed for in the Level 2 spec?</p>
      <ul class="opts">${q.opts.map((g,j)=>{ let c="opt"; if(ans!==undefined){ if(g===q.right||x.grapes.includes(g)) c+=" right"; else if(q.pick===g) c+=" wrong"; } return `<li><button class="${c}" data-g="${j}" ${ans!==undefined?"disabled":""}><span class="letter">${"abcd"[j]}</span><span>${esc(g)}</span></button></li>`; }).join("")}</ul>
      ${ans!==undefined?`<div class="explain" id="explain"><p class="verdict ${ans?"ok":"no"}">${ans?"Right.":"Not quite."}</p><p>${esc(x.gi)} is listed for: <strong>${x.grapes.map(esc).join(", ")}</strong> (chapter${x.chs.length>1?"s":""} ${x.chs.join(", ")}).</p></div>`:""}`; }
  else { const o=q.o, checked=ans!==undefined;
    h+=`<div class="meta"><span class="tag">${esc(o.title)}</span></div><p class="stem">${esc(o.prompt)}</p>
      <p class="tm">Tap the items in order. Tap a placed item to take it back.</p>
      <ol class="placed">${q.placed.map((it,j)=>{ const ok=checked?it===o.items[j]:null; return `<li><button class="opt ${ok===true?"right":ok===false?"wrong":""}" data-un="${j}" ${checked?"disabled":""}><span class="letter">${j+1}</span><span>${esc(it)}</span></button></li>`; }).join("")}</ol>
      ${q.pool.length?`<div class="poolw">${q.pool.map((it,j)=>`<button class="chip" data-pl="${j}">${esc(it)}</button>`).join("")}</div>`:""}
      ${checked?`<div class="explain" id="explain"><p class="verdict ${ans?"ok":"no"}">${ans?"Right order.":"Not quite. The correct order:"}</p>${ans?"":`<ol class="corr">${o.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ol>`}<p class="src">${esc(o.src||"")}</p></div>`:""}`; }
  h+=`</article><div class="actionbar"><button class="btn ghost" id="dQuit">End</button>${d.type==="order"&&ans===undefined?`<button class="btn" id="dCheck" ${q.pool.length?"disabled":""}>Check</button>`:`<button class="btn" id="dNext" ${ans===undefined?"disabled":""}>${k===n-1?"Finish":"Next"}</button>`}</div>`;
  document.body.classList.add("running"); V().innerHTML=h;
  document.getElementById("dQuit").onclick=()=>{ saveDrill(); drill=null; document.body.classList.remove("running"); renderSetup(); };
  const nx=document.getElementById("dNext"); if(nx) nx.onclick=()=>{ d.i++; if(d.i>=n){ saveDrill(); document.body.classList.remove("running"); } renderDrill(); window.scrollTo({top:0}); };
  V().querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ const g=q.opts[+b.dataset.g]; q.pick=g; d.ans[k]=q.x.grapes.includes(g); renderDrill(); const ex=document.getElementById("explain"); if(ex) ex.scrollIntoView({behavior:"smooth",block:"nearest"}); });
  V().querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{ const j=+b.dataset.pl; q.placed.push(q.pool[j]); q.pool.splice(j,1); renderDrill(); });
  V().querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{ const j=+b.dataset.un; q.pool.push(q.placed[j]); q.placed.splice(j,1); renderDrill(); });
  const ck=document.getElementById("dCheck"); if(ck) ck.onclick=()=>{ d.ans[k]=q.placed.every((it,j)=>it===q.o.items[j]); renderDrill(); const ex=document.getElementById("explain"); if(ex) ex.scrollIntoView({behavior:"smooth",block:"nearest"}); };
}
async function saveDrill(){ const d=drill; if(!d||!db||!Object.keys(d.ans).length||d.saved) return; d.saved=true;
  const results={}; d.qs.forEach((q,k)=>{ if(d.ans[k]===undefined) return; if(d.type==="gi") results[q.x.gi+"|"+q.x.country]={ok:d.ans[k],grape:q.pick}; else results[q.o.id]={ok:d.ans[k]}; });
  const doc={type:d.type,at:new Date().toISOString(),started:d.started,total:Object.keys(results).length,score:Object.values(results).filter(r=>r.ok).length,results};
  try{ await db.collection("drills").doc(newId()).set(doc); setDot("on","Saved"); }catch(e){ setDot("off","Couldn't save the drill ("+(e&&e.code||"error")+")."); } }

// ---------- boot ----------
readHash(); render();
(async()=>{
  const fail=(msg)=>{ dbState="none"; setDot("off",msg); render(); };
  const timer=setTimeout(()=>{ if(dbState==="pending") fail("Results store didn't answer. Quizzes work but won't be saved."); },10000);
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ db=null; }
  if(!db){ clearTimeout(timer); fail("Results can't be saved in this view. Quizzes still work."); return; }
  const rerender=()=>{ if(tab==="quiz"&&(run||drill)) return; if(tab==="study"&&!detail&&document.getElementById("sres")){ drawStudy(); return; } render(); };
  db.doc("meta/progress").onSnapshot(s=>{ const d=s.exists?s.data():null; covered=d&&Array.isArray(d.covered)?d.covered.map(Number).sort((a,b)=>a-b):null; current=d&&d.current?+d.current:null; rerender(); },()=>{});
  db.doc("meta/gaps").onSnapshot(s=>{ gapsDoc=s.exists?s.data():null; rerender(); },()=>{});
  db.collection("reading").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ const x=d.data(); if(x&&x.ch&&x.topic) m[x.ch+"|"+x.topic]=x.at||true; }); readMap=m; rerender(); },()=>{});
  db.collection("drills").onSnapshot(snap=>{ drillDocs=snap.docs.map(d=>({id:d.id,...d.data()})); },()=>{});
  db.collection("attempts").onSnapshot(snap=>{ clearTimeout(timer); dbState="ok"; attempts=snap.docs.map(d=>({id:d.id,...d.data()})); setDot("on","Results saved privately to your account"); rerender(); },
    err=>{ clearTimeout(timer); fail("Couldn't read saved results ("+(err&&err.code||"error")+")."); });
})();
</script>

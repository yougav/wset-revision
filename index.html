e light dishes.","b":"Fat makes the wine seem more acidic and more refreshing.","c":"Acid seems to cut through the fat and cleanse the palate.","d":"Fat softens the tannins and adds fruit to the wine."},"notes":{"a":"Not in the book; it describes the acid 'cutting through' the fattiness.","b":"Reversed: fatty or oily food makes wine seem LESS acidic.","c":"Correct: though the book notes this effect is very subjective.","d":"Softer tannin and more fruit are effects of salt."},"answer":"c","ctx":"","src":"L2 book p. 17-18 (Acid and fat)","cards":"L2-card-24"},{"id":"Q-L2-02-12","level":"L2","lo":"LO6","ch":"2","topic":"Flavour intensity matching","trap":"","stem":"A delicate, lightly flavoured white wine is served with a very highly flavoured dish. What is the MOST LIKELY result?","options":{"a":"The wine's flavours seem more intense and vivid.","b":"The wine's alcohol seems much hotter.","c":"The food's flavours seem lighter.","d":"The wine is overwhelmed by the food's flavours."},"notes":{"a":"A highly flavoured dish overwhelms a lighter wine; it does not intensify it.","b":"That is the effect of chilli heat.","c":"The reverse: the food's flavours overpower the wine.","d":"Correct: the book advises matching flavour intensities so one does not overpower the other."},"answer":"d","ctx":"","src":"L2 book p. 17-18 (Flavour intensity)","cards":"L2-card-24"},{"id":"Q-L2-02-13","level":"L2","lo":"LO6","ch":"2","topic":"How food affects wine","trap":"","stem":"Which statement about food and wine interactions is correct, according to the book?","options":{"a":"Food usually affects the wine more than the reverse.","b":"Food's impact on wine is usually more positive than negative.","c":"Mouth-coating foods such as chocolate sharpen the sense of taste.","d":"Wine usually affects the food more than the reverse."},"notes":{"a":"Correct: and the impact is more likely to be negative than positive.","b":"The book says the impact is more likely to be negative.","c":"Chocolate and thick creamy dishes coat the mouth and can impair taste.","d":"Reversed: food generally has more impact on the wine."},"answer":"a","ctx":"Taste buds adapt too: think of orange juice straight after toothpaste.","src":"L2 book p. 16 (Food and wine interactions)","cards":"L2-card-23"},{"id":"Q-L2-02-14","level":"L2","lo":"LO6","ch":"2","topic":"Individual sensitivities","trap":"","stem":"Why might a food and wine pairing that seems perfect to one person seem ordinary to another?","options":{"a":"The basic food and wine interactions are essentially random.","b":"Some tasters have not been trained in the SAT.","c":"People differ in their sensitivities and preferences.","d":"Wine served too cold hides the effects of food."},"notes":{"a":"No: the book sets out clear basic interactions; it is people who vary.","b":"Not the book's reason; it cites individual sensitivities and preferences.","c":"Correct: pairings should consider the individual as well as the basic interactions.","d":"Not the book's reason; it cites individual sensitivities and preferences."},"answer":"c","ctx":"Sensitivity (how strongly you react) differs from preference (whether you like the reaction).","src":"L2 book p. 16 (Pairing Wine and Food)","cards":"L2-card-23, L2-card-24"},{"id":"Q-L2-03-02","level":"L2","lo":"LO6","ch":"3","topic":"Storing cork-sealed bottles","trap":"","stem":"Why should a bottle sealed with a cork be stored on its side?","options":{"a":"It reduces the risk of cork taint (TCA) developing.","b":"It protects the wine from strong light and heat.","c":"It lets any deposit settle along the length of the bottle.","d":"It keeps the cork moist so that it does not let air in."},"notes":{"a":"TCA comes mainly from contaminated cork; storage position is about keeping the cork moist.","b":"Light and heat are avoided by where you store wine, not by its position.","c":"Not the book's reason; it is about keeping the cork moist.","d":"Correct: a dried-out cork can let in air, which oxidises the wine and dulls its fruit."},"answer":"d","ctx":"Screwcapped bottles can be stored standing up.","src":"L2 book p. 19 (Storing wine)","cards":"L2-card-25"},{"id":"Q-L2-03-03","level":"L2","lo":"LO6","ch":"3","topic":"Long-term storage conditions","trap":"","stem":"Which of these storage conditions is MOST LIKELY to damage wine kept for the long term?","options":{"a":"A cool, dark cellar at a constant temperature","b":"Screwcapped bottles stored standing upright","c":"Cork-sealed bottles stored lying down on their side","d":"A sunny window where the temperature swings daily"},"notes":{"a":"This is the ideal: cool, constant and away from light.","b":"Fine: screwcapped wines can be stored standing up.","c":"Good practice: it keeps the cork moist.","d":"Correct: strong sunshine and big temperature changes can both damage wine."},"answer":"d","ctx":"Three storage rules: cool and constant; away from strong light; corked bottles on their side.","src":"L2 book p. 19 (Storing wine)","cards":"L2-card-25"},{"id":"Q-L2-03-04","level":"L2","lo":"LO6","ch":"3","topic":"Well-chilled styles","trap":"NOT stem","stem":"Which of these wines should NOT be served well chilled?","options":{"a":"An oaked Chardonnay","b":"A sweet Sauternes","c":"A non-vintage Champagne","d":"A sweet Tokaji Aszú"},"notes":{"a":"Correct: full-bodied whites are served lightly chilled, 10-13°C.","b":"Sweet wines: well chilled, 6-8°C.","c":"Sparkling wines: well chilled, 6-10°C.","d":"Sweet wines: well chilled, 6-8°C."},"answer":"a","ctx":"Only two styles are 'well chilled' on the spec: sparkling and sweet.","src":"L2 book p. 21 (Service temperatures)","cards":"L2-card-26"},{"id":"Q-L2-03-05","level":"L2","lo":"LO6","ch":"3","topic":"Light-bodied red temperature","trap":"light-bodied reds 13-18°C (known gap)","stem":"What is the recommended service temperature for a light-bodied red such as Beaujolais?","options":{"a":"Room temperature or lightly chilled, 13-18°C","b":"Lightly chilled, like an oaked Chardonnay, 10-13°C","c":"Well chilled, like a Sauternes, 6-8°C","d":"Chilled, like a light white or rosé, 7-10°C"},"notes":{"a":"Correct: as given in the L2 book's table.","b":"10-13°C is for full-bodied whites such as oaked Chardonnay.","c":"6-8°C, well chilled, is for sweet wines such as Sauternes.","d":"7-10°C is for light- and medium-bodied whites and rosés."},"answer":"a","ctx":"Watch the wording: 'room temperature OR lightly chilled', 13-18°C; Shiraz is 15-18°C. (L3 2016 says 13°C.)","src":"L2 book p. 21 (Service temperatures)","cards":"L2-card-26"},{"id":"Q-L2-03-06","level":"L2","lo":"LO6","ch":"3","topic":"Guest temperature preference","trap":"","stem":"A guest prefers their red wine cooler than the recommended temperature. What does the book advise the host to do?","options":{"a":"Offer a white wine instead of the red.","b":"Serve it cooler, as the guest prefers.","c":"Serve it at the recommended temperature.","d":"Explain that cool red wine is a fault."},"notes":{"a":"Not the book's advice; it says to respect the guest's preference.","b":"Correct: recommended temperatures should not override personal preference.","c":"The book says the guidance should not override a guest's preference.","d":"Temperature preference is not a fault; the book says respect it."},"answer":"b","ctx":"","src":"L2 book p. 19 (Service temperature)","cards":"L2-card-26"},{"id":"Q-L2-03-07","level":"L2","lo":"LO6","ch":"3","topic":"Service temperature order","trap":"ordering","stem":"Which sequence lists these wines from the COLDEST to the WARMEST recommended service temperature?","options":{"a":"Pinot Grigio, Sauternes, oaked Chardonnay, Shiraz","b":"Pinot Grigio, oaked Chardonnay, Sauternes, Shiraz","c":"Sauternes, Pinot Grigio, oaked Chardonnay, Shiraz","d":"Sauternes, oaked Chardonnay, Pinot Grigio, Shiraz"},"notes":{"a":"Sauternes (sweet, 6-8°C) is served colder than Pinot Grigio (7-10°C).","b":"Sauternes is the coldest of these (well chilled, 6-8°C).","c":"Correct: 6-8°C, 7-10°C, 10-13°C, 15-18°C.","d":"Oaked Chardonnay (lightly chilled, 10-13°C) is warmer than Pinot Grigio (7-10°C)."},"answer":"c","ctx":"These are the book's own example wines for each style.","src":"L2 book p. 21 (Service temperatures)","cards":"L2-card-26"},{"id":"Q-L2-03-08","level":"L2","lo":"LO6","ch":"3","topic":"Using an ice bucket","trap":"","stem":"How should an ice bucket be prepared to keep a bottle of white wine chilled?","options":{"a":"Fill it with cold water only, no ice.","b":"Fill it with ice and cold water.","c":"Fill it with ice only, and no water.","d":"Fill it with ice and a little warm water."},"notes":{"a":"The book says to use cold water AS WELL AS ice.","b":"Correct: the book says a bucket filled only with ice will not work as efficiently.","c":"Ice alone works less efficiently; add cold water as well.","d":"The book says COLD water as well as ice; warm water would warm the wine."},"answer":"b","ctx":"An insulated container is the book's other option for keeping wine chilled.","src":"L2 book p. 20 (Service temperature)","cards":"L2-card-26"},{"id":"Q-L2-03-09","level":"L2","lo":"LO6","ch":"3","topic":"Warming a cold red","trap":"","stem":"A bottle of red wine is too cold to serve. What does the book advise?","options":{"a":"Put it in the serving room to warm naturally.","b":"Stand it beside a radiator to warm it quickly.","c":"Stand it in a bowl of hot water for a few minutes.","d":"Leave it in a sunny window for a short while."},"notes":{"a":"Correct: let the temperature rise naturally in the room.","b":"The book warns against heating wine this way; it can damage the flavours.","c":"This heats the wine, which the book says can damage its flavours.","d":"Sunshine (its light and heat) can make a wine lose its fruit character."},"answer":"a","ctx":"","src":"L2 book p. 20 (Service temperature)","cards":"L2-card-26"},{"id":"Q-L2-03-10","level":"L2","lo":"LO6","ch":"3","topic":"Glassware shape","trap":"","stem":"What feature do all of the best wine glasses share, and why?","options":{"a":"The bowl narrows at the rim, concentrating the aromas.","b":"The glass is tinted, to hide any slight haze.","c":"The bowl widens at the rim, releasing more aroma.","d":"The bowl is thick-walled, to keep the wine cool for longer."},"notes":{"a":"Correct: aromas are concentrated inside the glass and better appreciated.","b":"You should be able to check appearance: haze can signal a fault.","c":"Reversed: the bowl narrows at the rim to concentrate the aromas.","d":"Not in the book; the shared feature is a bowl that narrows at the rim."},"answer":"a","ctx":"Red-wine glasses are slightly larger than white; sparkling goes in flutes or tulips.","src":"L2 book p. 20 (Glassware)","cards":"L2-card-27"},{"id":"Q-L2-03-11","level":"L2","lo":"LO6","ch":"3","topic":"Opening still wine","trap":"cut the foil then wipe (known gap)","stem":"Which sequence gives the correct order for opening a bottle of still wine sealed with a cork?","options":{"a":"Remove capsule top, clean neck, draw cork, wipe neck","b":"Draw cork, remove capsule top, clean neck, wipe neck","c":"Remove capsule top, draw cork, clean neck, wipe neck","d":"Clean neck, remove capsule top, draw cork, wipe neck"},"notes":{"a":"Correct: cut the capsule, clean the neck, draw the cork, then wipe inside and out.","b":"The capsule top is removed first, before the corkscrew goes in.","c":"The neck is cleaned BEFORE the cork is drawn, then wiped again after.","d":"The capsule top comes off first; then the neck is cleaned."},"answer":"a","ctx":"Centre the corkscrew and draw the cork gently. Applies to cork and synthetic cork only.","src":"L2 book p. 22 (Opening a bottle of still wine)","cards":"L2-card-28"},{"id":"Q-L2-03-12","level":"L2","lo":"LO6","ch":"3","topic":"Sparkling wine safety","trap":"hand on cork from loosening the cage","stem":"Why must the cork of a sparkling wine be kept covered by hand from the moment the wire cage is loosened?","options":{"a":"Warmth from the hand helps the cork come out smoothly.","b":"The pressure can force the cork out and injure someone.","c":"It keeps the cork moist so that it does not crumble.","d":"It stops the wine losing its bubbles before it is poured."},"notes":{"a":"No: it is about controlling the pressure; chilling, not warmth, reduces it.","b":"Correct: even when the wine is chilled, the cork can easily fly out.","c":"Keeping the cork moist is why still wines are stored on their side.","d":"Not the reason given; the risk is the cork flying out."},"answer":"b","ctx":"Chilling reduces the pressure but does not remove the risk.","src":"L2 book p. 22 (Opening a bottle of sparkling wine)","cards":"L2-card-28"},{"id":"Q-L2-03-13","level":"L2","lo":"LO6","ch":"3","topic":"Why decant","trap":"","stem":"According to the L2 book, which wines need to be decanted?","options":{"a":"Wines that smell of damp cardboard","b":"All sparkling wines before serving","c":"Wines with a heavy natural deposit","d":"Wines that look hazy in the glass"},"notes":{"a":"That is cork taint (TCA), a fault; the book decants wines with a heavy deposit.","b":"Not in the book; it decants wines with a heavy deposit.","c":"Correct: the deposit is natural, formed during bottle ageing of some red wines.","d":"Haze may indicate a fault; the book decants wines with a heavy deposit."},"answer":"c","ctx":"","src":"L2 book p. 22 (Decanting a bottle of wine)","cards":"L2-card-28"},{"id":"Q-L2-03-14","level":"L2","lo":"LO6","ch":"3","topic":"Decanting technique","trap":"","stem":"When decanting, how do you know when to stop pouring?","options":{"a":"When the deposit shows near the neck.","b":"When the wine in the decanter starts to look hazy.","c":"When the bottle is completely empty.","d":"When half of the wine has been poured."},"notes":{"a":"Correct: pour in front of a light and stop when the deposit can be seen near the neck.","b":"Too late: the aim is to stop before any deposit enters the decanter.","c":"That would pour the deposit into the decanter.","d":"No set amount: you watch for the deposit against a light."},"answer":"a","ctx":"Keep the bottle horizontal (decanting basket) so the deposit is not disturbed.","src":"L2 book p. 22 (Decanting a bottle of wine)","cards":"L2-card-28"},{"id":"Q-L2-03-15","level":"L2","lo":"LO6","ch":"3","topic":"Inert gas systems","trap":"inert gas vs vacuum","stem":"How do inert gas systems help to keep an opened bottle of wine fresh?","options":{"a":"The gas reacts with the wine to preserve its fruit.","b":"A pump removes the air from inside the bottle.","c":"The gas chills the wine to slow its reaction with air.","d":"Gases such as argon keep air away from the wine."},"notes":{"a":"'Inert' means they do NOT react with the wine.","b":"That is how vacuum systems work.","c":"Not how they work; chilling is what the fridge does.","d":"Correct: inert gases (nitrogen, argon) do not react with the wine and stop it contacting air."},"answer":"d","ctx":"Opened wine goes stale as it reacts with air; a fridge with the cork in also helps.","src":"L2 book p. 20 (Keeping a wine fresh)","cards":"L2-card-27"},{"id":"Q-L2-03-16","level":"L2","lo":"LO6","ch":"3","topic":"Cork taint (TCA)","trap":"heat damage vs oxidation vs TCA (known gap)","stem":"Checking a wine before service, you find aromas of damp cardboard and muted, less fresh fruit. Which fault is MOST LIKELY?","options":{"a":"Heat damage","b":"Failure of closure","c":"Cork taint (TCA)","d":"A heavy deposit"},"notes":{"a":"Heat damage dulls freshness and fruit, but damp cardboard points to TCA.","b":"Oxidation shows as a browner colour with honey, caramel or coffee.","c":"Correct: TCA, mainly from contaminated cork, gives damp cardboard and muted fruit.","d":"A deposit is natural in some aged reds and is not a fault."},"answer":"c","ctx":"Wines with TCA are called 'corked'.","src":"L2 book p. 23 (Cork taint)","cards":"L2-card-29, L2-card-27"},{"id":"Q-L2-03-17","level":"L2","lo":"LO6","ch":"3","topic":"Oxidation signs","trap":"NOT stem; heat damage vs oxidation vs TCA (known gap)","stem":"Which of these is NOT a sign of a wine oxidised by failure of its closure?","options":{"a":"Aromas of honey, caramel or coffee","b":"A lack of freshness and fruit","c":"Aromas of damp cardboard","d":"A browner colour than expected"},"notes":{"a":"This IS a sign (unless it is an oxidative style or a very old wine).","b":"This IS a sign of oxidation.","c":"Correct: damp cardboard is cork taint (TCA).","d":"This IS a sign: oxidised wines look browner than they should."},"answer":"c","ctx":"Not a fault in wines made in an oxidative style or after many years of bottle maturation.","src":"L2 book p. 23 (Failure of closure)","cards":"L2-card-29"},{"id":"Q-L2-03-18","level":"L2","lo":"LO6","ch":"3","topic":"Heat damage","trap":"heat damage vs oxidation vs TCA (known gap)","stem":"A young white has spent months in a hot, brightly lit shop window. It is not browned, but has lost its freshness and fruit. Which fault is MOST LIKELY?","options":{"a":"Failure of closure","b":"Cork taint (TCA)","c":"Heat damage","d":"Lack of clarification"},"notes":{"a":"Oxidation would show as a browner colour, with honey, caramel or coffee.","b":"TCA gives damp cardboard aromas, mainly from contaminated cork.","c":"Correct: too hot, direct sunlight or bright artificial light -> loses freshness and fruit.","d":"Not clarifying shows as haze, not loss of fruit; and the cause here is heat."},"answer":"c","ctx":"Hook: TCA = damp cardboard; oxidation = brown + caramel; heat = just tired and fruitless.","src":"L2 book p. 23 (Heat damage)","cards":"L2-card-29, L2-card-25"},{"id":"Q-L3-01-02","level":"L3","lo":"Stretch (L2 ch 1 tasting)","ch":"1","topic":"Medium(+) on L3 scales","trap":"","stem":"On the L3 SAT, what does 'medium(+)' mean on a scale such as acidity?","options":{"a":"A level found only in sweet or fortified wines","b":"Medium, towards the upper end of the medium band","c":"A level just above high, for extreme wines","d":"The fourth of five equal steps from low up to high"},"notes":{"a":"It applies to most structural scales, for all wines.","b":"Correct: L3 splits 'medium' into three; it is not a scale of five equal parts.","c":"High is itself a range; medium(+) sits below it.","d":"The L3 book stresses it is NOT a scale of five equal parts."},"answer":"b","ctx":"L2 exam: use the three-point scales (e.g. low - medium - high).","src":"L3 book (2016) ch 1, p. 2","cards":"L3-stretch-01"},{"id":"Q-L3-01-03","level":"L3","lo":"Stretch (L2 ch 1 tasting)","ch":"1","topic":"What changes with age","trap":"NOT stem","stem":"According to the L3 book, which of these does NOT change as a wine develops in bottle?","options":{"a":"Its alcohol level","b":"How sweet a sweet wine tastes","c":"Its aromas and flavours","d":"Its tannins"},"notes":{"a":"Correct: alcohol does not change; acidity and sugar change very little.","b":"Sweet wines very slowly taste drier as they age.","c":"They develop away from primary fruit towards tertiary.","d":"Tannins soften with age."},"answer":"a","ctx":"So ageing potential needs a firm structure of acid or tannin plus enough flavour concentration.","src":"L3 book (2016) ch 1, p. 9","cards":"L3-stretch-02"},{"id":"Q-L3-01-04","level":"L3","lo":"Stretch (L2 ch 1 tasting)","ch":"1","topic":"Dried fruit: primary or tertiary","trap":"dried fruit is not always tertiary","stem":"Why does the L3 book warn that dried-fruit aromas do not always signal tertiary development?","options":{"a":"Dried-fruit aromas are a sign of cork taint.","b":"Dried-fruit aromas only form after decades of bottle age.","c":"Young wines from dried grapes or hot climates show them.","d":"Dried-fruit aromas come only from new oak barrels."},"notes":{"a":"TCA gives damp cardboard aromas and muted fruit.","b":"If so they would always be tertiary; the warning is that young wines can show them.","c":"Correct: there they are primary, so they say nothing about age.","d":"Oak gives vanilla, toast, smoke and the like, not dried fruit."},"answer":"c","ctx":"L2 link: Amarone, from dried grapes, shows prune, raisin and fig (L2 book p. 106).","src":"L3 book (2016) ch 1, p. 5","cards":"L3-stretch-02"},{"id":"Q-L3-02-01","level":"L3","lo":"Stretch (L2 LO6)","ch":"2","topic":"Umami without salt","trap":"","stem":"Why does the L3 book say hard cheeses such as Parmesan are easier to pair with wine than eggs or asparagus?","options":{"a":"They are acidic, which makes any wine taste softer.","b":"They have no umami, so they cannot harden the wine.","c":"Their fat makes the wine taste less bitter.","d":"They have salt as well as umami, which offsets it."},"notes":{"a":"Not the reason given; it is the combination of umami with salt.","b":"Parmesan is high in umami; it is the salt that helps.","c":"Not the reason given; fat makes wine seem less acidic (L2). Salt is the key.","d":"Correct: eggs, asparagus, mushrooms and ripe soft cheese have umami but lack the salt."},"answer":"d","ctx":"Cured or smoked meats and seafood work the same way: umami plus salt.","src":"L3 book (2016) ch 2, p. 11","cards":"L3-stretch-03"},{"id":"Q-L3-02-02","level":"L3","lo":"Stretch (L2 LO6)","ch":"2","topic":"Oysters with Muscadet","trap":"","stem":"Why do Muscadet and Champagne work well with oysters, according to the L3 book?","options":{"a":"Oaked, full-bodied and high in alcohol","b":"Unoaked, light in flavour and high in acidity","c":"Off-dry, low in acidity and with light tannins","d":"Sweet, aromatic and low in alcohol"},"notes":{"a":"Oak bitterness clashes with umami, and big flavours would overwhelm oysters.","b":"Correct: no oak bitterness for umami to spoil, no overwhelming, fresh with lemon.","c":"Low acid would seem flat with lemon juice; the book stresses high acidity.","d":"Not the reasons given; the book cites unoaked, light flavour and high acidity."},"answer":"b","ctx":"By the same logic the L3 book suggests Rías Baixas Albariño and Hunter Valley Semillon.","src":"L3 book (2016) ch 2, p. 13","cards":"L3-stretch-03"},{"id":"Q-L3-03-01","level":"L3","lo":"Stretch (L2 LO6)","ch":"3","topic":"Letting wine breathe","trap":"","stem":"Why does the L3 book say that opening a bottle some time before service, to let it 'breathe', does no good?","options":{"a":"Air only affects wines that have a heavy deposit.","b":"The cork has already let in enough air during storage.","c":"Too little of the wine is in contact with the air.","d":"Wine stops reacting with air once it is chilled."},"notes":{"a":"Deposit is why some wines are decanted; aeration is a separate effect.","b":"Not the reason; a sound cork keeps air out.","c":"Correct: decanting, or swirling in the glass, aerates far more.","d":"Not the reason; the issue is how little wine touches the air."},"answer":"c","ctx":"Some young wines do benefit from aeration: decant them or swirl them in the glass.","src":"L3 book (2016) ch 3, p. 17","cards":"L3-stretch-04"},{"id":"Q-L3-03-02","level":"L3","lo":"Stretch (L2 LO6)","ch":"3","topic":"Reduction fault","trap":"","stem":"On the L3 list of faults, which one gives a 'stinky' smell of rotten eggs, boiled cabbage or blocked drains?","options":{"a":"Brettanomyces","b":"Volatile acidity","c":"Reduction","d":"Oxidation"},"notes":{"a":"Brett gives sticking plaster, hot vinyl, smoked meat, leather or sweaty horse.","b":"High VA smells of vinegar or nail polish remover.","c":"Correct: very low levels can add complexity; some may dissipate once the bottle is open.","d":"The opposite of reduction: browner, with toffee, honey, caramel or coffee."},"answer":"c","ctx":"L2 lists only TCA, failure of closure and heat damage; reduction is L3 only.","src":"L3 book (2016) ch 1, p. 4","cards":"L3-stretch-05"},{"id":"Q-L2-01-21","level":"L2","lo":"Ch1 tasting","ch":"1","topic":"ISO tasting glass","trap":"","stem":"What are the two important features of a tasting glass such as the ISO glass, and why do they matter?","options":{"a":"A rounded bowl to aid swirling, and inward walls to trap aromas.","b":"A long stem to hold, and a wide rim to let aromas escape.","c":"A thick base for stability, and a large bowl for a big sample.","d":"Thin, light glass, and straight walls so the wine can breathe."},"notes":{"a":"Correct: per the book (p. 7); other good tasting glasses share both features.","b":"The walls slope inward to capture aromas at the top, not release them.","c":"Good tasting glasses are small enough for a tasting sample.","d":"The book's features are a rounded bowl and inward-sloping walls."},"answer":"a","ctx":"","src":"L2 book p. 7 (Preparing to taste)","cards":"L2-card-01"},{"id":"Q-L2-03-19","level":"L2","lo":"LO6","ch":"3","topic":"Vacuum systems","trap":"","stem":"How does a vacuum system help to keep an opened bottle of still wine fresh?","options":{"a":"An inert gas forms a layer over the wine.","b":"Sulfur dioxide is added through the closure.","c":"A pump removes the air from inside the bottle.","d":"The bottle is chilled to stop all oxidation."},"notes":{"a":"That is an inert gas system (e.g. nitrogen, argon).","b":"Not a method the book describes for keeping wine fresh.","c":"Correct: per the book (p. 20); less air means the wine goes stale more slowly.","d":"A fridge slows the changes but does not stop them; this is not a vacuum system."},"answer":"c","ctx":"An opened wine goes stale as it reacts with air; all three methods slow this down.","src":"L2 book p. 20 (Keeping a wine fresh)","cards":"L2-card-27"},{"id":"Q-L2-03-20","level":"L2","lo":"LO6","ch":"3","topic":"Checks before serving","trap":"","stem":"Which of these is NOT one of the checks the book recommends before serving a wine?","options":{"a":"Check that the wine is clear and not hazy.","b":"Check that the colour is deep rather than pale.","c":"Check that there are no bits floating in the wine.","d":"Check that there are no aromas of wet cardboard or vinegar."},"notes":{"a":"A check: a hazy wine may be faulty.","b":"Correct: not a check; colour depth varies with style and is not a sign of a fault.","c":"A check given in the book.","d":"A check: these aromas suggest a faulty wine."},"answer":"b","ctx":"Spec LO6: checks on the appearance and nose of the wine before serving.","src":"L2 book p. 20 (Serving wine)","cards":"L2-card-27"},{"id":"Q-L2-04-04","level":"L2","lo":"LO1","ch":"4","topic":"Parts of the grape","trap":"","stem":"Which part of the grape gives a red wine its colour?","options":{"a":"The skins of black grapes","b":"The pulp of black grapes","c":"The seeds of black grapes","d":"The stems of black grapes"},"notes":{"a":"Correct: the skin holds colour, tannins and flavours; colour and tannin are much higher in black grapes.","b":"With a tiny number of exceptions, the pulp of white and black grapes has the same pale colour.","c":"Seeds contain high levels of tannin, which can taste bitter, but they do not colour the wine.","d":"Stems contain high levels of tannin, not the colour that red wine takes from the grape."},"answer":"a","ctx":"Spec summary: skin = colour, tannins, flavours; pulp = sugar, acids, water, flavours.","src":"L2 book p. 27 (The parts of a grape)","cards":"L2-card-39"},{"id":"Q-L2-04-05","level":"L2","lo":"LO1","ch":"4","topic":"Seeds and stems","trap":"","stem":"Which part or parts of the grape contain high levels of tannins that can make a wine taste very bitter if handled roughly in winemaking?","options":{"a":"The area just below the skin","b":"The pulp","c":"The skins of white grapes","d":"The seeds and stems"},"notes":{"a":"The book says this area holds high levels of flavour, not the bitter tannins in question.","b":"The pulp is mainly water and sugar, with acids and flavours; the book gives it no tannin.","c":"Tannin levels are much higher in black grapes; the bitterness warning is for seeds and stems.","d":"Correct: the book says these parts can make a wine taste very bitter if handled roughly in winemaking."},"answer":"d","ctx":"","src":"L2 book p. 27 (The parts of a grape)","cards":"L2-card-39"},{"id":"Q-L2-04-06","level":"L2","lo":"LO1","ch":"4","topic":"What a vine needs","trap":"NOT stem","stem":"Which of the following is NOT one of the five things a vine needs in order to grow and thrive?","options":{"a":"Warmth","b":"Nutrients","c":"Carbon dioxide","d":"Oxygen"},"notes":{"a":"Needed: without enough heat a vine cannot grow, which is why it is dormant in winter.","b":"Needed in small amounts, taken up by the roots, to grow healthy shoots, leaves and roots.","c":"Needed: it is taken in by the leaves and used in photosynthesis to make sugars.","d":"Correct: not on the list. The five needs are warmth, sunlight, carbon dioxide, water and nutrients."},"answer":"d","ctx":"Photosynthesis: sunlight lets the vine combine CO2 (via the leaves) and water (via the roots) into sugars.","src":"L2 book p. 27 (What a vine needs)","cards":"L2-card-39b"},{"id":"Q-L2-04-07","level":"L2","lo":"LO1","ch":"4","topic":"Stages of grape formation","trap":"","stem":"Which sequence shows the stages of grape formation and ripening in the correct order?","options":{"a":"Flowering, fruit set, véraison, ripening","b":"Flowering, véraison, fruit set, ripening","c":"Véraison, flowering, fruit set, ripening","d":"Fruit set, flowering, véraison, ripening"},"notes":{"a":"Correct: flowers are pollinated, become small hard green grapes, then start ripening at véraison.","b":"Véraison comes after fruit set, in mid-summer, once the grapes are big enough.","c":"Véraison marks the start of ripening, so it cannot come before flowering.","d":"Fruit set follows flowering: once pollinated, the flower swells and becomes a grape."},"answer":"a","ctx":"Véraison = grapes lose their green colour: white grapes turn golden; black grapes turn red, then purple.","src":"L2 book p. 28 (Grape formation and ripening)","cards":"L2-card-39, L2-card-39b"},{"id":"Q-L2-04-08","level":"L2","lo":"LO1","ch":"4","topic":"Changes during ripening","trap":"","stem":"Which changes take place in a grape as it ripens?","options":{"a":"Acidity falls, sugar rises and black-grape tannins ripen.","b":"Acidity falls, sugar rises and herbaceous flavours increase.","c":"Acidity rises, sugar falls and black-grape tannins ripen.","d":"Acidity falls, sugar falls and the grapes become harder."},"notes":{"a":"Correct: grapes also swell with water and soften. Unripe tannins can taste bitter.","b":"Herbaceous flavours DECREASE as the signature flavours develop.","c":"Reversed: unripe grapes start with very high acid and hardly any sugar.","d":"Sugar rises, and the grapes become soft and fleshy as they swell with water."},"answer":"a","ctx":"","src":"L2 book p. 29 (Ripening)","cards":"L2-card-39"},{"id":"Q-L2-04-09","level":"L2","lo":"LO1","ch":"4","topic":"Aroma changes with ripeness","trap":"direction of change","stem":"Which statement about how grape aromas and flavours change during ripening is correct?","options":{"a":"Some white grapes move from green fruit towards tropical fruit.","b":"Some white grapes move from tropical fruit towards green fruit.","c":"Black grapes move from cooked fruit towards fresh fruit.","d":"Black grapes develop more herbaceous flavours as they ripen."},"notes":{"a":"Correct: green fruit, then stone fruit, then tropical fruit as ripeness increases.","b":"Reversed: green fruit is the less-ripe end of the scale.","c":"Reversed: black grapes go from fresh fruit to cooked fruit as they ripen.","d":"Herbaceous flavours decrease in all grapes as they ripen."},"answer":"a","ctx":"Tasting link: tropical fruit in a white, or cooked fruit in a red, points to riper grapes.","src":"L2 book p. 29 (Ripening)","cards":"L2-card-39"},{"id":"Q-L2-04-10","level":"L2","lo":"LO1","ch":"4","topic":"Extra-ripe and raisined grapes","trap":"raisining vs botrytis vs freezing","stem":"Grapes are left on the vine long after the normal harvest, and the weather stays dry and warm. After a long period, what happens to them?","options":{"a":"Water evaporates, concentrating sugar and acid; dried-fruit aromas develop.","b":"Sugar falls and acidity rises, giving fresher, more herbaceous flavours.","c":"A fungus pierces the skins, concentrating sugars, acids and flavours.","d":"The water freezes and is left behind as ice when the grapes are pressed."},"notes":{"a":"Correct: such grapes can be so sweet that they are commonly used for sweet wines.","b":"The reverse: sugars concentrate and dried-fruit aromas develop.","c":"That is botrytis/noble rot, which also needs damp, misty mornings.","d":"That is how frozen grapes for icewine are concentrated."},"answer":"a","ctx":"Why dry and warm: rain can lead to fungal disease, and ripening needs warmth to continue.","src":"L2 book p. 29 (Extra ripening); p. 35 (Harvest)","cards":"L2-card-39, L2-card-42"},{"id":"Q-L2-04-11","level":"L2","lo":"LO1","ch":"4","topic":"Conditions for noble rot","trap":"","stem":"Which vineyard conditions are ideal for botrytis to develop as noble rot, rather than destroying the grapes?","options":{"a":"Warm, dry mornings, then damp, misty afternoons","b":"Damp, misty mornings, then warm, dry afternoons","c":"Long spells of dry, warm weather with no mist","d":"Heavy autumn rain followed by freezing nights"},"notes":{"a":"Reversed: the book gives misty mornings followed by warm, dry afternoons.","b":"Correct: mist lets the fungus grow and spread; dry afternoons limit it. It must grow on ripe grapes.","c":"This suits extra ripening (raisining); botrytis needs damp, misty mornings.","d":"Rain spreads harmful fungal disease; freezing is the icewine method."},"answer":"b","ctx":"Where the mist comes from: mists near rivers on autumn mornings are essential for botrytis (p. 33).","src":"L2 book p. 30 (Botrytis/noble rot); p. 33 (Mist)","cards":"L2-card-13b, L2-card-40"},{"id":"Q-L2-04-12","level":"L2","lo":"LO1","ch":"4","topic":"How noble rot works","trap":"","stem":"A wine labelled 'Botrytis Semillon' is made from grapes affected by noble rot. How does noble rot change the grapes?","options":{"a":"It turns the acids in the pulp into extra sugar.","b":"It freezes the water inside the grapes on the vine.","c":"It thickens the skins, so the grapes resist rain.","d":"It makes tiny holes in the skins, so water evaporates."},"notes":{"a":"No: sugar AND acid both become very highly concentrated.","b":"That is icewine/Eiswein, which needs healthy grapes.","c":"No: it pierces the skins, and the fungus can easily destroy grapes.","d":"Correct: this concentrates the acids, sugars and flavours of the grape."},"answer":"d","ctx":"Label term Botrytis/Noble Rot: nearly always a sweet wine, very high in sugar and acid.","src":"L2 book p. 30 (Botrytis/noble rot); p. 38-39 (labelling terms)","cards":"L2-card-13, L2-card-13b"},{"id":"Q-L2-04-13","level":"L2","lo":"LO1","ch":"4","topic":"Icewine/Eiswein","trap":"press before thawing","stem":"How is the concentrated juice for an Icewine/Eiswein obtained?","options":{"a":"Frozen grapes are allowed to thaw, then pressed for maximum juice.","b":"Grapes are left to turn into raisins on the vine, then pressed.","c":"Frozen grapes are pressed before they thaw, leaving the ice behind.","d":"Grapes with noble rot are left on the vine and pressed in winter."},"notes":{"a":"They are pressed BEFORE they thaw, so the ice can be separated out.","b":"That is extra ripening; icewine grapes are frozen, not raisined.","c":"Correct: ice crystals and skins are separated from a little concentrated liquid.","d":"Icewine uses HEALTHY grapes, left on the vine into winter until frozen."},"answer":"c","ctx":"Result: a sweet wine with concentrated, pure varietal character.","src":"L2 book p. 30 (Frozen grapes); p. 39 (Icewine/Eiswein)","cards":"L2-card-13, L2-card-39"},{"id":"Q-L2-04-14","level":"L2","lo":"LO1","ch":"4","topic":"Climate vs weather","trap":"","stem":"What is the difference between climate and weather?","options":{"a":"Climate is the long-term average; weather is the day-to-day.","b":"Weather is the long-term average; climate is the day-to-day.","c":"Climate covers temperature only; weather covers rain and sun.","d":"Climate changes yearly; weather stays the same for decades."},"notes":{"a":"Correct: climate = average temperature, sunlight and rainfall a region can expect.","b":"Reversed.","c":"Climate covers average temperature, sunlight AND rainfall.","d":"Reversed: climate does not change yearly, though it can shift over decades."},"answer":"a","ctx":"Climate change: rising average temperatures, more variability and more extreme events such as droughts and floods.","src":"L2 book p. 31, 33 (Climate; Weather)","cards":"L2-card-40b"},{"id":"Q-L2-04-15","level":"L2","lo":"LO1","ch":"4","topic":"Climate categories","trap":"thresholds 16.5 / 18.5 / 21°C","stem":"A region has an average growing season temperature of 19.5°C. How is its climate classified in the Level 2 book?","options":{"a":"Cool","b":"Warm","c":"Moderate","d":"Hot"},"notes":{"a":"Cool = 16.5°C or below.","b":"Correct: warm = 18.5°C to 21°C.","c":"Moderate = 16.5°C to 18.5°C.","d":"Not one of the L2 book's three bands; 19.5°C falls within warm (18.5°C to 21°C)."},"answer":"b","ctx":"Growing season: April to October in the north; October to April in the south.","src":"L2 book p. 31 (Climate)","cards":"L2-card-40b"},{"id":"Q-L2-04-16","level":"L2","lo":"LO1","ch":"4","topic":"Latitude","trap":"","stem":"Which factor does the Level 2 book describe as the most important influence on a wine region's climate?","options":{"a":"Ocean currents","b":"Altitude","c":"Latitude","d":"Soil"},"notes":{"a":"Seas moderate climate (e.g. cooling the Cape) but come after latitude.","b":"Important (higher = cooler), but the book names latitude as the most important factor.","c":"Correct: the closer to the equator, the hotter. Most vineyards lie between 30° and 50° north or south.","d":"Soil supplies water and nutrients, and stones can add warmth, but it is not the main factor."},"answer":"c","ctx":"Outside 30°-50° it is likely to be too hot or too cold for vines to survive.","src":"L2 book p. 31 (Latitude)","cards":"L2-card-40"},{"id":"Q-L2-04-17","level":"L2","lo":"LO1","ch":"4","topic":"Altitude and acidity","trap":"","stem":"Two vineyards lie at the same latitude, but one is much higher. Compared with the lower site, the higher site's grapes are MOST LIKELY to have:","options":{"a":"more sugar, because the cooler air speeds up ripening.","b":"higher acidity, because the cooler climate slows ripening.","c":"lower acidity, because the higher site gets more heat.","d":"riper flavours, because mountains keep autumn rain away."},"notes":{"a":"Cooler conditions slow ripening, so sugar is likely to be lower.","b":"Correct: altitude means a cooler site (p. 32); less ripening leaves more acid (p. 29, 33).","c":"Temperatures drop with altitude, so the higher site is cooler.","d":"Shelter from rain is what mountains do as a barrier, not altitude itself."},"answer":"b","ctx":"Causal chain: higher -> cooler -> slower ripening -> more acid, less sugar.","src":"L2 book p. 32 (Altitude); p. 29, 33","cards":"L2-card-40, L2-card-39"},{"id":"Q-L2-04-18","level":"L2","lo":"LO1","ch":"4","topic":"Seas and ocean currents","trap":"cold vs warm currents","stem":"Which influence does the Level 2 book say cools the climate of the grape-growing regions of the Cape in South Africa?","options":{"a":"Autumn river mists","b":"Cold ocean currents","c":"Warm ocean currents","d":"Heavy cloud cover"},"notes":{"a":"Mists near rivers matter for botrytis, not for cooling the Cape.","b":"Correct: the Cape is a warm region close to the sea, moderated by cold ocean currents.","c":"Warm currents are what WARM the vineyards of northern Europe.","d":"The book links cloud to some warmer Australian regions, not the Cape."},"answer":"b","ctx":"","src":"L2 book p. 32 (Seas)","cards":"L2-card-40"},{"id":"Q-L2-04-19","level":"L2","lo":"LO1","ch":"4","topic":"Rivers","trap":"NOT stem; rivers vs mountains","stem":"Which of the following is NOT a benefit of rivers described in the Level 2 book?","options":{"a":"Helping to protect vineyards against frost","b":"Extending the period warm enough to ripen grapes","c":"Reflecting sunlight on to the vineyards","d":"Sheltering vineyards from rain and cold winds"},"notes":{"a":"A benefit: rivers stay warmer than the land in autumn.","b":"A benefit: their stored warmth lengthens the ripening period.","c":"A benefit: this helps grapes ripen further from the equator.","d":"Correct: this barrier effect is what mountains provide (p. 33)."},"answer":"d","ctx":"Why: rivers take longer to warm up and cool down than land.","src":"L2 book p. 32 (Rivers)","cards":"L2-card-40"},{"id":"Q-L2-04-20","level":"L2","lo":"LO1","ch":"4","topic":"Cloud, fog and mist","trap":"cloud vs fog vs mist","stem":"Which moderating influence does the Level 2 book link to some warmer Australian regions?","options":{"a":"Mist, which forms near rivers on autumn mornings","b":"Cloud, which blocks sunlight and slows photosynthesis","c":"Fog, which forms at ground level and cools the vines","d":"Cold currents, which cool vineyards from the sea"},"notes":{"a":"River mists are linked to botrytis, not to Australia.","b":"Correct: grapes take longer to ripen; a very important factor in some warmer Australian regions.","c":"The book links fog to coastal California and Chile.","d":"The book's example of cold currents is the Cape, South Africa."},"answer":"b","ctx":"Hook: Cloud = warmer Australia; Fog = coastal California and Chile; Mist = botrytis.","src":"L2 book p. 33 (Cloud, fog and mist)","cards":"L2-card-40, L2-card-39b"},{"id":"Q-L2-04-21","level":"L2","lo":"LO1","ch":"4","topic":"Mountains","trap":"mountains vs rivers vs altitude","stem":"According to the Level 2 book, how can a mountain range benefit nearby vineyards?","options":{"a":"They block cloud, rain and cold winds, giving dry autumns.","b":"Their height makes the sheltered vineyards much warmer.","c":"They reflect sunlight on to the vines, helping them ripen.","d":"They bring autumn mists that encourage the growth of botrytis."},"notes":{"a":"Correct: the result is sunny summers, dry autumns and an extended growing season.","b":"Altitude makes vineyards cooler, not warmer.","c":"Reflecting sunlight is a benefit the book gives for rivers.","d":"Autumn morning mists that encourage botrytis form near rivers."},"answer":"a","ctx":"Mountains can also cool warm vineyards at night, as cold air flows down to lower altitudes (Air, p. 32).","src":"L2 book p. 33 (Mountains)","cards":"L2-card-40"},{"id":"Q-L2-04-22","level":"L2","lo":"LO1","ch":"4","topic":"Stony soils","trap":"","stem":"How can many stones on the surface of a vineyard's soil help the grapes to ripen?","options":{"a":"They push cold air away from the vines at night.","b":"They store extra water for the vine in summer.","c":"They absorb heat and make the vineyard warmer.","d":"They add extra nutrients for the vine's roots."},"notes":{"a":"Not in the book; the stones help by absorbing heat.","b":"The book credits the stones with absorbing heat, not with storing water.","c":"Correct: the book says this extra heat can help with grape ripening.","d":"Nutrients come from the soil itself; the stones' role here is heat."},"answer":"c","ctx":"Soil also supplies the vine's water and nutrients, so it must store enough of both.","src":"L2 book p. 33 (Soil)","cards":"L2-card-40"},{"id":"Q-L2-04-23","level":"L2","lo":"LO1","ch":"4","topic":"Cool vintages","trap":"cool vs hot vintage","stem":"In an unusually cool growing season with less bright sunlight, which problems are the grapes MOST LIKELY to have?","options":{"a":"Swollen grapes with diluted flavours","b":"Acid too high, sugar too low, weak signature aromas","c":"Acid too low, sugar too high and few signature aromas","d":"Dried-fruit aromas and damage from sunburn"},"notes":{"a":"Caused by heavy rain close to harvest, not by cool temperatures.","b":"Correct: the vines may struggle to ripen their grapes.","c":"Reversed: less heat and light means less ripening.","d":"These are problems of HOT vintages with untypically bright sun."},"answer":"b","ctx":"Hot vintages: dried-fruit aromas, sunburn, and vines short of water shut down so grapes stop ripening.","src":"L2 book p. 33 (Cool vintages; Hot vintages)","cards":"L2-card-41"},{"id":"Q-L2-04-24","level":"L2","lo":"LO1","ch":"4","topic":"Rain near harvest","trap":"","stem":"Why can heavy rain shortly before harvest reduce the quality of the grapes?","options":{"a":"The grapes lose water, so their sugar becomes too concentrated.","b":"The vines shut down and stop ripening the grapes.","c":"The grapes swell with water, which dilutes their flavours.","d":"The cold rain freezes the grapes on the vine."},"notes":{"a":"Rain adds water; losing water is what happens in raisining.","b":"Vines shut down when SHORT of water in hot, dry conditions.","c":"Correct: high moisture also helps fungal diseases to spread.","d":"Frozen grapes come from winter temperatures and are used for icewine."},"answer":"c","ctx":"","src":"L2 book p. 34 (High levels of rain)","cards":"L2-card-41"},{"id":"Q-L2-04-25","level":"L2","lo":"LO1","ch":"4","topic":"Spring frost","trap":"","stem":"Which weather hazard is a particular risk in spring because it can damage and kill the vine's new growth?","options":{"a":"Hail","b":"Drought","c":"Frost","d":"Fog"},"notes":{"a":"Hail can destroy a vineyard's entire crop, but the book ties the spring risk to frost.","b":"Prolonged low rainfall stops the grapes ripening and can kill vines; not this spring risk.","c":"Correct: this reduces the number of grapes that can be grown that year.","d":"Fog cools coastal vineyards; the book treats it as a moderating influence, not a hazard."},"answer":"c","ctx":"","src":"L2 book p. 34 (Frost; Hail; Drought)","cards":"L2-card-41"},{"id":"Q-L2-04-26","level":"L2","lo":"LO1","ch":"4","topic":"Training, pruning, irrigation","trap":"NOT stem","stem":"Which statement about managing vines is NOT correct, according to the Level 2 book?","options":{"a":"In regions short of rainfall, growers may normally irrigate.","b":"Water is increasingly limited, so most growers use it sparingly.","c":"The majority of vines are trained on trellises.","d":"Vines are typically pruned in summer, while they are in leaf."},"notes":{"a":"True: growers in dry regions are normally allowed to irrigate.","b":"True: water is an increasingly limited and expensive resource.","c":"True: as stated in the book.","d":"Correct: the book says vines are typically pruned in winter, while they are dormant."},"answer":"d","ctx":"Why train and prune: to harvest a healthy, commercially viable crop every year.","src":"L2 book p. 34 (Training and pruning; Irrigation)","cards":"L2-card-41, L2-card-42"},{"id":"Q-L2-04-27","level":"L2","lo":"LO1","ch":"4","topic":"Yield","trap":"too high vs too low","stem":"What is the main risk to grape quality if a vineyard's yields are too high?","options":{"a":"Higher sugar levels and much riper flavours","b":"Diluted flavours and lower sugar levels","c":"Over-concentrated, raisined flavours","d":"A crop too small to be commercially viable"},"notes":{"a":"The reverse: high yields can lower sugar and dilute flavour.","b":"Correct: as stated in the book.","c":"Raisining comes from leaving grapes long on the vine, not from high yields.","d":"That is the risk of yields that are too LOW."},"answer":"b","ctx":"Yield = amount of fruit per unit of area; some regions set a legal maximum.","src":"L2 book p. 35 (Yield)","cards":"L2-card-42"},{"id":"Q-L2-04-28","level":"L2","lo":"LO1","ch":"4","topic":"Harvest timing","trap":"","stem":"A producer wants a crisp, high-acid white wine with less-ripe fruit flavours. When should the grapes be picked?","options":{"a":"Once frozen on the vine in winter","b":"Later in the ripening process","c":"Earlier in the ripening process","d":"After the grapes have shrivelled"},"notes":{"a":"Frozen grapes are used for sweet icewine.","b":"Later picking gives more sugar, less acid and riper flavours.","c":"Correct: earlier picking gives lower sugar, higher acid and less-ripe flavours.","d":"Shrivelled grapes are very sweet, with raisin and dried-fruit flavours."},"answer":"c","ctx":"Causal chain: early pick -> less sugar (so less alcohol) and more acid -> crisp, lighter style.","src":"L2 book p. 35 (Harvest)","cards":"L2-card-42"},{"id":"Q-L2-04-29","level":"L2","lo":"LO1","ch":"4","topic":"Hand or machine harvest","trap":"","stem":"Which statement about harvesting grapes by hand or by machine is correct?","options":{"a":"Machine harvesters work best on steep, terraced slopes.","b":"Neither method is fundamentally better for wine quality.","c":"Hand harvesting gives higher-quality wine in every case.","d":"The method is normally set down by law in each region."},"notes":{"a":"The reverse: machine harvesters cannot be used on steep slopes.","b":"Correct: the choice normally depends on the style of wine being made.","c":"The book says neither approach is fundamentally better.","d":"The book says the choice normally depends on the style of wine."},"answer":"b","ctx":"","src":"L2 book p. 35 (Harvest)","cards":"L2-card-42"},{"id":"Q-L2-04-30","level":"L2","lo":"LO1","ch":"4","topic":"Organic grape-growing","trap":"organic is not chemical-free","stem":"What does it mean if a vineyard is certified as organic?","options":{"a":"The vines may not be irrigated or trained on trellises.","b":"Most chemicals are not used, though some sprays are allowed.","c":"Only herbicides are banned; fungicides and insecticides are fine.","d":"No chemical sprays of any kind may be used on the vines."},"notes":{"a":"Organic status concerns chemicals, not irrigation or training.","b":"Correct: some sprays are still permitted to control the worst fungal diseases.","c":"Most chemicals are not used, not just herbicides.","d":"Some sprays are still permitted against the worst fungal diseases."},"answer":"b","ctx":"Fungicides kill fungi, insecticides kill insects, herbicides kill weeds; nets and fences keep birds and animals out.","src":"L2 book p. 35 (Managing weeds, pests and diseases); p. 39","cards":"L2-card-42, L2-card-13"},{"id":"Q-L2-04-31","level":"L2","lo":"LO1","ch":"4","topic":"GIs outside the EU","trap":"EU vs non-EU GIs","stem":"Why do consumers buying wine from a GI outside the European Union often need the grape variety to predict its style?","options":{"a":"Those GIs set strict rules on which grapes may be planted.","b":"Their labels need not state any origin, so the GI is vague.","c":"Those GIs always cover whole countries, not small regions.","d":"Growers there face minimal rules on grapes and winemaking."},"notes":{"a":"Reversed: that is true of GIs INSIDE the EU, making them a guide to style.","b":"Some statement of origin, such as the country, is legally required.","c":"GIs anywhere can range from a whole country down to one vineyard.","d":"Correct: they can grow whatever they think will succeed, so styles vary widely."},"answer":"d","ctx":"Inside the EU, a GI is a relatively reliable guide to style, because its rules cover grapes and winemaking.","src":"L2 book p. 36-37 (Geographical Indications)","cards":"L2-card-11"},{"id":"Q-L2-04-32","level":"L2","lo":"LO1","ch":"4","topic":"Pays d'Oc IGP","trap":"PGI terms (known gap)","stem":"A Chardonnay from Languedoc-Roussillon is labelled 'Pays d'Oc IGP'. What does IGP tell you about it?","options":{"a":"It is a PGI wine from a wide area with less strict rules.","b":"It is a PDO wine from a small area with tightly defined rules.","c":"It is a wine from a GI outside the European Union.","d":"It is a late-harvest wine made from extra-ripe grapes."},"notes":{"a":"Correct: IGP is France's PGI term. PGIs give producers more flexibility over grapes and methods.","b":"That describes a PDO: AOC or AOP in France.","c":"France is in the EU; IGP is an EU PGI term.","d":"IGP is a GI category; the French late-harvest term is Vendanges tardives."},"answer":"a","ctx":"PGI styles range from high-volume, inexpensive wines to low-volume outstanding wines at a premium price.","src":"L2 book p. 37 (labelling terms table); p. 69 (Languedoc-Roussillon)","cards":"L2-card-12, L2-card-11"},{"id":"Q-L2-04-33","level":"L2","lo":"LO1","ch":"4","topic":"Vino de la Tierra","trap":"PGI terms (known gap); IGT is Italian","stem":"Which Spanish labelling term indicates a PGI wine?","options":{"a":"Vino de la Tierra","b":"Denominación de Origen Calificada (DOCa)","c":"Denominación de Origen (DO)","d":"Indicazione Geografica Tipica (IGT)"},"notes":{"a":"Correct: Spain's PGI term.","b":"A Spanish PDO term (e.g. Rioja DOCa).","c":"A Spanish PDO term.","d":"This IS a PGI term, but it is Italian, not Spanish."},"answer":"a","ctx":"Spain: DOCa and DO = PDO; Vino de la Tierra = PGI.","src":"L2 book p. 37 (labelling terms table)","cards":"L2-card-12"},{"id":"Q-L2-04-34","level":"L2","lo":"LO1","ch":"4","topic":"Landwein","trap":"Landwein = PGI (known gap)","stem":"A German wine is labelled 'Landwein'. What does this term tell you?","options":{"a":"It is a PDO wine with higher minimum sugar","b":"It is a sweet wine from grapes frozen on the vine","c":"It is a PDO wine from one of 13 wine areas","d":"It is a PGI wine, Germany's version of IGP"},"notes":{"a":"That describes Prädikatswein.","b":"That describes Eiswein.","c":"That describes Qualitätswein (p. 60).","d":"Correct: Landwein is Germany's PGI term; typically light-bodied, dry to off-dry (p. 60)."},"answer":"d","ctx":"German ripeness ladder: Landwein (PGI), then Qualitätswein, then Prädikatswein (both PDO).","src":"L2 book p. 37 (labelling terms table); p. 60 (Labelling in Germany)","cards":"L2-card-12"},{"id":"Q-L2-04-35","level":"L2","lo":"LO1","ch":"4","topic":"IGT","trap":"PGI terms (known gap); IGT vs IGP","stem":"On a wine label, what does the term IGT indicate?","options":{"a":"A PGI wine from Italy","b":"A PDO wine from Spain","c":"A PGI wine from France","d":"A PDO wine from Italy"},"notes":{"a":"Correct: Indicazione Geografica Tipica is Italy's PGI term.","b":"Spain's PDO terms are DO and DOCa.","c":"France's PGI term is IGP, not IGT.","d":"Italy's PDO terms are DOC and DOCG."},"answer":"a","ctx":"Example in the book: inexpensive Pinot Grigio labelled Veneto IGT (p. 77).","src":"L2 book p. 37 (labelling terms table); p. 77","cards":"L2-card-12"},{"id":"Q-L2-04-36","level":"L2","lo":"LO1","ch":"4","topic":"PDO labelling terms","trap":"PDO vs PGI terms (known gap)","stem":"Which group contains ONLY PDO labelling terms?","options":{"a":"AOP, DOCG, DOCa","b":"AOP, DO, Landwein","c":"AOC, IGT, DO","d":"IGP, DOC, Qualitätswein"},"notes":{"a":"Correct: PDO terms from France, Italy and Spain.","b":"Landwein is Germany's PGI term; AOP and DO are PDO.","c":"IGT is Italy's PGI term; AOC and DO are PDO.","d":"IGP is France's PGI term; DOC and Qualitätswein are PDO."},"answer":"a","ctx":"One PGI term per country: IGP, IGT, Vino de la Tierra, Landwein. AOC and AOP are both French PDO terms.","src":"L2 book p. 37 (labelling terms table)","cards":"L2-card-12"},{"id":"Q-L2-04-37","level":"L2","lo":"LO1","ch":"4","topic":"Varietal labelling","trap":"","stem":"A bottle of Chablis AOC does not mention Chardonnay on its label. Why is this?","options":{"a":"EU PDO labels need not name the grape; Chablis must be Chardonnay.","b":"Only wines from outside the EU are permitted to name their grape.","c":"Chablis is a PGI wine, and PGI labels may not show grape varieties.","d":"Chablis is always a blend, so no single grape variety can be named."},"notes":{"a":"Correct: the GI's rules fix the grape, so the name may be left off.","b":"EU wines can name grapes (e.g. Alsace); it is just more common outside the EU.","c":"Chablis is a PDO (AOC), and Pays d'Oc IGP wines are often varietal.","d":"Chablis wines must be made from Chardonnay."},"answer":"a","ctx":"Outside the EU, wines are commonly varietally labelled (e.g. a Semillon from South Eastern Australia).","src":"L2 book p. 39 (Example labels)","cards":"L2-card-13"},{"id":"Q-L2-04-38","level":"L2","lo":"LO1","ch":"4","topic":"Vintage and hemisphere","trap":"hemisphere timing","stem":"An Australian wine and a Californian wine are both labelled 2022. How do their ages compare?","options":{"a":"They are exactly the same age, as both say 2022.","b":"The Australian wine is about half a year older.","c":"It depends on when each producer bottled the wine.","d":"The Californian wine is about half a year older."},"notes":{"a":"Same year, but the southern hemisphere harvest comes earlier in it.","b":"Correct: the southern growing season ends around April, the northern one around October.","c":"The vintage is the year the grapes were HARVESTED, not bottled.","d":"Reversed: the southern hemisphere harvests about half a year earlier."},"answer":"b","ctx":"Most wines are best young, so the vintage shows whether a wine may be past its best.","src":"L2 book p. 38 (Vintage); p. 31","cards":"L2-card-13, L2-card-13b"},{"id":"Q-L2-04-39","level":"L2","lo":"LO1","ch":"4","topic":"Late Harvest/Vendanges tardives","trap":"late harvest is not always sweet","stem":"Which statement about wines labelled 'Late Harvest' is correct?","options":{"a":"They must be made from grapes affected by noble rot.","b":"They are lighter in body than wines from a normal harvest.","c":"They may be dry, off-dry, medium or sweet.","d":"They must be made from grapes frozen on the vine."},"notes":{"a":"Botrytis/Noble Rot is a separate term; these grapes are just picked much later.","b":"The reverse: riper grapes and more sugar give fuller-bodied wines.","c":"Correct: riper grapes give fuller-bodied, more concentrated wines in any of these styles.","d":"That is Icewine/Eiswein."},"answer":"c","ctx":"Vendanges tardives is French for 'late harvest'; in Alsace it typically means a medium to sweet wine (p. 78).","src":"L2 book p. 38 (Late Harvest); p. 62, 78 (Vendanges tardives)","cards":"L2-card-13"},{"id":"Q-L2-04-40","level":"L2","lo":"LO1","ch":"4","topic":"Why old vines are prized","trap":"","stem":"Why are wines labelled 'Old Vine' or 'Vieilles vignes' often thought to be of higher quality?","options":{"a":"Older vines give more grapes, so yields are commercially viable.","b":"Older vines give fewer grapes, with more concentrated aromas.","c":"Older vines are picked later, giving riper, sweeter grapes.","d":"Older vines must be grown organically, without most chemicals."},"notes":{"a":"Reversed: older vines typically produce smaller numbers of grapes.","b":"Correct: the smaller crop can give more complex aromas and higher-quality wines (p. 38).","c":"That describes Late Harvest; vine age is about crop size.","d":"Organic status concerns chemical use, not vine age."},"answer":"b","ctx":"The term is not legally defined, so its use can be disputed.","src":"L2 book p. 38 (Vine age)","cards":"L2-card-13, L2-card-12"},{"id":"Q-L3-04-02","level":"L3","lo":"Stretch (L2 LO1)","ch":"4","topic":"Phylloxera and rootstocks","trap":"","stem":"Why are most Vitis vinifera vines grafted on to the roots of American vine species or hybrids?","options":{"a":"American vines give better-flavoured grapes for winemaking.","b":"Grafted vines give a full commercial crop in their first year.","c":"American roots resist phylloxera, which attacks vinifera roots.","d":"Grafted vines are easier to spray with chemicals against phylloxera."},"notes":{"a":"The reverse: their wines are widely thought to have unattractive flavours.","b":"A newly planted vine needs at least three years for a commercial crop.","c":"Correct: grafting gives the American vine's protection with the European vine's flavour.","d":"Phylloxera cannot be controlled with chemicals."},"answer":"c","ctx":"Phylloxera-free exceptions in 2016: Chile, parts of Argentina and South Australia, protected by strict quarantine.","src":"L3 book (2016) ch 4, p. 19, 22-23","cards":"L3-stretch-06, L3-stretch-07"},{"id":"Q-L3-04-03","level":"L3","lo":"Stretch (L2 LO1)","ch":"4","topic":"Crossings and hybrids","trap":"crossing vs hybrid vs clone","stem":"Pinotage was bred from Pinot Noir and Cinsault. Why is it called a crossing rather than a hybrid?","options":{"a":"It was propagated from cuttings rather than from seed.","b":"Both parents belong to the same species, Vitis vinifera.","c":"One of its two parents is an American vine species.","d":"It arose from a natural mutation of Pinot Noir."},"notes":{"a":"Cuttings copy an existing variety; a new variety comes from a seed.","b":"Correct: a hybrid has parents from two different species, usually one American.","c":"That would make it a hybrid.","d":"A mutation gives a clone, as with Pinot Gris and Pinot Blanc."},"answer":"b","ctx":"Links to L2 ch 20. Cabernet Sauvignon is also a crossing: Cabernet Franc x Sauvignon Blanc.","src":"L3 book (2016) ch 4, p. 19, 22","cards":"L3-stretch-06, L3-stretch-07"},{"id":"Q-L3-04-04","level":"L3","lo":"Stretch (L2 LO1)","ch":"4","topic":"Wet soils and budburst","trap":"","stem":"Why can soils with a high water content delay budburst in spring?","options":{"a":"They need more energy to warm up and draw heat from the vine.","b":"They encourage fungal disease that kills the new buds.","c":"They hold more nutrients, so the vine grows leaves before buds.","d":"They reflect more sunlight away from the vines than dry soils."},"notes":{"a":"Correct: wet soils warm slowly and conduct heat from the vine faster than dry soils.","b":"Damp encourages disease (L3 p. 30), but the delay comes from cold soil.","c":"Not the L3 explanation; the effect is on soil temperature.","d":"Reflection is not given; wet soils need more energy to warm up."},"answer":"a","ctx":"Contrast: dark or stony soils absorb and reradiate heat, which can be critical in cool climates.","src":"L3 book (2016) ch 5, p. 25","cards":"L3-stretch-08"},{"id":"Q-L3-04-05","level":"L3","lo":"Stretch (L2 LO1)","ch":"4","topic":"Continentality","trap":"","stem":"Why do wine regions close to large bodies of water generally have low continentality?","options":{"a":"Water reflects sunlight, making the summers much hotter.","b":"Water creates fog that keeps each month equally cold.","c":"Water widens the gap between day and night temperatures.","d":"Water heats up and cools down more slowly than land."},"notes":{"a":"Reflection can add sunlight, but it does not explain the small seasonal range.","b":"Fog cools some regions, but this is not why the seasonal range is small.","c":"The reverse: nearby water REDUCES diurnal range.","d":"Correct: it warms the air in winter and cools it in summer."},"answer":"d","ctx":"Continentality = gap between the hottest and coldest months. It sets the length of the growing season.","src":"L3 book (2016) ch 5, p. 25-26","cards":"L3-stretch-09"},{"id":"Q-L3-04-06","level":"L3","lo":"Stretch (L2 LO1)","ch":"4","topic":"Diurnal range and cloud","trap":"","stem":"Why do clear skies at night tend to increase a vineyard's diurnal range?","options":{"a":"Clear nights trap heat in the soil, raising temperatures.","b":"Clear skies bring sea breezes that warm vineyards overnight.","c":"Clear skies bring more rain, which cools the vines at night.","d":"With no cloud, heat escapes and temperatures drop quickly."},"notes":{"a":"The reverse: with no blanket of cloud, the vineyard cools fast.","b":"Water and its breezes REDUCE diurnal range; clear nights let heat escape.","c":"Clear skies are not linked to rain; cloud cover is the factor.","d":"Correct: cloud acts as an insulating blanket; without it, nights cool fast."},"answer":"d","ctx":"Then: cool nights slow the loss of aroma and acidity (pair with Q-L3-04-01).","src":"L3 book (2016) ch 5, p. 26","cards":"L3-stretch-09"},{"id":"Q-L3-04-07","level":"L3","lo":"Stretch (L2 LO1)","ch":"4","topic":"Continental climate varieties","trap":"bud LATE, ripen early","stem":"Which kind of grape variety does the L3 book say is better suited to a cool continental climate, such as Chablis or Champagne?","options":{"a":"One that buds late and ripens late","b":"One that buds early and ripens early","c":"One that buds late and ripens early","d":"One that buds early and ripens late"},"notes":{"a":"Late budding helps, but late ripening risks the short summer and fast cool-down.","b":"Early ripening helps, but early budding exposes new shoots to spring frost.","c":"Correct: late budding avoids spring frost; early ripening beats the rapid autumn cool-down.","d":"The worst fit: frost risk in spring and too little time in autumn."},"answer":"c","ctx":"Why: short summers, a large rapid temperature drop in autumn, and spring frost risk.","src":"L3 book (2016) ch 5, p. 31","cards":"L3-stretch-10"},{"id":"Q-L3-04-08","level":"L3","lo":"Stretch (L2 LO1)","ch":"4","topic":"Maritime climate","trap":"","stem":"How does a maritime climate help Bordeaux ripen thick-skinned Cabernet Sauvignon at its latitude?","options":{"a":"It stays warm enough for ripening to go on far into autumn.","b":"Its cold nights give the grapes more time to build sugar.","c":"It has a big gap between summer and winter temperatures.","d":"It gives hot, dry summers with almost no rain all year."},"notes":{"a":"Correct: low continentality and evenly spread rain moderate temperatures.","b":"Not the L3 explanation; it is the long, mild autumn that matters.","c":"That is high continentality (continental climate); maritime is low.","d":"Maritime rainfall is spread evenly through the year."},"answer":"a","ctx":"Downside: spring and summer rain can harm flowering, fruit set and grape health. Pair with Q-L2-15-01 (gravel).","src":"L3 book (2016) ch 5, p. 31","cards":"L3-stretch-10"},{"id":"Q-L3-04-09","level":"L3","lo":"Stretch (L2 LO1)","ch":"4","topic":"Mediterranean climate style","trap":"","stem":"Compared with wines from a maritime climate, wines from a Mediterranean climate are MOST LIKELY to have:","options":{"a":"fuller body, riper tannins, less alcohol and more acid.","b":"lighter body, firmer tannins, less alcohol and more acid.","c":"lighter body, riper tannins, more alcohol and more acid.","d":"fuller body, riper tannins, more alcohol and less acid."},"notes":{"a":"Riper grapes mean MORE alcohol and LESS acid.","b":"Reversed: that is the cooler, less sunny maritime direction.","c":"Extra warmth gives fuller body and lower acidity.","d":"Correct: extra warmth and sunlight give riper grapes."},"answer":"d","ctx":"Mediterranean: low continentality, warm dry summers (e.g. coastal California, Chile, South Africa); drought risk.","src":"L3 book (2016) ch 5, p. 31","cards":"L3-stretch-11"},{"id":"Q-L3-04-10","level":"L3","lo":"Stretch (L2 LO1)","ch":"4","topic":"Spring frost protection","trap":"sprinklers vs wind machines vs heaters","stem":"How do sprinklers protect newly burst buds and shoots during a spring frost?","options":{"a":"They draw warmer air down from above to ground level.","b":"The water washes off frost crystals before they can form.","c":"As the water freezes, it releases heat into the plant tissue.","d":"They create air movement that stops cold air settling."},"notes":{"a":"That is how wind machines work.","b":"Not the mechanism given; freezing water releases heat.","c":"Correct: per the L3 book.","d":"That is how heaters work, per the L3 book."},"answer":"c","ctx":"Site choice helps too: cold air sinks, so mid-slope sites are less frost-prone than hollows.","src":"L3 book (2016) ch 5, p. 26","cards":"L3-stretch-11"},{"id":"Q-L3-04-11","level":"L3","lo":"Stretch (L2 LO1)","ch":"4","topic":"Mild water stress","trap":"mild stress vs drought","stem":"Why can a mild shortage of water, once the vine's canopy has grown, benefit grape ripening?","options":{"a":"The canopy grows larger, shading the grapes from sunburn.","b":"The vine stops photosynthesising, so the grapes keep their acid.","c":"The vine puts its energy into ripening grapes, not new shoots.","d":"The grapes swell with more water, giving fuller flavours."},"notes":{"a":"The reverse: the canopy stays small, reducing shade.","b":"Mild stress lets photosynthesis continue; severe drought stops it.","c":"Correct: it keeps photosynthesising, and the smaller canopy shades the grapes less.","d":"Water shortage limits swelling; too much water dilutes flavour."},"answer":"c","ctx":"L3 ideal: good water early in the season, then mild water stress after véraison.","src":"L3 book (2016) ch 5, p. 27, 31","cards":"L3-stretch-12"},{"id":"Q-L3-04-12","level":"L3","lo":"Stretch (L2 LO1)","ch":"4","topic":"Bush vines","trap":"","stem":"Why are untrellised bush vines well suited to warm, dry, sunny regions such as the Southern Rhône and Barossa Valley?","options":{"a":"Their dense shade improves airflow and cuts disease.","b":"Their extra shade helps to protect the grapes.","c":"They are easy to harvest by machine on flat land.","d":"Their open canopy maximises sunlight on the grapes."},"notes":{"a":"Shade and poor airflow PROMOTE disease, a problem in cool or wet regions.","b":"Correct: in intense sun, shade guards the grapes against sunburn.","c":"Untrellised vines are not suitable for mechanical harvesting.","d":"Open trellised canopies (e.g. VSP) suit regions with LIMITED sunlight."},"answer":"b","ctx":"In cool or wet regions bush-vine shade slows ripening; Beaujolais ties the shoot tips together (gobelet).","src":"L3 book (2016) ch 6, p. 34","cards":"L3-stretch-13"},{"id":"Q-L2-04-41","level":"L2","lo":"LO1","ch":"4","topic":"Cooling air","trap":"","stem":"How can air moving from nearby mountains or cold seas help vineyards in a warm area?","options":{"a":"It warms them, stopping spring frost on the valley floor.","b":"It brings rain, so irrigation is not needed.","c":"It concentrates sugars by drying out the grapes on the vine.","d":"It cools them, e.g. cold mountain air flowing down at night."},"notes":{"a":"The book's point is that air from seas and mountains cools warm areas, not warms them.","b":"The book's point is cooling, not rainfall.","c":"Grapes shrivel when left long on the vine; this air cools vineyards instead.","d":"Correct: onshore winds from cold seas and night-time mountain air moderate warm areas (p. 32)."},"answer":"d","ctx":"Causal chain: cooler air -> slower ripening -> more acidity kept.","src":"L2 book p. 32 (Air)","cards":"L2-card-40"},{"id":"Q-L2-04-42","level":"L2","lo":"LO1","ch":"4","topic":"Fog","trap":"fog vs mist","stem":"What effect does fog have on vineyards in coastal California and Chile?","options":{"a":"It warms them by trapping the day's heat close to the ground.","b":"It protects the vines from spring frost and hail.","c":"It cools the vineyards, a very important moderating influence.","d":"It encourages noble rot, essential for their sweet wines."},"notes":{"a":"Fog cools a vineyard rather than warming it.","b":"Not the book's explanation; fog's role is cooling.","c":"Correct: fog forms at ground level and cools a vineyard (p. 33).","d":"That is autumn mist near rivers (e.g. Sauternes), not coastal fog."},"answer":"c","ctx":"Clouds block sunlight; fog forms at ground level and cools; mist (less dense) helps botrytis.","src":"L2 book p. 33 (Cloud, fog and mist)","cards":"L2-card-40"},{"id":"Q-L2-04-43","level":"L2","lo":"LO1","ch":"4","topic":"Hail","trap":"","stem":"Why is hail a serious hazard for grape growers?","options":{"a":"It freezes the grapes, so they can only make icewine.","b":"It cools the vineyard air at night, so grapes ripen slowly.","c":"Heavy storms can destroy a vineyard's entire annual crop.","d":"It spreads fungal disease, which causes noble rot."},"notes":{"a":"Icewine comes from healthy grapes frozen in winter, not hail.","b":"Cold night air from mountains does that; hail physically damages the vines.","c":"Correct: hail can badly damage vines and grapes (p. 34).","d":"Noble rot needs misty mornings and warm, dry afternoons."},"answer":"c","ctx":"","src":"L2 book p. 34 (Hail)","cards":"L2-card-42"},{"id":"Q-L2-04-44","level":"L2","lo":"LO1","ch":"4","topic":"Drought","trap":"","stem":"What happens to a vine in drought, and why can't irrigation always solve it?","options":{"a":"It produces more sugar, and irrigation would dilute it.","b":"It ripens its grapes faster, and irrigation is banned in PDOs.","c":"Its grapes swell and dilute, and irrigation spreads disease.","d":"It cannot ripen its grapes, and water may not be available."},"notes":{"a":"Without water the vine cannot ripen its grapes at all.","b":"Drought stops ripening; the book gives lack of water as the limit.","c":"Swelling and dilution come from heavy rain near harvest, not drought.","d":"Correct: in the worst cases the vine may die; irrigation needs water (p. 34)."},"answer":"d","ctx":"Drought: prolonged below-average rainfall, often made worse by above-average temperatures.","src":"L2 book p. 34 (Drought)","cards":"L2-card-42"},{"id":"Q-L2-04-45","level":"L2","lo":"LO1","ch":"4","topic":"Vineyard sprays","trap":"","stem":"Which pairing of vineyard spray and target is correct?","options":{"a":"Fungicide: birds and animals","b":"Insecticide: weed growth","c":"Herbicide: insect pests","d":"Fungicide: fungal disease"},"notes":{"a":"Birds and larger animals are kept out with nets and fences.","b":"Insecticides kill insects; herbicides control weeds.","c":"Herbicides control weeds; insecticides kill insects.","d":"Correct: fungicides kill fungi; insecticides kill insects; herbicides control weeds (p. 35)."},"answer":"d","ctx":"Many growers minimise chemicals; organic vineyards are restricted in their use.","src":"L2 book p. 34-35 (Managing weeds, pests and diseases)","cards":"L2-card-42"},{"id":"Q-L2-04-46","level":"L2","lo":"LO1","ch":"4","topic":"Véraison colour change","trap":"","stem":"At véraison, how do the colours of white and black grapes change?","options":{"a":"White grapes become pink; black grapes turn brown, then black.","b":"White grapes become golden; black grapes turn red, then purple.","c":"White grapes turn green; black grapes turn purple, then red.","d":"Both stay green until harvest, then darken in the sun."},"notes":{"a":"Not the book's description.","b":"Correct: véraison is when grapes start to lose their green colour (p. 28).","c":"Grapes LOSE their green at véraison, and black grapes go red, then purple.","d":"Colour change marks the start of ripening, by mid-summer."},"answer":"b","ctx":"Véraison starts the ripening process, by mid-summer.","src":"L2 book p. 28 (Véraison)","cards":"L2-card-39"},{"id":"Q-L2-05-03","level":"L2","lo":"LO2","ch":"5","topic":"Alcoholic fermentation","trap":"","stem":"During alcoholic fermentation, what do yeast produce as they feed on the sugars in grape juice?","options":{"a":"Alcohol, carbon dioxide and heat","b":"Alcohol, oxygen and heat","c":"Carbon dioxide, colour and acidity","d":"Alcohol, acid and tannin"},"notes":{"a":"Correct: the book says yeast produce alcohol, CO2 (which escapes) and heat.","b":"Yeast produce carbon dioxide, not oxygen.","c":"Colour comes from black-grape skins; alcohol is the key product.","d":"Acid and tannin come from the grapes, not from yeast feeding on sugar."},"answer":"a","ctx":"It usually stops when all the sugar is used up, giving a dry wine; more sugar in the grapes means more alcohol.","src":"L2 book p. 40 (Alcoholic fermentation)","cards":"L2-card-43"},{"id":"Q-L2-05-04","level":"L2","lo":"LO2","ch":"5","topic":"Crushing vs pressing","trap":"crushing vs pressing","stem":"In winemaking, what is the purpose of crushing the grapes?","options":{"a":"To split the skins and release some juice.","b":"To separate the new wine from the skins.","c":"To push the floating cap down into the juice.","d":"To squeeze out as much liquid as possible."},"notes":{"a":"Correct: as defined in the book.","b":"That is draining, which in red winemaking follows fermentation.","c":"That is punching down, a red-wine extraction technique.","d":"That is pressing, done in a machine called a press."},"answer":"a","ctx":"Pressing can happen before fermentation (whites) or after it (reds).","src":"L2 book p. 40 (Common winemaking techniques)","cards":"L2-card-43"},{"id":"Q-L2-05-05","level":"L2","lo":"LO2","ch":"5","topic":"Red winemaking order","trap":"white vs red order","stem":"Which of these shows the typical order of the stages in making a dry red wine?","options":{"a":"Crushing, fermentation, pressing, draining, maturation, packaging","b":"Crushing, pressing, fermentation, draining, maturation, packaging","c":"Crushing, fermentation, draining, pressing, maturation, packaging","d":"Pressing, crushing, fermentation, draining, maturation, packaging"},"notes":{"a":"Draining comes before pressing: the free wine is drained, then the rest is pressed out.","b":"Pressing before fermentation is the white-wine order; reds need the skins in the ferment.","c":"Correct: the book's order; reds ferment with the skins, then are drained and pressed.","d":"Crushing comes first in the book's order for red wine."},"answer":"c","ctx":"White order: crushing, pressing, fermentation, storage or maturation, packaging.","src":"L2 book p. 41 (Making dry red wines)","cards":"L2-card-43"},{"id":"Q-L2-05-06","level":"L2","lo":"LO2","ch":"5","topic":"White wine from black grapes","trap":"","stem":"How can a winemaker make a white wine from black grapes?","options":{"a":"Ferment on the skins, but at cool white-wine temperatures.","b":"Drain the fermenting juice off the skins after a few hours.","c":"Ferment it as a red, then blend it with a larger amount of white.","d":"Press them very gently and ferment the juice without the skins."},"notes":{"a":"The colour is in the skins; fermenting with them extracts colour, giving a red or rosé.","b":"That is short maceration, which makes a rosé, not a white.","c":"Blending red and white wine is a method for making rosé.","d":"Correct: colour in black grapes is only in the skins, so very gentle pressing gives white juice."},"answer":"d","ctx":"The why: the pulp of black grapes is not coloured; only the skins hold the colour.","src":"L2 book p. 43 (Making dry white wines)","cards":"L2-card-44"},{"id":"Q-L2-05-07","level":"L2","lo":"LO2","ch":"5","topic":"Cap management","trap":"","stem":"Why do red winemakers use punching down or pumping over during fermentation?","options":{"a":"Skins left floating in the cap give up little colour and tannin.","b":"They add oxygen, which creates nutty and caramel flavours.","c":"They remove the skins before too much tannin is extracted.","d":"They help the bacteria begin malolactic conversion much sooner."},"notes":{"a":"Correct: the skins rise to form a cap; they must be mixed with the liquid to extract colour and tannin.","b":"Nutty, caramel notes come from oxygen during oak maturation.","c":"The reverse: they keep the skins in contact with the liquid.","d":"MLF is done by bacteria after fermentation; cap management is for colour and tannin."},"answer":"a","ctx":"Punching down = plunger pushes the cap in. Pumping over = liquid from the bottom sprayed over the cap.","src":"L2 book p. 41 (Extracting colour and tannin)","cards":"L2-card-43"},{"id":"Q-L2-05-08","level":"L2","lo":"LO2","ch":"5","topic":"Storage vs maturation","trap":"storage vs maturation","stem":"Most wines are stored for less than a year before bottling. How do their flavours change in that time?","options":{"a":"They gain vanilla and coconut notes.","b":"Their fruit fades into vegetal notes.","c":"They change very little, if at all.","d":"They move from primary to tertiary."},"notes":{"a":"These come from new oak, not from a short storage period.","b":"That is what happens to most wines kept too long in bottle.","c":"Correct: the book says flavours change very little, if at all, in a short storage period.","d":"That happens during maturation, an extended period of storage."},"answer":"c","ctx":"Maturation = extended storage, normally in oak: flavours go primary -> tertiary and tannins may integrate.","src":"L2 book p. 40 (Storage or maturation)","cards":"L2-card-43b"},{"id":"Q-L2-05-09","level":"L2","lo":"LO2","ch":"5","
